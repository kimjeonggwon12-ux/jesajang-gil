<title>제사장의 길 - 공부방</title>

<style>
  html, body { margin:0; padding:0; background:#f6f5f4; }

  @keyframes hx-fade-in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

<body>
<div id="root" class="max-w-md mx-auto min-h-screen bg-white shadow"></div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const paramMemberId = urlParams.get('memberId');
  const paramName = urlParams.get('name');
  if (paramMemberId && paramName) {
    window.TEST_MEMBER_ID = paramMemberId;
    window.TEST_NAME = paramName;
    window.TEST_MODE = true;
  }
  
  // ← 여기서부터 기존 코드 시작
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

// ===== 테스트 모드 (개발 단계) =====
// TEST_MODE = true  : 로그인(성도고유번호 본인확인) 화면을 건너뛰고 아래 임시 계정을 자동 사용
// TEST_MODE = false : 실제 성도고유번호 + 이름 본인확인 로그인 화면 표시
// 운영 전환 시 아래 한 줄만 false 로 바꾸면 됩니다. (로그인 화면 코드는 그대로 보존)
const TEST_MODE = true;
// URL에 ?memberId=&name= 이 주어지면(예: home.html 임베드, 관리자 테스트 링크) 그 계정을 사용하고,
// 없으면 기본 임시 계정으로 대체합니다.
const TEST_MEMBER = {
  memberId: window.TEST_MEMBER_ID || "TEST-0001",
  name: window.TEST_NAME || "테스트사용자"
};

// 필수 이수 교육 5항목 — 백엔드 Code.gs의 REQUIRED_EDU_CATEGORIES와 동일 순서.
// getRequiredEducation 응답에 categories 가 실려오면 그걸 우선 쓰고, 아직 미배포라
// 응답이 없을 때만 이 기본값으로 대체.
const REQ_EDU_CATEGORIES_DEFAULT = ['복음방교사양성교육', '섭외전도교육', '상담교육', '복음방교재교육', '교사소양교육'];
const REQ_EDU_ICONS = { '복음방교사양성교육': '🌟', '섭외전도교육': '📣', '상담교육': '💬', '복음방교재교육': '📖', '교사소양교육': '🎓' };

// 2026-09-18: 5개 테마 탭 개편 — "교재" 시트 courseId 접두어(G1/G2/G3)를 백엔드가
// category 필드로 매핑해서 내려줌(Code.gs _studyCourseCategory_와 동일 결). "교사소양"/
// "무신앙"은 아직 교재가 없어 목록이 비어있으면 "준비 중"으로 표시(에러 아님).
const COURSE_TABS = [
  { key: 'teacherQuality', category: '교사소양', icon: '🎓', label: '교사 소양' },
  { key: 'counseling', category: '상담', icon: '💬', label: '상담' },
  { key: 'noFaith', category: '무신앙', icon: '🌱', label: '무신앙' },
  { key: 'gospelRoom', category: '복음방', icon: '📖', label: '복음방 교재' }
];

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// home.html/district-dashboard.html과 동일 규칙 — 2/3글자 이상 이름 마스킹.
function maskName(nm) {
  const s = String(nm || '').trim();
  if (s.length <= 1) return s;
  if (s.length === 2) return s[0] + '*';
  return s[0] + '*'.repeat(s.length - 2) + s[s.length - 1];
}

async function callApi(payload) {
  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

let state = {
  tab: 'reqEdu',          // reqEdu | teacherQuality | counseling | noFaith | gospelRoom (5개 테마 탭)
  memberId: TEST_MODE ? TEST_MEMBER.memberId : '',
  name:     TEST_MODE ? TEST_MEMBER.name : '',
  identified: TEST_MODE ? true : false,
  loading: false,
  courses: [],           // getCourseList 원본(전체, category 필드 포함): [{courseId, courseName, unitName, order, content, minutes, category}]
  progress: {},          // courseId -> {progress, completedAt, lastStudiedAt}
  expanded: null,        // 펼쳐진 courseId
  sliderVal: {},         // courseId -> 슬라이더 임시값
  saving: {},            // courseId -> true(저장 중)
  reqEdu: null,          // getRequiredEducation 원본: { memberId, name, [카테고리]: 날짜|'', categories }
  reqEduToggling: {},    // 카테고리명 -> true(토글 처리 중)
  reqEduForm: { open: false, category: '', date: '' }, // "이수 교육 등록하기" 폼(카테고리 선택+이수일 입력)
  // Phase 4(2026-09-15): "내 수강생 현재 상태 입력" → AI 교재 추천(generateCoachingScript).
  studentRec: {
    studentName: '', stage: '', note: '',
    loadingTab: '',    // 현재 생성 중인 탭 key('' = 없음)
    resultByTab: {}    // tabKey -> { text, studentName, stage } (탭 전환해도 마지막 결과 유지)
  }
};

// Code.gs TARGET_STAGES와 동일 9단계 — study-room.html "수강생 현재 상태" 단계 선택용.
const REC_STAGES = ['섭외', '친분', '만남1', '만남2', '상담1', '상담2', '복음방', '센터소개', '센터수강'];

// list(교재 배열)를 courseName 기준으로 묶는다 — 5개 탭 전부 공용(카테고리로 이미 필터링된 리스트를 넘겨줌).
function groupCourses(list) {
  const groups = [];
  const idx = {};
  (list || state.courses).forEach(u => {
    if (!(u.courseName in idx)) {
      idx[u.courseName] = groups.length;
      groups.push({ courseName: u.courseName, units: [] });
    }
    groups[idx[u.courseName]].units.push(u);
  });
  groups.forEach(g => g.units.sort((a,b) => a.order - b.order));
  return groups;
}

function coursesForCategory(cat) {
  return state.courses.filter(c => c.category === cat);
}

// ============ Phase 4: "내 수강생 현재 상태 입력" → AI 교재 추천 ============

function studentRecSectionHtml(tabDef) {
  const sr = state.studentRec;
  const result = sr.resultByTab[tabDef.key];
  const loading = sr.loadingTab === tabDef.key;
  return `
    <div class="rounded-[1.5rem] p-4 bg-white/80 backdrop-blur-md border border-white/60 shadow-[0_4px_15px_rgba(0,0,0,0.03)] space-y-2.5">
      <h3 class="text-[13px] font-black text-gray-800 flex items-center gap-1.5 tracking-tight"><span class="text-indigo-500">🎯</span> 내 수강생 현재 상태 입력</h3>
      <input id="sr-name" type="text" placeholder="수강생 이름" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-[13px] outline-none focus:border-indigo-400" value="${esc(sr.studentName)}">
      <select id="sr-stage" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-[13px] outline-none focus:border-indigo-400">
        <option value="">현재 단계 선택</option>
        ${REC_STAGES.map(s => `<option value="${esc(s)}" ${sr.stage === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
      </select>
      <textarea id="sr-note" rows="2" placeholder="특이사항 (선택)" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-[13px] resize-none outline-none focus:border-indigo-400">${esc(sr.note)}</textarea>
      <button class="sr-generate-btn w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl py-2.5 text-[13px] font-bold disabled:opacity-50" data-tabkey="${esc(tabDef.key)}" ${loading ? 'disabled' : ''}>
        ${loading ? '⏳ AI가 추천을 생성 중입니다...' : `✨ 이 단계에 맞는 ${esc(tabDef.label)} 교재 추천받기`}
      </button>
      ${result ? `
        <div class="mt-1 rounded-xl bg-indigo-50 border border-indigo-100 p-3 text-[12.5px] text-gray-800 whitespace-pre-wrap leading-relaxed">
          <div class="text-[10.5px] font-bold text-indigo-500 mb-1.5">${esc(maskName(result.studentName))}님 · ${esc(result.stage)} 단계 추천</div>${esc(result.text)}
        </div>
      ` : ''}
    </div>
  `;
}

function wireStudentRecSection(body, tabDef) {
  const sr = state.studentRec;
  const bindInput = (id, key) => { const el = body.querySelector('#' + id); if (el) el.oninput = e => { sr[key] = e.target.value; }; };
  bindInput('sr-name', 'studentName');
  bindInput('sr-note', 'note');
  const stageEl = body.querySelector('#sr-stage');
  if (stageEl) stageEl.onchange = e => { sr.stage = e.target.value; };
  body.querySelectorAll('.sr-generate-btn').forEach(btn => {
    btn.onclick = () => generateStudentRec(tabDef);
  });
}

// 백엔드(_callAi_)가 이미 503 등 일시 오류를 최대 3회 자동 재시도하지만, 클라이언트 fetch 자체가
// 실패(네트워크 오류 등)하는 경우까지 대비해 여기서도 최대 3회, 1초 간격 재시도
// (district-dashboard.html runAiAnalysis()와 동일한 패턴).
async function generateStudentRec(tabDef) {
  const sr = state.studentRec;
  if (!sr.studentName.trim()) { alert('수강생 이름을 입력해주세요.'); return; }
  if (!sr.stage) { alert('현재 단계를 선택해주세요.'); return; }
  sr.loadingTab = tabDef.key;
  render();

  const courseNames = [...new Set(coursesForCategory(tabDef.category).map(c => c.courseName))];
  let lastErrMsg = '';
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const res = await callApi({
        action: 'generateCoachingScript',
        targetInfo: { studentName: sr.studentName.trim(), stage: sr.stage, note: sr.note.trim(), category: tabDef.category, courseNames }
      });
      if (res && res.error) throw new Error(res.error);
      sr.resultByTab[tabDef.key] = { text: res.text, studentName: sr.studentName.trim(), stage: sr.stage };
      sr.loadingTab = '';
      render();
      return;
    } catch (e) {
      lastErrMsg = e.message || String(e);
    }
    if (attempt < 3) await new Promise(r => setTimeout(r, 1000));
  }
  sr.resultByTab[tabDef.key] = { text: '오류가 발생했습니다: ' + lastErrMsg, studentName: sr.studentName.trim(), stage: sr.stage };
  sr.loadingTab = '';
  render();
}

function todayStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function progressOf(courseId) {
  const p = state.progress[courseId];
  return p ? Number(p.progress || 0) : 0;
}

// ===== 다운로드 (워드용 .doc) =====
// 파일명에 못 쓰는 문자(\/:*?"<>|, 줄바꿈)만 밑줄로 치환 — 내용은 건드리지 않음.
function sanitizeFilename(s) {
  return String(s || '').replace(/[\\/:*?"<>|\r\n]+/g, '_').trim();
}

// 워드가 열 수 있는 최소한의 HTML 문서를 만들어 application/msword로 다운로드.
// 실제 .docx(zip 기반)가 아니라 "워드가 HTML을 인식해서 열어주는" 방식(.doc 확장자
// + MS Office 네임스페이스 선언)이라 별도 라이브러리 없이 브라우저에서 바로 생성 가능.
function downloadUnitAsWord(u) {
  const paragraphs = String(u.content || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const bodyHtml = paragraphs.map(p =>
    `<p style="margin:0 0 12pt 0; line-height:1.6;">${esc(p).split('\n').join('<br>')}</p>`
  ).join('\n');

  const html = `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="UTF-8">
<meta name="ProgId" content="Word.Document">
<title>${esc(u.unitName)}</title>
<style>
  body { font-family: '맑은 고딕', 'Malgun Gothic', sans-serif; font-size: 11pt; }
  h1 { font-size: 20pt; margin: 0 0 4pt 0; }
  .subtitle { font-size: 10pt; color: #555555; margin: 0 0 18pt 0; }
</style>
</head>
<body>
<h1>${esc(u.unitName)}</h1>
<p class="subtitle">${esc(u.courseName)} · 예상 소요시간 약 ${u.minutes || '-'}분</p>
${bodyHtml}
</body>
</html>`;

  // 맨 앞 UTF-8 BOM — 워드가 한글을 EUC-KR 등으로 오인해 깨지는 것을 방지.
  const blob = new Blob(['﻿' + html], { type: 'application/msword;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = sanitizeFilename(`${u.courseName}_${u.unitName}.doc`);
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// 모든 탭 상단에 공통으로 보이는 "내 전체 진도율"(등록된 전체 교재 기준, 카테고리 무관 합산).
function overallProgressBarHtml() {
  const total = state.courses.length;
  if (total === 0) return '';
  const done = state.courses.filter(u => progressOf(u.courseId) >= 100).length;
  const avg = Math.round(state.courses.reduce((s,u) => s + progressOf(u.courseId), 0) / total);
  return `
    <div class="px-4 pt-2 pb-1 bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
      <div class="flex items-center justify-between text-[11px]">
        <span class="font-bold text-indigo-100">내 전체 진도율</span>
        <span class="font-black">${avg}% <span class="font-normal text-indigo-200">(완료 ${done}/${total}단원)</span></span>
      </div>
      <div class="mt-1 mb-1.5 h-1.5 bg-white/25 rounded-full overflow-hidden">
        <div class="h-full bg-white rounded-full transition-all" style="width:${avg}%"></div>
      </div>
    </div>`;
}

const TAB_DEFS = [
  { key: 'reqEdu', icon: '✅', label: '내가 이수한 교육' },
  ...COURSE_TABS
];

function render() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="flex items-center px-4 py-2 border-b border-gray-100">
      <a href="home.html" class="text-xs text-gray-400 hover:text-gray-600">← 홈</a>
    </div>
    <div class="flex overflow-x-auto border-b" style="scrollbar-width:none">
      ${TAB_DEFS.map(t => `
        <button class="study-tab-btn shrink-0 py-3 text-xs font-medium whitespace-nowrap px-3 ${state.tab===t.key ? 'text-indigo-700 border-b-2 border-indigo-600' : 'text-gray-400'}" data-tab="${t.key}">${t.icon} ${esc(t.label)}</button>
      `).join('')}
    </div>
    ${state.identified ? overallProgressBarHtml() : ''}
    <div id="body" class="p-5"></div>
  `;
  document.querySelectorAll('.study-tab-btn').forEach(btn => {
    btn.onclick = () => { state.tab = btn.dataset.tab; render(); };
  });

  const body = document.getElementById('body');

  // ===== 본인 확인 (TEST_MODE=false 일 때만 노출) =====
  if (!state.identified) {
    body.innerHTML = `
      <div class="space-y-3">
        <div class="text-sm text-gray-500 mb-2">먼저 본인 확인이 필요합니다.</div>
        <input id="input-memberId" type="text" placeholder="성도 고유번호" class="w-full border rounded-lg px-3 py-2 text-sm" value="${esc(state.memberId)}">
        <input id="input-name" type="text" placeholder="이름" class="w-full border rounded-lg px-3 py-2 text-sm" value="${esc(state.name)}">
        <button id="btn-identify" class="w-full bg-indigo-600 text-white rounded-lg py-2.5 text-sm font-medium">확인</button>
      </div>
    `;
    document.getElementById('btn-identify').onclick = () => {
      const mid = document.getElementById('input-memberId').value.trim();
      const nm = document.getElementById('input-name').value.trim();
      if (!mid || !nm) { alert('고유번호와 이름을 모두 입력해주세요.'); return; }
      state.memberId = mid;
      state.name = nm;
      state.identified = true;
      render();
      loadAll();
    };
    return;
  }

  if (state.tab === 'reqEdu') {
    renderRequiredEduTab(body);
    return;
  }
  const tabDef = COURSE_TABS.find(t => t.key === state.tab);
  renderCourseCategoryTab(body, tabDef);
}

async function loadAll() {
  state.loading = true;
  render();
  try {
    const [courseRes, progRes, reqEduRes] = await Promise.all([
      callApi({ action: 'getCourseList' }),
      callApi({ action: 'getMyProgress', memberId: state.memberId }),
      callApi({ action: 'getRequiredEducation', memberId: state.memberId })
    ]);
    state.courses = (courseRes && courseRes.rows) || [];
    state.progress = {};
    ((progRes && progRes.rows) || []).forEach(r => { state.progress[r.courseId] = r; });
    state.reqEdu = (reqEduRes && !reqEduRes.error) ? reqEduRes : null;
  } catch (err) {
    state.courses = [];
    state.progress = {};
    state.reqEdu = null;
  }
  state.loading = false;
  render();
}

function renderContentHtml(text) {
  const paragraphs = String(text || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  return paragraphs.map(p => {
    const html = esc(p).split('\n').join('<br>');
    const isHeading = /^[●|]/.test(p);
    return isHeading
      ? `<div class="font-black text-indigo-700 text-[13px] mt-2 first:mt-0">${html}</div>`
      : `<div class="text-[13px] text-gray-700 leading-relaxed mt-1">${html}</div>`;
  }).join('');
}

function progressBar(pct, colorCls) {
  colorCls = colorCls || 'bg-indigo-500';
  return `
    <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
      <div class="h-full ${colorCls} rounded-full transition-all" style="width:${Math.max(0,Math.min(100,pct))}%"></div>
    </div>`;
}

// 2026-09-18: 5개 테마 탭("교사 소양"/"상담"/"무신앙"/"복음방 교재") 공용 렌더러 — 기존
// "교재 목록"(단원 목록+본문 열람+진도 슬라이더) 탭과 "내 학습 현황"(교재별 진도 요약) 탭을
// 하나로 합쳐서, 탭마다 카테고리로 필터링된 교재만 보여준다. 교재가 없는 카테고리(교사소양/
// 무신앙은 아직 등록된 교재 없음)는 에러 없이 "준비 중" 안내만 표시.
function renderCourseCategoryTab(body, tabDef) {
  if (state.loading) {
    body.innerHTML = `<div class="text-sm text-gray-400 text-center py-10">불러오는 중...</div>`;
    return;
  }
  const list = coursesForCategory(tabDef.category);
  if (list.length === 0) {
    body.innerHTML = `
      <div class="animate-fade-in space-y-4">
        ${studentRecSectionHtml(tabDef)}
        <div class="text-center py-12">
          <div class="text-4xl mb-3">🚧</div>
          <div class="text-sm font-bold text-gray-500">${esc(tabDef.label)} 교재 준비 중입니다</div>
          <div class="text-xs text-gray-400 mt-1">교재가 등록되면 이곳에 자동으로 표시됩니다.</div>
        </div>
      </div>`;
    wireStudentRecSection(body, tabDef);
    return;
  }

  const groups = groupCourses(list);
  const totalUnits = groups.reduce((s,g) => s + g.units.length, 0);
  const doneUnits = groups.reduce((s,g) => s + g.units.filter(u => progressOf(u.courseId) >= 100).length, 0);
  const catAvg = totalUnits ? Math.round(groups.reduce((s,g) => s + g.units.reduce((s2,u)=>s2+progressOf(u.courseId),0), 0) / totalUnits) : 0;
  const cardCls = 'bg-white/80 backdrop-blur-md rounded-[1.5rem] shadow-[0_4px_15px_rgba(0,0,0,0.03)] border border-white/60 overflow-hidden';

  body.innerHTML = `
    <div class="animate-fade-in space-y-4">
      <div class="text-[11px] text-gray-400">${esc(state.name)}님 (${esc(state.memberId)}) · 교재를 눌러 학습 후 진도를 갱신하세요</div>

      ${studentRecSectionHtml(tabDef)}

      <div class="rounded-[1.5rem] p-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-[0_8px_25px_rgba(99,102,241,0.3)]">
        <div class="flex items-baseline justify-between">
          <span class="text-[12px] font-bold text-indigo-100">${esc(tabDef.label)} 내 진도율</span>
          <span class="text-2xl font-black">${catAvg}%</span>
        </div>
        <div class="mt-2 h-2 bg-white/25 rounded-full overflow-hidden">
          <div class="h-full bg-white rounded-full" style="width:${catAvg}%"></div>
        </div>
        <div class="text-[11px] text-indigo-100 mt-2">완료 ${doneUnits} / 전체 ${totalUnits}단원</div>
      </div>

      ${groups.map(g => {
        const total = g.units.length;
        const avg = total ? Math.round(g.units.reduce((s,u) => s + progressOf(u.courseId), 0) / total) : 0;
        return `
        <div class="${cardCls}">
          <div class="px-4 py-3.5 bg-gradient-to-r from-indigo-50 to-purple-50 border-b border-indigo-100/70">
            <div class="flex items-center justify-between mb-1.5">
              <h3 class="text-[13.5px] font-black text-indigo-900">${esc(g.courseName)} <span class="text-[10.5px] font-normal text-gray-400">(${total}단원)</span></h3>
              <span class="text-[11px] font-bold text-indigo-500">${avg}%</span>
            </div>
            ${progressBar(avg)}
          </div>
          <div class="divide-y divide-gray-100">
            ${g.units.map(u => renderUnitRow(u)).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;

  body.querySelectorAll('.unit-row-head').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.course;
      state.expanded = state.expanded === id ? null : id;
      if (state.sliderVal[id] === undefined) state.sliderVal[id] = progressOf(id);
      render();
    };
  });

  wireProgressControls(body);
  wireStudentRecSection(body, tabDef);
}

function renderUnitRow(u) {
  const pct = progressOf(u.courseId);
  const isExpanded = state.expanded === u.courseId;
  const done = pct >= 100;
  return `
    <div>
      <div class="unit-row-head px-4 py-3 flex items-center gap-3 cursor-pointer hover:bg-indigo-50/40 transition-all" data-course="${esc(u.courseId)}">
        <span class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 text-[10px] font-black ${done ? 'bg-emerald-500 text-white' : 'bg-gray-100 text-gray-400'}">
          ${done ? '✓' : u.order}
        </span>
        <div class="flex-1 min-w-0">
          <div class="text-[12.5px] font-bold text-gray-800 truncate">${esc(u.unitName)}</div>
          <div class="mt-1">${progressBar(pct, done ? 'bg-emerald-500' : 'bg-indigo-400')}</div>
        </div>
        <span class="text-[10.5px] font-bold text-gray-400 w-8 text-right">${pct}%</span>
        <span class="text-gray-300 text-[10px] transition-transform ${isExpanded ? 'rotate-90' : ''}">▶</span>
      </div>
      ${isExpanded ? renderUnitDetail(u) : ''}
    </div>`;
}

function renderUnitDetail(u) {
  const pct = state.sliderVal[u.courseId] !== undefined ? state.sliderVal[u.courseId] : progressOf(u.courseId);
  const isSaving = !!state.saving[u.courseId];
  const rec = state.progress[u.courseId];
  return `
    <div class="animate-fade-in-up bg-indigo-50/30 px-4 py-4 border-t border-indigo-100/60">
      <div class="text-[10.5px] text-gray-400 mb-2">예상 소요시간 약 ${u.minutes || '-'}분${rec && rec.lastStudiedAt ? ` · 마지막 학습 ${esc(rec.lastStudiedAt)}` : ''}</div>
      <div class="bg-white rounded-[14px] p-3.5 max-h-64 overflow-y-auto border border-gray-100 shadow-sm">
        ${renderContentHtml(u.content)}
      </div>

      <button class="download-unit-btn mt-2.5 w-full bg-white border border-indigo-200 text-indigo-600 rounded-[12px] py-2 text-[12.5px] font-bold flex items-center justify-center gap-1.5 hover:bg-indigo-50 transition-all" data-course="${esc(u.courseId)}">
        <span>⬇</span> 워드로 다운로드
      </button>

      <div class="mt-3.5 space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-[11.5px] font-black text-gray-600">진도 갱신</span>
          <span class="text-[13px] font-black text-indigo-600">${pct}%</span>
        </div>
        <input type="range" min="0" max="100" step="5" value="${pct}" class="study-slider w-full slider-input" data-course="${esc(u.courseId)}">
        <div class="grid grid-cols-3 gap-2">
          <button class="quick-btn py-2 rounded-[10px] text-[12px] font-bold border ${pct===0?'bg-indigo-600 text-white border-indigo-600':'bg-white text-gray-500 border-gray-200'}" data-course="${esc(u.courseId)}" data-val="0">0%</button>
          <button class="quick-btn py-2 rounded-[10px] text-[12px] font-bold border ${pct===50?'bg-indigo-600 text-white border-indigo-600':'bg-white text-gray-500 border-gray-200'}" data-course="${esc(u.courseId)}" data-val="50">50%</button>
          <button class="quick-btn py-2 rounded-[10px] text-[12px] font-bold border ${pct===100?'bg-emerald-600 text-white border-emerald-600':'bg-white text-gray-500 border-gray-200'}" data-course="${esc(u.courseId)}" data-val="100">100%</button>
        </div>
        <button class="save-btn w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-[12px] py-2.5 text-[13px] font-black shadow-[0_6px_18px_rgba(99,102,241,0.3)] active:scale-[0.98] transition-all disabled:opacity-50" data-course="${esc(u.courseId)}" ${isSaving ? 'disabled' : ''}>
          ${isSaving ? '저장 중...' : '진도 저장'}
        </button>
      </div>
    </div>`;
}

function wireProgressControls(body) {
  body.querySelectorAll('.download-unit-btn').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.course;
      const u = state.courses.find(c => c.courseId === id);
      if (u) downloadUnitAsWord(u);
    };
  });

  body.querySelectorAll('.slider-input').forEach(el => {
    el.addEventListener('input', (e) => {
      e.stopPropagation();
      const id = el.dataset.course;
      state.sliderVal[id] = Number(e.target.value);
      render();
    });
    el.onclick = (e) => e.stopPropagation();
  });

  body.querySelectorAll('.quick-btn').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.course;
      state.sliderVal[id] = Number(el.dataset.val);
      render();
    };
  });

  body.querySelectorAll('.save-btn').forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation();
      const id = el.dataset.course;
      const u = state.courses.find(c => c.courseId === id);
      if (!u) return;
      const val = state.sliderVal[id] !== undefined ? state.sliderVal[id] : progressOf(id);
      state.saving[id] = true;
      render();
      try {
        const res = await callApi({
          action: 'updateProgress',
          memberId: state.memberId,
          name: state.name,
          courseId: id,
          courseName: u.courseName,
          progress: val
        });
        if (res && res.error) throw new Error(res.error);
        state.progress[id] = {
          courseId: id, courseName: u.courseName,
          progress: res.progress, completedAt: res.completedAt, lastStudiedAt: res.lastStudiedAt
        };
      } catch (err) {
        alert('진도 저장 중 오류가 발생했습니다: ' + err.message);
      }
      state.saving[id] = false;
      render();
    };
  });
}


function renderReqEduCard(cat, rec) {
  const date = rec[cat];
  const done = !!date;
  const busy = !!state.reqEduToggling[cat];
  return `
    <button class="reqedu-card text-left p-3.5 rounded-[1.25rem] border transition-all disabled:opacity-60 ${done ? 'bg-emerald-50 border-emerald-300 shadow-[0_4px_15px_rgba(16,185,129,0.12)]' : 'bg-gray-50 border-gray-200'}" data-category="${esc(cat)}" ${busy ? 'disabled' : ''}>
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-lg">${REQ_EDU_ICONS[cat] || '✅'}</span>
        <span class="w-5 h-5 rounded-md flex items-center justify-center shrink-0 border-2 ${done ? 'bg-emerald-500 border-emerald-500' : 'border-gray-300 bg-white'}">
          ${done ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M5 13l4 4L19 7"/></svg>' : ''}
        </span>
      </div>
      <div class="text-[12.5px] font-black ${done ? 'text-emerald-900' : 'text-gray-600'}">${esc(cat)}</div>
      <div class="text-[10.5px] mt-1 ${done ? 'text-emerald-600 font-bold' : 'text-gray-400'}">${busy ? '처리 중...' : (done ? esc(date) + ' 이수' : '미이수')}</div>
    </button>`;
}

function renderRequiredEduTab(body) {
  if (state.loading) {
    body.innerHTML = `<div class="text-sm text-gray-400 text-center py-10">불러오는 중...</div>`;
    return;
  }
  const rec = state.reqEdu || {};
  const categories = (rec.categories && rec.categories.length) ? rec.categories : REQ_EDU_CATEGORIES_DEFAULT;
  const doneCount = categories.filter(c => rec[c]).length;
  const pct = categories.length ? Math.round(doneCount / categories.length * 100) : 0;
  const undoneCategories = categories.filter(c => !rec[c]);
  const f = state.reqEduForm;

  body.innerHTML = `
    <div class="animate-fade-in space-y-4">
      <div class="text-[11px] text-gray-400">${esc(state.name)}님 (${esc(state.memberId)}) · 필수 이수 교육</div>

      <div class="rounded-[1.5rem] p-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-[0_8px_25px_rgba(99,102,241,0.3)]">
        <div class="flex items-baseline justify-between">
          <span class="text-[12px] font-bold text-indigo-100">필수 교육 이수 현황</span>
          <span class="text-2xl font-black">${doneCount} / ${categories.length}개 이수</span>
        </div>
        <div class="mt-2 h-2 bg-white/25 rounded-full overflow-hidden">
          <div class="h-full bg-white rounded-full transition-all" style="width:${pct}%"></div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        ${categories.map(cat => renderReqEduCard(cat, rec)).join('')}
      </div>

      ${undoneCategories.length === 0 ? `
      <div class="text-center text-[12px] font-bold text-emerald-600 py-2">🎉 필수 교육을 전부 이수했습니다!</div>` : `
      <button id="btn-reqedu-register-toggle" class="w-full border-2 border-dashed border-indigo-300 text-indigo-600 rounded-[1.25rem] py-3 text-[13px] font-bold hover:bg-indigo-50 transition-all">
        ${f.open ? '접기 ▲' : '➕ 이수 교육 등록하기'}
      </button>`}

      ${(f.open && undoneCategories.length > 0) ? `
      <div class="bg-white rounded-[1.25rem] border border-indigo-100 p-4 space-y-3 shadow-sm animate-fade-in-up">
        <div class="text-[12px] font-black text-gray-700">이수한 교육 항목을 선택하고 이수일을 입력하세요</div>
        <select id="reqedu-form-category" class="w-full border rounded-lg px-3 py-2 text-sm">
          ${undoneCategories.map(c => `<option value="${esc(c)}" ${f.category===c?'selected':''}>${REQ_EDU_ICONS[c]||''} ${esc(c)}</option>`).join('')}
        </select>
        <input id="reqedu-form-date" type="date" class="w-full border rounded-lg px-3 py-2 text-sm" value="${esc(f.date || todayStr())}" max="${esc(todayStr())}">
        <button id="btn-reqedu-submit" class="w-full bg-indigo-600 text-white rounded-lg py-2.5 text-sm font-bold disabled:opacity-50" ${state.reqEduToggling['__form__'] ? 'disabled' : ''}>
          ${state.reqEduToggling['__form__'] ? '등록 중...' : '등록'}
        </button>
      </div>` : ''}

      ${!state.reqEdu ? `<div class="text-[11px] text-gray-400 text-center py-2">서버에서 현재 이수 상태를 불러오지 못했습니다. 체크하면 실제 저장된 값으로 갱신됩니다.</div>` : ''}
    </div>
  `;

  body.querySelectorAll('.reqedu-card').forEach(el => {
    el.onclick = async () => {
      const cat = el.dataset.category;
      state.reqEduToggling[cat] = true;
      render();
      try {
        const res = await callApi({
          action: 'toggleRequiredEducation',
          memberId: state.memberId,
          name: state.name,
          category: cat
        });
        if (res && res.error) throw new Error(res.error);
        state.reqEdu = res;
      } catch (err) {
        alert('필수교육 상태 변경 중 오류가 발생했습니다: ' + err.message);
      }
      delete state.reqEduToggling[cat];
      render();
    };
  });

  const toggleBtn = document.getElementById('btn-reqedu-register-toggle');
  if (toggleBtn) toggleBtn.onclick = () => {
    state.reqEduForm.open = !state.reqEduForm.open;
    if (state.reqEduForm.open && !state.reqEduForm.category) {
      state.reqEduForm.category = undoneCategories[0] || '';
      state.reqEduForm.date = todayStr();
    }
    render();
  };
  const catSelect = document.getElementById('reqedu-form-category');
  if (catSelect) catSelect.onchange = (e) => { state.reqEduForm.category = e.target.value; };
  const dateInput = document.getElementById('reqedu-form-date');
  if (dateInput) dateInput.oninput = (e) => { state.reqEduForm.date = e.target.value; };
  const submitBtn = document.getElementById('btn-reqedu-submit');
  if (submitBtn) submitBtn.onclick = async () => {
    const cat = document.getElementById('reqedu-form-category').value;
    const date = document.getElementById('reqedu-form-date').value || todayStr();
    if (!cat) return;
    state.reqEduToggling['__form__'] = true;
    render();
    try {
      const res = await callApi({ action: 'toggleRequiredEducation', memberId: state.memberId, name: state.name, category: cat, date });
      if (res && res.error) throw new Error(res.error);
      state.reqEdu = res;
      state.reqEduForm = { open: false, category: '', date: '' };
    } catch (err) {
      alert('이수 등록 중 오류가 발생했습니다: ' + err.message);
    }
    delete state.reqEduToggling['__form__'];
    render();
  };
}

render();
loadAll();
</script>
</body>
</html>
