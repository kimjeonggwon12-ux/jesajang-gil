<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>제사장의 길 - 공부방</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --color-primary: #5B4FCF;
    --color-primary-light: #EDE9FF;
    --color-primary-dark: #3D34A5;
    --color-surface: #FFFFFF;
    --color-bg: #F5F5F5;
    --color-card: #FFFFFF;
    --color-text: #1A1A2E;
    --color-text-sub: #666680;
    --color-border: #E8E8F0;
    --color-success: #2D9B6F;
    --color-warning: #E8A020;
    --color-error: #D94040;
    --color-accent: #FF6B6B;
    --radius-card: 16px;
    --radius-btn: 12px;
    --radius-input: 10px;
    --shadow-card: 0 2px 12px rgba(0,0,0,0.08);
    --height-btn: 52px;
    --height-btn-sm: 44px;
    --height-header: 56px;
    --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px;
  }
  .lucide-i { width:1em; height:1em; display:inline-block; vertical-align:-0.15em; flex-shrink:0; }
  .kko-header { height:var(--height-header); background:var(--color-primary); display:flex; align-items:center; gap:10px; padding:0 16px; flex-shrink:0; }
  .kko-header .kko-back { color:#fff; font-size:20px; line-height:1; text-decoration:none; }
  .kko-header .kko-title { color:#fff; font-weight:700; font-size:16px; }
  .kko-card { background:var(--color-card); border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:20px; }
  .kko-btn-main {
    display:flex; align-items:center; justify-content:center;
    height:var(--height-btn); min-height:var(--height-btn); border-radius:var(--radius-btn);
    background:var(--color-primary); color:#fff; font-size:16px; font-weight:700; border:none; width:100%;
  }
  .kko-btn-main[disabled] { opacity:.6; }
  .kko-btn-outline {
    display:flex; align-items:center; justify-content:center;
    height:var(--height-btn-sm); min-height:var(--height-btn-sm); border-radius:var(--radius-btn);
    background:#fff; color:var(--color-primary); font-size:14px; font-weight:700; border:1.5px solid var(--color-primary); width:100%;
  }
  .kko-input, textarea.kko-input { min-height:48px; border-radius:var(--radius-input); border:1px solid var(--color-border); }
  .kko-input:focus { border-color:var(--color-primary); outline-color:var(--color-primary); }
  @keyframes kkoFadeIn { from { opacity:0; } to { opacity:1; } }
  .kko-fade-in { animation: kkoFadeIn .2s ease; }
  @keyframes kkoCardIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  .kko-card-in { animation: kkoCardIn .3s ease; }
  .kko-btn-main, .kko-btn-outline { transition: transform .1s ease; }
  .kko-btn-main:active, .kko-btn-outline:active { transform: scale(0.97); }
  @keyframes kkoShimmer { 0% { background-position:-200px 0; } 100% { background-position:200px 0; } }
  .kko-skeleton { background:linear-gradient(90deg,#EEEEEE 25%,#F5F5F5 37%,#EEEEEE 63%); background-size:400px 100%; animation:kkoShimmer 1.4s ease infinite; border-radius:8px; }
  .kko-spinner { width:36px; height:36px; border-radius:50%; border:3px solid #EDE9FF; border-top-color:#5B4FCF; animation:kkoSpin .7s linear infinite; display:inline-block; }
  @keyframes kkoSpin { to { transform:rotate(360deg); } }
  .reqedu-row:last-child { border-bottom:none; }

  html, body { margin:0; padding:0; background:var(--color-bg); }
  * { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; }

  @keyframes hx-fade-in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes hx-fade-in-up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
  @keyframes hx-slide-in { from { opacity:0; transform:translateY(12px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }
  .animate-fade-in { animation: hx-fade-in .4s ease-out both; }
  .animate-fade-in-up { animation: hx-fade-in-up .4s ease-out both; }
  .animate-slide-in { animation: hx-slide-in .35s cubic-bezier(0.16,1,0.3,1) both; }

</style>
</head>
<body>
<div id="root" class="max-w-md mx-auto min-h-screen shadow" style="background:var(--color-bg);"></div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const paramMemberId = urlParams.get('memberId');
  const paramName = urlParams.get('name');
  if (paramMemberId && paramName) {
    window.TEST_MEMBER_ID = paramMemberId;
    window.TEST_NAME = paramName;
    window.TEST_MODE = true;
  }
  
  // ← 여기서부터 기존 코드 시작
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

// ===== 테스트 모드 (개발 단계) =====
// TEST_MODE = true  : 로그인(성도고유번호 본인확인) 화면을 건너뛰고 아래 임시 계정을 자동 사용
// TEST_MODE = false : 실제 성도고유번호 + 이름 본인확인 로그인 화면 표시
// 운영 전환 시 아래 한 줄만 false 로 바꾸면 됩니다. (로그인 화면 코드는 그대로 보존)
const TEST_MODE = true;
// URL에 ?memberId=&name= 이 주어지면(예: home.html 임베드, 관리자 테스트 링크) 그 계정을 사용하고,
// 없으면 기본 임시 계정으로 대체합니다.
const TEST_MEMBER = {
  memberId: window.TEST_MEMBER_ID || "TEST-0001",
  name: window.TEST_NAME || "테스트사용자"
};

// 필수 이수 교육 5항목 — 백엔드 Code.gs의 REQUIRED_EDU_CATEGORIES와 동일 순서.
// getRequiredEducation 응답에 categories 가 실려오면 그걸 우선 쓰고, 아직 미배포라
// 응답이 없을 때만 이 기본값으로 대체.
const REQ_EDU_CATEGORIES_DEFAULT = ['복음방교사양성교육', '섭외전도교육', '상담교육', '복음방교재교육', '교사소양교육'];
const REQ_EDU_ICONS = {
  '복음방교사양성교육': `<svg class="lucide-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>`,
  '섭외전도교육': `<svg class="lucide-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14"/><path d="M8 6v8"/></svg>`,
  '상담교육': `<svg class="lucide-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg>`,
  '복음방교재교육': `<svg class="lucide-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg>`,
  '교사소양교육': `<svg class="lucide-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>`
};
const REQ_EDU_ICON_DONE = `<svg class="lucide-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg>`;
// 2026-09-18: 사용자 요청 — "필수 과목"/"추가 과목" 2개 그룹으로 화면을 나눔(백엔드 카테고리
// 자체는 그대로 5개, 프런트에서만 그룹핑). categories 가 이 5개와 다르게 내려오는 경우를 대비해
// 이 두 목록에 없는 나머지 카테고리는 "추가 과목"에 자동으로 붙인다(REQ_EDU_GROUP 참고).
const REQ_EDU_REQUIRED = ['복음방교사양성교육', '복음방교재교육'];
const REQ_EDU_ADDITIONAL = ['섭외전도교육', '상담교육', '교사소양교육'];

// 2026-09-18: 5개 테마 탭 개편 — "교재" 시트 courseId 접두어(G1/G2/G3)를 백엔드가
// category 필드로 매핑해서 내려줌(Code.gs _studyCourseCategory_와 동일 결). "교사소양"/
// "무신앙"은 아직 교재가 없어 목록이 비어있으면 "준비 중"으로 표시(에러 아님).
const COURSE_TABS = [
  { key: 'teacherQuality', category: '교사소양', label: '소양' },
  { key: 'counseling', category: '상담', label: '상담' },
  { key: 'noFaith', category: '무신앙', label: '무신앙' },
  { key: 'gospelRoom', category: '복음방', label: '복음방' }
];

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
async function callApi(payload) {
  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

let state = {
  tab: 'reqEdu',          // reqEdu | teacherQuality | counseling | noFaith | gospelRoom (5개 테마 탭)
  memberId: TEST_MODE ? TEST_MEMBER.memberId : '',
  name:     TEST_MODE ? TEST_MEMBER.name : '',
  identified: TEST_MODE ? true : false,
  loading: false,
  courses: [],           // getCourseList 원본(전체, category 필드 포함): [{courseId, courseName, unitName, order, content, minutes, category}]
  expanded: null,        // 펼쳐진 courseId
  reqEdu: null           // getRequiredEducation 원본: { memberId, name, [카테고리]: 날짜|'', categories } — 읽기 전용
};

// list(교재 배열)를 courseName 기준으로 묶는다 — 5개 탭 전부 공용(카테고리로 이미 필터링된 리스트를 넘겨줌).
function groupCourses(list) {
  const groups = [];
  const idx = {};
  (list || state.courses).forEach(u => {
    if (!(u.courseName in idx)) {
      idx[u.courseName] = groups.length;
      groups.push({ courseName: u.courseName, units: [] });
    }
    groups[idx[u.courseName]].units.push(u);
  });
  groups.forEach(g => g.units.sort((a,b) => a.order - b.order));
  return groups;
}

function coursesForCategory(cat) {
  return state.courses.filter(c => c.category === cat);
}

// 2026-09-15: "내 수강생 현재 상태 입력" + AI 교재 추천(generateCoachingScript 호출) 기능 전체 삭제
// (사용자 요청 — 공부방은 교재 열람/학습 완료 체크에만 집중). 백엔드 액션도 함께 제거함.
// 2026-09-16: 단원별 "학습 완료" 체크 + 진도율 UI 전체 삭제(사용자 요청 — 공부방은 교재 열람 전용).
// 백엔드 updateProgress_/getMyProgress_/getAllProgress_ 도 함께 제거함.

// ===== 다운로드 (워드용 .doc) =====
// 파일명에 못 쓰는 문자(\/:*?"<>|, 줄바꿈)만 밑줄로 치환 — 내용은 건드리지 않음.
function sanitizeFilename(s) {
  return String(s || '').replace(/[\\/:*?"<>|\r\n]+/g, '_').trim();
}

// 워드가 열 수 있는 최소한의 HTML 문서를 만들어 application/msword로 다운로드.
// 실제 .docx(zip 기반)가 아니라 "워드가 HTML을 인식해서 열어주는" 방식(.doc 확장자
// + MS Office 네임스페이스 선언)이라 별도 라이브러리 없이 브라우저에서 바로 생성 가능.
function downloadUnitAsWord(u) {
  const paragraphs = String(u.content || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const bodyHtml = paragraphs.map(p =>
    `<p style="margin:0 0 12pt 0; line-height:1.6;">${esc(p).split('\n').join('<br>')}</p>`
  ).join('\n');

  const html = `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="UTF-8">
<meta name="ProgId" content="Word.Document">
<title>${esc(u.unitName)}</title>
<style>
  body { font-family: '맑은 고딕', 'Malgun Gothic', sans-serif; font-size: 11pt; }
  h1 { font-size: 20pt; margin: 0 0 4pt 0; }
  .subtitle { font-size: 10pt; color: #555555; margin: 0 0 18pt 0; }
</style>
</head>
<body>
<h1>${esc(u.unitName)}</h1>
<p class="subtitle">${esc(u.courseName)} · 예상 소요시간 약 ${u.minutes || '-'}분</p>
${bodyHtml}
</body>
</html>`;

  // 맨 앞 UTF-8 BOM — 워드가 한글을 EUC-KR 등으로 오인해 깨지는 것을 방지.
  const blob = new Blob(['﻿' + html], { type: 'application/msword;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = sanitizeFilename(`${u.courseName}_${u.unitName}.doc`);
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

const TAB_DEFS = [
  { key: 'reqEdu', label: '이수교육' },
  ...COURSE_TABS
];

function render() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="kko-header">
      <a href="home.html" class="kko-back">←</a>
      <span class="kko-title">공부방</span>
    </div>
    <div class="flex overflow-x-auto gap-2 px-4 py-3" style="scrollbar-width:none; background:var(--color-bg);">
      ${TAB_DEFS.map(t => {
        const active = state.tab === t.key;
        const style = active
          ? 'background:var(--color-primary); color:#fff; border:1.5px solid var(--color-primary);'
          : 'background:#fff; color:var(--color-primary); border:1.5px solid var(--color-primary);';
        return `<button class="study-tab-btn shrink-0 whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold" style="${style}" data-tab="${t.key}">${esc(t.label)}</button>`;
      }).join('')}
    </div>
    <div id="body" class="p-5" style="background:var(--color-bg);"></div>
  `;
  document.querySelectorAll('.study-tab-btn').forEach(btn => {
    btn.onclick = () => { state.tab = btn.dataset.tab; render(); };
  });

  const body = document.getElementById('body');

  // ===== 본인 확인 (TEST_MODE=false 일 때만 노출) =====
  if (!state.identified) {
    body.innerHTML = `
      <div class="space-y-3">
        <div class="text-sm mb-2" style="color:var(--color-text-sub);">먼저 본인 확인이 필요합니다.</div>
        <input id="input-memberId" type="text" placeholder="성도 고유번호" class="kko-input w-full px-3 py-2 text-sm" value="${esc(state.memberId)}">
        <input id="input-name" type="text" placeholder="이름" class="kko-input w-full px-3 py-2 text-sm" value="${esc(state.name)}">
        <button id="btn-identify" class="kko-btn-main">확인</button>
      </div>
    `;
    document.getElementById('btn-identify').onclick = () => {
      const mid = document.getElementById('input-memberId').value.trim();
      const nm = document.getElementById('input-name').value.trim();
      if (!mid || !nm) { alert('고유번호와 이름을 모두 입력해주세요.'); return; }
      state.memberId = mid;
      state.name = nm;
      state.identified = true;
      render();
      loadAll();
    };
    return;
  }

  if (state.tab === 'reqEdu') {
    renderRequiredEduTab(body);
    return;
  }
  const tabDef = COURSE_TABS.find(t => t.key === state.tab);
  renderCourseCategoryTab(body, tabDef);
}

async function loadAll() {
  state.loading = true;
  render();
  try {
    const [courseRes, reqEduRes] = await Promise.all([
      callApi({ action: 'getCourseList' }),
      callApi({ action: 'getRequiredEducation', memberId: state.memberId })
    ]);
    state.courses = (courseRes && courseRes.rows) || [];
    state.reqEdu = (reqEduRes && !reqEduRes.error) ? reqEduRes : null;
  } catch (err) {
    state.courses = [];
    state.reqEdu = null;
  }
  state.loading = false;
  render();
}

function renderContentHtml(text) {
  const paragraphs = String(text || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  return paragraphs.map(p => {
    const html = esc(p).split('\n').join('<br>');
    const isHeading = /^[●|]/.test(p);
    return isHeading
      ? `<div class="font-black text-indigo-700 text-[13px] mt-2 first:mt-0">${html}</div>`
      : `<div class="text-[13px] text-gray-700 leading-relaxed mt-1">${html}</div>`;
  }).join('');
}

// 2026-09-18: 5개 테마 탭("교사 소양"/"상담"/"무신앙"/"복음방 교재") 공용 렌더러 — 기존
// "교재 목록"(단원 목록+본문 열람+진도 슬라이더) 탭과 "내 학습 현황"(교재별 진도 요약) 탭을
// 하나로 합쳐서, 탭마다 카테고리로 필터링된 교재만 보여준다. 교재가 없는 카테고리(교사소양/
// 무신앙은 아직 등록된 교재 없음)는 에러 없이 "준비 중" 안내만 표시.
function renderCourseCategoryTab(body, tabDef) {
  if (state.loading) {
    body.innerHTML = `<div class="text-sm text-gray-400 text-center py-10">불러오는 중...</div>`;
    return;
  }
  const list = coursesForCategory(tabDef.category);
  if (list.length === 0) {
    body.innerHTML = `
      <div class="kko-fade-in text-center py-16">
        <div class="text-4xl mb-3">🚧</div>
        <div class="text-sm font-bold" style="color:var(--color-text-sub);">${esc(tabDef.label)} 교재 준비 중입니다</div>
        <div class="text-xs mt-1" style="color:var(--color-text-sub);">교재가 등록되면 이곳에 자동으로 표시됩니다.</div>
      </div>`;
    return;
  }

  const groups = groupCourses(list);
  const totalUnits = groups.reduce((s,g) => s + g.units.length, 0);

  body.innerHTML = `
    <div class="kko-fade-in space-y-4">
      <div class="text-[11px]" style="color:var(--color-text-sub);">${esc(state.name)}님 (${esc(state.memberId)}) · 교재를 눌러 내용을 확인하세요 · 전체 ${totalUnits}단원</div>

      ${groups.map(g => {
        const total = g.units.length;
        return `
        <div class="kko-card-in overflow-hidden" style="background:var(--color-card); border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:0;">
          <div class="px-4 py-3.5 border-b" style="background:var(--color-primary-light); border-color:var(--color-border);">
            <h3 class="text-[13.5px] font-black" style="color:var(--color-primary);">${esc(g.courseName)} <span class="text-[10.5px] font-normal" style="color:var(--color-text-sub);">(${total}단원)</span></h3>
          </div>
          <div class="divide-y divide-gray-100">
            ${g.units.map(u => renderUnitRow(u)).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;

  body.querySelectorAll('.unit-row-head').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.course;
      state.expanded = state.expanded === id ? null : id;
      render();
    };
  });

  wireUnitControls(body);
}

function renderUnitRow(u) {
  const isExpanded = state.expanded === u.courseId;
  return `
    <div class="kko-card-in">
      <div class="unit-row-head px-4 flex items-center gap-3 cursor-pointer hover:bg-black/5 transition-all" style="min-height:64px;" data-course="${esc(u.courseId)}">
        <span class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 text-[10px] font-black" style="background:var(--color-primary-light); color:var(--color-primary);">
          ${u.order}
        </span>
        <div class="flex-1 min-w-0">
          <div class="text-[13px] font-bold truncate" style="color:var(--color-text);">${esc(u.unitName)}</div>
        </div>
        <span class="text-[18px] transition-transform ${isExpanded ? 'rotate-90' : ''}" style="color:var(--color-text-sub);">›</span>
      </div>
      ${isExpanded ? renderUnitDetail(u) : ''}
    </div>`;
}

// 2026-09-16: 단원별 "학습 완료" 체크(진도 저장) 전부 삭제(사용자 요청) — 이제 교재 열람 전용.
function renderUnitDetail(u) {
  return `
    <div class="kko-fade-in px-4 py-4 border-t" style="background:var(--color-primary-light); border-color:var(--color-border);">
      <div class="text-[10.5px] mb-2" style="color:var(--color-text-sub);">예상 소요시간 약 ${u.minutes || '-'}분</div>
      <div class="bg-white rounded-[14px] p-3.5 border shadow-sm" style="border-color:var(--color-border);">
        ${renderContentHtml(u.content)}
      </div>

      <button class="download-unit-btn kko-btn-outline mt-2.5" data-course="${esc(u.courseId)}">
        <svg class="lucide-i mr-1.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg> 워드로 다운로드
      </button>
    </div>`;
}

function wireUnitControls(body) {
  body.querySelectorAll('.download-unit-btn').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.course;
      const u = state.courses.find(c => c.courseId === id);
      if (u) downloadUnitAsWord(u);
    };
  });
}


// 2026-09-15: 교사 본인 체크 → 읽기 전용으로 변경(사용자 요청). 이수 등록은 교육부·전도부가
// 관리자 화면(edu-dashboard.html "필수교육 이수 등록")에서만 할 수 있다.
// 2026-09-18: 카드 그리드(바둑판) → 1열 목록(한 행에 한 과목), 체크박스 대신 "이수"/"미이수"
// 글자를 열 표면에 직접 표시하는 방식으로 재설계(사용자 요청).
function renderReqEduRow(cat, rec) {
  const date = rec[cat];
  const done = !!date;
  return `
    <div class="reqedu-row flex items-center justify-between gap-3 px-4" style="min-height:56px; border-bottom:1px solid var(--color-border);">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-base shrink-0">${REQ_EDU_ICONS[cat] || REQ_EDU_ICON_DONE}</span>
        <div class="min-w-0">
          <div class="text-[13px] font-bold truncate" style="color:var(--color-text);">${esc(cat)}</div>
          <div class="text-[10.5px] mt-0.5" style="color:var(--color-text-sub);">${done ? esc(date) : '이수 기록 없음'}</div>
        </div>
      </div>
      <div class="text-[13px] font-black shrink-0" style="color:${done ? '#059669' : '#AAAAAA'};">${done ? '이수' : '미이수'}</div>
    </div>`;
}

function reqEduSectionHtml(title, cats, rec) {
  if (!cats.length) return '';
  return `
    <div class="kko-card-in overflow-hidden" style="background:var(--color-card); border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:0;">
      <div class="px-4 py-3" style="background:var(--color-primary-light);">
        <h3 class="text-[13px] font-black" style="color:var(--color-primary);">${esc(title)}</h3>
      </div>
      ${cats.map(cat => renderReqEduRow(cat, rec)).join('')}
    </div>`;
}

function renderRequiredEduTab(body) {
  if (state.loading) {
    body.innerHTML = `<div class="text-sm text-gray-400 text-center py-10">불러오는 중...</div>`;
    return;
  }
  const rec = state.reqEdu || {};
  const categories = (rec.categories && rec.categories.length) ? rec.categories : REQ_EDU_CATEGORIES_DEFAULT;
  // 응답 categories에 REQ_EDU_REQUIRED/ADDITIONAL에 없는 값이 섞여 와도(백엔드가 나중에
  // 카테고리를 추가하는 경우 대비) 누락 없이 "추가 과목"에 자동으로 붙인다.
  const requiredCats = REQ_EDU_REQUIRED.filter(c => categories.includes(c));
  const additionalCats = categories.filter(c => !requiredCats.includes(c));

  body.innerHTML = `
    <div class="kko-fade-in space-y-4">
      <div class="text-[11px]" style="color:var(--color-text-sub);">${esc(state.name)}님 (${esc(state.memberId)}) · 이수교육</div>

      <div class="rounded-[1.25rem] px-4 py-3 text-[12px] leading-relaxed" style="background:var(--color-primary-light); color:var(--color-primary);">
        ℹ️ <b>교육부·전도부에서 등록한 이수 내역입니다.</b> 열람만 가능하며, 이수 기록이 실제와 다르면 교육부에 문의해주세요.
      </div>

      ${reqEduSectionHtml('필수 과목', requiredCats, rec)}
      ${reqEduSectionHtml('추가 과목', additionalCats, rec)}

      ${!state.reqEdu ? `<div class="text-[11px] text-center py-2" style="color:var(--color-text-sub);">서버에서 현재 이수 상태를 불러오지 못했습니다.</div>` : ''}
    </div>
  `;
}

render();
loadAll();
</script>
</body>
</html>
