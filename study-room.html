<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>제사장의 길 - 공부방</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin:0; padding:0; background:#f6f5f4; }
  * { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; }

  @keyframes hx-fade-in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes hx-fade-in-up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
  @keyframes hx-slide-in { from { opacity:0; transform:translateY(12px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }
  .animate-fade-in { animation: hx-fade-in .4s ease-out both; }
  .animate-fade-in-up { animation: hx-fade-in-up .4s ease-out both; }
  .animate-slide-in { animation: hx-slide-in .35s cubic-bezier(0.16,1,0.3,1) both; }

</style>
</head>
<body>
<div id="root" class="max-w-md mx-auto min-h-screen bg-white shadow"></div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const paramMemberId = urlParams.get('memberId');
  const paramName = urlParams.get('name');
  if (paramMemberId && paramName) {
    window.TEST_MEMBER_ID = paramMemberId;
    window.TEST_NAME = paramName;
    window.TEST_MODE = true;
  }
  
  // ← 여기서부터 기존 코드 시작
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

// ===== 테스트 모드 (개발 단계) =====
// TEST_MODE = true  : 로그인(성도고유번호 본인확인) 화면을 건너뛰고 아래 임시 계정을 자동 사용
// TEST_MODE = false : 실제 성도고유번호 + 이름 본인확인 로그인 화면 표시
// 운영 전환 시 아래 한 줄만 false 로 바꾸면 됩니다. (로그인 화면 코드는 그대로 보존)
const TEST_MODE = true;
// URL에 ?memberId=&name= 이 주어지면(예: home.html 임베드, 관리자 테스트 링크) 그 계정을 사용하고,
// 없으면 기본 임시 계정으로 대체합니다.
const TEST_MEMBER = {
  memberId: window.TEST_MEMBER_ID || "TEST-0001",
  name: window.TEST_NAME || "테스트사용자"
};

// 필수 이수 교육 5항목 — 백엔드 Code.gs의 REQUIRED_EDU_CATEGORIES와 동일 순서.
// getRequiredEducation 응답에 categories 가 실려오면 그걸 우선 쓰고, 아직 미배포라
// 응답이 없을 때만 이 기본값으로 대체.
const REQ_EDU_CATEGORIES_DEFAULT = ['복음방교사양성교육', '섭외전도교육', '상담교육', '복음방교재교육', '교사소양교육'];
const REQ_EDU_ICONS = { '복음방교사양성교육': '🌟', '섭외전도교육': '📣', '상담교육': '💬', '복음방교재교육': '📖', '교사소양교육': '🎓' };

// 2026-09-18: 5개 테마 탭 개편 — "교재" 시트 courseId 접두어(G1/G2/G3)를 백엔드가
// category 필드로 매핑해서 내려줌(Code.gs _studyCourseCategory_와 동일 결). "교사소양"/
// "무신앙"은 아직 교재가 없어 목록이 비어있으면 "준비 중"으로 표시(에러 아님).
const COURSE_TABS = [
  { key: 'teacherQuality', category: '교사소양', icon: '🎓', label: '교사 소양' },
  { key: 'counseling', category: '상담', icon: '💬', label: '상담' },
  { key: 'noFaith', category: '무신앙', icon: '🌱', label: '무신앙' },
  { key: 'gospelRoom', category: '복음방', icon: '📖', label: '복음방 교재' }
];

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
async function callApi(payload) {
  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

let state = {
  tab: 'reqEdu',          // reqEdu | teacherQuality | counseling | noFaith | gospelRoom (5개 테마 탭)
  memberId: TEST_MODE ? TEST_MEMBER.memberId : '',
  name:     TEST_MODE ? TEST_MEMBER.name : '',
  identified: TEST_MODE ? true : false,
  loading: false,
  courses: [],           // getCourseList 원본(전체, category 필드 포함): [{courseId, courseName, unitName, order, content, minutes, category}]
  expanded: null,        // 펼쳐진 courseId
  reqEdu: null           // getRequiredEducation 원본: { memberId, name, [카테고리]: 날짜|'', categories } — 읽기 전용
};

// list(교재 배열)를 courseName 기준으로 묶는다 — 5개 탭 전부 공용(카테고리로 이미 필터링된 리스트를 넘겨줌).
function groupCourses(list) {
  const groups = [];
  const idx = {};
  (list || state.courses).forEach(u => {
    if (!(u.courseName in idx)) {
      idx[u.courseName] = groups.length;
      groups.push({ courseName: u.courseName, units: [] });
    }
    groups[idx[u.courseName]].units.push(u);
  });
  groups.forEach(g => g.units.sort((a,b) => a.order - b.order));
  return groups;
}

function coursesForCategory(cat) {
  return state.courses.filter(c => c.category === cat);
}

// 2026-09-15: "내 수강생 현재 상태 입력" + AI 교재 추천(generateCoachingScript 호출) 기능 전체 삭제
// (사용자 요청 — 공부방은 교재 열람/학습 완료 체크에만 집중). 백엔드 액션도 함께 제거함.
// 2026-09-16: 단원별 "학습 완료" 체크 + 진도율 UI 전체 삭제(사용자 요청 — 공부방은 교재 열람 전용).
// 백엔드 updateProgress_/getMyProgress_/getAllProgress_ 도 함께 제거함.

// ===== 다운로드 (워드용 .doc) =====
// 파일명에 못 쓰는 문자(\/:*?"<>|, 줄바꿈)만 밑줄로 치환 — 내용은 건드리지 않음.
function sanitizeFilename(s) {
  return String(s || '').replace(/[\\/:*?"<>|\r\n]+/g, '_').trim();
}

// 워드가 열 수 있는 최소한의 HTML 문서를 만들어 application/msword로 다운로드.
// 실제 .docx(zip 기반)가 아니라 "워드가 HTML을 인식해서 열어주는" 방식(.doc 확장자
// + MS Office 네임스페이스 선언)이라 별도 라이브러리 없이 브라우저에서 바로 생성 가능.
function downloadUnitAsWord(u) {
  const paragraphs = String(u.content || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const bodyHtml = paragraphs.map(p =>
    `<p style="margin:0 0 12pt 0; line-height:1.6;">${esc(p).split('\n').join('<br>')}</p>`
  ).join('\n');

  const html = `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="UTF-8">
<meta name="ProgId" content="Word.Document">
<title>${esc(u.unitName)}</title>
<style>
  body { font-family: '맑은 고딕', 'Malgun Gothic', sans-serif; font-size: 11pt; }
  h1 { font-size: 20pt; margin: 0 0 4pt 0; }
  .subtitle { font-size: 10pt; color: #555555; margin: 0 0 18pt 0; }
</style>
</head>
<body>
<h1>${esc(u.unitName)}</h1>
<p class="subtitle">${esc(u.courseName)} · 예상 소요시간 약 ${u.minutes || '-'}분</p>
${bodyHtml}
</body>
</html>`;

  // 맨 앞 UTF-8 BOM — 워드가 한글을 EUC-KR 등으로 오인해 깨지는 것을 방지.
  const blob = new Blob(['﻿' + html], { type: 'application/msword;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = sanitizeFilename(`${u.courseName}_${u.unitName}.doc`);
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

const TAB_DEFS = [
  { key: 'reqEdu', icon: '✅', label: '내가 이수한 교육' },
  ...COURSE_TABS
];

function render() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="flex items-center px-4 py-2 border-b border-gray-100">
      <a href="home.html" class="text-xs text-gray-400 hover:text-gray-600">← 홈</a>
    </div>
    <div class="flex overflow-x-auto border-b" style="scrollbar-width:none">
      ${TAB_DEFS.map(t => `
        <button class="study-tab-btn shrink-0 py-3 text-xs font-medium whitespace-nowrap px-3 ${state.tab===t.key ? 'text-indigo-700 border-b-2 border-indigo-600' : 'text-gray-400'}" data-tab="${t.key}">${t.icon} ${esc(t.label)}</button>
      `).join('')}
    </div>
    <div id="body" class="p-5"></div>
  `;
  document.querySelectorAll('.study-tab-btn').forEach(btn => {
    btn.onclick = () => { state.tab = btn.dataset.tab; render(); };
  });

  const body = document.getElementById('body');

  // ===== 본인 확인 (TEST_MODE=false 일 때만 노출) =====
  if (!state.identified) {
    body.innerHTML = `
      <div class="space-y-3">
        <div class="text-sm text-gray-500 mb-2">먼저 본인 확인이 필요합니다.</div>
        <input id="input-memberId" type="text" placeholder="성도 고유번호" class="w-full border rounded-lg px-3 py-2 text-sm" value="${esc(state.memberId)}">
        <input id="input-name" type="text" placeholder="이름" class="w-full border rounded-lg px-3 py-2 text-sm" value="${esc(state.name)}">
        <button id="btn-identify" class="w-full bg-indigo-600 text-white rounded-lg py-2.5 text-sm font-medium">확인</button>
      </div>
    `;
    document.getElementById('btn-identify').onclick = () => {
      const mid = document.getElementById('input-memberId').value.trim();
      const nm = document.getElementById('input-name').value.trim();
      if (!mid || !nm) { alert('고유번호와 이름을 모두 입력해주세요.'); return; }
      state.memberId = mid;
      state.name = nm;
      state.identified = true;
      render();
      loadAll();
    };
    return;
  }

  if (state.tab === 'reqEdu') {
    renderRequiredEduTab(body);
    return;
  }
  const tabDef = COURSE_TABS.find(t => t.key === state.tab);
  renderCourseCategoryTab(body, tabDef);
}

async function loadAll() {
  state.loading = true;
  render();
  try {
    const [courseRes, reqEduRes] = await Promise.all([
      callApi({ action: 'getCourseList' }),
      callApi({ action: 'getRequiredEducation', memberId: state.memberId })
    ]);
    state.courses = (courseRes && courseRes.rows) || [];
    state.reqEdu = (reqEduRes && !reqEduRes.error) ? reqEduRes : null;
  } catch (err) {
    state.courses = [];
    state.reqEdu = null;
  }
  state.loading = false;
  render();
}

function renderContentHtml(text) {
  const paragraphs = String(text || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  return paragraphs.map(p => {
    const html = esc(p).split('\n').join('<br>');
    const isHeading = /^[●|]/.test(p);
    return isHeading
      ? `<div class="font-black text-indigo-700 text-[13px] mt-2 first:mt-0">${html}</div>`
      : `<div class="text-[13px] text-gray-700 leading-relaxed mt-1">${html}</div>`;
  }).join('');
}

// 2026-09-18: 5개 테마 탭("교사 소양"/"상담"/"무신앙"/"복음방 교재") 공용 렌더러 — 기존
// "교재 목록"(단원 목록+본문 열람+진도 슬라이더) 탭과 "내 학습 현황"(교재별 진도 요약) 탭을
// 하나로 합쳐서, 탭마다 카테고리로 필터링된 교재만 보여준다. 교재가 없는 카테고리(교사소양/
// 무신앙은 아직 등록된 교재 없음)는 에러 없이 "준비 중" 안내만 표시.
function renderCourseCategoryTab(body, tabDef) {
  if (state.loading) {
    body.innerHTML = `<div class="text-sm text-gray-400 text-center py-10">불러오는 중...</div>`;
    return;
  }
  const list = coursesForCategory(tabDef.category);
  if (list.length === 0) {
    body.innerHTML = `
      <div class="animate-fade-in text-center py-16">
        <div class="text-4xl mb-3">🚧</div>
        <div class="text-sm font-bold text-gray-500">${esc(tabDef.label)} 교재 준비 중입니다</div>
        <div class="text-xs text-gray-400 mt-1">교재가 등록되면 이곳에 자동으로 표시됩니다.</div>
      </div>`;
    return;
  }

  const groups = groupCourses(list);
  const totalUnits = groups.reduce((s,g) => s + g.units.length, 0);
  const cardCls = 'bg-white/80 backdrop-blur-md rounded-[1.5rem] shadow-[0_4px_15px_rgba(0,0,0,0.03)] border border-white/60 overflow-hidden';

  body.innerHTML = `
    <div class="animate-fade-in space-y-4">
      <div class="text-[11px] text-gray-400">${esc(state.name)}님 (${esc(state.memberId)}) · 교재를 눌러 내용을 확인하세요 · 전체 ${totalUnits}단원</div>

      ${groups.map(g => {
        const total = g.units.length;
        return `
        <div class="${cardCls}">
          <div class="px-4 py-3.5 bg-gradient-to-r from-indigo-50 to-purple-50 border-b border-indigo-100/70">
            <h3 class="text-[13.5px] font-black text-indigo-900">${esc(g.courseName)} <span class="text-[10.5px] font-normal text-gray-400">(${total}단원)</span></h3>
          </div>
          <div class="divide-y divide-gray-100">
            ${g.units.map(u => renderUnitRow(u)).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;

  body.querySelectorAll('.unit-row-head').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.course;
      state.expanded = state.expanded === id ? null : id;
      render();
    };
  });

  wireUnitControls(body);
}

function renderUnitRow(u) {
  const isExpanded = state.expanded === u.courseId;
  return `
    <div>
      <div class="unit-row-head px-4 py-3 flex items-center gap-3 cursor-pointer hover:bg-indigo-50/40 transition-all" data-course="${esc(u.courseId)}">
        <span class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 text-[10px] font-black bg-gray-100 text-gray-400">
          ${u.order}
        </span>
        <div class="flex-1 min-w-0">
          <div class="text-[12.5px] font-bold text-gray-800 truncate">${esc(u.unitName)}</div>
        </div>
        <span class="text-gray-300 text-[10px] transition-transform ${isExpanded ? 'rotate-90' : ''}">▶</span>
      </div>
      ${isExpanded ? renderUnitDetail(u) : ''}
    </div>`;
}

// 2026-09-16: 단원별 "학습 완료" 체크(진도 저장) 전부 삭제(사용자 요청) — 이제 교재 열람 전용.
function renderUnitDetail(u) {
  return `
    <div class="animate-fade-in-up bg-indigo-50/30 px-4 py-4 border-t border-indigo-100/60">
      <div class="text-[10.5px] text-gray-400 mb-2">예상 소요시간 약 ${u.minutes || '-'}분</div>
      <div class="bg-white rounded-[14px] p-3.5 max-h-64 overflow-y-auto border border-gray-100 shadow-sm">
        ${renderContentHtml(u.content)}
      </div>

      <button class="download-unit-btn mt-2.5 w-full bg-white border border-indigo-200 text-indigo-600 rounded-[12px] py-2 text-[12.5px] font-bold flex items-center justify-center gap-1.5 hover:bg-indigo-50 transition-all" data-course="${esc(u.courseId)}">
        <span>⬇</span> 워드로 다운로드
      </button>
    </div>`;
}

function wireUnitControls(body) {
  body.querySelectorAll('.download-unit-btn').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.course;
      const u = state.courses.find(c => c.courseId === id);
      if (u) downloadUnitAsWord(u);
    };
  });
}


// 2026-09-15: 교사 본인 체크 → 읽기 전용으로 변경(사용자 요청). 이수 등록은 교육부·전도부가
// 관리자 화면(edu-dashboard.html "필수교육 이수 등록")에서만 할 수 있다. 여기선 <button> 대신
// <div>로 바꿔 클릭 자체가 불가능하게 함.
function renderReqEduCard(cat, rec) {
  const date = rec[cat];
  const done = !!date;
  return `
    <div class="text-left p-3.5 rounded-[1.25rem] border ${done ? 'bg-emerald-50 border-emerald-300 shadow-[0_4px_15px_rgba(16,185,129,0.12)]' : 'bg-gray-50 border-gray-200'}">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-lg">${REQ_EDU_ICONS[cat] || '✅'}</span>
        <span class="w-5 h-5 rounded-md flex items-center justify-center shrink-0 border-2 ${done ? 'bg-emerald-500 border-emerald-500' : 'border-gray-300 bg-white'}">
          ${done ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M5 13l4 4L19 7"/></svg>' : ''}
        </span>
      </div>
      <div class="text-[12.5px] font-black ${done ? 'text-emerald-900' : 'text-gray-600'}">${esc(cat)}</div>
      <div class="text-[10.5px] mt-1 ${done ? 'text-emerald-600 font-bold' : 'text-gray-400'}">${done ? esc(date) + ' 이수' : '미이수'}</div>
    </div>`;
}

function renderRequiredEduTab(body) {
  if (state.loading) {
    body.innerHTML = `<div class="text-sm text-gray-400 text-center py-10">불러오는 중...</div>`;
    return;
  }
  const rec = state.reqEdu || {};
  const categories = (rec.categories && rec.categories.length) ? rec.categories : REQ_EDU_CATEGORIES_DEFAULT;
  const doneCount = categories.filter(c => rec[c]).length;
  const pct = categories.length ? Math.round(doneCount / categories.length * 100) : 0;

  body.innerHTML = `
    <div class="animate-fade-in space-y-4">
      <div class="text-[11px] text-gray-400">${esc(state.name)}님 (${esc(state.memberId)}) · 필수 이수 교육</div>

      <div class="rounded-[1.25rem] bg-indigo-50 border border-indigo-100 px-4 py-3 text-[12px] text-indigo-800 leading-relaxed">
        ℹ️ <b>교육부·전도부에서 등록한 이수 내역입니다.</b> 열람만 가능하며, 이수 기록이 실제와 다르면 교육부에 문의해주세요.
      </div>

      <div class="rounded-[1.5rem] p-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-[0_8px_25px_rgba(99,102,241,0.3)]">
        <div class="flex items-baseline justify-between">
          <span class="text-[12px] font-bold text-indigo-100">필수 교육 이수 현황</span>
          <span class="text-2xl font-black">${doneCount} / ${categories.length}개 이수</span>
        </div>
        <div class="mt-2 h-2 bg-white/25 rounded-full overflow-hidden">
          <div class="h-full bg-white rounded-full transition-all" style="width:${pct}%"></div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        ${categories.map(cat => renderReqEduCard(cat, rec)).join('')}
      </div>

      ${doneCount === categories.length ? `
      <div class="text-center text-[12px] font-bold text-emerald-600 py-2">🎉 필수 교육을 전부 이수했습니다!</div>` : ''}

      ${!state.reqEdu ? `<div class="text-[11px] text-gray-400 text-center py-2">서버에서 현재 이수 상태를 불러오지 못했습니다.</div>` : ''}
    </div>
  `;
}

render();
loadAll();
</script>
</body>
</html>
