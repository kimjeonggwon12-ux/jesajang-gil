<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>복음방 교사 - 캘린더</title>
<!--
  2026-09-22 신설: 캘린더 탭. home.html 하단 탭바 "캘린더"가 iframe 으로 불러온다(?memberId=&name=).
  관리자(admin-calendar.html)가 등록한 개강일·행사일을 월간 달력으로 보여주고, 행사일에서
  ① 스탭·기능자 신청 ② 참석자(섭외된 전도 대상자) 신청을 받는다. 하단에 [전도부 광고] 고정 섹션.
  백엔드(V2Backend.gs): getCalendarEvents / getCalendarAds / applyEventStaff / cancelEventStaff /
  applyEventAttendee / deleteEventAttendee / getMyEventSignups
-->
<style>
  :root {
    --color-primary:#5B4FCF; --color-primary-light:#EDE9FF; --color-bg:#F5F5F5; --color-card:#fff; --color-text:#1A1A2E;
    --color-text-sub:#666680; --color-border:#E8E8F0; --color-error:#D94040;
    --open-color:#2D9B6F; --event-color:#E8590C;
    --radius-card:16px; --radius-btn:12px; --shadow-card:0 2px 12px rgba(0,0,0,.08);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--color-bg); color:var(--color-text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif; }
  body { padding-bottom:96px; }
  .wrap { max-width:640px; margin:0 auto; padding:12px 12px 0; }
  .card { background:#fff; border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:14px; margin-bottom:14px; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-head b { font-size:20px; }
  .nav-btn { width:40px; height:40px; border-radius:50%; border:none; background:var(--color-primary-light); color:var(--color-primary); font-size:20px; cursor:pointer; }
  .today-btn { height:32px; padding:0 12px; border-radius:16px; border:1.5px solid var(--color-primary); background:#fff; color:var(--color-primary); font-weight:700; font-size:13px; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); }
  .dow { text-align:center; font-size:12px; font-weight:700; color:var(--color-text-sub); padding:6px 0; }
  .dow.sun, .day.sun .num { color:#D94040; } .dow.sat, .day.sat .num { color:#2F6FDE; }
  .day { min-height:70px; border-top:1px solid var(--color-border); padding:3px 2px; cursor:pointer; overflow:hidden; }
  .day.out { opacity:.35; }
  .day .num { font-size:12px; font-weight:600; width:22px; height:22px; line-height:22px; text-align:center; border-radius:50%; display:inline-block; margin-left:1px; }
  .day.today .num { background:var(--color-primary); color:#fff !important; }
  .chip { display:block; font-size:10px; line-height:14px; border-radius:3px; padding:0 3px; margin-top:2px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip.open { background:var(--open-color); } .chip.event { background:var(--event-color); }
  .more { font-size:10px; color:var(--color-text-sub); padding-left:3px; }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--color-text-sub); margin-top:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .ad-title { font-size:15px; font-weight:800; color:var(--color-primary); margin-bottom:8px; }
  .ad { border-left:4px solid var(--color-primary); background:var(--color-primary-light); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .ad b { font-size:14px; } .ad div { font-size:13px; color:#3b3b55; margin-top:3px; white-space:pre-wrap; }
  .sheet-back { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:#fff; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:20px 16px 24px; }
  .btn { display:flex; align-items:center; justify-content:center; height:48px; border-radius:var(--radius-btn); background:var(--color-primary); color:#fff; font-size:15px; font-weight:700; border:none; width:100%; cursor:pointer; }
  .btn.out { background:#fff; color:var(--color-primary); border:1.5px solid var(--color-primary); }
  .btn:disabled { opacity:.5; }
  .inp { width:100%; min-height:44px; border:1px solid var(--color-border); border-radius:10px; padding:8px 12px; font-size:15px; font-family:inherit; background:#fff; color:var(--color-text); }
  .lbl { display:block; font-size:13px; font-weight:700; margin:14px 0 6px; } .req { color:var(--color-error); }
  .seg { display:flex; flex-wrap:wrap; gap:6px; }
  .seg button { height:38px; min-width:44px; padding:0 14px; border-radius:999px; font-size:14px; font-weight:600; border:1.5px solid var(--color-border); background:#fff; color:#666680; cursor:pointer; }
  .seg button.on { background:var(--color-primary); color:#fff; border-color:var(--color-primary); }
  .pill { display:inline-block; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; color:#fff; }
  .hint { font-size:12px; color:var(--color-text-sub); }
  .ev-row { display:flex; gap:10px; align-items:center; padding:12px; border:1px solid var(--color-border); border-radius:12px; margin-bottom:8px; cursor:pointer; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:rgba(26,26,46,.92); color:#fff; padding:12px 18px; border-radius:12px; font-size:14px; z-index:80; max-width:88vw; text-align:center; }
  .toast.err { background:var(--color-error); }
  .guest { display:flex; align-items:center; gap:8px; padding:8px 10px; background:#F7F7FB; border-radius:10px; margin-top:6px; font-size:13px; }
  .guest button { margin-left:auto; border:none; background:none; color:var(--color-error); font-size:12px; cursor:pointer; }
</style>
</head>
<body>
<main class="wrap">
  <div class="card" style="padding-bottom:10px">
    <div class="cal-head">
      <button class="nav-btn" id="prev">‹</button>
      <div style="text-align:center"><b id="title"></b></div>
      <button class="nav-btn" id="next">›</button>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:4px"><button class="today-btn" id="todayBtn">오늘</button></div>
    <div class="grid" id="dow"></div>
    <div class="grid" id="days"></div>
    <div class="legend"><span><i style="background:var(--open-color)"></i>개강일</span><span><i style="background:var(--event-color)"></i>행사일</span></div>
  </div>
  <div class="card" id="adBox">
    <div class="ad-title">📢 전도부 광고</div>
    <div id="ads"><div class="hint">불러오는 중...</div></div>
  </div>
</main>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";
const qs = new URLSearchParams(location.search);
const MEMBER_ID = qs.get('memberId') || 'TEST-0001';
const MY_NAME = qs.get('name') || '테스트교사';
const DEPTS5 = ['교', '자', '장', '부', '청'];
const ATT_ROLES = [['인', '인도자'], ['교', '교사'], ['섬', '섬김이'], ['협', '협력교사']];
const STAGES = ['섭외', '친분', '만남1', '만남2', '상담1', '상담2', '복음방', '센터소개', '센터수강'];
const DOW = ['일', '월', '화', '수', '목', '금', '토'];

const st = { y: 0, m: 0, events: [], loaded: false };
const p2 = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${p2(m + 1)}-${p2(d)}`;
const today = new Date(); const TODAY = ymd(today.getFullYear(), today.getMonth(), today.getDate());
st.y = today.getFullYear(); st.m = today.getMonth();

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, isErr) {
  const h = document.getElementById('toastHost'); h.innerHTML = `<div class="toast ${isErr ? 'err' : ''}">${esc(msg)}</div>`;
  setTimeout(() => { h.innerHTML = ''; }, 2600);
}
async function callApi(payload) {
  const res = await fetch(PROXY_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  if (!(res.headers.get('content-type') || '').includes('application/json')) throw new Error('서버 연결 오류. 잠시 후 다시 시도해주세요.');
  return await res.json();
}
function closeSheet() { document.getElementById('sheetHost').innerHTML = ''; }
function openSheet(html) {
  const h = document.getElementById('sheetHost');
  h.innerHTML = `<div class="sheet-back" id="sb"><div class="sheet">${html}</div></div>`;
  document.getElementById('sb').onclick = e => { if (e.target.id === 'sb') closeSheet(); };
}
const evClass = e => e.type === '개강' ? 'open' : 'event';
const eventsOn = date => st.events.filter(e => e.startDate <= date && date <= e.endDate);
function rangeText(e) { return e.startDate === e.endDate ? e.startDate : `${e.startDate} ~ ${e.endDate}`; }

// ---------- 달력 ----------
function drawCalendar() {
  document.getElementById('title').textContent = `${st.y}년 ${st.m + 1}월`;
  document.getElementById('dow').innerHTML = DOW.map((d, i) => `<div class="dow ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</div>`).join('');
  const first = new Date(st.y, st.m, 1), startOffset = first.getDay();
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(st.y, st.m, 1 - startOffset + i);
    const date = ymd(d.getFullYear(), d.getMonth(), d.getDate());
    const evs = eventsOn(date);
    const dow = d.getDay();
    cells.push(`<div class="day ${d.getMonth() !== st.m ? 'out' : ''} ${date === TODAY ? 'today' : ''} ${dow === 0 ? 'sun' : dow === 6 ? 'sat' : ''}" data-date="${date}">
      <span class="num">${d.getDate()}</span>
      ${evs.slice(0, 2).map(e => `<span class="chip ${evClass(e)}">${esc(e.title)}</span>`).join('')}
      ${evs.length > 2 ? `<span class="more">+${evs.length - 2}</span>` : ''}
    </div>`);
    if (i === 34 && new Date(st.y, st.m, 1 - startOffset + 35).getMonth() !== st.m) break; // 5주로 충분하면 6주째 생략
  }
  document.getElementById('days').innerHTML = cells.join('');
}
document.getElementById('days').onclick = e => {
  const c = e.target.closest('.day'); if (!c) return;
  const evs = eventsOn(c.dataset.date);
  if (evs.length === 1) openEvent(evs[0]);
  else if (evs.length > 1) openDayList(c.dataset.date, evs);
};
document.getElementById('prev').onclick = () => { st.m--; if (st.m < 0) { st.m = 11; st.y--; } drawCalendar(); };
document.getElementById('next').onclick = () => { st.m++; if (st.m > 11) { st.m = 0; st.y++; } drawCalendar(); };
document.getElementById('todayBtn').onclick = () => { st.y = today.getFullYear(); st.m = today.getMonth(); drawCalendar(); };

function openDayList(date, evs) {
  openSheet(`<div style="font-size:18px;font-weight:800;margin-bottom:12px">${date}</div>
    ${evs.map((e, i) => `<div class="ev-row" data-i="${i}"><span class="pill" style="background:var(--${e.type === '개강' ? 'open' : 'event'}-color)">${esc(e.type)}</span><div style="flex:1"><b>${esc(e.title)}</b><div class="hint">${esc(rangeText(e))}${e.place ? ' · ' + esc(e.place) : ''}</div></div>›</div>`).join('')}`);
  document.querySelectorAll('.ev-row').forEach(r => { r.onclick = () => openEvent(evs[Number(r.dataset.i)]); });
}

// ---------- 행사 상세 + 신청 ----------
let cur = null, mine = { staff: null, attendees: [], totalAttendees: 0 };
async function openEvent(ev) {
  cur = ev; mine = { staff: null, attendees: [], totalAttendees: 0 };
  renderEvent(true);
  if (ev.type !== '행사') return;
  try {
    const res = await callApi({ action: 'getMyEventSignups', eventId: ev.eventId, memberId: MEMBER_ID });
    if (res && !res.error && cur === ev) { mine = res; renderEvent(false); }
  } catch (e) { toast(e.message, true); }
}
function renderEvent(loading) {
  const e = cur, isEvent = e.type === '행사';
  openSheet(`
    <span class="pill" style="background:var(--${isEvent ? 'event' : 'open'}-color)">${esc(e.type)}</span>
    <div style="font-size:21px;font-weight:800;margin:8px 0 4px">${esc(e.title)}</div>
    <div class="hint">📅 ${esc(rangeText(e))}${e.place ? ' · 📍 ' + esc(e.place) : ''}${e.dept ? ' · ' + esc(e.dept) : ''}</div>
    ${e.desc ? `<div style="margin-top:12px;font-size:14px;white-space:pre-wrap">${esc(e.desc)}</div>` : ''}
    ${isEvent ? `
    <div style="margin-top:18px;display:flex;flex-direction:column;gap:10px">
      <button class="btn" id="goStaff">🙋 스탭·기능자 신청${mine.staff ? ' (신청됨 · ' + esc(mine.staff.dept) + ')' : ''}</button>
      <button class="btn out" id="goAtt">👥 참석자 신청 <span style="font-weight:400">· 총 ${mine.totalAttendees}명${mine.attendees.length ? ' (내 섭외 ' + mine.attendees.length + '명)' : ''}</span></button>
    </div>
    ${loading ? '<div class="hint" style="text-align:center;margin-top:8px">내 신청 내역 확인 중...</div>' : ''}` : '<div class="hint" style="margin-top:14px">개강일은 안내용이에요.</div>'}
    <div style="text-align:center;margin-top:12px"><button class="hint" style="background:none;border:none;cursor:pointer" onclick="closeSheet()">닫기</button></div>`);
  const s = document.getElementById('goStaff'); if (s) s.onclick = openStaffForm;
  const a = document.getElementById('goAtt'); if (a) a.onclick = openAttForm;
}
function segHtml(id, opts, val) { return `<div class="seg" id="${id}">${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<button type="button" data-v="${esc(v)}" class="${v === val ? 'on' : ''}">${esc(l)}</button>`; }).join('')}</div>`; }
function bindSeg(id, set) { const el = document.getElementById(id); el.onclick = e => { const b = e.target.closest('button'); if (!b) return; el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); set(b.dataset.v); }; }

function openStaffForm() {
  const f = { dept: (mine.staff && mine.staff.dept) || '', note: (mine.staff && mine.staff.note) || '' };
  openSheet(`
    <div style="font-size:19px;font-weight:800">스탭·기능자 신청</div>
    <div class="hint" style="margin-top:2px">${esc(cur.title)} · ${esc(rangeText(cur))}</div>
    <label class="lbl">부서 <span class="req">*</span></label>${segHtml('sDept', DEPTS5, f.dept)}
    <label class="lbl">가능한 역할·메모 <small style="font-weight:400">(선택)</small></label>
    <input class="inp" id="sNote" maxlength="100" placeholder="예: 안내, 사진, 음향, 찬양 가능" value="${esc(f.note)}">
    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn out" style="flex:1" id="sBack">뒤로</button><button class="btn" style="flex:2" id="sSave">${mine.staff ? '수정' : '신청'}</button>
    </div>
    ${mine.staff ? '<div style="text-align:center;margin-top:10px"><button id="sCancel" style="border:none;background:none;color:var(--color-error);font-size:13px;cursor:pointer">신청 취소</button></div>' : ''}`);
  bindSeg('sDept', v => { f.dept = v; });
  document.getElementById('sBack').onclick = () => renderEvent(false);
  document.getElementById('sSave').onclick = async () => {
    if (!f.dept) return toast('부서를 선택해주세요.', true);
    const btn = document.getElementById('sSave'); btn.disabled = true;
    try {
      const res = await callApi({ action: 'applyEventStaff', eventId: cur.eventId, memberId: MEMBER_ID, name: MY_NAME, dept: f.dept, note: document.getElementById('sNote').value.trim() });
      if (res && res.error) throw new Error(res.error);
      mine.staff = { dept: f.dept, note: document.getElementById('sNote').value.trim() };
      toast('신청했어요!'); renderEvent(false);
    } catch (e) { toast(e.message, true); btn.disabled = false; }
  };
  const c = document.getElementById('sCancel');
  if (c) c.onclick = async () => {
    if (!confirm('스탭·기능자 신청을 취소할까요?')) return;
    try { await callApi({ action: 'cancelEventStaff', eventId: cur.eventId, memberId: MEMBER_ID }); mine.staff = null; toast('취소했어요.'); renderEvent(false); }
    catch (e) { toast(e.message, true); }
  };
}

function openAttForm() {
  const last = mine.attendees[mine.attendees.length - 1] || {};
  const f = { applicantDept: last.applicantDept || (mine.staff && mine.staff.dept) || '', applicantRole: last.applicantRole || '', guestName: '', guestDept: '', guestAge: '', guestStage: '' };
  openSheet(`
    <div style="font-size:19px;font-weight:800">참석자 신청</div>
    <div class="hint" style="margin-top:2px">${esc(cur.title)} · 섭외된 전도 대상자를 등록해요. 총 참석 예정 <b id="totalNow">${mine.totalAttendees}</b>명</div>
    ${mine.attendees.length ? `<div style="margin-top:10px"><div class="hint">내가 등록한 섭외자</div>${mine.attendees.map(g => `<div class="guest"><b>${esc(g.guestName)}</b>${esc(g.guestDept)} · ${esc(g.guestAge)}세 · ${esc(g.guestStage)}<button data-del="${esc(g.id)}">삭제</button></div>`).join('')}</div>` : ''}
    <div style="font-size:14px;font-weight:800;margin-top:16px;color:var(--color-primary)">신청자</div>
    <label class="lbl">신청자 부서 <span class="req">*</span></label>${segHtml('aDept', DEPTS5, f.applicantDept)}
    <label class="lbl">신청자 역할 <span class="req">*</span></label>${segHtml('aRole', ATT_ROLES, f.applicantRole)}
    <div style="font-size:14px;font-weight:800;margin-top:18px;color:var(--color-primary)">섭외자 정보</div>
    <label class="lbl">이름 <span class="req">*</span></label><input class="inp" id="gName" maxlength="30">
    <label class="lbl">부서 <span class="req">*</span></label>${segHtml('gDept', DEPTS5, '')}
    <label class="lbl">나이 <span class="req">*</span></label><input class="inp" id="gAge" type="number" inputmode="numeric" min="1" max="120" style="max-width:140px">
    <label class="lbl">전도단계 <span class="req">*</span></label>${segHtml('gStage', STAGES, '')}
    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn out" style="flex:1" id="aBack">뒤로</button><button class="btn" style="flex:2" id="aSave">섭외자 등록</button>
    </div>`);
  bindSeg('aDept', v => { f.applicantDept = v; }); bindSeg('aRole', v => { f.applicantRole = v; });
  bindSeg('gDept', v => { f.guestDept = v; }); bindSeg('gStage', v => { f.guestStage = v; });
  document.getElementById('aBack').onclick = () => renderEvent(false);
  document.querySelectorAll('[data-del]').forEach(b => { b.onclick = async () => {
    if (!confirm('이 섭외자 등록을 삭제할까요?')) return;
    try {
      const res = await callApi({ action: 'deleteEventAttendee', id: b.dataset.del, memberId: MEMBER_ID });
      if (res && res.error) throw new Error(res.error);
      mine.attendees = mine.attendees.filter(x => x.id !== b.dataset.del); mine.totalAttendees = Math.max(0, mine.totalAttendees - 1);
      toast('삭제했어요.'); openAttForm();
    } catch (e) { toast(e.message, true); }
  }; });
  document.getElementById('aSave').onclick = async () => {
    f.guestName = document.getElementById('gName').value.trim(); f.guestAge = document.getElementById('gAge').value.trim();
    if (!f.applicantDept) return toast('신청자 부서를 선택해주세요.', true);
    if (!f.applicantRole) return toast('신청자 역할을 선택해주세요.', true);
    if (!f.guestName) return toast('섭외자 이름을 입력해주세요.', true);
    if (!f.guestDept) return toast('섭외자 부서를 선택해주세요.', true);
    if (!f.guestAge) return toast('섭외자 나이를 입력해주세요.', true);
    if (!f.guestStage) return toast('섭외자 전도단계를 선택해주세요.', true);
    const btn = document.getElementById('aSave'); btn.disabled = true;
    try {
      const res = await callApi(Object.assign({ action: 'applyEventAttendee', eventId: cur.eventId, applicantId: MEMBER_ID, applicantName: MY_NAME }, f));
      if (res && res.error) throw new Error(res.error);
      mine.attendees.push({ id: res.id, applicantDept: f.applicantDept, applicantRole: f.applicantRole, guestName: f.guestName, guestDept: f.guestDept, guestAge: f.guestAge, guestStage: f.guestStage });
      mine.totalAttendees++;
      toast('섭외자를 등록했어요!'); openAttForm();
    } catch (e) { toast(e.message, true); btn.disabled = false; }
  };
}

// ---------- 로드 ----------
async function loadAll() {
  try {
    const [evRes, adRes] = await Promise.all([callApi({ action: 'getCalendarEvents' }), callApi({ action: 'getCalendarAds' })]);
    st.events = (evRes && evRes.rows) || [];
    const ads = (adRes && adRes.rows) || [];
    document.getElementById('ads').innerHTML = ads.length
      ? ads.map(a => `<div class="ad"><b>${esc(a.title)}</b>${a.body ? `<div>${esc(a.body)}</div>` : ''}</div>`).join('')
      : '<div class="hint">등록된 공지가 없어요.</div>';
  } catch (e) { document.getElementById('ads').innerHTML = `<div class="hint" style="color:var(--color-error)">${esc(e.message)}</div>`; }
  drawCalendar();
}
drawCalendar();
loadAll();
</script>
