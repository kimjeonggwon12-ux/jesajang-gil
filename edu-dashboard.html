<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제사장의 길 - 교육부 대시보드</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  html, body { margin:0; padding:0; background:#f4f6f5; }
  * { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; }
</style>
</head>
<body>
<div id="root" class="max-w-4xl mx-auto min-h-screen bg-white shadow"></div>

<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

let rows = [];
let roster = [];       // getRoster 캐시 (교사명단)
let rosterTiers = [];  // 교사구분 참고 목록 (백엔드 TEACHER_TIERS)
let actRows = [];      // getAllActivities 캐시 (미배포/실패 시 빈 배열로 degrade)
let courseRows = [];   // getCourseList 캐시 ("공부방" 교재 목록, 미배포/실패 시 빈 배열로 degrade)
let progressRows = []; // getAllProgress 캐시 (전 교사 "이수내역", 미배포/실패 시 빈 배열로 degrade)
let loading = true;

// "최근 N일 내 학습 기록 유무" 판정 기준일. 활동/피드백 쪽 30일 기준과 달리
// 공부방은 단원 단위라 더 촘촘히 보려고 14일로 잡음 — 필요하면 이 값만 조정.
const STUDY_RECENT_DAYS = 14;

let tierSuggestions = null;  // null = 아직 안 불러옴, [] = 불러왔지만 변경 대상 없음
let tierLoading = false;
let tierApplying = {};       // memberId → true (승인 처리 중)

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function callApi(payload) {
  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

// 아주 단순한 키워드 기반 카테고리 분류 (추후 AI 분류로 교체 가능)
function categorize(text) {
  if (!text) return '기타';
  const t = text;
  if (t.includes('복음방') || t.includes('전도')) return '복음방/전도';
  if (t.includes('상담')) return '상담 기술';
  if (t.includes('관계') || t.includes('갈등') || t.includes('싸') ) return '관계/갈등';
  if (t.includes('동기') || t.includes('의욕') || t.includes('열정')) return '동기부여';
  if (t.includes('센터') || t.includes('수강')) return '센터 활동';
  return '기타';
}

function daysDiff(a, b) {
  return (new Date(b) - new Date(a)) / (1000 * 60 * 60);
}

async function load() {
  loading = true;
  render();
  const res = await callApi({ action: 'getAllFeedback' });
  rows = res.rows || [];

  // 교사명단 + 활동실적은 실패해도 기존 피드백 통계는 그대로 보이도록 개별 try/catch.
  try {
    const rosterRes = await callApi({ action: 'getRoster' });
    roster = (rosterRes && Array.isArray(rosterRes.rows)) ? rosterRes.rows : [];
    rosterTiers = (rosterRes && Array.isArray(rosterRes.tiers)) ? rosterRes.tiers : [];
  } catch (e) { roster = []; rosterTiers = []; }

  try {
    const actRes = await callApi({ action: 'getAllActivities' });
    actRows = (actRes && Array.isArray(actRes.rows)) ? actRes.rows : [];
  } catch (e) { actRows = []; }

  try {
    const courseRes = await callApi({ action: 'getCourseList' });
    courseRows = (courseRes && Array.isArray(courseRes.rows)) ? courseRes.rows : [];
  } catch (e) { courseRows = []; }

  try {
    const progRes = await callApi({ action: 'getAllProgress' });
    progressRows = (progRes && Array.isArray(progRes.rows)) ? progRes.rows : [];
  } catch (e) { progressRows = []; }

  loading = false;
  render();
}

// ============ 등급 심사 (checkTierChanges / applyTierChange) ============

async function loadTierSuggestions() {
  tierLoading = true;
  render();
  try {
    const res = await callApi({ action: 'checkTierChanges' });
    tierSuggestions = Array.isArray(res) ? res : (res && Array.isArray(res.rows) ? res.rows : []);
  } catch (e) {
    tierSuggestions = [];
    alert('변경 예정 목록을 불러오지 못했습니다: ' + e.message);
  }
  tierLoading = false;
  render();
}

async function approveTierChange(memberId, newTier) {
  tierApplying[memberId] = true;
  render();
  try {
    const res = await callApi({ action: 'applyTierChange', memberId, newTier });
    if (res && res.error) throw new Error(res.error);
    tierSuggestions = (tierSuggestions || []).filter(s => s.memberId !== memberId);
    // 로컬 roster 캐시도 갱신 (다음 새로고침 전까지 부서별 교사 현황 차트에 즉시 반영)
    const idx = roster.findIndex(r => r.memberId === memberId);
    if (idx >= 0) roster[idx].tier = newTier;
  } catch (e) {
    alert('반영 중 오류가 발생했습니다: ' + e.message);
  }
  delete tierApplying[memberId];
  render();
}

function renderTierSection() {
  return `
    <div class="mb-8 pb-6 border-b border-gray-200">
      <div class="flex items-center justify-between mb-1">
        <div class="text-base font-bold text-gray-800">등급 심사</div>
        <button id="btn-tier-load" ${tierLoading ? 'disabled' : ''} class="text-xs bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg transition-colors disabled:opacity-50">
          ${tierLoading ? '불러오는 중...' : '변경 예정 목록 불러오기'}
        </button>
      </div>
      <div class="text-xs text-gray-400 mb-4">휴교사 · 교사 · 정교사 · 우수교사 승급/강등 후보 — 확인 후 개별 승인해야 실제 반영됩니다</div>
      ${renderTierTable()}
    </div>
  `;
}

function renderTierTable() {
  if (tierLoading) {
    return `<div class="text-xs text-gray-400 border rounded-lg p-4 text-center">불러오는 중...</div>`;
  }
  if (tierSuggestions === null) {
    return `<div class="text-xs text-gray-400 border rounded-lg p-4 text-center">"변경 예정 목록 불러오기"를 눌러 확인하세요.</div>`;
  }
  if (tierSuggestions.length === 0) {
    return `<div class="text-xs text-gray-400 border rounded-lg p-4 text-center">변경 대상이 없습니다.</div>`;
  }
  return `
    <div class="border rounded-lg overflow-hidden overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50"><tr class="text-left">
          <th class="p-2">이름</th><th class="p-2">현재등급</th><th class="p-2">제안등급</th><th class="p-2">사유</th><th class="p-2"></th>
        </tr></thead>
        <tbody>
          ${tierSuggestions.map(s => `
            <tr class="border-t">
              <td class="p-2 font-medium text-gray-800">${esc(s.name)}<div class="text-[10px] text-gray-400">${esc(s.memberId)}</div></td>
              <td class="p-2 text-gray-500">${esc(s.currentTier)}</td>
              <td class="p-2 font-medium ${s.suggestedTier === s.currentTier ? 'text-slate-600' : 'text-indigo-700'}">${esc(s.suggestedTier)}</td>
              <td class="p-2 text-gray-500">${esc(s.reason)}</td>
              <td class="p-2 whitespace-nowrap">
                <button class="tier-approve-btn text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-md disabled:opacity-50" data-mid="${esc(s.memberId)}" data-tier="${esc(s.suggestedTier)}" ${tierApplying[s.memberId] ? 'disabled' : ''}>
                  ${tierApplying[s.memberId] ? '처리중...' : '승인'}
                </button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function wireTierSection() {
  const loadBtn = document.getElementById('btn-tier-load');
  if (loadBtn) loadBtn.onclick = loadTierSuggestions;
  document.querySelectorAll('.tier-approve-btn').forEach(btn => {
    btn.onclick = () => approveTierChange(btn.dataset.mid, btn.dataset.tier);
  });
}

// ============ 부서별 교사 현황 (getRoster 기반) ============

function daysAgo(dateStr, days) {
  const d = new Date(dateStr);
  if (isNaN(d)) return false;
  return (Date.now() - d.getTime()) <= days * 24 * 60 * 60 * 1000;
}

function buildRosterStats() {
  const deptCounts = {};
  roster.forEach(r => {
    const d = r.dept || '(부서 미상)';
    deptCounts[d] = (deptCounts[d] || 0) + 1;
  });
  const deptLabels = Object.keys(deptCounts).sort((a, b) => deptCounts[b] - deptCounts[a]);

  // 교사구분: 백엔드가 내려준 참고 목록 순서를 우선 사용 (하드코딩 방지),
  // 목록에 없는 값이 실제로 존재하면 뒤에 추가로 붙임.
  const tierCounts = {};
  roster.forEach(r => {
    const t = r.tier || '(미분류)';
    tierCounts[t] = (tierCounts[t] || 0) + 1;
  });
  const tierLabels = rosterTiers.slice();
  Object.keys(tierCounts).forEach(t => { if (!tierLabels.includes(t)) tierLabels.push(t); });

  // 최근 30일 내 활동 또는 피드백 기록이 있는 memberId 집합
  const recent30 = new Set();
  rows.forEach(r => { if (r.memberId && daysAgo(r.submittedAt, 30)) recent30.add(String(r.memberId).trim()); });
  actRows.forEach(r => { if (r.memberId && daysAgo(r.submittedAt, 30)) recent30.add(String(r.memberId).trim()); });

  // 부서별 × (최근 30일 기록 有/無) 교차 집계
  const crossActive = {};
  const crossInactive = {};
  deptLabels.forEach(d => { crossActive[d] = 0; crossInactive[d] = 0; });
  roster.forEach(r => {
    const d = r.dept || '(부서 미상)';
    if (recent30.has(String(r.memberId).trim())) crossActive[d] = (crossActive[d] || 0) + 1;
    else crossInactive[d] = (crossInactive[d] || 0) + 1;
  });

  return { deptLabels, deptCounts, tierLabels, tierCounts, crossActive, crossInactive };
}

function renderRosterSection() {
  if (roster.length === 0) return '';
  return `
    <div class="mb-8 pb-6 border-b border-gray-200">
      <div class="text-base font-bold text-gray-800 mb-1">부서별 교사 현황</div>
      <div class="text-xs text-gray-400 mb-4">교사명단 등록 ${roster.length}명 기준 (부서/교사구분은 시트 값을 그대로 사용)</div>

      <div class="grid md:grid-cols-2 gap-6 mb-6">
        <div>
          <div class="text-sm font-medium text-gray-700 mb-2">부서별 등록 교사 수</div>
          <canvas id="deptCountChart" height="200"></canvas>
        </div>
        <div>
          <div class="text-sm font-medium text-gray-700 mb-2">교사구분(등급)별 분포</div>
          <canvas id="tierChart" height="200"></canvas>
        </div>
      </div>

      <div>
        <div class="text-sm font-medium text-gray-700 mb-2">부서별 · 최근 30일 활동/피드백 기록 유무</div>
        <canvas id="crossChart" height="220"></canvas>
      </div>
    </div>
  `;
}

function renderRosterCharts() {
  if (roster.length === 0) return;
  const s = buildRosterStats();
  const TIER_COLORS = ['#94a3b8', '#4338ca', '#0ea5e9', '#059669', '#d97706', '#dc2626'];

  new Chart(document.getElementById('deptCountChart'), {
    type: 'bar',
    data: {
      labels: s.deptLabels,
      datasets: [{ data: s.deptLabels.map(d => s.deptCounts[d]), backgroundColor: '#4338ca' }]
    },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });

  new Chart(document.getElementById('tierChart'), {
    type: 'doughnut',
    data: {
      labels: s.tierLabels,
      datasets: [{ data: s.tierLabels.map(t => s.tierCounts[t] || 0), backgroundColor: s.tierLabels.map((_, i) => TIER_COLORS[i % TIER_COLORS.length]) }]
    },
    options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } } }
  });

  new Chart(document.getElementById('crossChart'), {
    type: 'bar',
    data: {
      labels: s.deptLabels,
      datasets: [
        { label: '최근 30일 기록 있음', data: s.deptLabels.map(d => s.crossActive[d] || 0), backgroundColor: '#059669' },
        { label: '최근 30일 기록 없음', data: s.deptLabels.map(d => s.crossInactive[d] || 0), backgroundColor: '#d97706' }
      ]
    },
    options: {
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
      scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }
    }
  });
}

// ============ 공부방 진도 현황 (getCourseList + getAllProgress 기반) ============

function buildStudyStats() {
  // 교재별 단원 수 — getCourseList 등장 순서를 그대로 교재 순서로 사용(G1→G2→G3).
  const courseNames = [];
  const unitCountByCourse = {};
  courseRows.forEach(u => {
    if (!(u.courseName in unitCountByCourse)) { unitCountByCourse[u.courseName] = 0; courseNames.push(u.courseName); }
    unitCountByCourse[u.courseName]++;
  });

  // 교재별 진도 합계(이수내역 전체 행 기준)
  const progressSumByCourse = {};
  courseNames.forEach(c => { progressSumByCourse[c] = 0; });
  progressRows.forEach(r => {
    if (!(r.courseName in progressSumByCourse)) progressSumByCourse[r.courseName] = 0;
    progressSumByCourse[r.courseName] += Number(r.progress || 0);
  });

  // 교재별 평균 진도(전체 교사 대비) = 합계 / (교사 수 × 단원 수). 교사명단이 없으면 계산 불가.
  const courseAvg = {};
  courseNames.forEach(c => {
    const denom = roster.length > 0 ? roster.length * (unitCountByCourse[c] || 1) : 0;
    courseAvg[c] = denom > 0 ? Math.round((progressSumByCourse[c] || 0) / denom) : 0;
  });

  // 교사별 진도 시작 여부 / 최근 N일 내 학습 여부
  const startedIds = new Set();
  const recentIds = new Set();
  progressRows.forEach(r => {
    const id = String(r.memberId || '').trim();
    if (!id) return;
    startedIds.add(id);
    if (daysAgo(r.lastStudiedAt, STUDY_RECENT_DAYS)) recentIds.add(id);
  });

  const notStarted = roster.filter(r => !startedIds.has(String(r.memberId).trim()));
  const recentCount = roster.filter(r => recentIds.has(String(r.memberId).trim())).length;
  const notRecentCount = Math.max(0, roster.length - recentCount);

  return { courseNames, courseAvg, notStarted, recentCount, notRecentCount };
}

function renderNotStartedTable(notStarted) {
  if (roster.length === 0) {
    return `<div class="text-xs text-gray-400 border rounded-lg p-4 text-center">교사명단(getRoster)을 불러오지 못해 목록을 계산할 수 없습니다.</div>`;
  }
  if (notStarted.length === 0) {
    return `<div class="text-xs text-gray-400 border rounded-lg p-4 text-center">전원 공부방을 시작했습니다.</div>`;
  }
  const CAP = 100;
  const shown = notStarted.slice(0, CAP);
  return `
    <div class="border rounded-lg overflow-hidden">
      <div class="max-h-64 overflow-y-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 sticky top-0"><tr class="text-left">
            <th class="p-2">이름</th><th class="p-2">고유번호</th><th class="p-2">부서</th>
          </tr></thead>
          <tbody>
            ${shown.map(r => `
              <tr class="border-t">
                <td class="p-2 font-medium text-gray-800">${esc(r.name)}</td>
                <td class="p-2 text-gray-400">${esc(r.memberId)}</td>
                <td class="p-2 text-gray-500">${esc(r.dept || '')}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${notStarted.length > CAP ? `<div class="text-[11px] text-gray-400 text-center py-1.5 bg-gray-50 border-t">외 ${notStarted.length - CAP}명 더</div>` : ''}
    </div>
  `;
}

function renderStudySection() {
  if (courseRows.length === 0) return ''; // 아직 seedStudyCourses_ 실행 전이거나 미배포
  const s = buildStudyStats();
  const courseCount = new Set(courseRows.map(u => u.courseName)).size;

  return `
    <div class="mb-8 pb-6 border-b border-gray-200">
      <div class="text-base font-bold text-gray-800 mb-1">공부방 진도 현황</div>
      <div class="text-xs text-gray-400 mb-4">
        교재 ${courseCount}종 · 총 ${courseRows.length}단원${roster.length > 0 ? ` · 교사명단 ${roster.length}명 기준` : ' · 교사명단 미로딩(전체 대비 진도 계산 불가)'}
      </div>

      <div class="mb-6">
        <div class="text-sm font-medium text-gray-700 mb-2">교재별 평균 진도 (전체 교사 대비)</div>
        ${roster.length === 0
          ? `<div class="text-xs text-gray-400 border rounded-lg p-4 text-center">교사명단(getRoster)을 불러오지 못해 전체 대비 진도를 계산할 수 없습니다.</div>`
          : `<canvas id="studyCourseChart" height="180"></canvas>`}
      </div>

      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <div class="text-sm font-medium text-gray-700 mb-2">최근 ${STUDY_RECENT_DAYS}일 내 학습 기록 유무</div>
          ${roster.length === 0
            ? `<div class="text-xs text-gray-400 border rounded-lg p-4 text-center">교사명단 필요</div>`
            : `<canvas id="studyRecentChart" height="180"></canvas>`}
        </div>
        <div>
          <div class="text-sm font-medium text-gray-700 mb-2">이수내역 0건(공부방 미시작) <span class="text-gray-400 font-normal">${s.notStarted.length}명</span></div>
          ${renderNotStartedTable(s.notStarted)}
        </div>
      </div>
    </div>
  `;
}

function renderStudyCharts() {
  if (courseRows.length === 0 || roster.length === 0) return;
  const s = buildStudyStats();

  const courseChartEl = document.getElementById('studyCourseChart');
  if (courseChartEl) {
    new Chart(courseChartEl, {
      type: 'bar',
      data: {
        labels: s.courseNames,
        datasets: [{ data: s.courseNames.map(c => s.courseAvg[c] || 0), backgroundColor: '#6366f1' }]
      },
      options: {
        indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: { x: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } }
      }
    });
  }

  const recentChartEl = document.getElementById('studyRecentChart');
  if (recentChartEl) {
    new Chart(recentChartEl, {
      type: 'doughnut',
      data: {
        labels: [`최근 ${STUDY_RECENT_DAYS}일 내 기록 있음`, '기록 없음'],
        datasets: [{ data: [s.recentCount, s.notRecentCount], backgroundColor: ['#059669', '#d1d5db'] }]
      },
      options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } } }
    });
  }
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="bg-indigo-800 text-white px-5 py-4 flex justify-between items-center">
      <div>
        <div class="text-lg font-bold">교육부 분석 대시보드</div>
        <div class="text-indigo-200 text-sm">제사장의 길 · 피드백 데이터</div>
      </div>
      <button id="btn-refresh" class="text-xs bg-indigo-700 px-3 py-1.5 rounded-lg">새로고침</button>
    </div>
    <div class="p-5" id="content"></div>
  `;
  document.getElementById('btn-refresh').onclick = load;

  const content = document.getElementById('content');
  if (loading) {
    content.innerHTML = `<div class="text-sm text-gray-400 text-center py-16">데이터 불러오는 중...</div>`;
    return;
  }

  // 등급 심사 + 부서별 교사 현황(교사명단 기반) + 공부방 진도 현황은 피드백 데이터 유무와 무관하게 표시.
  const tierSectionHtml = renderTierSection();
  const rosterHtml = renderRosterSection();
  const studyHtml = renderStudySection();

  if (rows.length === 0) {
    content.innerHTML = tierSectionHtml + rosterHtml + studyHtml + (roster.length === 0
      ? `<div class="text-sm text-gray-400 text-center py-16">아직 데이터가 없습니다.</div>`
      : `<div class="text-sm text-gray-400 text-center py-10">아직 피드백 데이터가 없습니다.</div>`);
    wireTierSection();
    renderRosterCharts();
    renderStudyCharts();
    return;
  }

  const total = rows.length;
  const aiDone = rows.filter(r => r.source === 'AI셀프코칭' && r.status === '완료').length;
  const escalated = rows.filter(r => r.source === '사람에스컬레이션').length;
  const answered = rows.filter(r => r.source === '사람에스컬레이션' && r.status === '완료' && r.answeredAt);
  const avgHours = answered.length
    ? (answered.reduce((sum, r) => sum + daysDiff(r.submittedAt, r.answeredAt), 0) / answered.length).toFixed(1)
    : '-';

  const now = new Date();
  const longPending = rows.filter(r => r.status === '접수' && daysDiff(r.submittedAt, now) >= 48);

  const memberCounts = {};
  rows.forEach(r => { memberCounts[r.memberId] = (memberCounts[r.memberId] || 0) + 1; });
  const repeaters = Object.entries(memberCounts)
    .filter(([id, c]) => c >= 3)
    .map(([id, c]) => ({ memberId: id, count: c, name: (rows.find(r => r.memberId === id) || {}).name || '' }))
    .sort((a, b) => b.count - a.count);

  const catCounts = {};
  rows.forEach(r => { const c = categorize(r.situation); catCounts[c] = (catCounts[c] || 0) + 1; });

  const weekCounts = {};
  rows.forEach(r => {
    const d = new Date(r.submittedAt);
    if (isNaN(d)) return;
    const weekKey = d.getFullYear() + '-W' + Math.ceil((((d - new Date(d.getFullYear(),0,1)) / 86400000) + new Date(d.getFullYear(),0,1).getDay()+1) / 7);
    weekCounts[weekKey] = (weekCounts[weekKey] || 0) + 1;
  });
  const weekLabels = Object.keys(weekCounts).sort();
  const weekValues = weekLabels.map(k => weekCounts[k]);

  content.innerHTML = tierSectionHtml + rosterHtml + studyHtml + `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div class="border rounded-lg p-3">
        <div class="text-xs text-gray-400">전체 요청 수</div>
        <div class="text-2xl font-bold text-indigo-800">${total}</div>
      </div>
      <div class="border rounded-lg p-3">
        <div class="text-xs text-gray-400">AI 단독 해결률</div>
        <div class="text-2xl font-bold text-emerald-700">${Math.round(aiDone / total * 100)}%</div>
      </div>
      <div class="border rounded-lg p-3">
        <div class="text-xs text-gray-400">교관 에스컬레이션율</div>
        <div class="text-2xl font-bold text-amber-600">${Math.round(escalated / total * 100)}%</div>
      </div>
      <div class="border rounded-lg p-3">
        <div class="text-xs text-gray-400">평균 응답 시간</div>
        <div class="text-2xl font-bold text-slate-700">${avgHours}${avgHours !== '-' ? 'h' : ''}</div>
      </div>
    </div>

    ${longPending.length > 0 ? `
    <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
      <div class="text-sm font-medium text-red-700 mb-2">48시간 이상 미처리 (${longPending.length}건)</div>
      ${longPending.map(r => `<div class="text-xs text-red-600">${r.receiptNo} · ${r.name} (${r.memberId})</div>`).join('')}
    </div>` : ''}

    <div class="grid md:grid-cols-2 gap-6 mb-6">
      <div>
        <div class="text-sm font-medium text-gray-700 mb-2">어려움 유형 분포</div>
        <canvas id="catChart" height="200"></canvas>
      </div>
      <div>
        <div class="text-sm font-medium text-gray-700 mb-2">주별 요청 추이</div>
        <canvas id="trendChart" height="200"></canvas>
      </div>
    </div>

    <div class="text-sm font-medium text-gray-700 mb-2">반복 요청자 (3건 이상)</div>
    ${repeaters.length === 0
      ? `<div class="text-xs text-gray-400 mb-6">해당 없음</div>`
      : `<table class="w-full text-sm border mb-6">
          <thead><tr class="bg-gray-50 text-left"><th class="p-2">이름</th><th class="p-2">고유번호</th><th class="p-2">건수</th></tr></thead>
          <tbody>
            ${repeaters.map(r => `<tr class="border-t"><td class="p-2">${r.name}</td><td class="p-2 text-gray-400">${r.memberId}</td><td class="p-2 font-medium">${r.count}건</td></tr>`).join('')}
          </tbody>
        </table>`
    }
  `;

  new Chart(document.getElementById('catChart'), {
    type: 'bar',
    data: {
      labels: Object.keys(catCounts),
      datasets: [{ data: Object.values(catCounts), backgroundColor: '#4338ca' }]
    },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });

  new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: {
      labels: weekLabels,
      datasets: [{ data: weekValues, borderColor: '#4338ca', tension: 0.3 }]
    },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });

  wireTierSection();
  renderRosterCharts();
  renderStudyCharts();
}

load();
</script>
</body>
</html>
