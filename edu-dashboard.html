<!DOCTYPE html>
<html lang="ko" data-theme="jesagil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제사장의 길 - 교육부 대시보드</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  /* 제사장의 길 공통 디자인 시스템 테마 (jesagil) — home.html / coach-dashboard.html과 동일 */
  [data-theme="jesagil"] {
    /* DaisyUI 4.12는 색상 변수를 OKLCH(L% C H)로 받음 — HSL 아님, 주의 */
    --p: 51.06% 0.2301 276.97;
    --pc: 100% 0 0;
    --s: 66.58% 0.1574 58.32;
    --sc: 100% 0 0;
    --a: 59.60% 0.1274 163.23;
    --ac: 100% 0 0;
    --n: 27.95% 0.0368 260.03;
    --nc: 96.70% 0.0029 264.54;
    --b1: 100% 0 0;
    --b2: 96.70% 0.0029 264.54;
    --b3: 92.76% 0.0058 264.53;
    --bc: 27.81% 0.0296 256.85;
    --in: 68.47% 0.1479 237.32;
    --inc: 100% 0 0;
    --su: 69.59% 0.1491 162.48;
    --suc: 100% 0 0;
    --wa: 76.86% 0.1647 70.08;
    --wac: 0% 0 0;
    --er: 57.71% 0.2152 27.33;
    --erc: 100% 0 0;
    --rounded-box: 0.75rem;
    --rounded-btn: 0.5rem;
    --rounded-badge: 1rem;
  }
  html, body { margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .brand-accent-bar { height: 3px; background: linear-gradient(90deg, oklch(var(--p)), oklch(var(--s)), oklch(var(--a))); }
  .section-card { border-radius: var(--rounded-box); overflow: hidden; }
  .section-stripe { height: 6px; }
</style>
</head>
<body class="bg-base-200 min-h-screen">
<div id="root" class="max-w-5xl mx-auto min-h-screen bg-base-100 shadow-sm"></div>

<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

let rows = [];
let roster = [];       // getRoster 캐시 (교사명단)
let rosterTiers = [];  // 교사구분 참고 목록 (백엔드 TEACHER_TIERS)
let actRows = [];      // getAllActivities 캐시 (미배포/실패 시 빈 배열로 degrade)
let courseRows = [];   // getCourseList 캐시 ("공부방" 교재 목록, 미배포/실패 시 빈 배열로 degrade)
let progressRows = []; // getAllProgress 캐시 (전 교사 "이수내역", 미배포/실패 시 빈 배열로 degrade)
let loading = true;

// "최근 N일 내 학습 기록 유무" 판정 기준일. 활동/피드백 쪽 30일 기준과 달리
// 공부방은 단원 단위라 더 촘촘히 보려고 14일로 잡음 — 필요하면 이 값만 조정.
const STUDY_RECENT_DAYS = 14;

let tierSuggestions = null;  // null = 아직 안 불러옴, [] = 불러왔지만 변경 대상 없음
let tierLoading = false;
let tierApplying = {};       // memberId → true (승인 처리 중)

// 월별 결산 현황 (getSettlementReport) — 메인 로드 후 지연 로드
let settlement = null;       // null = 아직 안 불러옴
let settlementLoading = false;

const INACT_BADGE = { warning: 'badge-warning', danger: 'badge-error' };
const INACT_LABEL = { warning: '주의 (2개월+)', danger: '경고 (3개월+)' };

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 섹션 카드 공통 골격: 색상 스트라이프 + 아이콘 헤더 + 본문. colorName은 daisyUI 시맨틱 컬러명(primary/secondary/accent/info 등).
function sectionCard(colorName, icon, title, subtitle, bodyHtml) {
  return `
    <div class="section-card bg-base-100 border border-base-300 shadow-sm mb-6">
      <div class="section-stripe bg-${colorName}"></div>
      <div class="p-5">
        <div class="flex items-start gap-3 mb-4">
          <div class="w-9 h-9 rounded-lg bg-${colorName}/10 text-${colorName} flex items-center justify-center text-lg shrink-0">${icon}</div>
          <div>
            <div class="text-base font-bold text-base-content">${title}</div>
            ${subtitle ? `<div class="text-xs text-base-content/40 mt-0.5">${subtitle}</div>` : ''}
          </div>
        </div>
        ${bodyHtml}
      </div>
    </div>
  `;
}

async function callApi(payload) {
  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

// 아주 단순한 키워드 기반 카테고리 분류 (추후 AI 분류로 교체 가능)
function categorize(text) {
  if (!text) return '기타';
  const t = text;
  if (t.includes('복음방') || t.includes('전도')) return '복음방/전도';
  if (t.includes('상담')) return '상담 기술';
  if (t.includes('관계') || t.includes('갈등') || t.includes('싸') ) return '관계/갈등';
  if (t.includes('동기') || t.includes('의욕') || t.includes('열정')) return '동기부여';
  if (t.includes('센터') || t.includes('수강')) return '센터 활동';
  return '기타';
}

function daysDiff(a, b) {
  return (new Date(b) - new Date(a)) / (1000 * 60 * 60);
}

async function load() {
  loading = true;
  render();
  const res = await callApi({ action: 'getAllFeedback' });
  rows = res.rows || [];

  // 교사명단 + 활동실적은 실패해도 기존 피드백 통계는 그대로 보이도록 개별 try/catch.
  try {
    const rosterRes = await callApi({ action: 'getRoster' });
    roster = (rosterRes && Array.isArray(rosterRes.rows)) ? rosterRes.rows : [];
    rosterTiers = (rosterRes && Array.isArray(rosterRes.tiers)) ? rosterRes.tiers : [];
  } catch (e) { roster = []; rosterTiers = []; }

  try {
    const actRes = await callApi({ action: 'getAllActivities' });
    actRows = (actRes && Array.isArray(actRes.rows)) ? actRes.rows : [];
  } catch (e) { actRows = []; }

  try {
    const courseRes = await callApi({ action: 'getCourseList' });
    courseRows = (courseRes && Array.isArray(courseRes.rows)) ? courseRes.rows : [];
  } catch (e) { courseRows = []; }

  try {
    const progRes = await callApi({ action: 'getAllProgress' });
    progressRows = (progRes && Array.isArray(progRes.rows)) ? progRes.rows : [];
  } catch (e) { progressRows = []; }

  loading = false;
  render();

  // 결산 현황은 무거운 계산(전 교사 스캔)이라 메인 렌더 후 별도로 로드
  loadSettlement();
}

// ============ 월별 결산 현황 (getSettlementReport) ============

async function loadSettlement() {
  settlementLoading = true;
  render();
  try {
    const res = await callApi({ action: 'getSettlementReport' });
    settlement = (res && !res.error) ? res : { error: (res && res.error) || '불러오기 실패' };
  } catch (e) {
    settlement = { error: String(e) };
  }
  settlementLoading = false;
  render();
}

function tierChangeBadge(cur, sug) {
  const up = rosterTiers.indexOf(sug) > rosterTiers.indexOf(cur);
  return `<span class="text-base-content/60">${esc(cur)}</span> <span class="text-base-content/30">→</span>
    <span class="badge ${up ? 'badge-success' : 'badge-error'} badge-sm">${esc(sug)}</span>`;
}

function renderSettlementSection() {
  if (settlementLoading && !settlement) {
    return sectionCard('primary', '📅', '이번 달 결산 현황', '전 교사 스캔 중...', `
      <div class="text-xs text-base-content/40 border border-base-300 rounded-box p-6 text-center">
        <span class="loading loading-spinner loading-sm align-middle mr-1"></span>결산 계산 중 (교사 수가 많아 20초 정도 걸릴 수 있습니다)
      </div>`);
  }
  if (!settlement) return '';
  if (settlement.error) {
    return sectionCard('primary', '📅', '이번 달 결산 현황', '', `
      <div class="alert alert-error py-2 text-sm"><div>⚠️ ${esc(settlement.error)}</div></div>`);
  }

  const s = settlement;
  const promoRows = (s.promotions || []);
  const demoRows = (s.demotions || []);

  const stats = `
    <div class="stats stats-horizontal w-full shadow-sm border border-base-300 mb-4 text-center">
      <div class="stat py-3 px-4">
        <div class="stat-title text-xs">승급 대상</div>
        <div class="stat-value text-2xl text-success">${s.promotionsTotal || 0}</div>
      </div>
      <div class="stat py-3 px-4">
        <div class="stat-title text-xs">강등 대상</div>
        <div class="stat-value text-2xl text-error">${s.demotionsTotal || 0}</div>
        <div class="stat-desc text-[11px]">경고 ${s.inactiveDanger || 0} · 주의 ${s.inactiveWarn || 0}</div>
      </div>
      <div class="stat py-3 px-4">
        <div class="stat-title text-xs">2인 승인 대기</div>
        <div class="stat-value text-2xl ${s.pendingApprovalCount ? 'text-primary' : ''}">${s.pendingApprovalCount || 0}</div>
        <div class="stat-desc text-[11px]">지역장·교관</div>
      </div>
    </div>`;

  const promoTable = promoRows.length ? `
    <div class="text-sm font-bold text-success mb-2 mt-1">⬆️ 승급 대상자 (${s.promotionsTotal}${s.promotionsTotal > promoRows.length ? `, ${promoRows.length}명 표시` : ''})</div>
    <div class="overflow-x-auto border border-base-300 rounded-box mb-4">
      <table class="table table-zebra table-sm">
        <thead><tr><th>이름</th><th>등급 변경</th><th>사유</th></tr></thead>
        <tbody>${promoRows.map(r => `
          <tr>
            <td class="font-medium">${esc(r.name)}<div class="text-[10px] text-base-content/40">${esc(r.region || r.dept || '')}</div></td>
            <td class="whitespace-nowrap">${tierChangeBadge(r.currentTier, r.suggestedTier)}</td>
            <td class="text-base-content/60 text-xs">${esc(r.reason)}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>` : `<div class="text-xs text-base-content/40 mb-4">⬆️ 승급 대상자 없음</div>`;

  const demoTable = demoRows.length ? `
    <div class="text-sm font-bold text-error mb-2">⬇️ 강등 대상자 (${s.demotionsTotal}${s.demotionsTotal > demoRows.length ? `, ${demoRows.length}명 표시` : ''})</div>
    <div class="overflow-x-auto border border-base-300 rounded-box">
      <div class="max-h-72 overflow-y-auto">
        <table class="table table-zebra table-sm">
          <thead class="sticky top-0 bg-base-100"><tr><th>이름</th><th>등급 변경</th><th>비활동</th><th>마지막 활동</th><th>사유</th></tr></thead>
          <tbody>${demoRows.map(r => `
            <tr>
              <td class="font-medium">${esc(r.name)}<div class="text-[10px] text-base-content/40">${esc(r.region || r.dept || '')}</div></td>
              <td class="whitespace-nowrap">${tierChangeBadge(r.currentTier, r.suggestedTier)}</td>
              <td>${r.inactivity ? `<span class="badge ${INACT_BADGE[r.inactivity]} badge-sm">${r.inactivity === 'danger' ? '경고' : '주의'}</span>` : '-'}</td>
              <td class="text-xs text-base-content/60 whitespace-nowrap">${r.lastActivityDate ? esc(r.lastActivityDate) : '기록 없음'}</td>
              <td class="text-base-content/60 text-xs">${esc(r.reason)}</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>` : `<div class="text-xs text-base-content/40">⬇️ 강등 대상자 없음</div>`;

  const pendTable = (s.pendingApprovals || []).length ? `
    <div class="text-sm font-bold text-primary mb-2 mt-4">⏳ 지역장·교관 2인 승인 대기 (${s.pendingApprovalCount})</div>
    <div class="overflow-x-auto border border-base-300 rounded-box">
      <table class="table table-zebra table-sm">
        <thead><tr><th>이름</th><th>제안 등급</th><th>유형</th><th>승인</th></tr></thead>
        <tbody>${s.pendingApprovals.map(r => `
          <tr>
            <td class="font-medium">${esc(r.name || r.memberId)}</td>
            <td>${tierChangeBadge(r.currentTier || '?', r.suggestedTier)}</td>
            <td>${r.type === 'reason' ? `<span class="badge badge-warning badge-outline badge-sm">사유자${r.reason ? ' · ' + esc(r.reason) : ''}</span>` : '<span class="text-xs text-base-content/40">자동 감지</span>'}</td>
            <td><progress class="progress progress-primary w-16 h-2 align-middle" value="${r.approvalCount}" max="2"></progress> <span class="text-xs">${r.approvalCount}/2</span></td>
          </tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="text-[11px] text-base-content/40 mt-1">승인은 지역장 화면(district-dashboard.html)에서 진행합니다.</div>` : '';

  return sectionCard('primary', '📅', '이번 달 결산 현황',
    `${s.month} 결산 기준 (기준일 ${s.asOf}) · 매월 말일 기준으로 자동 계산`,
    stats + promoTable + demoTable + pendTable);
}

function renderInactiveSection() {
  if (!settlement || settlement.error) return '';
  const s = settlement;
  const list = s.inactive || [];
  const body = list.length ? `
    <div class="flex gap-2 mb-3 text-xs">
      <span class="badge badge-error badge-sm">경고 ${s.inactiveDanger || 0}명</span>
      <span class="badge badge-warning badge-sm">주의 ${s.inactiveWarn || 0}명</span>
      <span class="text-base-content/40 self-center">· 마지막 활동일 기준 (활동 종류 무관)</span>
    </div>
    <div class="border border-base-300 rounded-box overflow-hidden">
      <div class="max-h-72 overflow-y-auto overflow-x-auto">
        <table class="table table-zebra table-sm">
          <thead class="sticky top-0 bg-base-100"><tr><th>단계</th><th>이름</th><th>지역/부서</th><th>등급</th><th>마지막 활동</th><th>이번 달</th></tr></thead>
          <tbody>${list.map(r => `
            <tr>
              <td><span class="badge ${INACT_BADGE[r.inactivity]} badge-sm">${r.inactivity === 'danger' ? '경고' : '주의'}</span></td>
              <td class="font-medium">${esc(r.name)}<div class="text-[10px] text-base-content/40">${esc(r.memberId)}</div></td>
              <td class="text-base-content/60 text-xs">${esc(r.region || '')}${r.dept ? ' · ' + esc(r.dept) : ''}</td>
              <td class="text-base-content/60">${esc(r.tier)}</td>
              <td class="text-xs whitespace-nowrap ${r.lastActivityDate ? '' : 'text-base-content/40'}">${r.lastActivityDate ? esc(r.lastActivityDate) : '기록 없음'}</td>
              <td class="text-center">${r.monthlyCount}건</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
      ${s.inactiveTotal > list.length ? `<div class="text-[11px] text-base-content/40 text-center py-1.5 bg-base-200 border-t border-base-300">외 ${s.inactiveTotal - list.length}명 더</div>` : ''}
    </div>` : `<div class="text-xs text-base-content/40 border border-dashed border-base-300 rounded-box p-6 text-center">✅ 2개월 이상 비활동 교사가 없습니다.</div>`;

  return sectionCard('warning', '😴', '비활동자 목록',
    `2개월+ 미활동 = 주의 · 3개월+ 미활동(또는 기록 없음) = 경고 (≒ 휴교사 전환 대상)`, body);
}

function renderLeadsSection() {
  if (!settlement || settlement.error) return '';
  const list = settlement.leaders || [];
  const body = list.length ? `
    <div class="overflow-x-auto border border-base-300 rounded-box">
      <div class="max-h-72 overflow-y-auto">
        <table class="table table-zebra table-sm">
          <thead class="sticky top-0 bg-base-100"><tr><th>#</th><th>이름</th><th>지역</th><th>등급</th><th>최근 1년 센터 인도</th></tr></thead>
          <tbody>${list.map((r, i) => `
            <tr>
              <td class="text-base-content/40">${i + 1}</td>
              <td class="font-medium">${esc(r.name)}<div class="text-[10px] text-base-content/40">${esc(r.memberId)}</div></td>
              <td class="text-base-content/60 text-xs">${esc(r.region || '')}</td>
              <td class="text-base-content/60">${esc(r.tier)}</td>
              <td class="font-bold text-accent">${r.leadCount}명</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>` : `<div class="text-xs text-base-content/40 border border-dashed border-base-300 rounded-box p-6 text-center">최근 1년간 센터 인도 실적(활동방 "센터 인도 등록")이 있는 교사가 없습니다.</div>`;

  return sectionCard('accent', '🎯', '센터 인도 실적 현황',
    `활동방 "센터 인도 등록"으로 집계 · 최근 1년 기준 (승급 판정에 사용)`, body);
}

// ============ 등급 심사 (checkTierChanges / applyTierChange) ============

async function loadTierSuggestions() {
  tierLoading = true;
  render();
  try {
    const res = await callApi({ action: 'checkTierChanges' });
    tierSuggestions = Array.isArray(res) ? res : (res && Array.isArray(res.rows) ? res.rows : []);
  } catch (e) {
    tierSuggestions = [];
    alert('변경 예정 목록을 불러오지 못했습니다: ' + e.message);
  }
  tierLoading = false;
  render();
}

async function approveTierChange(memberId, newTier) {
  tierApplying[memberId] = true;
  render();
  try {
    const res = await callApi({ action: 'applyTierChange', memberId, newTier });
    if (res && res.error) throw new Error(res.error);
    tierSuggestions = (tierSuggestions || []).filter(s => s.memberId !== memberId);
    // 로컬 roster 캐시도 갱신 (다음 새로고침 전까지 부서별 교사 현황 차트에 즉시 반영)
    const idx = roster.findIndex(r => r.memberId === memberId);
    if (idx >= 0) roster[idx].tier = newTier;
  } catch (e) {
    alert('반영 중 오류가 발생했습니다: ' + e.message);
  }
  delete tierApplying[memberId];
  render();
}

function renderTierSection() {
  const body = `
    <div class="flex justify-end mb-3 -mt-1">
      <button id="btn-tier-load" ${tierLoading ? 'disabled' : ''} class="btn btn-primary btn-sm">
        ${tierLoading ? '불러오는 중...' : '📥 변경 예정 목록 불러오기'}
      </button>
    </div>
    ${renderTierTable()}
  `;
  return sectionCard('primary', '🎖️', '등급 심사', '휴교사 · 교사 · 활동교사 · 우수교사 승급/강등 후보 — 확인 후 개별 승인해야 실제 반영됩니다', body);
}

function renderTierTable() {
  if (tierLoading) {
    return `<div class="text-xs text-base-content/40 border border-base-300 rounded-box p-6 text-center">
      <span class="loading loading-spinner loading-sm align-middle mr-1"></span>불러오는 중...
    </div>`;
  }
  if (tierSuggestions === null) {
    return `<div class="text-xs text-base-content/40 border border-dashed border-base-300 rounded-box p-6 text-center">"변경 예정 목록 불러오기"를 눌러 확인하세요.</div>`;
  }
  if (tierSuggestions.length === 0) {
    return `<div class="text-xs text-base-content/40 border border-dashed border-base-300 rounded-box p-6 text-center">✅ 변경 대상이 없습니다.</div>`;
  }
  return `

// ============ 부서별 교사 현황 (getRoster 기반) ============

function daysAgo(dateStr, days) {
  const d = new Date(dateStr);
  if (isNaN(d)) return false;
  return (Date.now() - d.getTime()) <= days * 24 * 60 * 60 * 1000;
}

function buildRosterStats() {
  const deptCounts = {};
  roster.forEach(r => {
    const d = r.dept || '(부서 미상)';
    deptCounts[d] = (deptCounts[d] || 0) + 1;
  });
  const deptLabels = Object.keys(deptCounts).sort((a, b) => deptCounts[b] - deptCounts[a]);

  // 교사구분: 백엔드가 내려준 참고 목록 순서를 우선 사용 (하드코딩 방지),
  // 목록에 없는 값이 실제로 존재하면 뒤에 추가로 붙임.
  const tierCounts = {};
  roster.forEach(r => {
    const t = r.tier || '(미분류)';
    tierCounts[t] = (tierCounts[t] || 0) + 1;
  });
  const tierLabels = rosterTiers.slice();
  Object.keys(tierCounts).forEach(t => { if (!tierLabels.includes(t)) tierLabels.push(t); });

  // 최근 30일 내 활동 또는 피드백 기록이 있는 memberId 집합
  const recent30 = new Set();
  rows.forEach(r => { if (r.memberId && daysAgo(r.submittedAt, 30)) recent30.add(String(r.memberId).trim()); });
  actRows.forEach(r => { if (r.memberId && daysAgo(r.submittedAt, 30)) recent30.add(String(r.memberId).trim()); });

  // 부서별 × (최근 30일 기록 有/無) 교차 집계
  const crossActive = {};
  const crossInactive = {};
  deptLabels.forEach(d => { crossActive[d] = 0; crossInactive[d] = 0; });
  roster.forEach(r => {
    const d = r.dept || '(부서 미상)';
    if (recent30.has(String(r.memberId).trim())) crossActive[d] = (crossActive[d] || 0) + 1;
    else crossInactive[d] = (crossInactive[d] || 0) + 1;
  });

  return { deptLabels, deptCounts, tierLabels, tierCounts, crossActive, crossInactive };
}

// ============ 공부방 진도 현황 (getCourseList + getAllProgress 기반) ============

function buildStudyStats() {
  // 교재별 단원 수 — getCourseList 등장 순서를 그대로 교재 순서로 사용(G1→G2→G3).
  const courseNames = [];
  const unitCountByCourse = {};
  courseRows.forEach(u => {
    if (!(u.courseName in unitCountByCourse)) { unitCountByCourse[u.courseName] = 0; courseNames.push(u.courseName); }
    unitCountByCourse[u.courseName]++;
  });

  // 교재별 진도 합계(이수내역 전체 행 기준)
  const progressSumByCourse = {};
  courseNames.forEach(c => { progressSumByCourse[c] = 0; });
  progressRows.forEach(r => {
    if (!(r.courseName in progressSumByCourse)) progressSumByCourse[r.courseName] = 0;
    progressSumByCourse[r.courseName] += Number(r.progress || 0);
  });

  // 교재별 평균 진도(전체 교사 대비) = 합계 / (교사 수 × 단원 수). 교사명단이 없으면 계산 불가.
  const courseAvg = {};
  courseNames.forEach(c => {
    const denom = roster.length > 0 ? roster.length * (unitCountByCourse[c] || 1) : 0;
    courseAvg[c] = denom > 0 ? Math.round((progressSumByCourse[c] || 0) / denom) : 0;
  });

  // 교사별 진도 시작 여부 / 최근 N일 내 학습 여부
  const startedIds = new Set();
  const recentIds = new Set();
  progressRows.forEach(r => {
    const id = String(r.memberId || '').trim();
    if (!id) return;
    startedIds.add(id);
    if (daysAgo(r.lastStudiedAt, STUDY_RECENT_DAYS)) recentIds.add(id);
  });

  const notStarted = roster.filter(r => !startedIds.has(String(r.memberId).trim()));
  const recentCount = roster.filter(r => recentIds.has(String(r.memberId).trim())).length;
  const notRecentCount = Math.max(0, roster.length - recentCount);

  return { courseNames, courseAvg, notStarted, recentCount, notRecentCount };
}

    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });

  wireTierSection();
  renderRosterCharts();
  renderStudyCharts();
}

load();
</script>
</body>
