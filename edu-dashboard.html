<!DOCTYPE html>
<html lang="ko" data-theme="jesagil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제사장의 길 - 통합</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  /* 제사장의 길 공통 디자인 시스템 테마 (jesagil) — home.html / coach-dashboard.html과 동일 */
  [data-theme="jesagil"] {
    /* DaisyUI 4.12는 색상 변수를 OKLCH(L% C H)로 받음 — HSL 아님, 주의 */
    /* 2026-09-17: 카카오톡 스타일 리디자인 — 메인 컬러를 #5B4FCF(보라)로 변경(OKLCH 환산값), home.html과 동일 */
    --p: 51.43% 0.1901 281.61;   /* primary: #5B4FCF */
    --pc: 100% 0 0;
    --s: 66.58% 0.1574 58.32;
    --sc: 100% 0 0;
    --a: 59.60% 0.1274 163.23;
    --ac: 100% 0 0;
    --n: 27.95% 0.0368 260.03;
    --nc: 96.70% 0.0029 264.54;
    --b1: 100% 0 0;
    --b2: 96.70% 0.0029 264.54;
    --b3: 92.76% 0.0058 264.53;
    --bc: 27.81% 0.0296 256.85;
    --in: 68.47% 0.1479 237.32;
    --inc: 100% 0 0;
    --su: 61.67% 0.1191 162.14;  /* success: #2D9B6F */
    --suc: 100% 0 0;
    --wa: 75.76% 0.1525 74.86;   /* warning: #E8A020 */
    --wac: 0% 0 0;
    --er: 59.56% 0.1901 25.05;   /* error: #D94040 */
    --erc: 100% 0 0;
    /* 2026-09-17: 카드 라운드를 카카오톡 스타일 16px/버튼 12px 기준으로 통일(결산 5박스·섹션카드·표에 공용 적용) */
    --rounded-box: 1rem;
    --rounded-btn: 0.75rem;
    --rounded-badge: 1rem;
  }
  :root {
    --color-primary: #5B4FCF;
    --color-primary-light: #EDE9FF;
    --color-primary-dark: #3D34A5;
    --color-surface: #FFFFFF;
    --color-card: #FFFFFF;
    --color-bg: #F5F5F5;
    --color-text: #1A1A2E;
    --color-text-sub: #666680;
    --color-border: #E8E8F0;
    --color-success: #2D9B6F;
    --color-warning: #E8A020;
    --color-error: #D94040;
    --color-accent: #FF6B6B;
    --radius-card: 16px;
    --radius-btn: 12px;
    --radius-input: 10px;
    --shadow-card: 0 2px 12px rgba(0,0,0,0.08);
    --height-btn: 52px;
    --height-btn-sm: 44px;
    --height-header: 56px;
    --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px;
  }
  .lucide-i { width:1em; height:1em; display:inline-block; vertical-align:-0.15em; flex-shrink:0; }
  .kko-card-in { animation: kkoCardIn .3s ease; }
  @keyframes kkoCardIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  .kko-fade-in { animation: kkoFadeIn .2s ease; }
  @keyframes kkoFadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes kkoShimmer { 0% { background-position:-200px 0; } 100% { background-position:200px 0; } }
  .kko-skeleton { background:linear-gradient(90deg,#EEEEEE 25%,#F5F5F5 37%,#EEEEEE 63%); background-size:400px 100%; animation:kkoShimmer 1.4s ease infinite; border-radius:8px; }
  html, body { margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: var(--color-bg); }
  .brand-accent-bar { height: 3px; background: linear-gradient(90deg, oklch(var(--p)), oklch(var(--s)), oklch(var(--a))); }
  .section-card { border-radius: var(--rounded-box); overflow: hidden; box-shadow: var(--shadow-card); }
  .section-stripe { height: 6px; }
  /* 2026-09-17: 카카오톡 스타일 헤더 — 56px 보라 고정 헤더 */
  .kko-header { height: 56px; background: var(--color-primary); color: #fff; display: flex; align-items: center; flex-shrink: 0; }
  /* 우수지역/결산 등 border-base-300 표는 공통 회색 보더 토큰으로 통일 */
  .border-base-300 { border-color: var(--color-border) !important; }
  /* 인페이지 탭(전체 현황/이수 관리, 부서별 우수지역) — 카카오톡 스타일 보라 밑줄 탭 */
  .tabs.tabs-boxed { background: transparent; padding: 0; gap: 6px; border-radius: 0; }
  .tabs.tabs-boxed .tab {
    background: transparent !important; border-radius: 0 !important;
    border-bottom: 2px solid transparent; color: var(--color-text-sub); font-weight: 600;
  }
  .tabs.tabs-boxed .tab.tab-active {
    background: transparent !important; color: var(--color-primary) !important;
    border-bottom-color: var(--color-primary); font-weight: 800;
  }
  /* 결산 5박스 — 카드형(그림자+radius) + 아이콘 확대 */
  .settlement-box {
    box-shadow: var(--shadow-card) !important; transition: transform .1s ease, box-shadow .15s ease;
  }
  .settlement-box:active { transform: scale(0.97); }
  .settlement-box .box-icon { font-size: 26px; line-height: 1; }
</style>
</head>
<body class="bg-base-200 min-h-screen">
<div id="root" class="max-w-5xl mx-auto min-h-screen bg-base-100 shadow-sm"></div>

<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

// 2026-09-19: 디자인 시스템 확정 — 자주 노출되는 이모지 아이콘을 Lucide SVG로 교체(MIT 라이선스).
// EMOJI_TO_ICON에 없는 이모지는 licon()이 원본 이모지를 그대로 반환한다(신규 SVG 제작 금지 — 지시서 기준).
const LUCIDE_ICONS = {
  'alert-triangle': '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" />',
  'bar-chart-2': '<path d="M5 21v-6" /><path d="M12 21V3" /><path d="M19 21V9" />',
  'graduation-cap': '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" /><path d="M22 10v6" /><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />',
  'bot': '<path d="M12 8V4H8" /><rect width="16" height="12" x="4" y="8" rx="2" /><path d="M2 14h2" /><path d="M20 14h2" /><path d="M15 13v2" /><path d="M9 13v2" />',
  'check-circle-2': '<circle cx="12" cy="12" r="10" /><path d="m16 9-5.5 5.5L8 12" />',
  'users': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M16 3.128a4 4 0 0 1 0 7.744" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" />',
  'clipboard-list': '<rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="M12 11h4" /><path d="M12 16h4" /><path d="M8 11h.01" /><path d="M8 16h.01" />',
  'trophy': '<path d="M10 14.66V17a1 1 0 0 1-1 1 2 2 0 0 0-2 2v2" /><path d="M14 14.66V17a1 1 0 0 0 1 1 2 2 0 0 1 2 2v2" /><path d="M17.916 10H19.5A2.5 2.5 0 0 0 22 7.5V5a1 1 0 0 0-1-1h-3" /><path d="M4 22h16" /><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z" /><path d="M6.084 10H4.5A2.5 2.5 0 0 1 2 7.5V5a1 1 0 0 1 1-1h3" />',
  'target': '<circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" />',
  'search': '<path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" />',
  'church': '<path d="M10 9h4" /><path d="M12 7v5" /><path d="M14 21v-3a2 2 0 0 0-4 0v3" /><path d="m18 9 3.52 2.147a1 1 0 0 1 .48.854V19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6.999a1 1 0 0 1 .48-.854L6 9" /><path d="M6 21V7a1 1 0 0 1 .376-.782l5-3.999a1 1 0 0 1 1.249.001l5 4A1 1 0 0 1 18 7v14" />',
  'user': '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />',
  'folder': '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />',
  'hourglass': '<path d="M5 22h14" /><path d="M5 2h14" /><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22" /><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" />',
  'book-open': '<path d="M12 5v16" /><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z" />',
  'star': '<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" />',
  'megaphone': '<path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" /><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14" /><path d="M8 6v8" />',
  'message-circle': '<path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" />',
  'compass': '<circle cx="12" cy="12" r="10" /><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" />'
};
const EMOJI_TO_ICON = {
  '⚠️': 'alert-triangle', '⚠': 'alert-triangle',
  '📊': 'bar-chart-2', '🎓': 'graduation-cap', '🤖': 'bot', '✅': 'check-circle-2',
  '👥': 'users', '📋': 'clipboard-list', '🏆': 'trophy', '🎯': 'target', '🔍': 'search',
  '⛪': 'church', '👩': 'user', '📁': 'folder', '⏳': 'hourglass', '📖': 'book-open',
  '🌟': 'star', '📣': 'megaphone', '💬': 'message-circle', '🧭': 'compass'
};
function licon(emoji) {
  const name = EMOJI_TO_ICON[emoji];
  if (!name || !LUCIDE_ICONS[name]) return emoji;
  return `<svg class="lucide-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${LUCIDE_ICONS[name]}</svg>`;
}

let rows = [];
let roster = [];       // getRoster 캐시 (교사명단)
let rosterTiers = [];  // 교사구분 참고 목록 (백엔드 TEACHER_TIERS)

// ============ 2026-09-19: 통합 화면 내 상단 인페이지 탭 — "📊 전체 현황" / "📋 이수 관리" ============
// mainNavHtml(관리자 홈/통합/부서별/피드백)은 파일 단위 이동이라 그대로 두고, "이수 관리"는
// edu-dashboard.html 안에서만 쓰는 별도 화면이라 이 파일 내부 탭으로 구현.
let eduTab = 'main'; // 'main' | 'reqEdu'
function switchEduTab(tab) {
  eduTab = tab;
  if (tab === 'reqEdu' && !reqEduLog && !reqEduLogLoading) loadReqEduLog();
  render();
}

// ============ 2026-09-15: "필수교육 이수 등록" → 2026-09-19 "📋 이수 관리" 탭으로 확장 ============
// study-room.html에서 교사 본인이 체크하던 기능을 없애고, 등록 권한을 이 관리자 화면으로 옮겨옴.
// 백엔드 REQUIRED_EDU_CATEGORIES와 동일 순서(study-room.html REQ_EDU_CATEGORIES_DEFAULT와도 동일).
const REQ_EDU_CATEGORIES = ['복음방교사양성교육', '섭외전도교육', '상담교육', '복음방교재교육', '교사소양교육'];
const REQ_EDU_ICON = { '복음방교사양성교육': licon('🌟'), '섭외전도교육': licon('📣'), '상담교육': licon('💬'), '복음방교재교육': licon('📖'), '교사소양교육': licon('🎓') };
let reqEduForm = {
  orgFilter: '',       // '' = 전체, ORG_DEPTS 중 하나면 그 조직 소속 교사만 검색 결과에 노출
  query: '',           // 고유번호 또는 이름 검색어
  picked: null,        // 선택된 교사 { memberId, name, dept, region }
  category: REQ_EDU_CATEGORIES[0],
  date: new Date().toISOString().slice(0, 10),
  registrar: '',       // 2026-09-19 신규: 등록자(전도부 담당자 또는 교관 이름) — 이수등록이력에 기록됨
  saving: false,
  note: '',            // 결과 안내 문구
  current: null        // 선택된 교사의 현재 이수 현황(getRequiredEducation 응답)
};

// 2026-09-19: "등록 이력 목록" — getRequiredEducationLog 캐시(탭 최초 진입 시 1회 로드).
let reqEduLog = null;
let reqEduLogLoading = false;
async function loadReqEduLog() {
  reqEduLogLoading = true;
  render();
  try {
    const res = await callApi({ action: 'getRequiredEducationLog' });
    reqEduLog = (res && Array.isArray(res.rows)) ? res.rows : [];
  } catch (e) { reqEduLog = []; }
  reqEduLogLoading = false;
  render();
}

function reqEduTodayStr() { return new Date().toISOString().slice(0, 10); }

// 검색어 + 조직 필터로 교사명단에서 최대 8명까지 후보를 찾는다(고유번호 부분일치 또는 이름 부분일치).
function reqEduSearchResults() {
  const q = reqEduForm.query.trim();
  if (!q) return [];
  return roster.filter(r =>
    (String(r.memberId || '').includes(q) || String(r.name || '').includes(q)) &&
    (!reqEduForm.orgFilter || orgBucket(r.dept) === reqEduForm.orgFilter)
  ).slice(0, 8);
}

async function pickReqEduTeacher(memberId) {
  const t = roster.find(r => String(r.memberId) === String(memberId));
  if (!t) return;
  reqEduForm.picked = { memberId: t.memberId, name: t.name, dept: t.dept || '', region: t.region || '' };
  reqEduForm.note = '';
  reqEduForm.current = null;
  render();
  try {
    const res = await callApi({ action: 'getRequiredEducation', memberId: t.memberId });
    if (res && !res.error) reqEduForm.current = res;
  } catch (e) { /* 현재 현황 조회 실패는 등록 자체를 막지 않음 — 안내만 생략 */ }
  render();
}

async function submitReqEdu() {
  const f = reqEduForm;
  if (!f.picked) { alert('교사를 먼저 선택해주세요.'); return; }
  if (!f.category) { alert('이수 항목을 선택해주세요.'); return; }
  f.saving = true;
  f.note = '';
  render();
  try {
    const res = await callApi({
      action: 'updateRequiredEducation',
      memberId: f.picked.memberId, name: f.picked.name,
      category: f.category, date: f.date || reqEduTodayStr(),
      registrar: f.registrar.trim()
    });
    if (res && res.error) throw new Error(res.error);
    f.current = res;
    f.note = `✅ ${f.picked.name} 교사 · ${f.category} · ${f.date || reqEduTodayStr()} 이수로 등록했습니다.`;
    loadReqEduLog(); // 등록 이력 목록 즉시 갱신
  } catch (e) {
    f.note = '⚠️ 등록 실패: ' + (e.message || e);
  }
  f.saving = false;
  render();
}

// 2026-09-19: "📋 이수 관리" 탭 본문 — 조직별 필터 + 검색 + 등록 + 등록 이력 목록.
// 전도부가 통합으로 입력하거나, 교관 개개인이 자기 담당분만 입력하는 것 둘 다 이 한 화면을
// 공유(등록자 필드로만 구분) — 별도 권한 분리 UI는 두지 않음(사용자 지시서 그대로).
function reqEduLogTableHtml() {
  if (reqEduLogLoading && !reqEduLog) {
    return `<div class="text-xs text-base-content/40 text-center py-6"><span class="loading loading-spinner loading-sm align-middle mr-1"></span>불러오는 중...</div>`;
  }
  const list = reqEduLog || [];
  if (list.length === 0) return `<div class="text-xs text-base-content/40 border border-dashed border-base-300 rounded-box p-4 text-center">아직 등록 이력이 없습니다.</div>`;
  return `
    <div class="overflow-x-auto border border-base-300 rounded-box">
      <div class="max-h-72 overflow-y-auto">
        <table class="table table-zebra table-sm">
          <thead class="sticky top-0 bg-base-100"><tr><th>등록일시</th><th>교사명</th><th>항목</th><th>이수일</th><th>등록자</th><th>구분</th></tr></thead>
          <tbody>
            ${list.map(r => `
              <tr>
                <td class="text-xs whitespace-nowrap text-base-content/50">${esc(r.at)}</td>
                <td class="font-medium">${esc(r.name)}<div class="text-[10px] text-base-content/40">${esc(r.memberId)}</div></td>
                <td class="text-xs">${REQ_EDU_ICON[r.category] || ''} ${esc(r.category)}</td>
                <td class="text-xs">${r.kind === '취소' ? '<span class="text-base-content/30">-</span>' : esc(r.date)}</td>
                <td class="text-xs">${r.registrar ? esc(r.registrar) : '<span class="text-base-content/30">미기재</span>'}</td>
                <td>${r.kind === '취소' ? `<span class="badge badge-ghost badge-sm">취소</span>` : `<span class="badge badge-success badge-sm">등록</span>`}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderReqEduAdminSection() {
  const f = reqEduForm;
  const results = reqEduSearchResults();
  const cur = f.current || {};
  const body = `
    <div class="flex flex-col gap-3">
      <div>

function wireReqEduAdminSection() {
  const q = document.getElementById('reqedu-query');
  if (q) {
    // 2026-09-19: 한글 입력 시 초성만 입력되던 버그 수정 — 매 input마다 render()가 #content를
    // 통째로 다시 그려 <input>을 새로 만들면서 브라우저의 한글 조합(IME) 상태가 끊겨버렸음
    // (음절이 완성되기 전에 DOM 노드가 교체됨). compositionstart~compositionend 구간에서는
    // 값만 저장하고 render()를 미루다가, 조합이 끝난 뒤(음절 확정 시점)에만 다시 그리도록 수정.
    q.oninput = (e) => {
      reqEduForm.query = e.target.value;
      if (!q.dataset.composing) render();
    };
    q.addEventListener('compositionstart', () => { q.dataset.composing = '1'; });
    q.addEventListener('compositionend', (e) => {
      delete q.dataset.composing;
      reqEduForm.query = e.target.value;
      render();
    });
    // 검색어 입력 중 리렌더로 포커스가 날아가므로 캐럿을 맨 뒤로 복원
    if (document.activeElement !== q && reqEduForm.query) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  document.querySelectorAll('.reqedu-org-btn').forEach(btn => {
    btn.onclick = () => { reqEduForm.orgFilter = btn.dataset.org; render(); };
  });
  document.querySelectorAll('.reqedu-pick').forEach(btn => {
    btn.onclick = () => pickReqEduTeacher(btn.dataset.mid);
  });
  const cat = document.getElementById('reqedu-category');
  if (cat) cat.onchange = (e) => { reqEduForm.category = e.target.value; };
  const dt = document.getElementById('reqedu-date');
  if (dt) dt.onchange = (e) => { reqEduForm.date = e.target.value; };
  const reg = document.getElementById('reqedu-registrar');
  if (reg) {
    reg.oninput = (e) => { reqEduForm.registrar = e.target.value; };
  }
  const sb = document.getElementById('reqedu-submit');
  if (sb) sb.onclick = submitReqEdu;
}

async function loadTopRegionsForDept(dept) {
  if (topRegionsByDept[dept] || topRegionsLoading[dept]) { render(); return; }
  topRegionsLoading[dept] = true;
  render();
  try {
    const res = await callApi({ action: 'getTopRegions', dept });
    topRegionsByDept[dept] = (res && !res.error) ? res : { error: (res && res.error) || '불러오기 실패' };
  } catch (e) {
    topRegionsByDept[dept] = { error: String(e) };
  }
  topRegionsLoading[dept] = false;
  render();
}

async function loadChurchTopRegions() {
  churchTopRegionsLoading = true;
  render();
  try {
    const res = await callApi({ action: 'getChurchTopRegions' });

async function callApi(payload) {
  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

// 아주 단순한 키워드 기반 카테고리 분류 (추후 AI 분류로 교체 가능)
// ⚠️ 2026-09-15 버그 수정: feedback-room.html이 situation 앞에 붙여 저장하는 분류 태그
// ("[심리상담/자문]", "[수강생코칭/자문/만남]" 등)가 아래 키워드 매칭에 그대로 걸려들어
// 실제 고민 내용과 무관하게 카테고리가 결정되던 문제가 있었다(예: "[수강생코칭/..."은 '수강'이
// 걸려 전부 '센터 활동'으로 분류됨). 맨 앞 대괄호 태그를 먼저 떼어낸 뒤 본문만 분류한다.
function categorize(text) {
  if (!text) return '기타';
  const t = String(text).replace(/^\s*\[[^\]]*\]\s*/, '');
  if (!t) return '기타';
  if (t.includes('복음방') || t.includes('전도')) return '복음방/전도';
  if (t.includes('상담')) return '상담 기술';
  if (t.includes('관계') || t.includes('갈등') || t.includes('싸') ) return '관계/갈등';
  if (t.includes('동기') || t.includes('의욕') || t.includes('열정')) return '동기부여';
  if (t.includes('센터') || t.includes('수강')) return '센터 활동';
  return '기타';
}

function daysDiff(a, b) {
  return (new Date(b) - new Date(a)) / (1000 * 60 * 60);
}

// "전체 현황"의 핵심 지표 4개를 임의의 rows 부분집합에 대해 계산 — 전체 합계와 부서별 분해에 공용.
function computeFeedbackStats(subRows) {
  const total = subRows.length;
  if (total === 0) return { total: 0, answeredCount: 0, aiPct: 0, escPct: 0, avgHours: '-' };
  const aiDone = subRows.filter(r => r.source === 'AI셀프코칭' && r.status === '완료').length;
  const escalated = subRows.filter(r => r.source === '사람에스컬레이션').length;
  const answered = subRows.filter(r => r.source === '사람에스컬레이션' && r.status === '완료' && r.answeredAt);
  const answeredCount = subRows.filter(r => r.status === '완료').length; // 2026-09-15: "답변 완료" 컬럼용(부서별 현황)
  const avgHours = answered.length
    ? (answered.reduce((sum, r) => sum + daysDiff(r.submittedAt, r.answeredAt), 0) / answered.length).toFixed(1)
    : '-';
  return { total, answeredCount, aiPct: Math.round(aiDone / total * 100), escPct: Math.round(escalated / total * 100), avgHours };
}

function leadsAvailableMonths() {
  if (!allLeads) return [];
  const months = new Set();
  allLeads.forEach(r => { if (r.date && r.date.length >= 7) months.add(r.date.slice(0, 7)); });
  return [...months].sort().reverse();
}

function buildRosterStats() {
  // 부서는 교역자/자문회/장년회/부녀회/청년회/기타 6개 조직 버킷으로 묶어서 집계
  // (district-dashboard.html/백엔드 _orgBucket_ 과 동일 규칙 — 원본 '부서' 값이 그대로 노출되지 않게).
  const deptCounts = {};
  roster.forEach(r => {
    const d = orgBucket(r.dept);
    deptCounts[d] = (deptCounts[d] || 0) + 1;
  });
  const deptLabels = Object.keys(deptCounts).sort((a, b) => deptCounts[b] - deptCounts[a]);

  // 교사구분: 백엔드가 내려준 참고 목록 순서를 우선 사용 (하드코딩 방지),
  // 목록에 없는 값이 실제로 존재하면 뒤에 추가로 붙임.
  const tierCounts = {};
  roster.forEach(r => {
    const t = r.tier || '(미분류)';
    tierCounts[t] = (tierCounts[t] || 0) + 1;
  });
  const tierLabels = rosterTiers.slice();
  Object.keys(tierCounts).forEach(t => { if (!tierLabels.includes(t)) tierLabels.push(t); });

  // 부서(버킷) × 교사구분 교차 집계 — "부서별 등록 교사 수" 누적 막대그래프용.
  const deptTierCounts = {};
  deptLabels.forEach(d => { deptTierCounts[d] = {}; });
  roster.forEach(r => {
    const d = orgBucket(r.dept);
    const t = r.tier || '(미분류)';
    deptTierCounts[d][t] = (deptTierCounts[d][t] || 0) + 1;
  });

  return { deptLabels, deptCounts, deptTierCounts, tierLabels, tierCounts };
}

function renderRosterCharts() {
  if (roster.length === 0) return;
  const s = buildRosterStats();
  const TIER_COLORS = ['#94a3b8', '#4f46e5', '#0ea5e9', '#059669', '#d97706', '#dc2626'];

  // "부서별 등록 교사 수" — 부서(교역자/자문회/장년회/부녀회/청년회/기타)별 한 막대에
  // 휴교사·교사·활동교사·우수교사 4개 구간을 색으로 누적 표시, 구간마다 인원+비율 라벨 표기.
  new Chart(document.getElementById('deptCountChart'), {
    type: 'bar',
    data: {
      labels: s.deptLabels,
      datasets: TIER_ORDER.map(t => ({
        label: t,
        backgroundColor: TIER_CHART_COLOR[t],
        data: s.deptLabels.map(d => (s.deptTierCounts[d] && s.deptTierCounts[d][t]) || 0)
      }))
    },
    plugins: [ChartDataLabels],
    options: {
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
        datalabels: {
          color: '#fff', font: { size: 10, weight: 'bold' },
          formatter: (value, ctx) => {
            if (!value) return '';
            const deptLabel = ctx.chart.data.labels[ctx.dataIndex];
            const deptTotal = s.deptCounts[deptLabel] || 0;
            return `${value}명\n(${pct(value, deptTotal)}%)`;
          }
        }
      },
      scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }
    }
  });

  new Chart(document.getElementById('tierChart'), {
    type: 'doughnut',
    data: {
      labels: s.tierLabels,
      datasets: [{ data: s.tierLabels.map(t => s.tierCounts[t] || 0), backgroundColor: s.tierLabels.map((_, i) => TIER_COLORS[i % TIER_COLORS.length]) }]
    },
    options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } } }
  });
}

  const btn = document.getElementById('btn-org-ai-analysis');
  if (btn) btn.onclick = runOrgAiAnalysis;
}

// ============ 2026-09-16: AI 분석 ("🤖 전체 현황 AI 분석" — 6개 부서 통합 데이터) ============
// district-dashboard.html과 동일한 백엔드 경로('generateContent', Code.gs _callAi_가 Claude
// 우선/Gemini 폴백+503 자동 재시도 처리) 재사용 — 이 파일에서 새 백엔드 액션 안 만듦.
let aiAnalysis = null; // { loading, error, text }
const AI_ANALYSIS_SECTIONS = ['📊 전체 활동 패턴', '🏆 강세 지역/항목', '⚠️ 보완 필요 지역/항목', '💡 다음 달 제안'];

// 현재 화면에 이미 로드된 데이터(roster/settlement/피드백)로 조직 전체 스냅샷을 만든다 —
// district-dashboard.html처럼 지역×역할×항목 원본 데이터는 이 화면엔 없어서, 대신 등급분포·
// 결산현황·부서별 피드백 지표로 구성한다.
function buildOrgSnapshot() {
  const s = buildRosterStats();
  const snapshot = {
    총교사수: roster.length,
    부서별_교사수: s.deptLabels.map(d => ({ 부서: d, 인원: s.deptCounts[d] })),
    부서별_등급분포: s.deptLabels.map(d => ({ 부서: d, ...s.deptTierCounts[d] }))
  };
  if (settlement && !settlement.error) {
    snapshot.이번달_결산 = {
      승급대상: settlement.promotionsTotal || 0, 강등대상: settlement.demotionsTotal || 0,
      허가대기: settlement.pendingApprovalCount || 0, 비활동자: settlement.inactiveTotal || 0,
      센터인도_상위: (settlement.leaders || []).slice(0, 10).map(l => ({ 이름: l.name, 지역: l.region, 건수: l.leadCount }))
    };
  }
  if (rows.length > 0) {
    const memberDeptMap = {};
    roster.forEach(r => { memberDeptMap[String(r.memberId).trim()] = orgBucket(r.dept); });
    snapshot.피드백_전체 = computeFeedbackStats(rows);
    snapshot.피드백_부서별 = ORG_DEPTS.map(d => {
      const subRows = rows.filter(r => memberDeptMap[String(r.memberId).trim()] === d);
      return { 부서: d, ...computeFeedbackStats(subRows) };
    });
  }
  return snapshot;
}

function buildOrgAiPrompt(snapshot) {
  return `다음은 "제사장의 길" 앱 전체(6개 부서: 교역자/자문회/장년회/부녀회/청년회/기타) 교사 현황 데이터입니다.\n\n${JSON.stringify(snapshot)}\n\n다음 항목을 분석해주세요:\n1. 전체적으로 어떤 활동/지표에 집중되어 있는지\n2. 특별히 강세를 보이는 부서와 그 이유 추정\n3. 취약한 부서와 보완이 필요한 부분\n4. 센터 인도 실적과 연관된 활동 패턴\n5. 다음 달 집중해야 할 활동 제안\n\n한국어로 간결하고 실용적으로 답변하되, 반드시 아래 4개 마크다운 제목을 정확히 그대로 사용하고 다른 제목은 추가하지 마세요:\n## 📊 전체 활동 패턴\n## 🏆 강세 지역/항목\n## ⚠️ 보완 필요 지역/항목\n## 💡 다음 달 제안`;
}

function parseAiSections(text) {
  const sections = {};
  const re = /##\s*(.+?)\s*\n([\s\S]*?)(?=\n##\s|$)/g;
  let m;
  while ((m = re.exec(text))) sections[m[1].trim()] = m[2].trim();
  return sections;
}

async function runOrgAiAnalysis() {
  aiAnalysis = { loading: true, error: '', text: '' };
  render();
  const payload = { contents: [{ role: 'user', parts: [{ text: buildOrgAiPrompt(buildOrgSnapshot()) }] }] };
  let lastErrMsg = '';
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const res = await callApi({ action: 'generateContent', payload });
      const text = res && res.candidates && res.candidates[0] && res.candidates[0].content && res.candidates[0].content.parts[0] && res.candidates[0].content.parts[0].text;
      if (text) { aiAnalysis = { loading: false, error: '', text }; render(); return; }
      lastErrMsg = 'AI 응답이 비어 있습니다.';
    } catch (e) {
      lastErrMsg = e.message || String(e);
    }
    if (attempt < 3) await new Promise(r => setTimeout(r, 1000));
  }
  aiAnalysis = { loading: false, error: '잠시 후 다시 시도해주세요.', text: '' };
  render();
}

function aiAnalysisResultHtml(text) {
  const sections = parseAiSections(text);
  const known = AI_ANALYSIS_SECTIONS.filter(k => sections[k]);
  if (!known.length) {
    return `<div class="card card-border bg-base-100 shadow-sm"><div class="card-body p-4 text-xs whitespace-pre-wrap leading-relaxed">${esc(text)}</div></div>`;
  }
  return `
    <div class="grid gap-2">
      ${known.map(k => `
        <div class="card card-border bg-base-100 shadow-sm">
          <div class="card-body p-3">
            <div class="text-xs font-bold text-base-content mb-1">${esc(k)}</div>
            <div class="text-[11px] text-base-content/70 whitespace-pre-wrap leading-relaxed">${esc(sections[k])}</div>
          </div>
        </div>`).join('')}
    </div>
  `;
}

function renderAiAnalysisSection() {
  if (roster.length === 0) return '';
  const a = aiAnalysis || {};
  const body = `
    <div class="flex items-center justify-end mb-2">
      <button id="btn-org-ai-analysis" class="btn btn-xs btn-outline btn-primary" ${a.loading ? 'disabled' : ''}>${a.loading ? '분석 중...' : licon('🤖') + ' 전체 현황 AI 분석'}</button>
    </div>
    ${a.loading ? `<div class="text-xs text-base-content/40 border border-base-300 rounded-box p-6 text-center"><span class="loading loading-spinner loading-sm align-middle mr-1"></span>${licon('🤖')} 데이터 분석 중...</div>` : ''}
    ${a.error ? `<div class="alert alert-warning py-2 text-sm"><div>${licon('⚠️')} ${esc(a.error)}</div></div>` : ''}
    ${a.text ? aiAnalysisResultHtml(a.text) : (!a.loading && !a.error ? `<div class="text-xs text-base-content/40 border border-dashed border-base-300 rounded-box p-4 text-center">전체 등급분포·결산현황·부서별 피드백 지표를 AI가 요약·제안해드려요.</div>` : '')}
  `;
  return sectionCard('primary', '🤖', 'AI 분석', '6개 부서 통합 데이터 기반', body);
}

// 승급/강등/비활동자 종류 필터 select 3개 공용 wiring — 두 렌더 경로(피드백 데이터 有/無) 모두에서 호출.
function wireSettlementFilters() {
  document.querySelectorAll('.settlement-box').forEach(btn => {
    btn.onclick = () => setSettlementView(btn.dataset.view);
  });
  const promoSel = document.getElementById('promo-filter-select');
  if (promoSel) promoSel.onchange = (e) => { promoFilter = e.target.value; render(); };
  const demoSel = document.getElementById('demo-filter-select');
  if (demoSel) demoSel.onchange = (e) => { demoFilter = e.target.value; render(); };
  const inactiveSel = document.getElementById('inactive-filter-select');
  if (inactiveSel) inactiveSel.onchange = (e) => { inactiveFilter = e.target.value; render(); };
  const leadsMonthSel = document.getElementById('leads-month-select');
  if (leadsMonthSel) leadsMonthSel.onchange = (e) => { leadsMonthFilter = e.target.value; render(); };
  document.querySelectorAll('.stagerole-tab').forEach(btn => { btn.onclick = () => setStageRole(btn.dataset.stagerole); });
  document.querySelectorAll('.topregion-tab').forEach(tab => {
    tab.onclick = () => switchTopRegionsTab(tab.dataset.topregionDept);
  });
}

load();
</script>
