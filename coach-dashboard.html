<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제사장의 길 - 교관 대시보드</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin:0; padding:0; background:#f4f6f5; }
  * { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; }
</style>
</head>
<body>
<div id="root" class="max-w-2xl mx-auto min-h-screen bg-white shadow"></div>

<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

let state = { handler: '', rows: [], loading: false };

async function callApi(payload) {
  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

async function loadPending() {
  state.loading = true;
  render();
  const res = await callApi({ action: 'listPending' });
  state.rows = res.rows || [];
  state.loading = false;
  render();
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="bg-slate-800 text-white px-5 py-4 flex justify-between items-center">
      <div>
        <div class="text-lg font-bold">교관 대시보드</div>
        <div class="text-slate-300 text-sm">대기중인 피드백 요청</div>
      </div>
      <button id="btn-refresh" class="text-xs bg-slate-700 px-3 py-1.5 rounded-lg">새로고침</button>
    </div>
    <div class="p-4">
      <input id="handler-name" type="text" placeholder="담당자 이름 (답변시 기록됨)" value="${state.handler}" class="w-full border rounded-lg px-3 py-2 text-sm mb-4">
      <div id="list"></div>
    </div>
  `;
  document.getElementById('btn-refresh').onclick = loadPending;
  document.getElementById('handler-name').oninput = (e) => { state.handler = e.target.value; };

  const list = document.getElementById('list');
  if (state.loading) {
    list.innerHTML = `<div class="text-sm text-gray-400 text-center py-10">불러오는 중...</div>`;
    return;
  }
  if (state.rows.length === 0) {
    list.innerHTML = `<div class="text-sm text-gray-400 text-center py-10">대기중인 요청이 없습니다.</div>`;
    return;
  }
  list.innerHTML = state.rows.map((row, idx) => `
    <div class="border rounded-lg p-4 mb-3">
      <div class="flex justify-between text-xs text-gray-400 mb-2">
        <span>${row.receiptNo}</span>
        <span>${row.name} (${row.memberId})</span>
      </div>
      <div class="text-sm text-gray-700 mb-2"><span class="font-medium">상황:</span> ${row.situation}</div>
      <div class="text-xs text-gray-500 bg-gray-50 rounded p-2 mb-3"><span class="font-medium">AI 코칭 결과:</span> ${row.aiCoachText}</div>
      <textarea id="answer-${idx}" rows="3" placeholder="답변을 입력해주세요" class="w-full border rounded-lg px-3 py-2 text-sm mb-2"></textarea>
      <button data-idx="${idx}" class="btn-submit w-full bg-slate-800 text-white rounded-lg py-2 text-sm font-medium">답변 등록</button>
    </div>
  `).join('');

  document.querySelectorAll('.btn-submit').forEach(btn => {
    btn.onclick = async () => {
      const idx = btn.dataset.idx;
      const answer = document.getElementById('answer-' + idx).value.trim();
      if (!answer) { alert('답변을 입력해주세요.'); return; }
      if (!state.handler.trim()) { alert('담당자 이름을 먼저 입력해주세요.'); return; }
      btn.disabled = true;
      btn.textContent = '등록 중...';
      await callApi({ action: 'answerFeedback', receiptNo: state.rows[idx].receiptNo, answer: answer, handler: state.handler });
      await loadPending();
    };
  });
}

loadPending();
</script>
</body>
</html>
