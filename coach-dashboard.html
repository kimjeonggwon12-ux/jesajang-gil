<!DOCTYPE html>
<html lang="ko" data-theme="jesagil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제사장의 길 - 교관 대시보드</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* 제사장의 길 공통 디자인 시스템 테마 (jesagil) — home.html과 동일 */
  [data-theme="jesagil"] {
    /* DaisyUI 4.12는 색상 변수를 OKLCH(L% C H)로 받음 — HSL 아님, 주의 */
    --p: 51.06% 0.2301 276.97;
    --pc: 100% 0 0;
    --s: 66.58% 0.1574 58.32;
    --sc: 100% 0 0;
    --a: 59.60% 0.1274 163.23;
    --ac: 100% 0 0;
    --n: 27.95% 0.0368 260.03;
    --nc: 96.70% 0.0029 264.54;
    --b1: 100% 0 0;
    --b2: 96.70% 0.0029 264.54;
    --b3: 92.76% 0.0058 264.53;
    --bc: 27.81% 0.0296 256.85;
    --in: 68.47% 0.1479 237.32;
    --inc: 100% 0 0;
    --su: 69.59% 0.1491 162.48;
    --suc: 100% 0 0;
    --wa: 76.86% 0.1647 70.08;
    --wac: 0% 0 0;
    --er: 57.71% 0.2152 27.33;
    --erc: 100% 0 0;
    --rounded-box: 0.75rem;
    --rounded-btn: 0.5rem;
    --rounded-badge: 1rem;
  }
  html, body { margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .brand-accent-bar { height: 3px; background: linear-gradient(90deg, oklch(var(--p)), oklch(var(--s)), oklch(var(--a))); }
  .avatar-chip { background: linear-gradient(135deg, oklch(var(--p)), oklch(var(--a))); }
  .card-hover { transition: box-shadow .15s ease, transform .15s ease; }
  .card-hover:hover { box-shadow: 0 4px 16px -4px rgb(0 0 0 / 0.12); transform: translateY(-1px); }
</style>
</head>
<body class="bg-base-200 min-h-screen">
<div class="max-w-2xl mx-auto min-h-screen bg-base-100 shadow-sm flex flex-col">
  <div id="root" class="flex-1"></div>
</div>

<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

let state = { handler: '', rows: [], loading: false };

async function callApi(payload) {
  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

async function loadPending() {
  state.loading = true;
  render();
  const res = await callApi({ action: 'listPending' });
  state.rows = res.rows || [];
  state.loading = false;
  render();
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="navbar bg-neutral text-neutral-content px-5 py-4 min-h-0">
      <div class="flex-1 flex items-center gap-2">
        <span class="text-xl leading-none">🎧</span>
        <div class="flex flex-col items-start leading-tight">
          <div class="text-lg font-bold">교관 대시보드</div>
          <div class="text-neutral-content/50 text-xs">대기중인 피드백 요청 ${state.rows.length > 0 ? `· ${state.rows.length}건` : ''}</div>
        </div>
      </div>
      <div class="flex-none flex items-center gap-2">
        <button id="btn-refresh" class="btn btn-sm btn-ghost">🔄 새로고침</button>
        <a href="admin-home.html" class="btn btn-sm btn-ghost">← 관리자 홈</a>
        <a href="home.html" class="btn btn-sm btn-ghost">교사 어플로 가기</a>
      </div>
    </div>
    <div class="brand-accent-bar"></div>
    <div class="p-4">
      <label class="input input-bordered flex items-center gap-2 w-full mb-4 text-sm">
        <span class="text-base-content/40">👤</span>
        <input id="handler-name" type="text" placeholder="담당자 이름 (답변시 기록됨)" value="${state.handler}" class="grow" />
      </label>
      <div id="list"></div>
    </div>
  `;
  document.getElementById('btn-refresh').onclick = loadPending;
  document.getElementById('handler-name').oninput = (e) => { state.handler = e.target.value; };

  const list = document.getElementById('list');
  if (state.loading) {
    list.innerHTML = `<div class="text-sm text-base-content/40 text-center py-16">
      <span class="loading loading-spinner loading-md align-middle mr-2"></span>불러오는 중...
    </div>`;
    return;
  }
  if (state.rows.length === 0) {
    list.innerHTML = `<div class="text-center py-16">
      <div class="text-5xl mb-3">📭</div>
      <div class="text-sm text-base-content/40">대기중인 요청이 없습니다.</div>
    </div>`;
    return;
  }
  list.innerHTML = state.rows.map((row, idx) => `
    <div class="card card-border bg-base-100 shadow-sm card-hover mb-3">
      <div class="card-body p-4">
        <div class="flex items-center gap-2 mb-2">
          <div class="avatar-chip w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0">${esc((row.name||'?').slice(0,1))}</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium truncate">${row.name} <span class="text-base-content/40 font-normal">(${row.memberId})</span></div>
            <div class="text-[11px] text-base-content/40">${row.receiptNo}</div>
          </div>
          <span class="badge badge-warning badge-outline badge-sm shrink-0">대기중</span>
        </div>
        <div class="text-sm text-base-content/80 mb-2"><span class="font-medium">💬 상황:</span> ${row.situation}</div>
        <div class="text-xs text-base-content/60 bg-base-200 rounded-lg p-3 mb-3 border-l-4 border-info/40"><span class="font-medium">🤖 AI 코칭 결과:</span> ${row.aiCoachText}</div>
        <textarea id="answer-${idx}" rows="3" placeholder="✍️ 답변을 입력해주세요" class="textarea textarea-bordered w-full text-sm mb-2"></textarea>
        <button data-idx="${idx}" class="btn-submit btn btn-neutral w-full">✅ 답변 등록</button>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.btn-submit').forEach(btn => {
    btn.onclick = async () => {
      const idx = btn.dataset.idx;
      const answer = document.getElementById('answer-' + idx).value.trim();
      if (!answer) { alert('답변을 입력해주세요.'); return; }
      if (!state.handler.trim()) { alert('담당자 이름을 먼저 입력해주세요.'); return; }
      btn.disabled = true;
      btn.textContent = '등록 중...';
      await callApi({ action: 'answerFeedback', receiptNo: state.rows[idx].receiptNo, answer: answer, handler: state.handler });
      await loadPending();
    };
  });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadPending();
</script>
</body>
</html>
