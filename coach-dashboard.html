<!DOCTYPE html>
<html lang="ko" data-theme="jesagil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제사장의 길 - 피드백</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* 제사장의 길 공통 디자인 시스템 테마 (jesagil) — 다른 관리자 화면과 동일 */
  [data-theme="jesagil"] {
    --p: 51.06% 0.2301 276.97; --pc: 100% 0 0;
    --s: 66.58% 0.1574 58.32;  --sc: 100% 0 0;
    --a: 59.60% 0.1274 163.23; --ac: 100% 0 0;
    --n: 27.95% 0.0368 260.03; --nc: 96.70% 0.0029 264.54;
    --b1: 100% 0 0; --b2: 96.70% 0.0029 264.54; --b3: 92.76% 0.0058 264.53;
    --bc: 27.81% 0.0296 256.85;
    --in: 68.47% 0.1479 237.32; --inc: 100% 0 0;
    --su: 69.59% 0.1491 162.48; --suc: 100% 0 0;
    --wa: 76.86% 0.1647 70.08;  --wac: 0% 0 0;
    --er: 57.71% 0.2152 27.33;  --erc: 100% 0 0;
    --rounded-box: 0.75rem; --rounded-btn: 0.5rem; --rounded-badge: 1rem;
  }
  html, body { margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .brand-accent-bar { height: 3px; background: linear-gradient(90deg, oklch(var(--p)), oklch(var(--s)), oklch(var(--a))); }
</style>
</head>
<body class="bg-base-200 min-h-screen">
<div class="max-w-4xl mx-auto min-h-screen bg-base-100 shadow-sm flex flex-col">
  <div id="root" class="flex-1"></div>
</div>

<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

// 부서(조직) 버킷 — district-dashboard.html/edu-dashboard.html/백엔드 _orgBucket_ 과 동일 규칙:
// 이 5개 외 값은 전부 "기타"로 묶는다. 교관 등록 폼의 "담당부서" 선택지도 이 6개로 통일.
const ORG_MAIN_DEPTS = ['교역자', '자문회', '장년회', '부녀회', '청년회'];
const ORG_DEPTS = ORG_MAIN_DEPTS.concat(['기타']);
function orgBucket(dept) { return ORG_MAIN_DEPTS.includes(dept) ? dept : '기타'; }
const DEPT_ICON = { '교역자': '⛪', '자문회': '🧭', '장년회': '👨‍👩‍👧', '부녀회': '👩', '청년회': '🧑‍🎓', '기타': '📁' };

// 2026-09-17: 다른 방 파일들(home.html 등)과 동일한 관례 — ?memberId=&name= 로 특정 교관 계정
// 미리보기/실사용 가능(예: coach-dashboard.html?memberId=0020113000010&name=김정권). 파라미터가
// 없으면 기존처럼 로그인 없는 순수 관리자 열람 화면 그대로 동작(하위 호환).
const urlParams = new URLSearchParams(window.location.search);
const paramMemberId = urlParams.get('memberId');
const paramName = urlParams.get('name');

let state = {
  loading: true,
  error: '',
  data: null,        // getCoachAdminOverview 응답 { requests, coaches } 캐시
  dept: null,        // null = 전체 요약, ORG_DEPTS 중 하나면 그 부서 상세
  region: '',        // 부서 상세에서 지역 필터('' = 전체)
  coachAdminOpen: false, // "교관 등록 관리" 접기/펼치기
  coachSaving: false,
  coachForm: { region: '', coachId: '', coachName: '', dept: ORG_DEPTS[0], status: '활성' },
  myCoach: null,       // getMyCoach 응답의 myCoachInfo(isCoach===true일 때만) — { coachId, coachName, regions[], depts[] }
  autoScoped: false,   // 최초 1회만 내 담당 부서/지역으로 자동 이동(이후 사용자가 다른 부서를 눌러도 안 되돌림)
  detailReceiptNo: null, // 클릭한 요청 상세 모달(receiptNo) — null이면 닫힘
  replyText: '',
  replySaving: false
};

// 관리자 화면 공통 메인 내비게이션 — 관리자 홈 / 통합 / 부서별 / 피드백 / 교사 어플로 가기 5개.
// 세 관리방(통합·부서별·피드백) 어디서든 서로 바로 이동 가능하도록 각 파일에 동일하게 둠.
function mainNavHtml(current) {
  const item = (key, href, icon, label) => {
    const active = key === current;
    return `<a href="${href}" class="btn btn-xs ${active ? 'btn-primary pointer-events-none' : 'btn-ghost'}">${icon} ${label}</a>`;
  };
  return `
    <div class="flex flex-wrap items-center gap-1.5 px-5 py-2 bg-base-200 border-b border-base-300">
      <a href="admin-home.html" class="btn btn-xs btn-ghost">🔐 관리자 홈</a>
      ${item('edu', 'edu-dashboard.html', '🎓', '통합')}
      ${item('district', 'district-dashboard.html', '🗺️', '부서별')}
      ${item('coach', 'coach-dashboard.html', '🎧', '피드백')}
      <a href="home.html" class="btn btn-xs btn-ghost ml-auto">🏃 교사 어플로 가기</a>
    </div>
  `;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 2026-09-18: district-dashboard.html과 동일한 소제목 강화 스타일(사용자 요청 "잘 안 보이잖아,
// 다른 소제목 키운 것처럼 다 키워줘") — 20px/900굵기/네이비/배경 띠.
function sectionTitleBand(icon, title, desc, bandColor) {
  bandColor = bandColor || '#E0E7FF';
  return `
    <div class="rounded-lg px-3 py-2" style="background:${bandColor}">
      <div style="font-size:20px;font-weight:900;color:#1F3864;line-height:1.3">${icon} ${esc(title)}</div>
    </div>
    ${desc ? `<div class="text-xs text-base-content/50 mt-1 mb-2 leading-relaxed">${esc(desc)}</div>` : ''}
  `;
}

async function callApi(payload) {
  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

async function load() {
  state.loading = true; state.error = '';
  render();
  try {
    const res = await callApi({ action: 'getCoachAdminOverview' });
    if (res && res.error) { state.error = res.error; }
    else { state.data = res; }
  } catch (e) {
    state.error = '서버 연결에 실패했습니다: ' + e;
  }

  // 2026-09-17: ?memberId=&name= 으로 들어온 경우 — 활성 교관인지 확인해서 담당 지역 자동 인식.
  if (paramMemberId) {
    try {
      const myRes = await callApi({ action: 'getMyCoach', memberId: paramMemberId });
      if (myRes && myRes.isCoach && myRes.myCoachInfo) state.myCoach = myRes.myCoachInfo;
    } catch (e) { /* 실패해도 기존 관리자 열람 화면으로는 계속 동작 */ }
  }
  // 담당 부서/지역으로 최초 1회만 자동 이동(이후 사용자가 다른 부서를 눌러도 안 되돌림).
  if (state.myCoach && !state.autoScoped) {
    state.autoScoped = true;
    const dept = state.myCoach.depts && state.myCoach.depts[0];
    const region = state.myCoach.regions && state.myCoach.regions[0];
    if (dept && ORG_DEPTS.includes(orgBucket(dept))) { state.dept = orgBucket(dept); state.region = region || ''; }
  }

  state.loading = false;
  render();
}

function switchDept(dept) {
  state.dept = dept;
  state.region = '';
  render();
}

function switchRegion(region) {
  state.region = region;
  render();
}

async function saveCoach() {
  const f = state.coachForm;
  if (!f.region.trim() || !f.coachId.trim() || !f.coachName.trim()) {
    alert('지역, 교관 고유번호, 교관 이름은 필수입니다.');
    return;
  }
  state.coachSaving = true;
  render();
  try {
    const res = await callApi({ action: 'upsertCoach', region: f.region.trim(), coachId: f.coachId.trim(), coachName: f.coachName.trim(), dept: f.dept, status: f.status });
    if (res && res.error) {
      alert('등록 실패: ' + res.error);
    } else {
      state.coachForm = { region: '', coachId: '', coachName: '', dept: f.dept, status: '활성' };
      await load(); // 코치명단 최신화(전체 재조회 — 이 액션은 빈도가 낮아 재요청 부담 적음)
      return;
    }
  } catch (e) {
    alert('등록 중 오류가 발생했습니다: ' + e);
  }
  state.coachSaving = false;
  render();
}

async function toggleCoachStatus(coach) {
  const nextStatus = coach.status === '활성' ? '비활성' : '활성';
  if (!confirm(`${coach.coachName}(${coach.region}) 교관을 "${nextStatus}"(으)로 변경하시겠습니까?`)) return;
  state.coachSaving = true;
  render();
  try {
    await callApi({ action: 'upsertCoach', region: coach.region, coachId: coach.coachId, coachName: coach.coachName, dept: coach.dept, status: nextStatus });
    await load();
    return;
  } catch (e) {
    alert('변경 중 오류가 발생했습니다: ' + e);
  }
  state.coachSaving = false;
  render();
}

// ============ 교관 등록 관리 (upsertCoach) ============

function coachAdminSectionHtml() {
  const coaches = (state.data && state.data.coaches) || [];
  const f = state.coachForm;
  return `
    <details id="coach-admin-details" class="mt-3 mx-4 border border-base-300 rounded-box bg-base-100 overflow-hidden" ${state.coachAdminOpen ? 'open' : ''}>
      <summary class="cursor-pointer select-none px-4 py-3 flex items-center justify-between" style="background:#F5F3FF">
        <span style="font-size:20px;font-weight:900;color:#1F3864">🧑‍🏫 교관 등록 관리 (${coaches.filter(c => c.status === '활성').length}명 활성 · 전체 ${coaches.length}명)</span>
        <span class="text-base-content/30 text-[11px] font-normal shrink-0 ml-2">펼치기/접기</span>
      </summary>
      <div class="border-t border-base-300 p-4">
        <div class="text-[11px] text-base-content/40 mb-3">지역별로 담당 교관을 여기서 바로 등록·수정할 수 있습니다(시트에 직접 입력할 필요 없음). 같은 지역+고유번호로 다시 등록하면 정보가 갱신됩니다.</div>
        <div class="grid sm:grid-cols-2 gap-2 mb-3">
          <input id="coach-form-region" type="text" placeholder="지역 (예: 01지역)" value="${esc(f.region)}" class="input input-bordered input-sm w-full">
          <select id="coach-form-dept" class="select select-bordered select-sm w-full">
            ${ORG_DEPTS.map(d => `<option value="${esc(d)}" ${f.dept === d ? 'selected' : ''}>${DEPT_ICON[d]} ${esc(d)}</option>`).join('')}
          </select>
          <input id="coach-form-coachid" type="text" placeholder="교관 고유번호" value="${esc(f.coachId)}" class="input input-bordered input-sm w-full">
          <input id="coach-form-coachname" type="text" placeholder="교관 이름" value="${esc(f.coachName)}" class="input input-bordered input-sm w-full">
        </div>
        <button id="btn-coach-save" class="btn btn-primary btn-sm w-full mb-4" ${state.coachSaving ? 'disabled' : ''}>
          ${state.coachSaving ? '저장 중...' : '➕ 등록 / 수정'}
        </button>
        ${coaches.length === 0
          ? `<div class="text-xs text-base-content/40 border border-dashed border-base-300 rounded-box p-6 text-center">등록된 교관이 아직 없습니다. 위 양식으로 지역별 담당 교관을 등록해 주세요.</div>`
          : `<div class="overflow-x-auto border border-base-300 rounded-box">
              <table class="table table-zebra table-sm">
                <thead><tr><th>지역</th><th>부서</th><th>교관</th><th>고유번호</th><th>상태</th><th></th></tr></thead>
                <tbody>
                  ${coaches.map(c => `
                    <tr>
                      <td class="font-medium">${esc(c.region)}</td>
                      <td class="text-xs">${DEPT_ICON[c.dept] || ''} ${esc(c.dept)}</td>
                      <td>${esc(c.coachName)}</td>
                      <td class="text-base-content/40 text-xs">${esc(c.coachId)}</td>
                      <td><span class="badge ${c.status === '활성' ? 'badge-success' : 'badge-ghost'} badge-sm">${esc(c.status)}</span></td>
                      <td>
                        <button class="btn-coach-toggle btn btn-outline btn-xs" data-region="${esc(c.region)}" data-coachid="${esc(c.coachId)}" ${state.coachSaving ? 'disabled' : ''}>
                          ${c.status === '활성' ? '비활성화' : '다시 활성화'}
                        </button>
                      </td>
                    </tr>`).join('')}
                </tbody>
              </table>
            </div>`}
      </div>
    </details>
  `;
}

// ============ 부서×지역 처리 현황 ============

// requests를 부서(orgBucket)×지역으로 집계.
function buildOverviewStats(data) {
  const byDept = {};
  ORG_DEPTS.forEach(d => { byDept[d] = { dept: d, pending: 0, answered: 0, regions: {} }; });
  (data.requests || []).forEach(r => {
    const d = orgBucket(r.dept);
    const bucket = byDept[d];
    if (r.status === '완료') bucket.answered++; else bucket.pending++;
    if (!bucket.regions[r.region]) bucket.regions[r.region] = { pending: 0, answered: 0 };
    if (r.status === '완료') bucket.regions[r.region].answered++; else bucket.regions[r.region].pending++;
  });
  return byDept;
}

function coachNameFor(coaches, dept, region) {
  const c = coaches.find(c => c.region === region && c.status === '활성');
  return c ? c.coachName : null;
}

function overviewSectionHtml() {
  if (!state.data) return '';
  const byDept = buildOverviewStats(state.data);
  const coaches = state.data.coaches || [];
  const uncoveredRegions = [...new Set((state.data.requests || []).map(r => r.region).filter(Boolean))]
    .filter(region => !coachNameFor(coaches, null, region));

  return `
    <div class="p-4">
      <div class="text-xs text-base-content/50 mb-3">교역자/자문회/장년회/부녀회/청년회/기타 6개 조직 · "교관에게 요청"으로 올라온 피드백 처리 현황 · 카드 클릭 시 그 부서 상세로 이동</div>
      ${uncoveredRegions.length > 0 ? `
        <div class="alert alert-warning py-2 text-sm mb-3"><div>⚠️ 요청이 있지만 담당 교관이 등록되지 않은 지역: ${uncoveredRegions.map(esc).join(', ')} — 위 "교관 등록 관리"에서 등록해 주세요.</div></div>
      ` : ''}
      <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-3">
        ${ORG_DEPTS.map(d => {
          const b = byDept[d];
          const total = b.pending + b.answered;
          return `
          <button class="btn-dept-card card card-border bg-base-100 shadow-sm text-left hover:shadow-md hover:-translate-y-0.5 transition-all" data-dept="${esc(d)}">
            <div class="card-body p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="text-xl">${DEPT_ICON[d] || '📁'}</span>
                <span class="font-bold text-base-content">${esc(d)}</span>
              </div>
              <div class="grid grid-cols-2 gap-x-2 gap-y-1 text-xs">
                <div class="text-base-content/50">전체 요청</div><div class="text-right font-medium">${total}건</div>
                <div class="text-base-content/50">미답변</div><div class="text-right font-medium ${b.pending ? 'text-warning' : ''}">${b.pending}건</div>
                <div class="text-base-content/50">답변완료</div><div class="text-right font-medium text-success">${b.answered}건</div>
                <div class="text-base-content/50">담당 지역 수</div><div class="text-right font-medium">${Object.keys(b.regions).length}곳</div>
              </div>
            </div>
          </button>`;
        }).join('')}
      </div>
    </div>
  `;
}

function statusBadge(status) {
  return status === '완료'
    ? `<span class="badge badge-success badge-sm">답변완료</span>`
    : `<span class="badge badge-warning badge-sm">미답변</span>`;
}

// 요청 내용을 목록 카드에서는 요약(길면 자르기), 상세 모달에서는 전체 표시.
function summarize(text, len) {
  const s = String(text || '');
  return s.length > len ? s.slice(0, len) + '…' : s;
}

function deptDetailSectionHtml() {
  const dept = state.dept;
  const data = state.data;
  const coaches = data.coaches || [];
  const deptRequests = (data.requests || []).filter(r => orgBucket(r.dept) === dept);
  const regions = [...new Set(deptRequests.map(r => r.region).filter(Boolean))].sort();
  const byRegion = regions.map(region => {
    const rs = deptRequests.filter(r => r.region === region);
    return {
      region,
      pending: rs.filter(r => r.status !== '완료').length,
      answered: rs.filter(r => r.status === '완료').length,
      coachName: coachNameFor(coaches, dept, region)
    };
  }).sort((a, b) => (b.pending + b.answered) - (a.pending + a.answered));

  const filteredRequests = state.region ? deptRequests.filter(r => r.region === state.region) : deptRequests;

  return `
    <div class="px-4 pt-3">
      ${sectionTitleBand('🗺️', '지역별 처리 현황', '', '#EFF6FF')}
      ${byRegion.length === 0
        ? `<div class="text-xs text-base-content/40 border border-dashed border-base-300 rounded-box p-6 text-center mb-3">이 부서에는 아직 "교관에게 요청"으로 올라온 피드백이 없습니다.</div>`
        : `<div class="overflow-x-auto border border-base-300 rounded-box mb-3">
            <table class="table table-zebra table-sm">
              <thead><tr><th>지역</th><th>담당 교관</th><th>미답변</th><th>답변완료</th></tr></thead>
              <tbody>
                ${byRegion.map(r => `
                  <tr class="btn-region-row cursor-pointer hover:bg-base-200" data-region="${esc(r.region)}" title="클릭해서 이 지역만 보기">
                    <td class="font-medium">${esc(r.region)}</td>
                    <td>${r.coachName ? esc(r.coachName) : `<span class="text-warning text-xs">⚠️ 미등록</span>`}</td>
                    <td class="${r.pending ? 'text-warning font-bold' : ''}">${r.pending}건</td>
                    <td class="text-success">${r.answered}건</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>`}

      <div class="flex items-center gap-2 mb-3">
        <label class="font-bold text-base-content" style="font-size:15px">🔍 지역 필터</label>
        <select id="dept-region-select" class="select select-bordered select-xs w-40">
          <option value="" ${state.region === '' ? 'selected' : ''}>전체 (${regions.length}개 지역)</option>
          ${regions.map(r => `<option value="${esc(r)}" ${state.region === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}
        </select>
        <span class="text-xs text-base-content/40 ml-auto">${filteredRequests.length}건 표시</span>
      </div>

      ${filteredRequests.length === 0
        ? `<div class="text-center py-16">
            <div class="text-5xl mb-3">📭</div>
            <div class="text-sm text-base-content/40">이 조건에 해당하는 요청이 없습니다.</div>
          </div>`
        : `<div class="flex flex-col gap-2 pb-4">
            ${filteredRequests.map(r => `
              <div class="btn-request-card card card-border bg-base-100 shadow-sm cursor-pointer hover:shadow-md" data-receipt="${esc(r.receiptNo)}">
                <div class="card-body p-4">
                  <div class="flex items-center justify-between gap-2 mb-1">
                    <div class="text-sm font-medium">${esc(r.name)} <span class="text-base-content/40 font-normal text-xs">${esc(r.region)} · ${esc(r.tier)}</span></div>
                    ${statusBadge(r.status)}
                  </div>
                  <div class="text-[10px] text-base-content/30 mb-2">${esc(r.receiptNo)} · ${esc(r.submittedAt)}</div>
                  <div class="text-sm text-base-content/80"><span class="font-medium">💬 요청 내용:</span> ${esc(summarize(r.situation, 60))}</div>
                  <div class="text-[11px] text-primary mt-1">눌러서 상세 보기 →</div>
                </div>
              </div>`).join('')}
          </div>`}
    </div>
  `;
}

// ============ 2026-09-17: 요청 상세 모달 (교사 정보 + 전체 내용 + AI 코칭 결과 + 답변 등록) ============

// innerHTML을 매 렌더마다 통째로 새로 그리는 이 파일 구조상, <dialog>+showModal()(브라우저 API,
// DOM이 유지돼야 동작)보다 고정 오버레이 div가 더 안전 — home.html의 <dialog> 패턴과 달리 여기선
// state.detailReceiptNo 유무로 매번 있다/없다를 그냥 다시 그린다.
function requestDetailModalHtml() {
  if (!state.detailReceiptNo || !state.data) return '';
  const r = (state.data.requests || []).find(x => x.receiptNo === state.detailReceiptNo);
  if (!r) return '';
  const canReply = !!state.myCoach; // ?memberId=&name= 으로 식별된 활성 교관일 때만 답변 입력란 노출
  return `
    <div id="request-detail-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(0,0,0,0.5)">
      <div class="bg-base-100 rounded-box shadow-xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-5">
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-bold text-lg">${esc(r.name)} <span class="text-sm font-normal text-base-content/50">${esc(r.region)} · ${esc(r.tier)}</span></h3>
          ${statusBadge(r.status)}
        </div>
        <div class="text-[10px] text-base-content/30 mb-3">${esc(r.receiptNo)} · ${esc(r.submittedAt)}</div>

        <div class="text-sm bg-base-200 rounded-lg p-3 mb-3">
          <div class="font-medium mb-1">💬 요청 전체 내용</div>
          <div class="text-base-content/80 whitespace-pre-wrap">${esc(r.situation)}</div>
        </div>

        ${r.aiCoachText ? `
        <div class="text-sm bg-info/10 border border-info/30 rounded-lg p-3 mb-3">
          <div class="font-medium mb-1">🤖 AI 코칭 결과</div>
          <div class="text-base-content/70 whitespace-pre-wrap text-xs">${esc(r.aiCoachText)}</div>
        </div>` : ''}

        ${r.handlerAnswer ? `
        <div class="text-sm bg-success/10 border-l-4 border-success/40 rounded-lg p-3 mb-3">
          <div class="font-medium mb-1">✅ 답변</div>
          <div class="text-base-content/70 whitespace-pre-wrap">${esc(r.handlerAnswer)}</div>
        </div>` : (canReply ? `
        <div class="mb-3">
          <label class="text-xs font-bold text-base-content/50 mb-1 block">답변 입력</label>
          <textarea id="reply-textarea" rows="4" class="textarea textarea-bordered w-full text-sm" placeholder="이 교사에게 보낼 답변을 입력하세요.">${esc(state.replyText)}</textarea>
          <button id="btn-submit-reply" class="btn btn-primary btn-sm w-full mt-2" ${state.replySaving ? 'disabled' : ''}>${state.replySaving ? '등록 중...' : '✅ 답변 등록'}</button>
        </div>` : `<div class="text-xs text-base-content/30 mb-3">아직 담당 교관이 답변하지 않았습니다(교사 어플 "교관 모드"에서도 답변 등록 가능). 이 화면에서 직접 답변하려면 담당 교관 계정으로 접속해주세요(?memberId=&name=).</div>`)}

        <button id="btn-close-detail" class="btn btn-ghost btn-sm w-full">닫기</button>
      </div>
    </div>
  `;
}

async function submitReply() {
  const r = (state.data.requests || []).find(x => x.receiptNo === state.detailReceiptNo);
  if (!r || !state.myCoach) return;
  const reply = state.replyText.trim();
  if (!reply) { alert('답변 내용을 입력해주세요.'); return; }
  state.replySaving = true;
  render();
  try {
    const res = await callApi({ action: 'submitCoachReply', feedbackId: r.receiptNo, reply, coachId: state.myCoach.coachId });
    if (res && res.error) throw new Error(res.error);
    // 처리 완료 시 상태 자동 변경(재요청 없이 캐시된 목록에도 즉시 반영).
    r.handlerAnswer = reply; r.status = '완료'; r.answeredAt = new Date().toISOString();
    state.replyText = '';
  } catch (e) {
    alert('답변 등록 중 오류가 발생했습니다: ' + e.message);
  }
  state.replySaving = false;
  render();
}

function render() {
  const root = document.getElementById('root');
  const isOverview = state.dept === null;

  root.innerHTML = `
    <div class="navbar bg-neutral text-neutral-content px-5 py-4 min-h-0">
      <div class="flex-1 flex items-center gap-2">
        <span class="text-xl leading-none">🎧</span>
        <div class="text-lg font-bold">피드백</div>
      </div>
    </div>
    <div class="brand-accent-bar"></div>
    ${mainNavHtml('coach')}

    ${state.myCoach ? `
      <div class="px-4 pt-2">
        <div class="alert bg-primary/10 border border-primary/30 py-2 px-3 text-sm">
          🎧 <b>${esc(state.myCoach.coachName)} 교관님</b> 담당 지역: <b>${state.myCoach.regions.map(esc).join(', ')}</b>
        </div>
      </div>` : ''}

    ${coachAdminSectionHtml()}

    ${!isOverview ? `
      <div class="px-4 pt-3 flex items-center justify-between">
        <button id="btn-back-overview" class="font-bold text-primary hover:underline" style="font-size:15px">← 전체 요약</button>
        <div class="text-sm font-bold text-base-content flex items-center gap-1">${DEPT_ICON[state.dept] || '📁'} ${esc(state.dept)}</div>
      </div>` : ''}

    ${state.loading
      ? `<div class="text-sm text-base-content/40 text-center py-16"><span class="loading loading-spinner loading-md align-middle mr-2"></span>불러오는 중...</div>`
      : state.error
        ? `<div class="p-4"><div class="alert alert-error py-2 text-sm"><div>⚠️ ${esc(state.error)}</div></div></div>`
        : (isOverview ? overviewSectionHtml() : deptDetailSectionHtml())}

    ${requestDetailModalHtml()}
  `;

  const coachAdminEl = document.getElementById('coach-admin-details');
  if (coachAdminEl) coachAdminEl.ontoggle = () => { state.coachAdminOpen = coachAdminEl.open; };
  const regionInput = document.getElementById('coach-form-region');
  if (regionInput) regionInput.oninput = (e) => { state.coachForm.region = e.target.value; };
  const deptSelect = document.getElementById('coach-form-dept');
  if (deptSelect) deptSelect.onchange = (e) => { state.coachForm.dept = e.target.value; };
  const coachIdInput = document.getElementById('coach-form-coachid');
  if (coachIdInput) coachIdInput.oninput = (e) => { state.coachForm.coachId = e.target.value; };
  const coachNameInput = document.getElementById('coach-form-coachname');
  if (coachNameInput) coachNameInput.oninput = (e) => { state.coachForm.coachName = e.target.value; };
  const saveBtn = document.getElementById('btn-coach-save');
  if (saveBtn) saveBtn.onclick = saveCoach;
  document.querySelectorAll('.btn-coach-toggle').forEach(btn => {
    btn.onclick = () => {
      const c = (state.data.coaches || []).find(c => c.region === btn.dataset.region && c.coachId === btn.dataset.coachid);
      if (c) toggleCoachStatus(c);
    };
  });

  document.querySelectorAll('.btn-dept-card').forEach(btn => {
    btn.onclick = () => switchDept(btn.dataset.dept);
  });
  const backBtn = document.getElementById('btn-back-overview');
  if (backBtn) backBtn.onclick = () => switchDept(null);
  const regionSelect = document.getElementById('dept-region-select');
  if (regionSelect) regionSelect.onchange = (e) => switchRegion(e.target.value);
  document.querySelectorAll('.btn-region-row').forEach(row => {
    row.onclick = () => switchRegion(row.dataset.region);
  });
  document.querySelectorAll('.btn-request-card').forEach(card => {
    card.onclick = () => { state.detailReceiptNo = card.dataset.receipt; state.replyText = ''; render(); };
  });
  const closeBtn = document.getElementById('btn-close-detail');
  if (closeBtn) closeBtn.onclick = () => { state.detailReceiptNo = null; render(); };
  const overlay = document.getElementById('request-detail-overlay');
  if (overlay) overlay.onclick = (e) => { if (e.target === overlay) { state.detailReceiptNo = null; render(); } };
  const replyTextarea = document.getElementById('reply-textarea');
  if (replyTextarea) replyTextarea.oninput = (e) => { state.replyText = e.target.value; };
  const submitReplyBtn = document.getElementById('btn-submit-reply');
  if (submitReplyBtn) submitReplyBtn.onclick = submitReply;
}

load();
</script>
</body>
</html>
