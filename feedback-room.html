// Gemini generateContent 응답에서 텍스트 추출 (parts 중 text가 있는 첫 항목)
function extractGenText(res) {
  const cand = res && res.candidates && res.candidates[0];
  if (!cand || !cand.content || !cand.content.parts) return '';
  for (const p of cand.content.parts) {
    if (p && typeof p.text === 'string' && p.text.trim()) return p.text;
  }
  return '';
}

// ===== index.html(하츠) 마크다운 렌더러 이식 (Tu / Cd / n3 → 바닐라 JS) =====
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// **볼드** 인라인 처리
function mdInline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong class="text-teal-900 font-extrabold">$1</strong>');
}
// 한 블록(제목 아래 본문)을 줄 단위로 렌더 (Cd 이식)
function mdBlock(text) {
  if (!text) return '';
  return text.split('\n').map(line => {
    const n = line.trim();
    if (!n) return '<div class="h-2"></div>';
    const h = n.match(/^(#{1,6})\s+(.*)/);
    if (h) {
      const t = h[2].replace(/\*\*/g,'').replace(/[\[\]]/g,'');
      if (h[1].length >= 4) {
        return `<div class="mt-3 mb-1.5 text-[13px] font-black text-teal-800 tracking-tight">${mdInline(t)}</div>`;
      }
      return `<div class="mt-6 mb-3 first:mt-1"><span class="inline-flex items-center px-4 py-1.5 bg-gradient-to-r from-teal-500 to-emerald-500 text-white text-[13.5px] font-black rounded-full shadow-[0_3px_10px_rgba(20,184,166,0.2)] tracking-tight"><span class="mr-1.5 opacity-80 text-[14px]">✨</span> ${esc(t)}</span></div>`;
    }
    if (n.startsWith('- ') || n.startsWith('* ')) {
      return `<div class="flex items-start gap-2.5 mb-2.5 text-[13.5px] leading-[1.65] text-gray-700 break-keep pl-1"><span class="text-teal-400 mt-[5px] shrink-0 text-[10px] leading-none">◾</span><p class="m-0 flex-1">${mdInline(n.slice(2))}</p></div>`;
    }
    if (n.startsWith('> ')) {
      return `<div class="border-l-[3px] border-teal-300 bg-teal-50/60 pl-3 pr-2 py-1.5 my-2 rounded-r-lg text-[13px] leading-[1.6] text-gray-700 break-keep">${mdInline(n.slice(2))}</div>`;
    }
    return `<p class="mb-3 text-[13.5px] leading-[1.65] text-gray-700 break-keep">${mdInline(line)}</p>`;
  }).join('');
}
let _accId = 0;
// 전체 결과 텍스트 렌더 (Tu 이식): ### 섹션 분해 → 단계/화법/멘트 섹션은 접이식 카드
function renderCoachMarkdown(text) {
  if (!text) return '';
  const lines = text.split('\n');
  const sections = [];
  let cur = { title: '', content: [], isStep: false };
  lines.forEach(line => {
    const m = line.match(/^(#{1,3})\s+(.*)/);
    if (m) {
      if (cur.title || cur.content.length) sections.push(cur);
      const t = m[2].replace(/\*\*/g,'').replace(/[\[\]]/g,'');
      cur = { title: t, content: [], isStep: t.includes('단계') || t.includes('화법') || t.includes('멘트') };
    } else {
      cur.content.push(line);
    }
  });
  if (cur.title || cur.content.length) sections.push(cur);

  return `<div class="space-y-1">` + sections.map(sec => {
    const body = sec.content.join('\n').trim();
    if (sec.isStep && sec.title) {
      const id = 'acc-' + (_accId++);
      return `
        <div class="border border-teal-100 rounded-2xl overflow-hidden shadow-sm bg-white mb-3">
          <button type="button" onclick="toggleAcc('${id}')" class="w-full flex items-center justify-between p-4 bg-gradient-to-r from-teal-50/50 to-emerald-50/50 text-left">

            </span>
          </button>
          <div id="${id}-body" class="hidden p-5 border-t border-teal-50 bg-white animate-fade-in">${mdBlock(body)}</div>
        </div>`;
    }
    return `<div class="space-y-1">
      ${sec.title ? `<div class="mt-4 mb-2 first:mt-0"><span class="inline-block max-w-full px-3.5 py-1.5 bg-gradient-to-r from-teal-600 to-emerald-600 text-white text-[13px] font-black rounded-xl shadow-sm tracking-tight">${esc(sec.title)}</span></div>` : ''}

  }).join('') + `</div>`;
}

// ===== 리딩 결과 → 퍼스널 코칭 성향 자동 연동 (index.html useEffect 이식) =====
function extractHeartsTypes(text) {
  if (!text) return [];
  const out = [];
  // "추천 세부 유형" / "세부 유형" / "성향 진단" 섹션에서 **볼드** 항목 추출
  const secMatch = text.match(/###[^\n]*(?:세부 유형|추천 유형)[\s\S]*?(?=\n###|$)/)
                || text.match(/###[^\n]*성향 진단[\s\S]*?(?=\n###|$)/);
  const scope = secMatch ? secMatch[0] : text;
  const re = /\*\*(.+?)\*\*/g;
  let mm;
  while ((mm = re.exec(scope)) !== null) {
    let t = mm[1].trim();
    if (t.includes(' - ')) t = t.split(' - ').slice(1).join(' - ').trim();
    t = t.replace(/[\[\]]/g,'').trim();
    if (t && t.length <= 24 && !out.includes(t)) out.push(t);
  }
  return out.slice(0, 6);
}

// ===== 결과 부가기능 (복사 / 공유 / Word / 인쇄) — index.html 이식, 자체 API 호출 없음 =====
function plainText(text) {
  return String(text || '').replace(/\[LINKS:\s*(.*?)\]/,'').replace(/\*\*(.*?)\*\*/g,'$1').trim();
}
async function copyResult(text) {
  const t = plainText(text);
  try {
    await navigator.clipboard.writeText(t);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }
  state.sc.copied = true;
  render();
  setTimeout(() => { state.sc.copied = false; render(); }, 1500);
}
async function shareResult(text) {
  const t = plainText(text);
  if (navigator.share) {
    try { await navigator.share({ title: '제사장의 길 - 코칭 리포트', text: t }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  copyResult(text);
}
function downloadWord(text) {
  let body = plainText(text).replace(/\n/g,'<br/>');
  body = body.replace(/### (.*?)(<br\/>|$)/g,'<h3 style="color:#0f766e">$1</h3>');
  const html = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'></head><body>" + body + "</body></html>";
  const a = document.createElement('a');
  a.href = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(html);
  a.download = '제사장의길_코칭리포트.doc';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function printResult(text) {
  let body = plainText(text).replace(/\n/g,'<br/>');
  body = body.replace(/### (.*?)(<br\/>|$)/g,'<h3 style="color:#0f766e;border-bottom:2px solid #99f6e4;padding-bottom:4px;margin-top:20px">$1</h3>');
  const w = window.open('', '_blank');
  if (!w) { alert('팝업이 차단되었습니다. 팝업을 허용해주세요.'); return; }
  w.document.write('<html><head><meta charset="utf-8"><title>코칭 리포트</title><style>body{font-family:-apple-system,"Malgun Gothic",sans-serif;padding:32px;line-height:1.7;color:#1f2937;font-size:14px}</style></head><body>' + body + '</body></html>');
  w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 300);
}

        <span class="text-[14px] shrink-0 opacity-80 mt-0.5 mr-2">🌿</span>
        ${sc.linkedTypes.length
          ? `<div class="flex flex-wrap gap-1.5 flex-1">${sc.linkedTypes.map((t,i) => `<button data-chip="${i}" class="sc-chip bg-white border border-teal-300 text-teal-800 text-[11px] font-extrabold px-2 py-1 rounded-md shadow-sm">${esc(t)} ✕</button>`).join('')}</div>`
          : `<span class="text-[12px] font-bold mt-0.5">리딩(마음읽기) 결과가 자동으로 연동됩니다</span>`}
      </div>
      <div class="grid grid-cols-2 gap-2.5">
        ${scSelect('sc-mbti', 'MBTI', sc.selMbti, mbtiOpts, '🧠')}
        ${scSelect('sc-enneagram', '에니어그램', sc.selEnneagram, ENNEAGRAM_OPTIONS, '🔆')}
        ${scSelect('sc-disc', 'DISC', sc.selDisc, DISC_OPTIONS, '📊')}
        ${scSelect('sc-sagunja', '매난국죽', sc.selSagunja, sagunjaOpts, '🎋')}
      </div>
    </div>

    <div class="bg-white/80 backdrop-blur-md p-4 rounded-[1.5rem] shadow-[0_4px_15px_rgba(0,0,0,0.03)] border border-white/60 space-y-3 relative z-10">
      <h3 class="text-[13px] font-black text-gray-800 flex items-center gap-1.5 tracking-tight"><span class="text-blue-500">💬</span> 현재 상황 및 고민</h3>
      <textarea id="sc-situation" rows="5" placeholder="${analyze ? '멘티의 발언/고민을 있는 그대로 적어주세요.' : '멘티의 현재 상황과 고민을 입력해주세요.'}" class="w-full bg-white border border-gray-200 text-gray-900 text-[13.5px] font-medium rounded-[20px] p-4 outline-none focus:border-teal-400 focus:ring-4 focus:ring-teal-500/10 transition-all resize-none leading-relaxed shadow-sm">${esc(sc.situationText)}</textarea>
    </div>

    <div class="flex justify-center mt-5">
      <div class="relative flex flex-col justify-center items-center">
        ${!sc.loading ? `<div class="absolute top-0 w-16 h-16 bg-teal-400/30 rounded-full animate-ping opacity-75"></div>` : ''}
        <button id="btn-sc-generate" ${sc.loading ? 'disabled' : ''} class="relative z-10 w-16 h-16 rounded-full shadow-[0_8px_25px_rgba(20,184,166,0.4)] flex items-center justify-center transition-all duration-300 border-[1.5px] border-white/80 ${sc.loading ? 'bg-teal-500 cursor-not-allowed scale-[0.98]' : 'bg-gradient-to-br from-teal-500 to-emerald-500 hover:scale-110 active:scale-95'}">
          ${sc.loading ? spinner : genIcon}
        </button>
        <div class="mt-2 text-[11px] font-black tracking-widest ${sc.loading ? 'text-teal-600 animate-pulse' : 'text-teal-800 opacity-80'}">
          ${sc.loading ? (analyze ? '심층 분석 진행 중...' : '맞춤 대본 작성 중...') : (analyze ? 'ANALYZE' : 'GENERATE')}
        </div>
      </div>
    </div>

    <div id="sc-result-area"></div>
    </div>
  `;

  document.getElementById('sc-mode-analyze').onclick = () => { sc.subMode = 'analyze'; sc.resultText=''; render(); };
  document.getElementById('sc-mode-script').onclick = () => { sc.subMode = 'script'; sc.resultText=''; render(); };

  body.querySelectorAll('.sc-chip').forEach(btn => {
    btn.onclick = () => { sc.linkedTypes.splice(parseInt(btn.dataset.chip, 10), 1); render(); };
  });

  ['sc-target','sc-stage','sc-courseType','sc-status','sc-mbti','sc-enneagram','sc-disc','sc-sagunja','sc-situation'].forEach(id => {
    const elx = document.getElementById(id);
    if (!elx) return;
    const key = {
      'sc-target':'targetGroup','sc-stage':'stage','sc-courseType':'courseType','sc-status':'studentStatus',
      'sc-mbti':'selMbti','sc-enneagram':'selEnneagram','sc-disc':'selDisc','sc-sagunja':'selSagunja','sc-situation':'situationText'
    }[id];
    const evt = id === 'sc-situation' ? 'oninput' : 'onchange';
    elx[evt] = (e) => {
      sc[key] = e.target.value;
      if (id === 'sc-target' || id === 'sc-stage') render();
    };
  });

  document.getElementById('btn-sc-generate').onclick = async () => {
    if (!sc.situationText.trim()) { alert('멘티의 상황을 입력해주세요.'); return; }
    if (!sc.targetGroup) { alert('대상을 선택해주세요.'); return; }
    if (sc.subMode === 'script' && !sc.stage) { alert('진행 단계를 선택해주세요.'); return; }

    sc.loading = true;
    sc.resultText = '';
    sc.followUpHistory = [];
    sc.escalated = false;
    sc.copied = false;
    render();

    try {
      let systemInstruction, prompt, tag;
      if (sc.subMode === 'analyze') {
        systemInstruction = buildAnalyzeSystemInstruction(sc.targetGroup);
        prompt = buildAnalyzePrompt(sc.targetGroup, sc.stage, sc.selMbti, sc.selEnneagram, sc.selDisc, sc.selSagunja, sc.situationText);
        tag = `[리딩/${sc.targetGroup}]`;
      } else {
        const built = buildCoachingPrompt(sc.targetGroup, sc.stage, sc.courseType, sc.studentStatus, sc.selMbti, sc.selEnneagram, sc.selDisc, sc.selSagunja, sc.situationText, sc.linkedTypes);
        systemInstruction = built.systemInstruction;
        prompt = built.prompt;
        tag = `[수강생코칭/${sc.targetGroup}/${sc.stage}]`;
      }

      const payload = {
        contents: [{ role: "user", parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: systemInstruction }] },
        safetySettings: [
          { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
        ]
      };
      const res = await callApi({
        action: 'aiCoach',
        memberId: state.memberId,
        name: state.name,
        situation: `${tag} ${sc.situationText}`,
        payload: payload
      });
      if (res.error) throw new Error(res.error);
      sc.resultText = res.coachText;
      sc.receiptNo = res.receiptNo;
      sc.resultMode = sc.subMode;
      // 리딩 결과 → 퍼스널 코칭 성향 자동 연동
      if (sc.subMode === 'analyze') {
        const types = extractHeartsTypes(sc.resultText);
        if (types.length) sc.linkedTypes = types;
      }
    } catch (err) {
      sc.resultText = '오류가 발생했습니다: ' + err.message;
      sc.resultMode = sc.subMode;
    }
    sc.loading = false;
    render();
  };

  if (sc.resultText) {
    const area = document.getElementById('sc-result-area');
    const isAnalyze = sc.resultMode === 'analyze';
    const actBtn = (id, label, activeLabel, active) => `<button id="${id}" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-[11px] font-bold transition-all shadow-sm ${active ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : 'bg-white text-gray-500 hover:bg-teal-50 hover:text-teal-700 border border-gray-200'}">${active ? activeLabel : label}</button>`;
    area.innerHTML = `
      <div class="bg-white p-5 rounded-[1.5rem] border border-teal-100 shadow-[0_10px_40px_rgba(13,148,136,0.08)] animate-slide-in relative overflow-hidden mt-2">
        <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-teal-400 to-emerald-400"></div>
        <div class="flex items-center justify-between mb-3 mt-1">
          <h3 class="text-[15px] font-black text-teal-900 flex items-center gap-2">${isAnalyze ? '✨ 심리 분석 리포트' : '📝 단계별 맞춤 대본'}</h3>
          ${isAnalyze && sc.linkedTypes.length ? `<span class="text-[10px] font-bold text-teal-600 bg-teal-50 border border-teal-200 px-2 py-0.5 rounded-full">유형 자동연동됨</span>` : ''}
        </div>
        <div class="text-[13.5px] leading-relaxed text-gray-700 bg-gray-50/80 rounded-2xl p-4 border border-gray-100/80">${renderCoachMarkdown(sc.resultText)}</div>
        <div class="mt-3 pt-3 flex flex-wrap justify-end gap-1.5 border-t border-gray-200/60">
          ${actBtn('btn-sc-copy', '📋 복사', '✓ 복사됨', sc.copied)}
          <button id="btn-sc-share" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-indigo-600 bg-indigo-50 border border-indigo-200 hover:bg-indigo-100 transition-colors shadow-sm">🔗 공유</button>
          <button id="btn-sc-word" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-blue-600 bg-blue-50 border border-blue-200 hover:bg-blue-100 transition-colors shadow-sm">📄 Word</button>
          <button id="btn-sc-print" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-rose-600 bg-rose-50 border border-rose-200 hover:bg-rose-100 transition-colors shadow-sm">🖨️ 인쇄/PDF</button>
        </div>
        <div class="text-[11px] text-gray-400 mt-2">접수번호: ${sc.receiptNo || '-'}</div>
      </div>

      ${sc.escalated
        ? `<div class="text-sm text-emerald-700 bg-emerald-50 rounded-xl p-3 my-3 border border-emerald-100">교관님께 전달되었습니다. 답변이 오면 '내 피드백 이력'에서 확인하실 수 있습니다.</div>`
        : `<button id="btn-sc-escalate" class="w-full border-2 border-emerald-700 text-emerald-700 rounded-xl py-3 text-sm font-bold my-3 hover:bg-emerald-50 transition-colors flex items-center justify-center gap-2">🚩 이 내용 그대로 교관님께도 전달하기</button>`
      }

      <div class="mt-2 pt-4 border-t border-teal-100/60 animate-fade-in">
        <h4 class="text-[13px] font-black text-teal-800 mb-1 flex items-center gap-1.5">
          <span>💬</span> 추가 질문이 있으신가요?
          <span class="bg-rose-500 text-white text-[9px] px-1.5 py-0.5 rounded-md tracking-wider shadow-sm">NEW</span>
        </h4>
        <p class="text-[11.5px] text-teal-700/80 font-bold mb-3 pl-6 break-keep">결과를 바탕으로 무한 맞춤 답변을 받아보세요.</p>
        <div id="sc-followup-history" class="space-y-3 mb-3 max-h-[300px] overflow-y-auto pr-1 hx-scroll"></div>
        <div class="flex items-end gap-2 w-full">
          <input id="sc-followup-input" type="text" placeholder="추가질문: MBTI / 감동문자 / 드레스코드 ... ∞" class="flex-1 bg-white border border-teal-200 text-gray-800 text-[13px] rounded-[20px] px-4 py-3 outline-none focus:border-teal-400 focus:ring-4 focus:ring-teal-500/10 transition-all shadow-sm">
          <button id="btn-sc-followup" class="shrink-0 bg-teal-500 hover:bg-teal-600 text-white w-11 h-11 rounded-full flex items-center justify-center transition-all shadow-md active:scale-95">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
          </button>
        </div>
      </div>
    `;

    document.getElementById('btn-sc-copy').onclick = () => copyResult(sc.resultText);
    document.getElementById('btn-sc-share').onclick = () => shareResult(sc.resultText);
    document.getElementById('btn-sc-word').onclick = () => downloadWord(sc.resultText);
    document.getElementById('btn-sc-print').onclick = () => printResult(sc.resultText);

    if (!sc.escalated) {
      document.getElementById('btn-sc-escalate').onclick = async () => {
        await callApi({
          action: 'escalate',
          memberId: state.memberId,
          name: state.name,
          situation: sc.situationText,
          aiCoachText: sc.resultText
        });
        sc.escalated = true;
        render();
      };
    }

    const histBox = document.getElementById('sc-followup-history');
    histBox.innerHTML = sc.followUpHistory.map(m => `
      <div class="flex ${m.role==='user' ? 'justify-end' : 'justify-start'}">
        <div class="max-w-[85%] rounded-2xl p-3 text-[13px] leading-relaxed break-keep shadow-sm ${m.role==='user' ? 'bg-teal-500 text-white rounded-tr-sm' : 'bg-gray-100 text-gray-800 border border-gray-200/50 rounded-tl-sm'}">${m.role==='user' ? esc(m.text) : renderCoachMarkdown(m.text)}</div>
      </div>
    `).join('') + (sc.followUpLoading ? `
      <div class="flex justify-start"><div class="bg-gray-100 text-gray-500 text-[12px] p-3 rounded-2xl rounded-tl-sm font-medium flex items-center gap-2">
        <svg class="animate-spin h-3.5 w-3.5 text-teal-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
        답변 작성 중...
      </div></div>` : '');

    document.getElementById('btn-sc-followup').onclick = async () => {
      const input = document.getElementById('sc-followup-input');
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      sc.followUpHistory.push({ role: 'user', text: q });
      sc.followUpLoading = true;
      render();

      const followPrompt = buildFollowUpPrompt(sc.situationText, sc.resultText, sc.followUpHistory.slice(0, -1), q);
      const payload = {
        contents: [{ role: "user", parts: [{ text: followPrompt }] }],
        systemInstruction: { parts: [{ text: "당신은 따뜻하고 전문적인 라이프 코치이자 멘토입니다." }] },
        safetySettings: [
          { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
        ]
      };
      try {
        const res = await callApi({ action: 'generateContent', model: 'gemini-3-flash-preview', payload: payload });
        const text = extractGenText(res);
        sc.followUpHistory.push({ role: 'model', text: text || '(응답 없음)' });
      } catch (err) {
        sc.followUpHistory.push({ role: 'model', text: '오류가 발생했습니다: ' + err.message });
      }
      sc.followUpLoading = false;
      render();
    };
    document.getElementById('sc-followup-input').onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btn-sc-followup').click(); }
    };
  }
}

function renderCoachTab(body) {
  body.innerHTML = `
    <div class="text-xs text-gray-400 mb-3">${state.name}님 (${state.memberId})</div>
    <textarea id="situation" rows="5" placeholder="겪고 계신 어려움이나 상황을 구체적으로 적어주세요." class="w-full border rounded-lg px-3 py-2 text-sm mb-3">${state.situation}</textarea>
    <button id="btn-ask" class="w-full bg-emerald-700 text-white rounded-lg py-2.5 text-sm font-medium disabled:opacity-50" ${state.loading ? 'disabled' : ''}>
      ${state.loading ? '분석 중...' : 'AI 코칭 받기'}
    </button>
    <div id="result-area" class="mt-4"></div>
  `;

  document.getElementById('btn-ask').onclick = async () => {
    const val = document.getElementById('situation').value.trim();
    if (!val) { alert('상황을 입력해주세요.'); return; }
    state.situation = val;
    state.loading = true;
    render();
    try {
      const payload = {
        contents: [{ parts: [{ text: '당신은 교회 교사를 위한 코칭 도우미입니다. 다음 상황에 대해 구체적이고 실천 가능한 코칭 방향을 제시해주세요.\\n\\n상황: ' + val }] }]
      };
      const res = await callApi({ action: 'aiCoach', memberId: state.memberId, name: state.name, situation: val, payload: payload });
      if (res.error) throw new Error(res.error);
      state.lastReceiptNo = res.receiptNo;
      state.lastCoachText = res.coachText;
      state.escalated = false;
    } catch (err) {
      state.lastReceiptNo = '';
      state.lastCoachText = '오류가 발생했습니다: ' + err.message;
    }
    state.loading = false;
    render();
  };

  if (state.lastCoachText) {
    const resultArea = document.getElementById('result-area');
    resultArea.innerHTML = `
      <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-4 text-sm whitespace-pre-wrap">${state.lastCoachText}</div>
      <div class="text-xs text-gray-400 mt-2">접수번호: ${state.lastReceiptNo}</div>
      ${state.escalated
        ? `<div class="mt-3 text-sm text-emerald-700 bg-emerald-50 rounded-lg p-3">교관님께 전달되었습니다. 답변이 오면 '내 피드백 이력'에서 확인하실 수 있습니다.</div>`
        : `<button id="btn-escalate" class="w-full mt-3 border border-emerald-700 text-emerald-700 rounded-lg py-2.5 text-sm font-medium">이 내용 그대로 교관님께도 전달하기</button>`
      }
    `;
    if (!state.escalated) {
      document.getElementById('btn-escalate').onclick = async () => {
        await callApi({
          action: 'escalate',
          memberId: state.memberId,
          name: state.name,
          situation: state.situation,
          aiCoachText: state.lastCoachText
        });
        state.escalated = true;
        render();
      };
    }
  }
}

async function loadHistory() {
  const res = await callApi({ action: 'getHistory', memberId: state.memberId });
  state.history = res.rows || [];
  render();
}

function renderHistoryTab(body) {
  if (state.history.length === 0) {
    body.innerHTML = `<div class="text-sm text-gray-400 text-center py-10">아직 이력이 없습니다.</div>`;
    return;
  }
  body.innerHTML = state.history.slice().reverse().map(row => {
    const badge = row.status === '완료'
      ? (row.source === 'AI셀프코칭' ? '<span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">AI 코칭 완료</span>' : '<span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">교관 답변 완료</span>')
      : '<span class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">교관 검토중</span>';
    return `
      <div class="border rounded-lg p-3 mb-3">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs text-gray-400">${row.receiptNo}</span>
          ${badge}
        </div>
        <div class="text-sm text-gray-700 mb-2">${row.situation}</div>
        <div class="text-xs text-gray-500 bg-gray-50 rounded p-2 mb-1">AI: ${row.aiCoachText || '-'}</div>
        ${row.handlerAnswer ? `<div class="text-xs text-blue-700 bg-blue-50 rounded p-2">교관: ${row.handlerAnswer}</div>` : ''}
      </div>
    `;
  }).join('');
}

render();
</script>
</body>
</html>
