<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>제사장의 길 - 관리자</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .header { background: #312e81; color: white; padding: 16px 20px; display:flex; align-items:center; justify-content:space-between; }
    .header h1 { font-size: 18px; }
    .header .who { font-size: 12px; color: #c7d2fe; cursor:pointer; text-decoration:underline; }
    .tabs { display: flex; background: #4338ca; }
    .tab { flex:1; padding: 14px; text-align: center; cursor: pointer; color: #c7d2fe; border: none; background:none; font-size: 15px; font-weight:600; }
    .tab.active { background: #6366f1; color: white; }
    .login { padding: 60px 20px; text-align: center; }
    .login h2 { margin-bottom: 8px; color:#312e81; }
    .login p { margin-bottom: 20px; color:#666; font-size: 13px; }
    .login input { padding: 10px; margin: 6px; width: 220px; border:1px solid #ccc; border-radius:6px; font-size:14px; }
    .login button { padding: 10px 24px; background: #6366f1; color: white; border: none; border-radius:6px; cursor: pointer; font-size:14px; font-weight:600; }
    .login .err { color: #dc2626; font-size: 13px; margin-top: 10px; min-height: 18px; }
    #appPanel { display:none; flex-direction:column; height:100vh; }
    .content { flex:1; border: none; width: 100%; }
  </style>
</head>
<body>
  <!--
    ⚠️ 임시 방편 로그인
    아래 ADMIN_PASSWORD 상수 하나로만 검증하는 프론트엔드 레벨 간단 체크입니다.
    소스만 열어보면 비밀번호가 그대로 노출되므로 실제 보안 효과는 없습니다.
    나중에 진짜 보안 작업(Apps Script 스크립트 속성 + 서버 검증 등)을 할 때
    이 블록 전체를 교체하세요.
  -->
  <div class="login" id="loginPanel">
    <h2>제사장의 길 - 관리자</h2>
    <p>관리자 비밀번호를 입력하세요.</p>
    <div>
      <input type="password" id="pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')tryLogin()" />
    </div>
    <button onclick="tryLogin()">입장</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="appPanel">
    <div class="header">
      <h1>제사장의 길 - 관리자</h1>
      <span class="who" onclick="logout()">로그아웃</span>
    </div>
    <div class="tabs">
      <button class="tab active" data-view="profile" onclick="switchTab('profile', this)">통합 조회</button>
      <button class="tab" data-view="coach" onclick="switchTab('coach', this)">교관 대시보드</button>
      <button class="tab" data-view="edu" onclick="switchTab('edu', this)">교육부 대시보드</button>
    </div>
    <iframe id="content" class="content"></iframe>
  </div>

  <script>
    // ⚠️ 임시 비밀번호 — 나중에 실제 보안 작업 시 교체할 것.
    const ADMIN_PASSWORD = 'admin1234';

    // 각 관리자 화면 파일명 — 실제 파일이 이 이름과 같은 폴더에 있어야 합니다.
    const VIEW_FILES = {
      profile: 'teacher-profile.html',
      coach: 'coach-dashboard.html',
      edu: 'edu-dashboard.html'
    };

    function tryLogin() {
      const pw = document.getElementById('pw').value;
      if (pw !== ADMIN_PASSWORD) {
        document.getElementById('loginErr').textContent = '비밀번호가 올바르지 않습니다.';
        return;
      }
      document.getElementById('loginErr').textContent = '';
      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('appPanel').style.display = 'flex';

      // 최초 진입 시 통합 조회 탭 활성화
      const firstBtn = document.querySelector('.tab[data-view="profile"]');
      switchTab('profile', firstBtn);
    }

    function logout() {
      document.getElementById('pw').value = '';
      document.getElementById('content').src = 'about:blank';
      document.getElementById('appPanel').style.display = 'none';
      document.getElementById('loginPanel').style.display = 'block';
    }

    function switchTab(view, btnEl) {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      if (btnEl) {
        btnEl.classList.add('active');
      } else {
        const fallback = document.querySelector(`.tab[data-view="${view}"]`);
        if (fallback) fallback.classList.add('active');
      }

      const file = VIEW_FILES[view];
      if (!file) {
        console.error('알 수 없는 화면:', view);
        return;
      }
      document.getElementById('content').src = file;
    }
  </script>
</body>
</html>
