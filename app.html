// 아주 단순한 키워드 기반 카테고리 분류 (추후 AI 분류로 교체 가능)
// ⚠️ 2026-09-15 버그 수정: feedback-room.html이 situation 앞에 붙여 저장하는 분류 태그
// ("[심리상담/자문]", "[수강생코칭/자문/만남]" 등)가 아래 키워드 매칭에 그대로 걸려들어
// 실제 고민 내용과 무관하게 카테고리가 결정되던 문제가 있었다(예: "[수강생코칭/..."은 '수강'이
// 걸려 전부 '센터 활동'으로 분류됨). 맨 앞 대괄호 태그를 먼저 떼어낸 뒤 본문만 분류한다.
function categorize(text) {
  if (!text) return '기타';
  const t = String(text).replace(/^\s*\[[^\]]*\]\s*/, '');
  if (!t) return '기타';
  if (t.includes('복음방') || t.includes('전도')) return '복음방/전도';
  if (t.includes('상담')) return '상담 기술';
  if (t.includes('관계') || t.includes('갈등') || t.includes('싸') ) return '관계/갈등';
  if (t.includes('동기') || t.includes('의욕') || t.includes('열정')) return '동기부여';
  if (t.includes('센터') || t.includes('수강')) return '센터 활동';
  return '기타';
}

function daysDiff(a, b) {
  return (new Date(b) - new Date(a)) / (1000 * 60 * 60);
}

// "전체 현황"의 핵심 지표 4개를 임의의 rows 부분집합에 대해 계산 — 전체 합계와 부서별 분해에 공용.
function computeFeedbackStats(subRows) {
  const total = subRows.length;
  if (total === 0) return { total: 0, answeredCount: 0, aiPct: 0, escPct: 0, avgHours: '-' };
  const aiDone = subRows.filter(r => r.source === 'AI셀프코칭' && r.status === '완료').length;
  const escalated = subRows.filter(r => r.source === '사람에스컬레이션').length;
  const answered = subRows.filter(r => r.source === '사람에스컬레이션' && r.status === '완료' && r.answeredAt);
  const answeredCount = subRows.filter(r => r.status === '완료').length; // 2026-09-15: "답변 완료" 컬럼용(부서별 현황)
  const avgHours = answered.length
    ? (answered.reduce((sum, r) => sum + daysDiff(r.submittedAt, r.answeredAt), 0) / answered.length).toFixed(1)
    : '-';
  return { total, answeredCount, aiPct: Math.round(aiDone / total * 100), escPct: Math.round(escalated / total * 100), avgHours };
}

    const max = Math.max(1, ...d.stages.map(x => x.count));
    body = `<div class="text-xs text-base-content/40 mb-2">${stageRole ? esc(adminRoleShortLabel(stageRole)) + ' 기준 ' : ''}진행 중인 대상자 ${d.total}명</div>
      <div class="flex flex-col gap-1.5">${d.stages.map(x => `
        <div class="flex items-center gap-2">
          <div class="text-xs font-bold shrink-0" style="width:56px">${esc(x.stage)}</div>
          <div class="flex-1 rounded" style="background:#F3F4F6;height:16px"><div class="rounded" style="height:16px;width:${x.count ? Math.max(3, Math.round(x.count / max * 100)) : 0}%;background:${STAGE_BAR_COLOR[x.stage] || '#7E22CE'}"></div></div>
          <div class="text-xs font-bold text-right shrink-0" style="width:44px">${x.count}명</div>
        </div>`).join('')}</div>`;
  }
  return sectionCard('accent', '📊', title, sub, key + tabs + body);
}

async function loadAllLeads() {
  allLeadsLoading = true;
  distRender();
  try {
    const res = await callApi({ action: 'getAllCenterLeads' });
    allLeads = (res && Array.isArray(res.rows)) ? res.rows : [];
  } catch (e) {
    allLeads = [];
  }
  allLeadsLoading = false;
  distRender();
}

// ============ 월별 결산 현황 (getSettlementReport) ============
// 2026-09-22: edu(1️⃣ 교사현황)에서 dist(2️⃣ 부서별 활동 관리, "[전체] 결산")로 이동 — 재렌더는 distRender.

async function loadSettlement() {
  settlementLoading = true;
  distRender();
  try {
    const res = await callApi({ action: 'getSettlementReport' });
    settlement = (res && !res.error) ? res : { error: (res && res.error) || '불러오기 실패' };
  } catch (e) {
    settlement = { error: String(e) };
  }
  settlementLoading = false;
  distRender();

function tierChangeBadge(cur, sug) {
  const up = rosterTiers.indexOf(sug) > rosterTiers.indexOf(cur);
  return `<span class="text-base-content/60">${esc(cur)}</span> <span class="text-base-content/30">→</span>
    <span class="badge ${up ? 'badge-success' : 'badge-error'} badge-sm">${esc(sug)}</span>`;
}

        <div class="text-xl font-black ${colorCls}">${value}</div>

// allLeads(getAllCenterLeads 원본 레코드)에 등장하는 'yyyy-MM' 월 목록, 최신순.
function leadsAvailableMonths() {
  if (!allLeads) return [];
  const months = new Set();
  allLeads.forEach(r => { if (r.date && r.date.length >= 7) months.add(r.date.slice(0, 7)); });
  return [...months].sort().reverse();
}

// ============ 부서별 교사 현황 (getRoster 기반) ============

function buildRosterStats() {
  // 부서는 교역자/자문회/장년회/부녀회/청년회/기타 6개 조직 버킷으로 묶어서 집계
  // (district-dashboard.html/백엔드 _orgBucket_ 과 동일 규칙 — 원본 '부서' 값이 그대로 노출되지 않게).
  const deptCounts = {};
  roster.forEach(r => {
    const d = orgBucket(r.dept);
    deptCounts[d] = (deptCounts[d] || 0) + 1;
  });
  const deptLabels = Object.keys(deptCounts).sort((a, b) => deptCounts[b] - deptCounts[a]);

  // 교사구분: 백엔드가 내려준 참고 목록 순서를 우선 사용 (하드코딩 방지),
  // 목록에 없는 값이 실제로 존재하면 뒤에 추가로 붙임.
  const tierCounts = {};
  roster.forEach(r => {
    const t = r.tier || '(미분류)';
    tierCounts[t] = (tierCounts[t] || 0) + 1;
  });
  const tierLabels = rosterTiers.slice();
  Object.keys(tierCounts).forEach(t => { if (!tierLabels.includes(t)) tierLabels.push(t); });

  // 부서(버킷) × 교사구분 교차 집계 — "부서별 등록 교사 수" 누적 막대그래프용.
  const deptTierCounts = {};
  deptLabels.forEach(d => { deptTierCounts[d] = {}; });
  roster.forEach(r => {
    const d = orgBucket(r.dept);
    const t = r.tier || '(미분류)';
    deptTierCounts[d][t] = (deptTierCounts[d][t] || 0) + 1;
  });

  return { deptLabels, deptCounts, deptTierCounts, tierLabels, tierCounts };
}

// 2026-09-23: 막대그래프 제거 요청 — 부서×등급을 표로 본다.
// 행 = 교역자/자문회/장년회/부녀회/청년회, 열 = 총 / 휴 / 교 / 활 / 우.
// (짧은 머리글은 폰에서 한 줄에 들어가게 하려는 것 — title 속성에 원래 이름을 넣어둠)
const TIER_SHORT = { '휴교사': '휴', '교사': '교', '활동교사': '활', '우수교사': '우' };

function renderRosterSection() {
  if (roster.length === 0) return '';
  const rows = ORG_MAIN_DEPTS.map(d => {
    const list = roster.filter(r => orgBucket(r.dept) === d);
    const byTier = {};
    list.forEach(r => { const t = r.tier || '(미분류)'; byTier[t] = (byTier[t] || 0) + 1; });
    return { dept: d, total: list.length, byTier };
  }).filter(r => r.total > 0);

  const totalAll = rows.reduce((n, r) => n + r.total, 0);
  const tierAll = t => rows.reduce((n, r) => n + (r.byTier[t] || 0), 0);
  const cell = (v, total) => v
    ? `<b>${v.toLocaleString()}</b><span class="dept-pct">${pct(v, total)}%</span>`
    : '<span class="dept-zero">-</span>';

  const body = `
    <div class="overflow-x-auto">
      <table class="dept-table">
        <thead><tr>
          <th class="dept-name">부서</th>
          <th>총</th>
          ${TIER_ORDER.map(t => `<th title="${esc(t)}" class="${TIER_TEXT_COLOR[t] || ''}">${TIER_SHORT[t] || esc(t)}</th>`).join('')}
        </tr></thead>
        <tbody>
          ${rows.map(r => `<tr>
            <td class="dept-name">${esc(r.dept)}</td>
            <td class="dept-total">${r.total.toLocaleString()}</td>
            ${TIER_ORDER.map(t => `<td>${cell(r.byTier[t] || 0, r.total)}</td>`).join('')}
          </tr>`).join('')}
        </tbody>
        <tfoot><tr>
          <td class="dept-name">합계</td>
          <td class="dept-total">${totalAll.toLocaleString()}</td>
          ${TIER_ORDER.map(t => `<td>${cell(tierAll(t), totalAll)}</td>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="text-xs text-base-content/40 mt-2">휴 = 휴교사 · 교 = 교사 · 활 = 활동교사 · 우 = 우수교사</div>
  `;
  return sectionCard('secondary', '🏢', '부서별 교사 현황 (교·자·장·부·청)', `교사명단 등록 ${roster.length}명 기준 (부서/교사구분은 시트 값을 그대로 사용)`, body);
}

// ============ 2026-09-16: AI 분석 ("🤖 전체 현황 AI 분석" — 6개 부서 통합 데이터) ============
// district-dashboard.html과 동일한 백엔드 경로('generateContent', Code.gs _callAi_가 Claude
// 우선/Gemini 폴백+503 자동 재시도 처리) 재사용 — 이 파일에서 새 백엔드 액션 안 만듦.
let aiAnalysis = null; // { loading, error, text }

// 현재 화면에 이미 로드된 데이터(roster/settlement/피드백)로 조직 전체 스냅샷을 만든다 —
// district-dashboard.html처럼 지역×역할×항목 원본 데이터는 이 화면엔 없어서, 대신 등급분포·
// 결산현황·부서별 피드백 지표로 구성한다.
function buildOrgSnapshot() {
  const s = buildRosterStats();
  const snapshot = {
    총교사수: roster.length,
    부서별_교사수: s.deptLabels.map(d => ({ 부서: d, 인원: s.deptCounts[d] })),
    부서별_등급분포: s.deptLabels.map(d => ({ 부서: d, ...s.deptTierCounts[d] }))
  };
  if (settlement && !settlement.error) {
    snapshot.이번달_결산 = {
      승급대상: settlement.promotionsTotal || 0, 강등대상: settlement.demotionsTotal || 0,
      허가대기: settlement.pendingApprovalCount || 0, 비활동자: settlement.inactiveTotal || 0,
      센터인도_상위: (settlement.leaders || []).slice(0, 10).map(l => ({ 이름: l.name, 지역: l.region, 건수: l.leadCount }))
    };
  }
  if (rows.length > 0) {
    const memberDeptMap = {};
    roster.forEach(r => { memberDeptMap[String(r.memberId).trim()] = orgBucket(r.dept); });
    snapshot.피드백_전체 = computeFeedbackStats(rows);
    snapshot.피드백_부서별 = ORG_DEPTS.map(d => {
      const subRows = rows.filter(r => memberDeptMap[String(r.memberId).trim()] === d);
      return { 부서: d, ...computeFeedbackStats(subRows) };
    });
  }
  return snapshot;
}

function buildOrgAiPrompt(snapshot) {
  return `다음은 "제사장의 길" 앱 전체(6개 부서: 교역자/자문회/장년회/부녀회/청년회/기타) 교사 현황 데이터입니다.\n\n${JSON.stringify(snapshot)}\n\n다음 항목을 분석해주세요:\n1. 전체적으로 어떤 활동/지표에 집중되어 있는지\n2. 특별히 강세를 보이는 부서와 그 이유 추정\n3. 취약한 부서와 보완이 필요한 부분\n4. 센터 인도 실적과 연관된 활동 패턴\n5. 다음 달 집중해야 할 활동 제안\n\n한국어로 간결하고 실용적으로 답변하되, 반드시 아래 4개 마크다운 제목을 정확히 그대로 사용하고 다른 제목은 추가하지 마세요:\n## 📊 전체 활동 패턴\n## 🏆 강세 지역/항목\n## ⚠️ 보완 필요 지역/항목\n## 💡 다음 달 제안`;
}



async function runOrgAiAnalysis() {
  aiAnalysis = { loading: true, error: '', text: '' };
  eduRender();
  const payload = { contents: [{ role: 'user', parts: [{ text: buildOrgAiPrompt(buildOrgSnapshot()) }] }] };
  let lastErrMsg = '';
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const res = await callApi({ action: 'generateContent', payload });
      const text = res && res.candidates && res.candidates[0] && res.candidates[0].content && res.candidates[0].content.parts[0] && res.candidates[0].content.parts[0].text;
      if (text) { aiAnalysis = { loading: false, error: '', text }; eduRender(); return; }
      lastErrMsg = 'AI 응답이 비어 있습니다.';
    } catch (e) {
      lastErrMsg = e.message || String(e);
    }
    if (attempt < 3) await new Promise(r => setTimeout(r, 1000));
  }
  aiAnalysis = { loading: false, error: '잠시 후 다시 시도해주세요.', text: '' };
  eduRender();
}

  if (roster.length === 0) return '';

async function loadReport(force) {
  const key = state.dept;
  if (!force && state.cache[key]) { distRender(); return; }
  state.loading = true; state.error = '';
  distRender();
  try {
    // region은 항상 '전체'로 받아서 캐시 — 지역 드롭다운은 클라이언트에서만 필터링(재요청 없이 즉시 전환)
    const res = await callApi({ action: 'getDistrictReport', dept: state.dept, region: '' });
    if (res && res.error) { state.error = res.error; }
    else {
      if (Array.isArray(res.byRegion)) res.byRegion.sort((x, y) => String(x.region || '').localeCompare(String(y.region || ''), 'ko', { numeric: true })); // 1지역부터 순서대로
      state.cache[key] = res;
    }
  } catch (e) {
    state.error = '서버 연결에 실패했습니다: ' + e;
  }
  state.loading = false;
  distRender();
}

async function loadTeacherReport(force) {
  if (!force && (tlReport || tlReportLoading)) return;
  tlReportLoading = true;
  eduRender();
  try {
    const res = await callApi({ action: 'getTeacherListReport' });
    tlReport = (res && Array.isArray(res.rows)) ? res.rows : [];
    if (res && res.error) tlReport = [];
  } catch (e) {
    tlReport = [];
  }
  tlReportLoading = false;
  mergeTeacherReport();
  eduRender();
}
function mergeTeacherReport() {
  if (!rosterAll || !tlReport) return;
  const byId = {};
  tlReport.forEach(r => { byId[String(r.memberId)] = r; });
  rosterAll.forEach(t => {
    const r = byId[String(t.memberId)];
    if (!r) return;
    t.monthlyCount = r.monthlyCount; t.lastActivityDate = r.lastActivityDate; t.conditionText = r.conditionText;
    t.actTotal = r.actTotal || 0; t.actTypes = r.actTypes || {}; t.leads1y = r.leads1y || 0; t.suggestion = r.suggestion; t.apply = r.apply; t.affilSel = r.affil; t.genderSel = r.gender; t._rep = true;
  });
}
// 앱에서 기록한 활동 요약 — "상담1 3 · 만남1 2" 형태(많은 순, 상위 3개 + 나머지 개수).
function actSummaryText(t, max) {
  const items = Object.entries(t.actTypes || {}).sort((a, b) => b[1] - a[1]);
  if (!items.length) return '';
  const shown = items.slice(0, max || 3).map(([k, v]) => k + ' ' + v).join(' · ');
  return items.length > (max || 3) ? shown + ' 외 ' + (items.length - (max || 3)) + '종' : shown;
}
function applyText(a) {
  if (!a) return '';
  const sch = a.scheduleType === '언제나' ? '언제나 가능' : a.scheduleType === '상의' ? '상의 후 결정'
    : [a.from && a.to ? a.from.slice(5).replace('-', '/') + '~' + a.to.slice(5).replace('-', '/') : '', (a.days || []).join(''), (a.times || []).join('·'), a.hours].filter(Boolean).join(' · ');
  return (a.roles || []).join('·') + (sch ? ' (' + sch + ')' : '');
}

// 2026-09-23: 지정 가능한 직책(사용자 지시). 이 사람들만 관리자 화면에 들어갈 수 있다.
// ⚠️ 백엔드 Code.gs 의 ALLOWED_POS 와 같은 값이어야 한다 — 한쪽만 고치면 저장이 거부된다.
const ASSIGNABLE_POSITIONS = ['회장', '총무', '지역장', '섭외 교관', '복음방 교관', '전도 과장', '교육 과장'];

async function assignPosition(t, position) {
  // 이미 그 직책이면 눌렀을 때 해제(빈 직책으로 되돌림), 아니면 새로 지정.
  const nextPosition = (t.position === position) ? '' : position;
  const label = position;
  const verb = nextPosition ? '지정' : '해제';
  if (!confirm(`${maskName(t.name)} 교사를 ${label}(으)로 ${verb}하시겠습니까?`)) return;
  state.tlAssigning = true;
  eduRender();
  try {
    const res = await callApi({
      action: 'upsertRosterLeader',
      memberId: t.memberId, name: t.name, region: t.region, dept: t.dept, position: nextPosition
    });
    if (res && res.error) throw new Error(res.error);
    t.position = nextPosition; // 캐시된 rosterAll 행에도 즉시 반영(재요청 없이 화면 갱신)
  } catch (e) {
    alert(`${label} ${verb} 중 오류가 발생했습니다: ` + e.message);
  }
  state.tlAssigning = false;
  eduRender();
}

// 2026-09-20: 교사 명단(별도 화면, ?view=teachers) — ① 부서 선택 ② 그 부서의 지역장·교관 등록 ③ 교사 현황 표(최근 1년 센터 등록 실적)
// ④ 교육부·전도부 일괄 등급 승인. 교관·지역장은 등급 승인 권한이 없다(등록/지정만).
const APPROVER_DEPTS = ['교육부', '전도부'];

function teacherListRowsFiltered() {
  let rows = rosterAll || [];
  // 2026-09-23 통합 검색: 부서 탭을 안 골라도 이름·고유번호·지역·부서·직책으로 전체에서 찾는다.
  // (부서 탭을 고른 상태라면 그 부서 안에서만 찾는 "부서별 검색"이 된다)
  const q = (state.tlQuery || '').trim().toLowerCase();
  if (q) {
    rows = rows.filter(t => [t.name, t.memberId, t.region, t.dept, t.position, t.tier]
      .some(v => String(v || '').toLowerCase().includes(q)));
  }
  if (state.tlFilterDept) rows = rows.filter(t => deptBucket(t.dept) === state.tlFilterDept);
  if (state.tlFilterRegion) rows = rows.filter(t => t.region === state.tlFilterRegion);
  if (state.tlFilterTier) rows = rows.filter(t => t.tier === state.tlFilterTier);
  if (state.tlFilterApply === 'yes') rows = rows.filter(t => t._rep && t.apply);
  if (state.tlFilterApply === 'no') rows = rows.filter(t => t._rep && !t.apply);
  if (state.pendingOnly) rows = rows.filter(t => t.suggestion);
  if (state.tlMinLeads > 0) rows = rows.filter(t => t._rep && (t.leads1y || 0) >= state.tlMinLeads);
  return [...rows].sort((a, b) =>
    (a.dept || '').localeCompare(b.dept || '', 'ko') ||
    (a.region || '').localeCompare(b.region || '', 'ko', { numeric: true }) ||
    (a.name || '').localeCompare(b.name || '', 'ko'));
}

//   부서·지역 필터가 이미 명단 위에 있으니 "그 부서 그 지역에서 지정"도 그대로 된다.

/** 교사 통합 검색 — 부서 탭을 안 골라도 전체에서, 고르면 그 부서 안에서 찾는다. */
function teacherSearchHtml() {
  const q = state.tlQuery || '';
  const scope = state.tlFilterDept ? `${state.tlFilterDept} 안에서` : '전체 교사에서';
  return `
    <div class="px-4 pt-3">
      <div class="tl-search">
        <input id="tl-q" type="text" placeholder="${esc(scope)} 이름·고유번호·지역·직책으로 찾기"
               value="${esc(q)}" autocomplete="off">
        ${q ? '<button type="button" class="clr" id="tl-q-clear" title="지우기">✕</button>' : ''}
      </div>
    </div>`;
}
function teacherListFilterHtml() {
  const regionsForDept = state.tlFilterDept
    ? [...new Set((rosterAll || []).filter(t => deptBucket(t.dept) === state.tlFilterDept).map(t => t.region).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko', { numeric: true }))
    : [];
  return `
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 px-4 pt-3">
      <select id="tl-filter-region" class="select select-bordered select-sm w-full" ${state.tlFilterDept ? '' : 'disabled'}>
        <option value="">지역 전체</option>
        ${regionsForDept.map(r => `<option value="${esc(r)}" ${state.tlFilterRegion === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}
      </select>
      <select id="tl-filter-tier" class="select select-bordered select-sm w-full">
        <option value="">등급 전체</option>
        ${TIER_ORDER.map(t => `<option value="${esc(t)}" ${state.tlFilterTier === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
      </select>
      <select id="tl-filter-apply" class="select select-bordered select-sm w-full">
        <option value="">활동 신청 전체</option>
        <option value="yes" ${state.tlFilterApply === 'yes' ? 'selected' : ''}>신청 있음</option>
        <option value="no" ${state.tlFilterApply === 'no' ? 'selected' : ''}>신청 없음</option>
      </select>
      <label class="flex items-center gap-1.5 text-xs whitespace-nowrap">최근 1년 센터 등록
        <input id="tl-min-leads" type="number" min="0" class="input input-bordered input-sm w-16" value="${state.tlMinLeads || ''}" placeholder="0"> 건↑</label>

// ════════════════════════════════════════════════════════════════════
// 2026-09-23 교사 개별 시트(팝업)
// ────────────────────────────────────────────────────────────────────
// 교관 요청: "자기 지역 소속 교사가 어느 부서의 어느 지역의 어느 활동에
// 연결돼서 활동할 수 있는지" 를 가로 스크롤 없이 한 창에서 봐야 한다.
// → 명단 행을 누르면 이 시트가 뜨고, 명단(getRoster)·리포트(getTeacherListReport)로
//   이미 갖고 있는 값을 먼저 그린 뒤, 연결 명함(getConnectCard)과
//   이수교육(getRequiredEducation) 2건만 추가로 불러와 다시 그린다.
// 캐시: 같은 사람을 다시 열면 재요청하지 않는다(tlSheetCache).
// ════════════════════════════════════════════════════════════════════
const tlSheetCache = {};   // memberId → { card, edu }
let tlSheetOpenId = null;  // 응답이 늦게 와도 "지금 열려 있는 사람"만 다시 그리기 위한 가드

function openTeacherSheet(mid) {
  const t = (rosterAll || []).find(x => x.memberId === mid);
  if (!t) return;
  tlSheetOpenId = mid;
  openSheet(teacherSheetHtml(t, tlSheetCache[mid]));
  wireTeacherSheet(t);
  if (!tlSheetCache[mid]) loadTeacherSheetExtras(t);
}

async function loadTeacherSheetExtras(t) {
  const mid = t.memberId;
  const [card, edu] = await Promise.all([
    callApi({ action: 'getConnectCard', memberId: mid, viewerId: MEMBER_ID }).catch(() => null),
    callApi({ action: 'getRequiredEducation', memberId: mid }).catch(() => null)
  ]);
  tlSheetCache[mid] = { card: (card && card.card) || null, edu: (edu && !edu.error) ? edu : null };
  if (tlSheetOpenId !== mid) return;              // 그 사이 다른 교사를 열었으면 덮어쓰지 않음
  openSheet(teacherSheetHtml(t, tlSheetCache[mid]));
  wireTeacherSheet(t);
}

function tlKV(label, value) {
  return `<div class="tls-k">${esc(label)}</div><div class="tls-v">${value}</div>`;
}

function teacherSheetHtml(t, extra) {
  const loaded = !!t._rep;
  const dash = '<span class="tls-dim">-</span>';
  const wait = '<span class="tls-dim">불러오는 중…</span>';

  // ── 연결 현황: 명함(가능 역할·항목/일정) + 활동 신청
  let connectBlock;
  if (!extra) {
    connectBlock = `<div class="tls-wait">${wait}</div>`;
  } else if (extra.card) {
    const c = extra.card;
    const chips = arr => (arr && arr.length)
      ? arr.map(v => `<span class="tls-chip">${esc(v)}</span>`).join('')
      : dash;
    const sched = c.schedType === '언제나' ? '언제나 가능'
      : c.schedType === '상의' ? '상의 후 결정'
      : [c.from && c.to ? c.from + ' ~ ' + c.to : '', (c.days || []).join(''), (c.times || []).join('·')].filter(Boolean).join(' · ');
    connectBlock = `
      <div class="tls-grid">
        ${tlKV('명함 소속', esc([c.dept, c.region].filter(Boolean).join(' · ') || '-'))}
        ${tlKV('가능 역할·항목', `<div class="tls-chips">${chips(c.roles)}</div>`)}
        ${c.targets && c.targets.length ? tlKV('가능 대상', `<div class="tls-chips">${chips(c.targets)}</div>`) : ''}
        ${c.fields && c.fields.length ? tlKV('전문 분야 · 전도 기능', `<div class="tls-chips">${chips(c.fields)}</div>`) : ''}
        ${tlKV('활동 가능 일정', esc(sched || '-') + (c.expired ? ' <span class="tls-warn">(기간 지남)</span>' : ''))}
        ${c.intro ? tlKV('소개', esc(c.intro)) : ''}
        ${c.phone ? tlKV('연락처', esc(c.phone)) : ''}
      </div>`;
  } else {
    connectBlock = `<div class="tls-empty">아직 명함을 등록하지 않았어요. (연결 탭에서 등록하면 여기에 보입니다)</div>`;
  }

  // ── 이수교육
  let eduBlock;
  if (!extra) {
    eduBlock = `<div class="tls-wait">${wait}</div>`;
  } else if (extra.edu) {
    const cats = (extra.edu.categories && extra.edu.categories.length) ? extra.edu.categories : REQ_EDU_CATEGORIES_DEFAULT;
    const done = cats.filter(c => extra.edu[c]);
    eduBlock = `
      <div class="tls-edu-sum">${done.length} / ${cats.length} 과목 이수</div>
      <div class="tls-edu">
        ${cats.map(c => {
          const d = extra.edu[c];
          return `<div class="tls-edu-row ${d ? 'on' : ''}">
            <span class="tls-edu-nm">${esc(c)}</span>
            <span class="tls-edu-st">${d ? esc(String(d)) : '미이수'}</span>
          </div>`;
        }).join('')}
      </div>`;
  } else {
    eduBlock = `<div class="tls-empty">이수 현황을 불러오지 못했어요.</div>`;
  }

  return `
    <div class="tls">
      <div class="tls-head">
        <div>
          <div class="tls-name">${esc(t.name)}<span class="tls-suffix"> 교사</span></div>
          <div class="tls-sub">${esc(t.dept || '-')} · ${esc(t.region || '-')}${t.affiliation ? ' · ' + esc(t.affiliation) : ''}</div>
        </div>
        <button class="tls-close" id="tls-close" aria-label="닫기">✕</button>
      </div>

      <div class="tls-badges">
        <span class="badge ${TIER_BADGE[t.tier] || 'badge-ghost'}">${esc(t.tier || '-')}</span>
        ${t.position ? `<span class="badge badge-outline">${esc(t.position)}</span>` : ''}
        ${loaded && t.actTotal > 0 ? `<span class="tls-chip leaf">활동 중 · 기록 ${esc(t.actTotal)}건</span>` : ''}
        ${loaded && t.suggestion ? `<span class="badge ${TIER_BADGE[t.suggestion.suggestedTier] || 'badge-ghost'}">등급 제안 → ${esc(t.suggestion.suggestedTier)}</span>` : ''}
      </div>

      <div class="tls-sec-t">센터 인도 실적</div>
      <div class="tls-stats">
        <div class="tls-stat"><b>${t.regLeads != null ? esc(t.regLeads) : '-'}</b><span>센터 등록</span></div>
        <div class="tls-stat"><b>${t.unregLeads != null ? esc(t.unregLeads) : '-'}</b><span>센터 미등록</span></div>
        <div class="tls-stat"><b>${loaded ? esc(t.monthlyCount || 0) : '…'}</b><span>이번 달 활동</span></div>
      </div>
      ${(t.counsel || t.gospelRoom || t.companion)
        ? `<div class="tls-grid">${tlKV('부서 기록란', `상담 ${esc(t.counsel || 0)} · 복음방 ${esc(t.gospelRoom || 0)} · 동행교사 ${esc(t.companion || 0)}`)}</div>`
        : ''}

      <div class="tls-sec-t">앱 활동 기록</div>
      <div class="tls-grid">
        ${tlKV('누적 기록', loaded ? esc(t.actTotal || 0) + '건' : wait)}
        ${tlKV('마지막 활동일', loaded ? esc(t.lastActivityDate || '-') : wait)}
        ${loaded && t.actTotal > 0 ? tlKV('기록한 활동', esc(actSummaryText(t, 20))) : ''}
        ${tlKV('승급·강등 조건', loaded ? esc(t.conditionText || '-') : wait)}
        ${loaded && t.suggestion ? tlKV('제안 사유', esc(t.suggestion.reason || '-')) : ''}
      </div>

      <div class="tls-sec-t">연결 현황</div>
      ${connectBlock}
      <div class="tls-grid" style="margin-top:8px">
        ${tlKV('활동 신청', loaded ? (t.apply ? esc(applyText(t.apply)) : '<span class="tls-dim">없음</span>') : wait)}
        ${loaded && t.apply ? tlKV('신청 소속·성별', esc([t.affilSel, t.genderSel].filter(Boolean).join(' · ') || '-')) : ''}
      </div>

      <div class="tls-sec-t">이수교육</div>
      ${eduBlock}

      ${t.note ? `<div class="tls-sec-t">비고</div><div class="tls-grid">${tlKV('메모', esc(t.note))}</div>` : ''}

      <!-- 2026-09-23: 지역장·교관 지정을 여기로 통합(별도 패널 삭제 — 기능이 중복돼 정신없다는 지적).
           명단 위 부서·지역 필터로 대상을 좁힌 뒤 그 사람을 눌러 여기서 지정한다. -->
      <div class="tls-sec-t">직책 지정</div>
      <div class="tls-pos-now">현재 · <b>${esc(t.position || '일반 교사')}</b></div>
      <div class="tls-pos-grid">
        ${ASSIGNABLE_POSITIONS.map(p => `
          <button type="button" class="tls-pos-btn ${t.position === p ? 'on' : ''}" data-pos="${p}" ${state.tlAssigning ? 'disabled' : ''}>${esc(p)}</button>`).join('')}
      </div>
      <div class="tls-pos-hint">
        ${esc(t.dept || '-')} · ${esc(t.region || '-')} 담당으로 등록됩니다.
        지정된 직책을 다시 누르면 해제돼요.<br>
        <b>직책이 지정된 사람만 관리자 화면에 들어갈 수 있어요.</b>
        (교역자와 센터 사명자는 직책과 상관없이 들어갈 수 있어요)
      </div>

      <div class="tls-id">고유번호 ${esc(t.memberId)}</div>
      <button class="kko-btn-outline" id="tls-encourage" style="margin-top:12px">💌 격려 메시지 보내기</button>
    </div>`;
}

function wireTeacherSheet(t) {
  const close = document.getElementById('tls-close');
  if (close) close.onclick = () => { tlSheetOpenId = null; closeSheet(); };
  const enc = document.getElementById('tls-encourage');
  if (enc) enc.onclick = () => { tlSheetOpenId = null; closeSheet(); openEncourageModal(t.memberId, t.name); };
  document.querySelectorAll('.tls-pos-btn').forEach(b => {
    b.onclick = async () => {
      tlSheetOpenId = null; closeSheet();
      await assignPosition(t, b.dataset.pos);   // 같은 직책을 다시 누르면 해제
    };
  });
}

      </div>
    </div>`;

function teacherListSectionHtml() {
  if (rosterLoading && !rosterAll) {
    return `<div class="p-6 text-center text-sm text-base-content/40"><span class="loading loading-spinner loading-md align-middle mr-2"></span>교사 명단 불러오는 중...</div>`;
  }
  if (!rosterAll) return '';
  const allRowsFiltered = teacherListRowsFiltered();
  // 20/50명씩 끊어 보기(0이면 전체). 체크박스 "보이는 N명 전체 선택"도 이 잘린 목록 기준.
  const rows = state.tlLimit > 0 ? allRowsFiltered.slice(0, state.tlLimit) : allRowsFiltered;
  const hiddenCount = allRowsFiltered.length - rows.length;
  const selected = state.tlSelected ? rosterAll.find(t => t.memberId === state.tlSelected) : null;
  const pendingTotal = rosterAll.filter(t => t.suggestion && (!state.tlFilterDept || deptBucket(t.dept) === state.tlFilterDept)).length;

  return `

      <div class="tl-banner">
        <div class="tl-banner-t">교사 명단 관리</div>

      </div>
    </div>
    ${teacherDeptTabsHtml()}
    ${teacherSearchHtml()}
    ${bulkBarHtml(rows)}
    ${teacherListFilterHtml()}
    <div class="px-4 pt-3 flex items-center justify-between gap-3 flex-wrap">
      <span class="tl-count">${hiddenCount > 0 ? `${rows.length}명 표시 <span class="text-base-content/40">/ 전체 ${allRowsFiltered.length}명</span>` : `${rows.length}명`}${tlReportLoading ? ' · 활동/센터 등록/제안 정보 불러오는 중… (20초 정도 걸릴 수 있어요)' : ''}</span>

          ${[20, 50, 0].map(n => `<button type="button" data-n="${n}" class="${state.tlLimit === n ? 'on' : ''}">${n === 0 ? '전체' : n + '명'}</button>`).join('')}
        </div>
      </div>
    </div>
    <div class="px-4 pt-1 pb-4">

          <thead class="sticky top-0 bg-base-100"><tr>

            <th>이름</th><th>지역</th><th>등급</th>
            <th title="이번 달 활동 건수">활동</th>

          <tbody>
            ${rows.map(t => `

async function runBulkApprove(useSuggested) {
  const rows = teacherListRowsFiltered();
  const byId = {}; (rosterAll || []).forEach(t => { byId[t.memberId] = t; });
  const ids = [...state.tlChecked].filter(id => byId[id]);
  const items = [];
  ids.forEach(id => {
    const t = byId[id];
    const newTier = useSuggested ? (t.suggestion && t.suggestion.suggestedTier) : state.bulkTier;
    if (newTier && newTier !== t.tier) items.push({ memberId: id, newTier, prevTier: t.tier, reason: useSuggested ? (t.suggestion && t.suggestion.reason) || '' : '최근 1년 센터 등록·활동 실적 기준 일괄 승인' });
  });
  state.bulkNote = '';
  if (!state.bulkApproverDept) { state.bulkNote = '⚠️ 승인 주체(교육부/전도부)를 선택해주세요.'; eduRender(); return; }
  if (!state.bulkApproverName.trim()) { state.bulkNote = '⚠️ 승인자 성함을 입력해주세요.'; eduRender(); return; }
  if (!useSuggested && !state.bulkTier) { state.bulkNote = '⚠️ 변경할 등급을 선택해주세요.'; eduRender(); return; }
  if (!items.length) { state.bulkNote = '⚠️ 변경할 대상이 없어요. (이미 그 등급이거나, 제안이 없는 분만 선택됐어요)'; eduRender(); return; }
  const summary = {}; items.forEach(i => { summary[i.newTier] = (summary[i.newTier] || 0) + 1; });
  const sumText = Object.entries(summary).map(([k, v]) => `${k} ${v}명`).join(', ');
  if (!confirm(`${state.bulkApproverDept} ${state.bulkApproverName.trim()}님 승인으로 ${items.length}명의 등급을 변경합니다.\n(${sumText})\n진행할까요?`)) return;
  state.bulkBusy = true; eduRender();
  try {
    const res = await callApi({ action: 'bulkChangeTier', items, approverDept: state.bulkApproverDept, approverName: state.bulkApproverName.trim() });
    if (res && res.error) throw new Error(res.error);
    const okIds = new Set((res.changed || []).map(c => String(c.memberId)));
    (rosterAll || []).forEach(t => {
      const it = items.find(i => String(i.memberId) === String(t.memberId));
      if (it && okIds.has(String(t.memberId))) { t.tier = it.newTier; t.suggestion = null; state.tlChecked.delete(t.memberId); }
    });
    state.bulkNote = `${res.changed.length}명 승인 완료` + ((res.failed && res.failed.length) ? ` (실패 ${res.failed.length}명)` : '');
    loadTeacherReport(true); // 제안/등급을 서버 기준으로 다시 계산
  } catch (e) {
    state.bulkNote = '⚠️ 승인 실패: ' + e.message;
  }
  state.bulkBusy = false; eduRender();
}

// 2026-09-22: district에서 edu(1️⃣ 교사 현황)로 이동 — 재렌더는 distRender가 아닌 eduRender.
function wireTeacherList() {
  const $ = id => document.getElementById(id);
  document.querySelectorAll('.tl-dept-tab').forEach(b => {
    b.onclick = () => { state.tlFilterDept = b.dataset.dept; state.tlFilterRegion = ''; state.tlPosQuery = ''; eduRender(); };
  });
  const bind = (id, fn) => { const el = $(id); if (el) el.onchange = fn; };
  bind('tl-filter-region', e => { state.tlFilterRegion = e.target.value; eduRender(); });
  bind('tl-filter-tier', e => { state.tlFilterTier = e.target.value; eduRender(); });
  bind('tl-filter-apply', e => { state.tlFilterApply = e.target.value; eduRender(); });
  bind('tl-min-leads', e => { state.tlMinLeads = Math.max(0, Number(e.target.value) || 0); eduRender(); });
  bind('bulk-approver-dept', e => { state.bulkApproverDept = e.target.value; });
  bind('bulk-tier', e => { state.bulkTier = e.target.value; });
  const nm = $('bulk-approver-name'); if (nm) nm.oninput = e => { state.bulkApproverName = e.target.value; };
  // 2026-09-22: 지역장·교관 등록 아코디언 / 20·50명 끊어보기 / 더 보기
  const limitBox = $('tl-limit');
  if (limitBox) limitBox.onclick = e => {
    const b = e.target.closest('button[data-n]'); if (!b) return;
    state.tlLimit = Number(b.dataset.n); eduRender();
  };
  const moreBtn = $('tl-more-btn');
  if (moreBtn) moreBtn.onclick = () => { state.tlLimit = state.tlLimit === 20 ? 50 : 0; eduRender(); };
  wireTeacherSearch();
  document.querySelectorAll('.tl-check').forEach(cb => {
    cb.onclick = e => e.stopPropagation();
    cb.onchange = () => { if (cb.checked) state.tlChecked.add(cb.dataset.mid); else state.tlChecked.delete(cb.dataset.mid); eduRender(); };
  });
  const head = $('tl-check-head');
  if (head) head.onchange = () => { const rows = teacherListRowsFiltered(); rows.forEach(t => head.checked ? state.tlChecked.add(t.memberId) : state.tlChecked.delete(t.memberId)); eduRender(); };
  const cn = $('tl-check-none'); if (cn) cn.onclick = () => { state.tlChecked.clear(); eduRender(); };
  const ba = $('bulk-apply'); if (ba) ba.onclick = () => runBulkApprove(false);
  const bs = $('bulk-apply-sug'); if (bs) bs.onclick = () => runBulkApprove(true);
  // 2026-09-23: 행을 누르면 표 아래 인라인이 아니라 개별 시트(팝업)로 연다.
  // (교관 요청 — "자기 지역 교사가 어느 부서·지역의 어느 활동에 연결돼 있는지"를
  //  가로 스크롤 없이 한 창에서 봐야 함)
  document.querySelectorAll('.tl-row').forEach(row => {
    row.onclick = () => openTeacherSheet(row.dataset.mid);
  });
}
// 2026-09-23: 검색창 배선.
// ⚠️ 한글은 조합 중에 DOM을 다시 그리면 글자가 끊긴다(이 프로젝트에서 이미 겪은 함정).
//    compositionstart~end 구간에는 재렌더하지 않고, 조합이 끝난 뒤에만 반영한다.
function wireTeacherSearch() {
  const q = document.getElementById('tl-q');
  if (q) {
    q.addEventListener('compositionstart', () => { q.dataset.composing = '1'; });
    q.addEventListener('compositionend', e => {
      q.dataset.composing = '';
      state.tlQuery = e.target.value; state.tlLimit = state.tlLimit || 20; eduRender();
      const n = document.getElementById('tl-q'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    });
    q.addEventListener('input', e => {
      if (q.dataset.composing) return;
      state.tlQuery = e.target.value; eduRender();
      const n = document.getElementById('tl-q'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    });
  }
  const clr = document.getElementById('tl-q-clear');
  if (clr) clr.onclick = () => { state.tlQuery = ''; eduRender(); };
}

function openEncourageModal(memberId, name) {

async function sendEncourageMessage() {
  const t = state.encourageTarget;
  if (!t) return;
  const fromName = (state.encourageFromName || '').trim();
  const message = (state.encourageText || '').trim();
  if (!fromName) { alert('보내는 분 성함을 입력해주세요.'); return; }
  if (!message) { alert('메시지를 입력해주세요.'); return; }
  state.encourageSending = true;
  eduRender();
  try {
    const res = await callApi({ action: 'sendEncouragement', fromId: '', fromName, toId: t.memberId, message });
    if (res && res.error) throw new Error(res.error);
    state.encourageSentNote = `${t.name} 교사님께 전달했습니다! 💌`;
    state.encourageText = '';
  } catch (e) {
    state.encourageSentNote = '오류가 발생했습니다: ' + e.message;
  }
  state.encourageSending = false;
  eduRender();
}

// ============ 지역별 활동 분석 (getAllActivities 기반, 이번 달) ============
// "이번 달 활동" 건수 하나만 보여주던 것을, 활동 유형(11종)별로 지역마다 몇 건·몇 %인지 펼쳐서
// 활동이 어디에 치중돼 있는지 보여주는 섹션. 지역별 상세와 같은 표/그래프 토글 형태.

function isThisMonth(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return false;
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}

// report: 현재 부서의 getDistrictReport 캐시(지역 필터와 무관하게 항상 부서 전체 rows 기준).
function buildActivityAnalysis(report) {
  if (!report || !allActivities) return null;
  const regionOf = {};
  const teacherCountByRegion = {};
  report.rows.forEach(r => {
    regionOf[String(r.memberId).trim()] = r.region || '';
    teacherCountByRegion[r.region || ''] = (teacherCountByRegion[r.region || ''] || 0) + 1;
  });

  const countsByRegion = {}; // region -> { type -> count }
  const totalByRegion = {};
  allActivities.forEach(a => {
    const region = regionOf[String(a.memberId).trim()];
    if (region === undefined) return; // 이 부서 소속 교사가 아님
    if (!isThisMonth(a.submittedAt)) return;
    (a.activities || []).forEach(type => {
      if (!type) return;
      if (!countsByRegion[region]) countsByRegion[region] = {};
      countsByRegion[region][type] = (countsByRegion[region][type] || 0) + 1;
      totalByRegion[region] = (totalByRegion[region] || 0) + 1;
    });
  });

  const regions = Object.keys(teacherCountByRegion);
  const seenTypes = new Set();
  Object.values(countsByRegion).forEach(m => Object.keys(m).forEach(t => seenTypes.add(t)));
  const types = ACTIVITY_OPTIONS.filter(t => seenTypes.has(t))
    .concat([...seenTypes].filter(t => !ACTIVITY_OPTIONS.includes(t)));

  const regionStats = regions.map(region => {
    const total = totalByRegion[region] || 0;
    const teacherCount = teacherCountByRegion[region] || 0;
    return {
      region, total, teacherCount,
      perTeacher: teacherCount > 0 ? total / teacherCount : 0,
      counts: countsByRegion[region] || {}
    };
  }).sort((a, b) => b.total - a.total);

  // 상/중/하 평가 — 교사 1인당 이번 달 활동 건수 기준, 부서 내 지역 순위를 3분위로 나눔.
  const rankOrder = [...regionStats].sort((a, b) => b.perTeacher - a.perTeacher);
  const rankMap = {};
  rankOrder.forEach((r, i) => { rankMap[r.region] = i; });
  const n = rankOrder.length;
  regionStats.forEach(r => {
    if (n <= 1) { r.grade = '-'; return; }
    const i = rankMap[r.region];
    const third = n / 3;
    r.grade = i < third ? '상' : (i < third * 2 ? '중' : '하');
  });

  return { types, regionStats };
}

// 위 roleActivitySectionHtml(역할별 총 건수 박스+지역별 표)은 역할별 "총 건수"만 보여줌 —
// 사용자가 "역할 파트 × 11개 활동 항목별 건수/비율까지 지역별로 펼쳐서" 요청해서 신설.
// 활동방(home.html) 신규 역할기반 기록(roles+activityItem)만 대상 — roles가 비어있는 옛 방식
// 기록(activity-room.html 시절)은 이 표에서 제외(그건 아래 "지역별 활동 분석"이 계속 담당).
// 2026-09-15: 3역할(인도자/섬김이/교사) → 4역할(인도자/교사/섬김이/협력교사)로 확장.
const ROLE_PARTS_DASH = ['인도자', '교사', '섬김이', '협력교사'];
const ROLE_ACTIVITY_ITEMS_DASH = ['피드백', '섭외', '친분', '만남1', '만남2', '상담1', '상담2', '복음방', '동행교사', '센터소개', '센터수강'];
function _emptyRoleCounts() {
  const o = {};
  ROLE_PARTS_DASH.forEach(r => { o[r] = 0; });
  return o;
}

// report: 현재 부서의 getDistrictReport 캐시(allActivities는 buildActivityAnalysis와 동일 전역 캐시 재사용).
function buildRoleActivityBreakdown(report) {
  if (!report || !allActivities) return null;
  const regionOf = {};
  report.rows.forEach(r => { regionOf[String(r.memberId).trim()] = r.region || ''; });

  const counts = {}; // counts[region][role][item] = count
  const itemGrandTotal = {};
  let grandTotal = 0;

  allActivities.forEach(a => {
    const region = regionOf[String(a.memberId).trim()];
    if (region === undefined) return; // 이 부서 소속 교사가 아님
    if (!isThisMonth(a.submittedAt)) return;
    const roles = (a.roles || []).filter(r => ROLE_PARTS_DASH.includes(r));
    if (!roles.length) return; // 옛 방식 기록(역할 없음)은 이 표 대상 아님
    roles.forEach(role => {
      (a.activities || []).forEach(item => {
        if (!item) return;
        if (!counts[region]) counts[region] = {};
        if (!counts[region][role]) counts[region][role] = {};
        counts[region][role][item] = (counts[region][role][item] || 0) + 1;
        itemGrandTotal[item] = (itemGrandTotal[item] || 0) + 1;
        grandTotal++;
      });
    });
  });

  const allRegions = report.byRegion.map(r => r.region);

  const regionRoleTotal = {}; // regionRoleTotal[region][role] = 그 지역·역할의 활동 총 건수(그래프1용)
  const regionItemTotal = {}; // regionItemTotal[region][item] = 역할 무관 그 지역·항목 총 건수(그래프2용)
  allRegions.forEach(region => {
    regionRoleTotal[region] = {};
    regionItemTotal[region] = {};
    ROLE_PARTS_DASH.forEach(role => {
      const m = (counts[region] && counts[region][role]) || {};
      regionRoleTotal[region][role] = Object.values(m).reduce((s, v) => s + v, 0);
    });
    ROLE_ACTIVITY_ITEMS_DASH.forEach(item => {
      let sum = 0;
      ROLE_PARTS_DASH.forEach(role => { sum += ((counts[region] && counts[region][role] && counts[region][role][item]) || 0); });
      regionItemTotal[region][item] = sum;
    });
  });

  return { counts, allRegions, regionRoleTotal, regionItemTotal, itemGrandTotal, grandTotal };
}

// 그 지역에서 역할 무관 합산 건수가 가장 높은 항목("강세 항목") 이름 — 표/AI 프롬프트 공용.
function regionTopItem(b, region) {
  let top = '', topV = -1;
  ROLE_ACTIVITY_ITEMS_DASH.forEach(item => {
    const v = (b.regionItemTotal[region] && b.regionItemTotal[region][item]) || 0;
    if (v > topV) { top = item; topV = v; }
  });
  return topV > 0 ? top : '-';
}
function regionTopItemValue(b, region) {
  return Math.max(0, ...ROLE_ACTIVITY_ITEMS_DASH.map(item => (b.regionItemTotal[region] && b.regionItemTotal[region][item]) || 0));
}

// 2026-09-17: 강세(빨강)~중간(노랑)~약세(파랑) 대비 색상 스케일 — "강세 항목"열/히트맵 공용.
// t: 0(가장 약함, 파랑) ~ 1(가장 강함, 빨강).
function divergingColor(t) {
  t = Math.max(0, Math.min(1, isFinite(t) ? t : 0));
  const lerp = (a, b, u) => Math.round(a + (b - a) * u);
  let r, g, bch;
  if (t < 0.5) { const u = t / 0.5; r = lerp(0x1d, 0xea, u); g = lerp(0x4e, 0xb3, u); bch = lerp(0xd8, 0x08, u); }
  else { const u = (t - 0.5) / 0.5; r = lerp(0xea, 0xb9, u); g = lerp(0xb3, 0x1c, u); bch = lerp(0x08, 0x1c, u); }
  const textColor = (t < 0.35 || t > 0.65) ? '#fff' : '#111';
  return { bg: `rgb(${r},${g},${bch})`, text: textColor };
}

// ============ 2026-09-16: 샘플 데이터(브리핑 시연용) ============
// 실제 데이터가 아직 안 쌓였어도 표/그래프/AI 분석을 시연할 수 있도록, 화면 우측 상단 토글로
// 이 고정 샘플로 전환할 수 있다(state.showSampleData). 12개 지역(부녀회 기준 지역 수를 참고해
// 고정) × 역할 4파트(인도자/교사/섬김이/협력교사) × 항목 11개, 지역마다 눈에 띄는 "강세 항목"을 다르게 배정해 현실적인
// 편차를 만든다. Math.sin 기반 결정론적 시드를 써서 매 렌더마다 같은 값이 나오게 한다
// (Math.random을 쓰면 토글을 껐다 켤 때마다 숫자가 바뀌어 시연 중 혼란스러움).
const SAMPLE_REGIONS = Array.from({ length: 12 }, (_, i) => `${i + 1}지역`);
const SAMPLE_STRONG_ITEM_BY_REGION = {
  '1지역': '섭외', '2지역': '친분', '3지역': '만남1', '4지역': '만남2', '5지역': '상담1',
  '6지역': '상담2', '7지역': '피드백', '8지역': '복음방', '9지역': '동행교사',
  '10지역': '센터소개', '11지역': '센터수강', '12지역': '친분'
};
function _sampleSeed_(a, b, c, range) {
  const x = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453;
  return Math.floor((x - Math.floor(x)) * range);
}
function buildSampleRoleActivityBreakdown() {
  const counts = {};
  const itemGrandTotal = {};
  let grandTotal = 0;
  SAMPLE_REGIONS.forEach((region, ri) => {
    counts[region] = {};
    const strongItem = SAMPLE_STRONG_ITEM_BY_REGION[region];
    ROLE_PARTS_DASH.forEach((role, roi) => {
      counts[region][role] = {};
      const roleFactor = role === '교사' ? 1.3 : (role === '인도자' ? 1.1 : 1); // 교사 활동이 조금 더 많게
      ROLE_ACTIVITY_ITEMS_DASH.forEach((item, ii) => {
        const base = 2 + _sampleSeed_(ri, roi, ii, 6); // 기본 2~7건
        const boost = item === strongItem ? 10 + _sampleSeed_(ri, roi, ii, 6) : 0; // 강세 항목만 확 높임
        counts[region][role][item] = Math.round((base + boost) * roleFactor);
      });
    });
  });
  SAMPLE_REGIONS.forEach(region => {
    ROLE_PARTS_DASH.forEach(role => {
      ROLE_ACTIVITY_ITEMS_DASH.forEach(item => {
        const c = counts[region][role][item];
        itemGrandTotal[item] = (itemGrandTotal[item] || 0) + c;
        grandTotal += c;
      });
    });
  });

  const regionRoleTotal = {}, regionItemTotal = {};
  SAMPLE_REGIONS.forEach(region => {
    regionRoleTotal[region] = {};
    regionItemTotal[region] = {};
    ROLE_PARTS_DASH.forEach(role => { regionRoleTotal[region][role] = Object.values(counts[region][role]).reduce((s, v) => s + v, 0); });
    ROLE_ACTIVITY_ITEMS_DASH.forEach(item => {
      let sum = 0;
      ROLE_PARTS_DASH.forEach(role => { sum += counts[region][role][item]; });
      regionItemTotal[region][item] = sum;
    });
  });

  return { counts, allRegions: SAMPLE_REGIONS, regionRoleTotal, regionItemTotal, itemGrandTotal, grandTotal, isSample: true };
}

// ============ 2026-09-16: AI 분석 (지역별 인섬교 활동 데이터를 Gemini에 넘겨 요약) ============
// 백엔드 action 'analyzeDistrictData'(Code.gs — 프롬프트 조립을 서버에서 전담, Gemini+503
// 자동 3회 재시도 포함). 프런트는 원본 데이터만 만들어 보낸다(buildAiAnalysisData).

// 2026-09-16: 프롬프트 조립(문구)을 백엔드 analyzeDistrictData_로 이전 — 이 함수는 이제
// 원본 데이터만 만들어서 그대로 보낸다(프롬프트 문구를 나중에 다듬을 때 프런트 재배포 없이
// 백엔드만 고치면 되도록). Code.gs의 analyzeDistrictData_와 이 데이터 shape은 항상 같이 맞출 것.
function buildAiAnalysisData(deptLabel, regionLabel, b) {
  return {
    부서: deptLabel, 지역필터: regionLabel,
    지역별: b.allRegions.map(region => ({
      지역: region,
      총건수: ROLE_PARTS_DASH.reduce((s, role) => s + b.regionRoleTotal[region][role], 0),
      역할별: Object.fromEntries(ROLE_PARTS_DASH.map(role => [role, b.regionRoleTotal[region][role]])),
      항목별: Object.fromEntries(ROLE_ACTIVITY_ITEMS_DASH.map(item => [item, b.regionItemTotal[region][item] || 0])),
      강세항목: regionTopItem(b, region)
    })),
    항목별전체합계: b.itemGrandTotal, 전체합계: b.grandTotal
  };
}



async function runAiAnalysis(deptLabel, regionLabel, b) {
  state.aiAnalysis = { loading: true, error: '', text: '' };
  distRender();
  const data = buildAiAnalysisData(deptLabel, regionLabel, b);
  let lastErrMsg = '';
  // 백엔드(_callAi_)가 이미 503 등 일시 오류를 최대 3회 자동 재시도하지만, 이 클라이언트 fetch
  // 자체가 실패(네트워크 오류 등)하는 경우까지 대비해 여기서도 최대 3회, 1초 간격 재시도.
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const res = await callApi({ action: 'analyzeDistrictData', data });
      if (res && res.text) { state.aiAnalysis = { loading: false, error: '', text: res.text }; distRender(); return; }
      lastErrMsg = 'AI 응답이 비어 있습니다.';
    } catch (e) {
      lastErrMsg = e.message || String(e);
    }
    if (attempt < 3) await new Promise(r => setTimeout(r, 1000));
  }
  state.aiAnalysis = { loading: false, error: '잠시 후 다시 시도해주세요.', text: '' };
  distRender();
}

function cnAdmHelpsTable(rows) {
  if (!rows.length) return '<div class="kko-card text-center text-sm" style="color:var(--color-text-sub)">등록된 글이 없습니다.</div>';
  return `<div class="kko-card wrap-table"><table><thead><tr><th>상태</th><th>유형</th><th>부서</th><th>한마디</th><th>등록자</th><th>기간</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><span class="badge2 ${r.status==='진행' && !r.expired ? 'open':'closed'}">${r.status==='진행' && !r.expired ? '진행':'마감'}</span></td><td>${esc(r.type)}</td><td>${esc(r.dept)}</td><td>${esc(r.oneLiner)}</td><td>${esc(r.name)}</td><td>${esc(r.startDate)}~${esc(r.endDate)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function cnAdmMatchesTable(rows) {
  if (!rows.length) return '<div class="kko-card text-center text-sm" style="color:var(--color-text-sub)">매칭 기록이 없습니다.</div>';
  return `<div class="kko-card wrap-table"><table><thead><tr><th>유형</th><th>요청자</th><th>상대</th><th>상태</th><th>일시</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${esc(r.kind)}</td><td>${esc(r.fromName)}</td><td>${esc(r.toName)}</td><td><span class="badge2 ${r.status==='성사'?'done':'req'}">${esc(r.status)}</span></td><td>${esc(String(r.at).slice(0,16))}</td>
      <td>${r.status !== '성사' ? `<button class="mini" data-done="${esc(r.matchId)}">성사 표시</button>` : ''}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function cnAdmRender() {
  const root = document.getElementById('cnAdmRoot');
  if (!cnAdmData) return;
  root.innerHTML = `
    ${cnAdmStatsHtml(cnAdmData.stats)}
    <div class="tabs2">
      <button data-t="cards" class="${cnAdmTab==='cards'?'on':''}">활동 신청 교사 (${cnAdmData.cards.length})</button>
      <button data-t="helps" class="${cnAdmTab==='helps'?'on':''}">도움 신청 (${cnAdmData.helps.length})</button>
      <button data-t="matches" class="${cnAdmTab==='matches'?'on':''}">매칭 (${cnAdmData.matches.length})</button>
    </div>
    ${cnAdmTab==='cards' ? cnAdmCardsTable(cnAdmData.cards) : cnAdmTab==='helps' ? cnAdmHelpsTable(cnAdmData.helps) : cnAdmMatchesTable(cnAdmData.matches)}
  `;
  root.querySelectorAll('.tabs2 button').forEach(b => { b.onclick = () => { cnAdmTab = b.dataset.t; cnAdmRender(); }; });
  root.querySelectorAll('[data-done]').forEach(b => { b.onclick = async () => {
    b.disabled = true;
    try { await callApi({ action: 'setMatchDone', matchId: b.dataset.done, status: '성사' }); await cnAdmLoad(); }
    catch (e) { alert(e.message); b.disabled = false; }
  }; });
}
async function cnAdmLoad() {
  try { cnAdmData = await callApi({ action: 'getConnectAdminOverview' }); cnAdmRender(); }
  catch (e) { document.getElementById('cnAdmRoot').innerHTML = `<div class="kko-card" style="color:#D94040">${esc(e.message)}</div>`; }
}
// cnAdmLoad() 최초 호출은 관리자 3️⃣ 서브탭 첫 진입 시(adminSwitchSubTab)에 수행 — 파싱 시 즉시 실행하지 않음.

const CALADM_ATT_ROLES = ['인', '교', '섬', '협'];
let calAdmTab = 'events', calAdmEvents = [], calAdmAds = [], calAdmReport = null, calAdmReportEventId = '';
document.querySelectorAll('#admin-pane-calAdmin .calAdm-tabs2 button').forEach(b => { b.onclick = () => { calAdmTab = b.dataset.t; document.querySelectorAll('#admin-pane-calAdmin .calAdm-tabs2 button').forEach(x => x.classList.toggle('on', x === b)); calAdmRender(); }; });

// ---------------- 행사 등록·관리 ----------------
async function calAdmLoadEvents() {
  const res = await callApi({ action: 'getCalendarEvents' });
  calAdmEvents = (res && res.rows) || [];
}
function calAdmEventFormHtml(ev) {
  const e = ev || { eventId: '', type: '행사', title: '', startDate: '', endDate: '', dept: '', place: '', desc: '' };
  return `
    <div class="kko-card" id="evForm">
      <div class="font-bold mb-2">${ev ? '행사 수정' : '새 행사 등록'}</div>
      <label class="lbl">유형</label>
      <select class="inp" id="efType"><option value="개강" ${e.type==='개강'?'selected':''}>개강일</option><option value="행사" ${e.type==='행사'?'selected':''}>행사일</option></select>
      <label class="lbl">제목 *</label><input class="inp" id="efTitle" value="${esc(e.title)}" maxlength="80">
      <div style="display:flex;gap:8px"><div style="flex:1"><label class="lbl">시작일 *</label><input type="date" class="inp" id="efStart" value="${esc(e.startDate)}"></div><div style="flex:1"><label class="lbl">종료일</label><input type="date" class="inp" id="efEnd" value="${esc(e.endDate)}"></div></div>
      <label class="lbl">장소</label><input class="inp" id="efPlace" value="${esc(e.place)}" maxlength="60">
      <label class="lbl">담당 부서(선택)</label><input class="inp" id="efDept" value="${esc(e.dept)}" maxlength="10" placeholder="예: 전도부">
      <label class="lbl">설명</label><textarea class="inp" id="efDesc" maxlength="1000">${esc(e.desc)}</textarea>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn out" id="efCancel">취소</button>
        <button class="btn" id="efSave">${ev ? '수정 저장' : '등록'}</button>
        ${ev ? '<button class="btn danger" id="efDelete">삭제</button>' : ''}
      </div>
    </div>`;
}
function calAdmEventsHtml() {
  return `
    <div class="kko-card"><button class="btn" id="newEventBtn">+ 새 행사 등록</button></div>
    <div id="evFormHost"></div>
    <div class="kko-card">
      <div class="font-bold mb-2">등록된 행사 (${calAdmEvents.length})</div>
      ${calAdmEvents.length === 0 ? `<div class="text-sm" style="color:var(--color-text-sub)">등록된 행사가 없습니다.</div>` : calAdmEvents.map(e => `
        <div class="ev-row" data-ev="${esc(e.eventId)}">
          <span class="pill ${e.type==='개강'?'open':'event'}">${esc(e.type)}</span>
          <div class="grow"><b>${esc(e.title)}</b><div class="text-xs" style="color:var(--color-text-sub)">${esc(e.startDate)}${e.endDate && e.endDate!==e.startDate ? ' ~ '+esc(e.endDate) : ''}${e.place ? ' · '+esc(e.place) : ''}${e.type==='행사' ? ` · 스탭 ${e.staffCount}명 · 참석 ${e.attendeeCount}명` : ''}</div></div>
          <button class="btn out" style="height:32px;padding:0 10px;font-size:12px" data-edit="${esc(e.eventId)}">수정</button>
        </div>`).join('')}
    </div>`;
}
function calAdmBindEvents() {
  document.getElementById('newEventBtn').onclick = () => { document.getElementById('evFormHost').innerHTML = calAdmEventFormHtml(null); calAdmBindEventForm(null); };
  document.querySelectorAll('[data-edit]').forEach(b => { b.onclick = () => {
    const ev = calAdmEvents.find(x => x.eventId === b.dataset.edit);
    document.getElementById('evFormHost').innerHTML = calAdmEventFormHtml(ev);
    calAdmBindEventForm(ev);
    document.getElementById('evFormHost').scrollIntoView({ behavior: 'smooth' });
  }; });
}
function calAdmBindEventForm(ev) {
  document.getElementById('efCancel').onclick = () => { document.getElementById('evFormHost').innerHTML = ''; };
  document.getElementById('efSave').onclick = async () => {
    const body = {
      eventId: ev ? ev.eventId : '', type: document.getElementById('efType').value, title: document.getElementById('efTitle').value.trim(),
      startDate: document.getElementById('efStart').value, endDate: document.getElementById('efEnd').value || document.getElementById('efStart').value,
      place: document.getElementById('efPlace').value.trim(), dept: document.getElementById('efDept').value.trim(), desc: document.getElementById('efDesc').value.trim()
    };
    const btn = document.getElementById('efSave'); btn.disabled = true;
    try {
      const res = await callApi({ action: 'saveCalendarEvent', event: body, by: MY_NAME });
      if (res && res.error) throw new Error(res.error);
      await calAdmLoadEvents(); document.getElementById('evFormHost').innerHTML = ''; calAdmRender();
    } catch (e) { alert(e.message); btn.disabled = false; }
  };
  const del = document.getElementById('efDelete');
  if (del) del.onclick = async () => {
    if (!confirm('이 행사를 삭제할까요? 신청 내역도 함께 삭제됩니다.')) return;
    try { await callApi({ action: 'deleteCalendarEvent', eventId: ev.eventId }); await calAdmLoadEvents(); document.getElementById('evFormHost').innerHTML = ''; calAdmRender(); }
    catch (e) { alert(e.message); }
  };
}

// ---------------- 스탭·참석자 집계 ----------------
async function calAdmLoadReport() {
  calAdmReport = await callApi({ action: 'getCalendarReport', eventId: calAdmReportEventId });
}
function calAdmCountRow(label, counts) {
  return `<div class="stat-tile"><b>${counts}</b><span>${esc(label)}</span></div>`;
}
function calAdmReportHtml() {
  if (!calAdmReport) return '<div class="text-center py-10"><span class="loading loading-spinner"></span></div>';
  const evOpts = calAdmEvents.filter(e => e.type === '행사');
  return `
    <div class="kko-card">
      <label class="lbl">행사 선택</label>
      <select class="inp" id="repEvent"><option value="">전체 행사 합산</option>${evOpts.map(e => `<option value="${esc(e.eventId)}" ${e.eventId===calAdmReportEventId?'selected':''}>${esc(e.title)} (${esc(e.startDate)})</option>`).join('')}</select>
    </div>
    <div class="kko-card">
      <div class="font-bold mb-2">참석 신청 총 ${calAdmReport.total}명</div>
      <div class="text-xs mb-1" style="color:var(--color-text-sub)">신청자 부서별</div>
      <div class="grid grid-cols-5 gap-2 mb-3">${DEPTS5.map(d => calAdmCountRow(d, calAdmReport.byApplicantDept[d]||0)).join('')}</div>
      <div class="text-xs mb-1" style="color:var(--color-text-sub)">신청자 역할별(인/교/섬/협)</div>
      <div class="grid grid-cols-4 gap-2 mb-3">${CALADM_ATT_ROLES.map(r => calAdmCountRow(r, calAdmReport.byApplicantRole[r]||0)).join('')}</div>
      <div class="text-xs mb-1" style="color:var(--color-text-sub)">섭외자 부서별</div>
      <div class="grid grid-cols-5 gap-2 mb-3">${DEPTS5.map(d => calAdmCountRow(d, calAdmReport.byGuestDept[d]||0)).join('')}</div>
      <div class="text-xs mb-1" style="color:var(--color-text-sub)">섭외자 전도단계별</div>
      <div class="grid grid-cols-3 gap-2 sm:grid-cols-5">${STAGES.map(s => calAdmCountRow(s, calAdmReport.byStage[s]||0)).join('')}</div>
    </div>
    <div class="kko-card">
      <div class="flex items-center justify-between mb-2"><div class="font-bold">스탭·기능자 신청 (${calAdmReport.staff.length}명)</div>
        <div class="grid grid-cols-5 gap-1" style="max-width:260px">${DEPTS5.map(d => `<span class="text-xs text-center">${d} ${calAdmReport.staffByDept[d]||0}</span>`).join('')}</div></div>
      <div class="wrap-table"><table><thead><tr><th>이름</th><th>부서</th><th>메모</th><th>행사</th></tr></thead><tbody>
        ${calAdmReport.staff.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.dept)}</td><td>${esc(s.note)}</td><td>${esc(s.eventTitle)}</td></tr>`).join('') || '<tr><td colspan="4" style="color:var(--color-text-sub)">신청자가 없습니다.</td></tr>'}
      </tbody></table></div>
    </div>
    <div class="kko-card">
      <div class="flex items-center justify-between mb-2"><div class="font-bold">참석자(섭외자) 명단</div><button class="btn out" id="csvBtn" style="height:32px;font-size:12px">CSV 내보내기</button></div>
      <div class="wrap-table"><table><thead><tr><th>신청자</th><th>부서/역할</th><th>섭외자</th><th>부서</th><th>나이</th><th>단계</th><th>행사</th></tr></thead><tbody>
        ${calAdmReport.attendees.map(a => `<tr><td>${esc(a.applicantName)}</td><td>${esc(a.applicantDept)}/${esc(a.applicantRole)}</td><td>${esc(a.guestName)}</td><td>${esc(a.guestDept)}</td><td>${esc(a.guestAge)}</td><td>${esc(a.guestStage)}</td><td>${esc(a.eventTitle)}</td></tr>`).join('') || '<tr><td colspan="7" style="color:var(--color-text-sub)">참석 신청이 없습니다.</td></tr>'}
      </tbody></table></div>
    </div>`;
}
function calAdmBindReport() {
  document.getElementById('repEvent').onchange = async e => { calAdmReportEventId = e.target.value; await calAdmLoadReport(); calAdmRender(); };
  const csv = document.getElementById('csvBtn');
  if (csv) csv.onclick = () => {
    const header = ['신청자', '신청자부서', '신청자역할', '섭외자', '섭외자부서', '나이', '전도단계', '행사'];
    const lines = [header.join(',')].concat(calAdmReport.attendees.map(a => [a.applicantName, a.applicantDept, a.applicantRole, a.guestName, a.guestDept, a.guestAge, a.guestStage, a.eventTitle].map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')));
    const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '세미나_참석자_집계.csv'; a.click();
  };
}

// ---------------- 전도부 광고 ----------------
async function calAdmLoadAds() {
  const res = await callApi({ action: 'getCalendarAds' });
  calAdmAds = (res && res.rows) || [];
}
function calAdmAdsHtml() {
  return `
    <div class="kko-card">
      <div class="font-bold mb-2">새 광고 등록</div>
      <label class="lbl">제목 *</label><input class="inp" id="adTitle" maxlength="60">
      <label class="lbl">내용</label><textarea class="inp" id="adBody" maxlength="600"></textarea>
      <button class="btn mt-2" id="adSave">등록</button>
    </div>
    <div class="kko-card">
      <div class="font-bold mb-2">등록된 광고 (${calAdmAds.length})</div>
      ${calAdmAds.length === 0 ? `<div class="text-sm" style="color:var(--color-text-sub)">등록된 광고가 없습니다.</div>` : calAdmAds.map(a => `
        <div class="ev-row" data-ad="${esc(a.adId)}">
          <div class="grow"><b>${esc(a.title)}</b><div class="text-xs" style="color:var(--color-text-sub)">${esc(a.body).slice(0,60)}</div></div>
          <button class="btn danger" style="height:32px;padding:0 10px;font-size:12px" data-del-ad="${esc(a.adId)}">삭제</button>
        </div>`).join('')}
    </div>`;
}
function calAdmBindAds() {
  document.getElementById('adSave').onclick = async () => {
    const title = document.getElementById('adTitle').value.trim();
    if (!title) return alert('제목을 입력해주세요.');
    const btn = document.getElementById('adSave'); btn.disabled = true;
    try {
      await callApi({ action: 'saveCalendarAd', ad: { title, body: document.getElementById('adBody').value.trim() } });
      await calAdmLoadAds(); calAdmRender();
    } catch (e) { alert(e.message); btn.disabled = false; }
  };
  document.querySelectorAll('[data-del-ad]').forEach(b => { b.onclick = async () => {
    if (!confirm('이 광고를 삭제할까요?')) return;
    try { await callApi({ action: 'deleteCalendarAd', adId: b.dataset.delAd }); await calAdmLoadAds(); calAdmRender(); }
    catch (e) { alert(e.message); }
  }; });
}

function calAdmRender() {
  const root = document.getElementById('calAdmRoot');
  if (calAdmTab === 'events') { root.innerHTML = calAdmEventsHtml(); calAdmBindEvents(); }
  else if (calAdmTab === 'report') { root.innerHTML = calAdmReportHtml(); if (calAdmReport) calAdmBindReport(); }
  else { root.innerHTML = calAdmAdsHtml(); calAdmBindAds(); }
}
// 최초 데이터 로드는 관리자 4️⃣ 서브탭 첫 진입 시(adminSwitchSubTab)에 calAdmInit()으로 수행.
async function calAdmInit() {
  await calAdmLoadEvents();
  await Promise.all([calAdmLoadAds(), calAdmLoadReport()]);
  calAdmRender();
}

    window.Sections.admin = { mount() { adminSwitchSubTab('edu'); } };

  </script>
</body>
</html>
