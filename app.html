<!DOCTYPE html>
<html lang="ko" data-theme="jesagil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>복음방 교사</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7E22CE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="복음방 교사">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- 2026-09-22: SPA 통합(app.html) — daisyUI/Tailwind/Chart.js는 문서 전체에 1회만 로드.
       이전 11개 파일이 각자 따로 로드하던 동일 CDN들을 여기 하나로 합쳤다. -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <!-- edu-dashboard.html(관리자 1️⃣교사현황)의 부서별 교사현황 차트(stacked bar)가 사용하는 라벨 플러그인 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
  <!-- 2026-09-22: 활동 섹션 당근마켓 스타일 리디자인용 Pretendard — #sec-activity에만 스코프해서 적용(다른 섹션 폰트는 그대로). -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    /* ════════════════════════════════════════════════════════════════
       [SHARED] 제사장의 길 공통 디자인 시스템 — 병합 전 11개 파일이 각자
       거의 동일하게 들고 있던 :root 토큰/jesagil 테마/kko-* 클래스를 여기 1곳으로 통합.
       섹션별 전용 CSS는 각 섹션 병합 시 아래 "SECTION CSS" 표시 아래 추가하고,
       daisyUI 전역 클래스(.card/.btn/.badge 등)와 이름이 겹치는 커스텀 클래스는
       반드시 섹션 접두사를 붙인다(예: .cal-btn, .cn-card) — 병합 전 감사 결과 다수 파일이
       평범한 이름(.card/.btn/.pill/.hint 등)을 그대로 썼고, 이는 daisyUI 전역 스타일과
       충돌하므로 병합 시 전부 리네임 대상.
       ════════════════════════════════════════════════════════════════ */
    [data-theme="jesagil"] {
      /* DaisyUI 4.12는 색상 변수를 OKLCH(L% C H)로 받음 — HSL 아님, 주의 */
      --p: 49.55% 0.2369 301.91;   /* primary: #7E22CE 포도색 */
      --pc: 100% 0 0;
      --s: 66.58% 0.1574 58.32;    /* secondary: amber-600 */
      --sc: 100% 0 0;
      --a: 72.27% 0.1920 149.58;   /* accent: #22C55E 잎사귀색 */
      --ac: 100% 0 0;
      --n: 27.95% 0.0368 260.03;   /* neutral: slate-800 */
      --nc: 96.70% 0.0029 264.54;
      --b1: 100% 0 0;              /* base-100: white */
      --b2: 96.70% 0.0029 264.54;  /* base-200: gray-100 */
      --b3: 92.76% 0.0058 264.53;  /* base-300: gray-200 */
      --bc: 27.81% 0.0296 256.85;  /* base-content: gray-800 */
      --in: 68.47% 0.1479 237.32;
      --inc: 100% 0 0;
      --su: 61.67% 0.1191 162.14;   /* success: #2D9B6F */
      --suc: 100% 0 0;
      --wa: 75.76% 0.1525 74.86;    /* warning: #E8A020 */
      --wac: 0% 0 0;
      --er: 59.56% 0.1901 25.05;    /* error: #D94040 */
      --erc: 100% 0 0;
      --rounded-box: 0.875rem;
      --rounded-btn: 0.875rem;
      --rounded-badge: 1rem;
    }
    :root {
      --color-primary: #7E22CE;
      --color-primary-light: #F3E8FF;
      --color-primary-dark: #6B21A8;
      --color-surface: #FFFFFF;
      --color-card: #FFFFFF;
      --color-bg: #F5F5F5;
      --color-text: #1A1A2E;
      --color-text-sub: #666680;
      --color-border: #E8E8F0;
      --color-success: #2D9B6F;
      --color-warning: #E8A020;
      --color-error: #D94040;
      --color-accent: #FF6B6B;
      /* 2026-09-23 포도원 테마: 라운딩 14px로 통일(표지 modern-input과 같은 값) */
      --radius-card: 16px;
      --radius-btn: 14px;
      --radius-input: 14px;
      /* 잎사귀색 — 활동/성사/이수 같은 "잘 되고 있다" 신호에만 쓴다 */
      --color-leaf: #22C55E;
      --color-leaf-light: #DCFCE7;
      --color-leaf-dark: #15803D;
      --shadow-card: 0 2px 12px rgba(0,0,0,0.08);
      --height-btn: 52px;
      --height-btn-sm: 44px;
      --height-header: 56px;
      --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px;

      /* ── 2026-09-22 당근마켓 스타일 리팩토링 토큰(dg- = daangn) ──
         "시각적 안정감: 라운딩 확대 / 부드러운 그림자 / 넓은 여백" 목표를 토큰으로 고정.
         기존 --radius-*/--shadow-card는 캘린더·연결·관리자 등 다른 섹션 레이아웃이 그대로
         쓰고 있어 값을 건드리지 않고, 새 토큰을 추가해서 리디자인된 화면만 이걸 쓴다. */
      --dg-radius-lg: 20px;   /* 시트/큰 카드 */
      --dg-radius-md: 14px;   /* 버튼/입력/그룹박스 */
      --dg-radius-sm: 10px;
      --dg-shadow-soft: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
      --dg-shadow-fab: 0 6px 20px rgba(126,34,206,.45);
      --dg-pad: 20px;         /* 넓은 여백 기준값 */
      --dg-line: #F2F2F5;     /* 피드 구분선 */
      --dg-text: #212124;     /* 본문 */
      --dg-text-sub: #868B94; /* 보조 텍스트 */
      --dg-bg-soft: #F8F9FA;  /* 모듈 박스 배경 */

      /* ── 2026-09-23 PC 레이아웃 토큰 ──
         앱 본체 최대 폭. 모바일에선 안 쓰이고, @media(min-width:769px)에서만
         #appPanel·탭바·바텀시트·FAB 위치 계산에 쓰인다(파일 맨 아래 PC 블록 참고). */
      /* 기본(폰)은 화면 전체 폭. PC에서만 아래 @media가 단계별로 넓혀준다.
         480 고정이면 관리자 표가 너무 좁아서, 화면이 커질수록 컬럼도 커지게 함. */
      --app-max-width: 480px;
      --app-outer-bg: #E9EAEE;  /* PC에서 앱 컬럼 바깥 여백 색 */
    }
    .lucide-i { width:1em; height:1em; display:inline-block; vertical-align:-0.15em; flex-shrink:0; }
    html, body { height: 100%; margin: 0; }
    /* 2026-09-22: Pretendard를 앱 전역 폰트로 승격(계획서 Phase 1 "전역 폰트") */
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: var(--color-bg); }
    .brand-accent-bar { height: 3px; background: linear-gradient(90deg, oklch(var(--p)), oklch(var(--s)), oklch(var(--a))); flex-shrink: 0; }
    .brand-avatar { background: linear-gradient(135deg, oklch(var(--p)), oklch(var(--a))); }
    .card-border { border-width: 0 !important; border-radius: 16px !important; box-shadow: 0 2px 12px rgba(0,0,0,0.08) !important; }
    .kko-btn-main {
      display: flex; align-items: center; justify-content: center;
      height: 52px; min-height: 52px; border-radius: 14px;
      background: #7E22CE; color: #fff; font-size: 16px; font-weight: 700;
      border: none; width: 100%;
    }
    .kko-btn-main[disabled] { opacity: .6; }
    .kko-btn-outline {
      display: flex; align-items: center; justify-content: center;
      height: 44px; min-height: 44px; border-radius: 14px;
      background: #fff; color: #7E22CE; font-size: 14px; font-weight: 700;
      border: 1.5px solid #7E22CE; width: 100%;
    }
    .kko-form .input, .kko-form .select, .kko-form textarea { min-height: 48px; border-radius: 14px; }
    .kko-form .input:focus, .kko-form .select:focus, .kko-form textarea:focus {
      border-color: #7E22CE !important; outline-color: #7E22CE !important;
    }
    /* 2026-09-22: 당근 스타일 하단 탭바 — 얇은 경계선, 비활성은 중성 회색(#868B94),
       활성만 브랜드 보라 + 아이콘 살짝 확대. 높이/라벨을 조금 키워 터치 영역 확보. */
    #bottomTabBar {
      display: flex; height: 62px; flex-shrink: 0; background: #fff; border-top: 1px solid var(--dg-line);
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #bottomTabBar .tab {
      flex: 1; display: flex; flex-direction: column; flex-wrap: nowrap; gap: 4px; align-items: center; justify-content: center;
      color: var(--dg-text-sub); background: transparent !important; border: none !important;
      transition: color .15s ease;
    }
    #bottomTabBar .tab:before, #bottomTabBar .tab:after { display: none !important; }
    #bottomTabBar .tab .tab-icon { display: flex; width: 23px; height: 23px; position: relative; }
    #bottomTabBar .tab .tab-icon svg { width: 23px; height: 23px; }
    #bottomTabBar .tab .tab-label { font-size: 11px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
    #bottomTabBar .tab.tab-active { color: var(--color-primary); }
    #bottomTabBar .tab.tab-active .tab-label { font-weight: 800; }
    #appSections { padding-bottom: 76px; }
    .app-section { display: none; }
    .app-section.active { display: block; }
    @keyframes stageUpDrop {
      0%   { transform: translateY(-140px) scale(0.9); opacity: 0; }
      70%  { transform: translateY(8px) scale(1.02); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .stage-up-drop { animation: stageUpDrop .55s cubic-bezier(.34,1.56,.64,1); }
    @keyframes kkoFadeIn { from { opacity:0; } to { opacity:1; } }
    .kko-fade-in { animation: kkoFadeIn .2s ease; }
    @keyframes kkoCardIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .kko-card-in { animation: kkoCardIn .3s ease; }
    .kko-btn-main, .kko-btn-outline, #bottomTabBar .tab, .coop-req-btn { transition: transform .1s ease; }
    .kko-btn-main:active, .kko-btn-outline:active, .coop-req-btn:active { transform: scale(0.97); }
    #bottomTabBar .tab.tab-active .tab-icon { animation: kkoTabBounce .2s ease; }
    @keyframes kkoTabBounce { 0% { transform: translateY(0); } 40% { transform: translateY(-4px); } 100% { transform: translateY(0); } }
    @keyframes kkoShimmer { 0% { background-position:-200px 0; } 100% { background-position:200px 0; } }
    .kko-skeleton { background:linear-gradient(90deg,#EEEEEE 25%,#F5F5F5 37%,#EEEEEE 63%); background-size:400px 100%; animation:kkoShimmer 1.4s ease infinite; border-radius:8px; }
    .kko-spinner { width:36px; height:36px; border-radius:50%; border:3px solid #F3E8FF; border-top-color:#7E22CE; animation:kkoSpin .7s linear infinite; display:inline-block; }
    @keyframes kkoSpin { to { transform:rotate(360deg); } }
    #kkoInstallToast {
      position:fixed; left:16px; right:16px; z-index:60;
      bottom:calc(72px + env(safe-area-inset-bottom, 0px));
      background:#222222; color:#fff; border-radius:12px; padding:12px 14px;
      font-size:12px; line-height:1.5; box-shadow:0 4px 16px rgba(0,0,0,0.25);
      animation: kkoCardIn .3s ease;
    }
    /* [SHARED] 공용 토스트(연결/캘린더 등 여러 섹션이 쓰던 거의 동일한 toast()를 1개로 통합) */
    #appToastHost { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 9998; }
    .app-toast { background: rgba(26,26,46,.92); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; max-width: 88vw; text-align: center; }
    .app-toast.err { background: var(--color-error); }
    /* [SHARED] 공용 바텀시트(연결/캘린더 등 여러 섹션이 쓰던 거의 동일한 openSheet()/#sheetHost를
       1개로 통합 — calendar-room.html과 connect-room.html의 .sheet/.sheet-back가 byte-단위로 동일했음). */
    .sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 9990; display: flex; align-items: flex-end; justify-content: center; animation: sheetFadeIn .2s ease-out; }
    /* 2026-09-23: 하단 탭바(62px+safe-area)가 시트 내용을 덮어서 마지막 줄이 안 보였다.
       시트 높이를 탭바만큼 줄이고, 아래 여백도 그만큼 준다. */
    .sheet { background: #fff; width: 100%; max-width: 560px;
      max-height: calc(92vh - 62px); overflow-y: auto; border-radius: 20px 20px 0 0;
      padding: 14px 16px calc(28px + 62px + env(safe-area-inset-bottom, 0px)); animation: sheetSlideUp .25s cubic-bezier(0.16,1,0.3,1); }
    /* 시트 공통 뒤로 버튼 — 스크롤해도 항상 보이게 위에 붙여둔다.
       2026-09-23: 신청서처럼 긴 시트에서 빠져나갈 방법이 없다는 지적으로 신설. */
    .sheet-back-btn { position: sticky; top: -14px; z-index: 5; display: block; margin: -14px -16px 10px;
      padding: 13px 16px; width: calc(100% + 32px); text-align: left;
      background: rgba(255,255,255,.96); backdrop-filter: blur(6px);
      border: none; border-bottom: 1px solid var(--dg-line);
      font-family: inherit; font-size: 15px; font-weight: 700; color: var(--dg-text-sub); cursor: pointer; }
    .sheet-back-btn:active { color: var(--color-primary); }
    /* 2026-09-22: 당근 스타일 바텀시트 등장 애니메이션 — openSheet()는 매번 새 DOM을 만들어 넣으므로
       transition이 아니라 삽입 시 자동 재생되는 animation으로(캘린더/연결 등 이 시트를 쓰는 모든
       섹션에 공용 적용, 새 함정 없음 — 순수 시각 효과 추가라 기존 동작 안 건드림). */
    @keyframes sheetFadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes sheetSlideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

    /* ===== SECTION CSS: calendar =====
       원본 calendar-room.html에서 daisyUI 전역 클래스와 겹치는 .card/.btn은 공유 kko-card/
       kko-btn-main/kko-btn-outline로 교체, 나머지 범용 이름(.pill/.lbl/.seg/.inp/.hint/.wrap/
       .day/.grid 등)은 cal- 접두사로 스코프. .sheet/.sheet-back/toast는 공유 것을 그대로 씀. */
    .cal-wrap { max-width:640px; margin:0 auto; padding:12px 12px 0; }
    .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .cal-head b { font-size:20px; }
    .cal-nav-btn { width:40px; height:40px; border-radius:50%; border:none; background:var(--color-primary-light); color:var(--color-primary); font-size:20px; cursor:pointer; }
    .cal-today-btn { height:32px; padding:0 12px; border-radius:16px; border:1.5px solid var(--color-primary); background:#fff; color:var(--color-primary); font-weight:700; font-size:13px; cursor:pointer; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); }
    .cal-dow { text-align:center; font-size:12px; font-weight:700; color:var(--color-text-sub); padding:6px 0; }
    .cal-dow.sun, .cal-day.sun .cal-num { color:#D94040; }
    .cal-dow.sat, .cal-day.sat .cal-num { color:#2F6FDE; }
    .cal-day { min-height:70px; border-top:1px solid var(--color-border); padding:3px 2px; cursor:pointer; overflow:hidden; }
    .cal-day.out { opacity:.35; }
    .cal-num { font-size:12px; font-weight:600; width:22px; height:22px; line-height:22px; text-align:center; border-radius:50%; display:inline-block; margin-left:1px; }
    .cal-day.today .cal-num { background:var(--color-primary); color:#fff !important; }
    .cal-chip { display:block; font-size:10px; line-height:14px; border-radius:3px; padding:0 3px; margin-top:2px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    /* 2026-09-22: 일정 유형 3종(공식/부서/내일정) 색상 — 기존 open(개강)/event(행사) 2색 체계를
       카테고리 기준 3색 체계로 교체(공식=파랑, 부서=초록, 내일정=주황). */
    .cal-chip.official { background:#2F6FDE; }
    .cal-chip.dept { background:#2D9B6F; }
    .cal-chip.mine { background:#E8590C; }
    .cal-more { font-size:10px; color:var(--color-text-sub); padding-left:3px; }
    .cal-legend { display:flex; gap:14px; font-size:12px; color:var(--color-text-sub); margin-top:8px; }
    .cal-legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
    .cal-ad-title { font-size:15px; font-weight:800; color:var(--color-primary); margin-bottom:8px; }
    .cal-ad { border-left:4px solid var(--color-primary); background:var(--color-primary-light); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
    .cal-ad b { font-size:14px; }
    .cal-ad div { font-size:13px; color:#3b3b55; margin-top:3px; white-space:pre-wrap; }
    .cal-pill { display:inline-block; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; color:#fff; }
    .cal-hint { font-size:12px; color:var(--color-text-sub); }
    .cal-lbl { display:block; font-size:13px; font-weight:700; margin:14px 0 6px; }
    .cal-req { color:var(--color-error); }
    .cal-seg { display:flex; flex-wrap:wrap; gap:6px; }
    .cal-seg button { height:38px; min-width:44px; padding:0 14px; border-radius:999px; font-size:14px; font-weight:600; border:1.5px solid var(--color-border); background:#fff; color:#666680; cursor:pointer; }
    .cal-seg button.on { background:var(--color-primary); color:#fff; border-color:var(--color-primary); }
    .cal-inp { width:100%; min-height:44px; border:1px solid var(--color-border); border-radius:10px; padding:8px 12px; font-size:15px; font-family:inherit; background:#fff; color:var(--color-text); }
    .cal-ev-row { display:flex; gap:10px; align-items:center; padding:12px; border:1px solid var(--color-border); border-radius:12px; margin-bottom:8px; cursor:pointer; }
    .cal-guest { display:flex; align-items:center; gap:8px; padding:8px 10px; background:#F7F7FB; border-radius:10px; margin-top:6px; font-size:13px; }
    .cal-guest button { margin-left:auto; border:none; background:none; color:var(--color-error); font-size:12px; cursor:pointer; }
    /* ===== SECTION CSS: activity =====
       2026-09-22 당근마켓(Daangn) 스타일 리디자인 — 박스형 카드 대신 얇은 border-b 구분선 피드,
       우측 하단 FAB(.act-fab)+바텀시트(공유 openSheet/closeSheet 재사용, 새로 안 만듦),
       select 대신 가로 스크롤 칩(.act-chip-btn). 브랜드 컬러(#7E22CE)는 그대로 유지.
       ⚠️ 바텀시트는 #sec-activity 밖의 공유 #appSheetHost에 렌더되므로(다른 섹션들과 동일한
       기존 함정 — #sec-XXX 스코프가 안 먹음), 시트 안에서 쓰는 클래스(.act-sheet-form/
       .act-step-label/.act-chip-scroll/.act-chip-btn, Pretendard 폰트 포함)는 전역으로 두되
       .act- 접두사로 다른 섹션과 충돌만 피한다. 대시보드 화면 안(#sec-activity 자식)에서만
       쓰는 것(.act-feed-*/.act-fab)만 #sec-activity로 스코프. */
    #sec-activity, .act-sheet-form { letter-spacing: -0.02em; color: var(--dg-text); }
    #sec-activity { background:#fff; min-height:100%; }

    /* ── Phase 1: 활동 탭 전용 헤더("나의 교실") — 당근처럼 흰 배경 + 검은 제목.
       브랜드 보라는 FAB/칩/활성탭 등 액션 요소에만 남겨 대비를 살린다. */
    #sec-activity .act-appbar {
      position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
      height:56px; padding:0 var(--dg-pad); background:#fff; border-bottom:1px solid var(--dg-line);
    }
    #sec-activity .act-appbar-title { font-size:19px; font-weight:800; color:var(--dg-text); letter-spacing:-0.03em; }
    #sec-activity .act-appbar-actions { display:flex; align-items:center; gap:14px; color:var(--dg-text); }
    #sec-activity .act-appbar-actions button { background:none; border:none; padding:0; color:inherit; cursor:pointer; display:flex; }

    /* ── Phase 2: 인사말 + 내 상태 위젯 */
    #sec-activity .act-hero { padding:22px var(--dg-pad) 18px; }
    /* .act-hero-greet(인사말)는 2026-09-22 제거 — 아래 .act-hero-sub만 등급 정보가 없을 때 쓰임 */
    #sec-activity .act-hero-sub { font-size:14px; color:var(--dg-text-sub); }
    #sec-activity .act-status {
      margin-top:16px; display:flex; align-items:center; gap:12px; padding:16px;
      border-radius:var(--dg-radius-md); background:var(--dg-bg-soft); cursor:pointer; width:100%; text-align:left; border:none;
    }
    #sec-activity .act-status-emoji { font-size:26px; line-height:1; }
    #sec-activity .act-status-tier { font-size:15px; font-weight:800; color:var(--dg-text); }
    #sec-activity .act-status-desc { font-size:13px; color:var(--dg-text-sub); margin-top:2px; }
    #sec-activity .act-status-go { font-size:13px; font-weight:700; color:var(--color-primary); white-space:nowrap; }
    /* 요약 수치 — 역할별 담당 대상자 수. 2026-09-22: "누를 수 있는 줄 몰랐다"는 지적으로
       숫자만 덩그러니 있던 것을 테두리 있는 타일 + ▼ 화살표 + 아래 안내 문구로 바꿔
       탭 가능한 버튼임이 바로 보이게 했다. */
    #sec-activity .act-stats { display:flex; gap:8px; padding:4px var(--dg-pad) 0; }
    #sec-activity .act-stat {
      flex:1; background:#fff; border:1.5px solid #E8EAED; padding:11px 0 9px; text-align:center;
      cursor:pointer; border-radius:var(--dg-radius-md); transition:transform .1s ease, border-color .15s ease, background .15s ease;
    }
    #sec-activity .act-stat:active { transform:scale(0.96); }
    #sec-activity .act-stat.on { background:var(--color-primary-light); border-color:var(--color-primary); }
    #sec-activity .act-stat-num { font-size:22px; font-weight:800; color:var(--dg-text); line-height:1.15; }
    #sec-activity .act-stat.on .act-stat-num { color:var(--color-primary); }
    #sec-activity .act-stat-label { font-size:12.5px; color:var(--dg-text-sub); margin-top:3px; font-weight:600; }
    #sec-activity .act-stat.on .act-stat-label { color:var(--color-primary); }
    #sec-activity .act-stat-caret { font-size:9px; opacity:.65; }
    #sec-activity .act-stats-hint {
      padding:9px var(--dg-pad) 0; font-size:12.5px; color:var(--dg-text-sub); line-height:1.5;
    }
    #sec-activity .act-stats-hint b { color:var(--color-primary); }

    /* ── 섹션 구분(당근은 굵은 회색 띠로 블록을 나눔) */
    #sec-activity .act-divider { height:8px; background:#F7F8F9; }

    /* ── 2026-09-23 "다음 단계로" 안내 — 흐려서 안 보인다는 지적으로 대비 강화 ── */
    .next-step { background: var(--color-primary-light); border-radius: 14px;
      padding: 12px 14px; margin-top: 10px; }
    .next-step-k { font-size: 12.5px; font-weight: 800; color: var(--color-primary); }
    .next-step-v { font-size: 14.5px; font-weight: 600; color: var(--color-primary-dark);
      line-height: 1.6; margin-top: 4px; }
    /* 대상자 상세의 "오늘 상황 추가 기록" */
    .tgt-add { width: 100%; height: 52px; border-radius: 14px; border: none;
      background: var(--color-primary); color: #fff; font-size: 16px; font-weight: 800;
      font-family: inherit; cursor: pointer; letter-spacing: -0.02em; }
    .tgt-add:active { transform: scale(.98); }

    /* ── 2026-09-23 내 등급 가이드(.gg-*) — "나는 어떤 교사이고 뭘 하면 되나" ── */
    #sec-activity .gg { padding: 20px; background: #fff; }
    #sec-activity .gg-head { display: flex; align-items: flex-start; gap: 11px; }
    #sec-activity .gg-emoji { font-size: 26px; line-height: 1.1; flex-shrink: 0; }
    #sec-activity .gg-headtxt { flex: 1; min-width: 0; }
    #sec-activity .gg-tier { font-size: 19px; font-weight: 900; letter-spacing: -0.04em; color: var(--dg-text); }
    #sec-activity .gg-who { font-size: 14px; color: var(--dg-text-sub); font-weight: 500; margin-top: 3px; line-height: 1.5; }
    #sec-activity .gg-goal { flex-shrink: 0; align-self: center; height: 28px; padding: 0 12px;
      border-radius: 999px; background: var(--color-leaf-light); color: var(--color-leaf-dark);
      font-size: 12.5px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap; }
    #sec-activity .gg-why { font-size: 13.5px; color: var(--dg-text-sub); line-height: 1.65;
      background: var(--dg-bg-soft); border-radius: 14px; padding: 13px 15px; margin-top: 14px; }
    #sec-activity .gg-q { font-size: 14.5px; font-weight: 800; margin: 18px 0 9px; letter-spacing: -0.03em; }
    #sec-activity .gg-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    #sec-activity .gg-chip { height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13.5px;
      font-weight: 700; border: 1.5px solid var(--color-border); background: #fff; color: var(--dg-text-sub);
      font-family: inherit; cursor: pointer; }
    #sec-activity .gg-chip.on { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
    #sec-activity .gg-answer { margin-top: 14px; border: 1.5px solid var(--color-primary-light);
      border-radius: 16px; padding: 16px; background: #FDFBFF; }
    #sec-activity .gg-tip { font-size: 14px; line-height: 1.65; color: var(--dg-text); font-weight: 500; }
    #sec-activity .gg-dos { margin: 12px 0 0; padding-left: 18px; }
    #sec-activity .gg-dos li { font-size: 13.5px; line-height: 1.75; color: var(--dg-text-sub); font-weight: 500; }
    #sec-activity .gg-gos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    #sec-activity .gg-go { height: 40px; padding: 0 16px; border-radius: 14px; font-size: 14px;
      font-weight: 700; border: none; background: var(--color-primary); color: #fff;
      font-family: inherit; cursor: pointer; }
    #sec-activity .act-sec-head { display:flex; align-items:center; justify-content:space-between; padding:20px var(--dg-pad) 10px; }
    #sec-activity .act-sec-title { font-size:17px; font-weight:800; letter-spacing:-0.03em; color:var(--dg-text); }
    #sec-activity .act-sec-more { font-size:13px; font-weight:600; color:var(--dg-text-sub); background:none; border:none; cursor:pointer; }

    /* ── 피드 리스트 — 카드 박스 없이 얇은 구분선만(당근 "동네생활" 목록) */
    #sec-activity .act-feed-list { background:#fff; }
    #sec-activity .act-feed-row { display:block; padding:16px var(--dg-pad); border-bottom:1px solid var(--dg-line); }
    #sec-activity .act-feed-row:last-child { border-bottom:none; }
    #sec-activity .act-feed-row.is-new { animation: actRowIn .45s ease-out; }
    @keyframes actRowIn { from { background:var(--color-primary-light); opacity:.4; } to { background:#fff; opacity:1; } }
    #sec-activity .act-feed-body { font-size:15px; line-height:1.55; color:var(--dg-text); margin-top:6px; white-space:pre-wrap; }
    #sec-activity .act-feed-meta { font-size:12.5px; color:var(--dg-text-sub); margin-top:8px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    #sec-activity .act-feed-empty { padding:48px var(--dg-pad); text-align:center; color:var(--dg-text-sub); font-size:14px; line-height:1.6; }
    #sec-activity .act-feed-end { padding:22px var(--dg-pad) 28px; text-align:center; color:#B0B4BA; font-size:13px; }

    /* 태그(Chip) — 대시보드/시트 양쪽에서 쓰므로 전역(.act- 접두사로 충돌 회피) */
    .act-chip { display:inline-flex; align-items:center; height:24px; padding:0 10px; border-radius:999px; background:#F2F3F6; color:#5E636B; font-size:12.5px; font-weight:600; white-space:nowrap; }
    .act-chip.act-chip-stage { background:var(--color-primary-light); color:var(--color-primary); font-weight:700; }

    /* ── 플로팅 액션 버튼(FAB) */
    #sec-activity .act-fab {
      position:fixed; right:20px; bottom:80px; width:56px; height:56px; border-radius:50%;
      background:var(--color-primary); color:#fff; border:none; line-height:1;
      display:flex; align-items:center; justify-content:center;
      box-shadow:var(--dg-shadow-fab); z-index:30; cursor:pointer; transition:transform .12s ease;
    }
    #sec-activity .act-fab:active { transform:scale(0.92); }

    /* ── Phase 3·4: 바텀시트 작성 폼(#appSheetHost에 렌더되므로 전역 클래스) */
    .act-sheet-form { display:flex; flex-direction:column; gap:14px; letter-spacing:-0.02em; }
    .act-sheet-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .act-sheet-title { font-size:20px; font-weight:800; color:var(--dg-text); letter-spacing:-0.03em; }
    .act-sheet-sub { font-size:13.5px; color:var(--dg-text-sub); margin-top:4px; }
    .act-sheet-close { background:none; border:none; font-size:22px; line-height:1; color:var(--dg-text-sub); cursor:pointer; padding:0 2px; }
    .act-sheet-form .act-step-label { font-size:13px; font-weight:700; color:var(--dg-text); margin-bottom:10px; }
    /* "모듈화된 폼" — 성격이 같은 입력을 연한 회색 박스로 묶어 시각적 피로도 감소 */
    .act-form-group { background:var(--dg-bg-soft); border-radius:var(--dg-radius-md); padding:16px; }
    .act-form-group + .act-form-group { margin-top:2px; }
    .act-input {
      width:100%; min-height:48px; border:none; background:#fff; border-radius:var(--dg-radius-sm);
      padding:12px 14px; font-size:15px; font-family:inherit; color:var(--dg-text); outline:none;
      box-shadow:inset 0 0 0 1px #E8EAED;
    }
    .act-input:focus { box-shadow:inset 0 0 0 1.5px var(--color-primary); }
    .act-input::placeholder { color:#B0B4BA; }
    textarea.act-input { min-height:80px; resize:none; line-height:1.55; }
    .act-field-label { font-size:12.5px; color:var(--dg-text-sub); margin-bottom:6px; }
    /* 가로 스크롤 칩 버튼 그룹 — select 대체 */
    .act-chip-scroll { display:flex; gap:8px; overflow-x:auto; padding:2px 0; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .act-chip-scroll::-webkit-scrollbar { display:none; }
    .act-chip-wrap { display:flex; flex-wrap:wrap; gap:8px; }
    .act-chip-btn {
      flex-shrink:0; height:40px; padding:0 16px; border-radius:999px; border:none; background:#fff;
      box-shadow:inset 0 0 0 1px #E8EAED; color:#5E636B; font-size:14.5px; font-weight:600;
      cursor:pointer; white-space:nowrap; font-family:inherit; transition:transform .1s ease;
    }
    .act-chip-btn:active { transform:scale(0.95); }
    .act-chip-btn.on { background:var(--color-primary); box-shadow:none; color:#fff; font-weight:700; }
    /* 시트 하단 고정 제출 버튼(당근처럼 크고 넓게) */
    .act-submit-row { display:flex; gap:8px; padding-top:4px; }
    .act-btn-primary {
      flex:1; height:54px; border-radius:var(--dg-radius-md); border:none; background:var(--color-primary);
      color:#fff; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; transition:transform .1s ease;
    }
    .act-btn-primary:disabled { opacity:.5; }
    .act-btn-primary:active { transform:scale(0.98); }
    .act-btn-ghost {
      height:54px; padding:0 18px; border-radius:var(--dg-radius-md); border:none; background:var(--dg-bg-soft);
      color:var(--dg-text-sub); font-size:14.5px; font-weight:700; cursor:pointer; font-family:inherit;
    }
    /* ===== SECTION CSS: connect =====
       원본 connect-room.html에서 .kko-card/.kko-btn-main/.kko-btn-outline/.kko-input/.kko-spinner/
       .kko-card-in 은 공유 shell과 겹치는 이름이지만가벼운 값 차이(cursor, flex:1 등)가 실사용
       레이아웃(전화하기 링크 버튼 등)에 필요해서 "그대로 재선언"해 소스 순서로 shell 값을
       덮어쓰게 둠(의도적 중복, 계산된 리스크). .sheet/.sheet-back/.toast 는 공유 것과 동일해서
       제거. daisyUI 전역 .badge 와 충돌하는 커스텀 .badge/.badge-hot/.badge-tier 는 cn- 접두사로
       리네임, 나머지 범용 이름(.pill/.lbl/.seg/.hint/.wrap/.role-*/.radio-row/.chk-chip/.avatar*/
       .fab/.chat-*)도 전부 cn- 접두사로 스코프. */
    #sec-connect .cn-wrap { max-width:560px; margin:0 auto; padding:16px; }
    #sec-connect .kko-card { background:var(--color-card); border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:20px; }
    #sec-connect .kko-btn-main { display:flex; align-items:center; justify-content:center; height:var(--height-btn); border-radius:var(--radius-btn); background:var(--color-primary); color:#fff; font-size:16px; font-weight:700; border:none; width:100%; cursor:pointer; }
    #sec-connect .kko-btn-main:disabled { opacity:.5; }
    #sec-connect a.kko-btn-outline, #sec-connect .kko-btn-outline { display:inline-flex; align-items:center; justify-content:center; height:var(--height-btn-sm); border-radius:var(--radius-btn); background:#fff; color:var(--color-primary); border:1.5px solid var(--color-primary); font-size:14px; font-weight:700; padding:0 14px; cursor:pointer; text-decoration:none; flex:1; }
    #sec-connect .kko-input { width:100%; min-height:50px; border:1px solid var(--color-border); border-radius:var(--radius-input); padding:12px 14px; font-size:15.5px; background:#fff; color:var(--color-text); font-family:inherit; }
    #sec-connect .kko-input:focus { outline:2px solid var(--color-primary); border-color:var(--color-primary); }
    #sec-connect textarea.kko-input { min-height:84px; resize:none; }
    #sec-connect .kko-spinner { width:32px; height:32px; border-radius:50%; border:3px solid var(--color-primary-light); border-top-color:var(--color-primary); animation:kkoSpin .7s linear infinite; display:inline-block; }
    /* 2026-09-22: 연결 탭을 당근 스타일로 — 흰 배경 위 굵은 검은 글씨, 활성 탭만 브랜드 보라
       밑줄. 글자도 전반적으로 키움(작다는 지적). */
    #sec-connect .kko-tabs { display:flex; background:#fff; border-bottom:1px solid var(--dg-line); position:sticky; top:0; z-index:20; }
    #sec-connect .kko-tab {
      flex:1; height:52px; font-size:16px; font-weight:700; letter-spacing:-0.02em;
      color:var(--dg-text-sub); background:none; border:none; border-bottom:2.5px solid transparent;
      cursor:pointer; transition:color .15s ease;
    }
    #sec-connect .kko-tab.kko-tab-active { color:var(--dg-text); border-bottom-color:var(--color-primary); font-weight:800; }
    /* 제목은 보라 대신 당근처럼 진한 검정 + 큼직하게 */
    #sec-connect .cn-sec-title { font-size:24px; font-weight:800; color:var(--dg-text); line-height:1.3; letter-spacing:-0.03em; }
    #sec-connect .cn-sec-sub { font-size:14.5px; color:var(--dg-text-sub); margin-top:5px; margin-bottom:18px; line-height:1.5; }
    #sec-connect .cn-req { color:var(--color-error); font-weight:700; }
    #sec-connect .cn-lbl { display:block; font-size:15px; font-weight:700; margin:18px 0 7px; letter-spacing:-0.02em; }
    #sec-connect .cn-lbl small { font-weight:400; color:var(--color-text-sub); }
    #sec-connect .cn-pill { display:inline-flex; align-items:center; gap:4px; font-size:13.5px; font-weight:600; padding:7px 13px; border-radius:999px; }
    #sec-connect .cn-pill-tag { background:var(--color-primary-light); color:var(--color-primary); }
    #sec-connect .cn-pill-tool { background:#EEEEEE; color:#666680; }
    #sec-connect .cn-pill button { border:none; background:none; color:inherit; font-size:15px; line-height:1; padding:0 0 0 2px; cursor:pointer; }
    /* 2026-09-22: 폰에서 카드/폼이 좌우로 삐져나오지 않도록 여백·줄바꿈 정리 */
    @media (max-width: 640px) {
      #sec-connect .kko-card { padding:16px; }
      #sec-connect .cn-seg { gap:7px; }
      #sec-connect .cn-sec-title { font-size:22px; }
      #sec-connect .kko-tab { font-size:15px; }
    }
    #sec-connect .cn-role-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    #sec-connect .cn-role-btn { height:56px; border-radius:var(--radius-btn); font-size:17px; font-weight:700; background:#fff; color:#888; border:1.5px solid #D5D5E0; cursor:pointer; }
    #sec-connect .cn-role-btn.on { background:var(--color-primary); color:#fff; border-color:var(--color-primary); }
    #sec-connect .cn-radio-row { display:flex; align-items:center; gap:10px; min-height:52px; padding:10px 14px; border:1.5px solid var(--color-border); border-radius:var(--radius-btn); font-size:16px; font-weight:600; margin-bottom:8px; cursor:pointer; background:#fff; }
    #sec-connect .cn-radio-row.on { border-color:var(--color-primary); background:var(--color-primary-light); color:var(--color-primary); }
    #sec-connect .cn-radio-row input { width:20px; height:20px; accent-color:var(--color-primary); }
    #sec-connect .cn-chk-chip { display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 12px; border:1.5px solid var(--color-border); border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; background:#fff; }
    #sec-connect .cn-chk-chip.on { border-color:var(--color-primary); background:var(--color-primary-light); color:var(--color-primary); }
    #sec-connect .cn-chk-chip input { accent-color:var(--color-primary); width:16px; height:16px; }
    #sec-connect .cn-seg { display:flex; flex-wrap:wrap; gap:6px; padding-bottom:2px; }
    #sec-connect .cn-seg button { flex:0 0 auto; height:40px; padding:0 15px; border-radius:999px; font-size:15px; font-weight:600; border:1.5px solid var(--color-border); background:#fff; color:#5E636B; cursor:pointer; }
    #sec-connect .cn-seg button.on { background:var(--color-primary); color:#fff; border-color:var(--color-primary); }
    #sec-connect .cn-seg.small button { height:36px; font-size:14px; }
    #sec-connect .cn-avatar { width:52px; height:52px; border-radius:50%; object-fit:cover; flex-shrink:0; }
    #sec-connect .cn-avatar-ph { width:52px; height:52px; border-radius:50%; background:var(--color-primary); color:#fff; font-weight:700; font-size:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    /* daisyUI 전역 .badge 와 충돌 방지를 위해 cn- 접두사로 격리 */
    .cn-badge-hot { background:#FFF0E5; color:#E8590C; }
    .cn-badge-tier { background:#E6F6EF; color:var(--color-success); }
    .cn-badge { display:inline-flex; align-items:center; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; }
    #sec-connect .cn-fab { position:fixed; right:16px; bottom:76px; height:52px; padding:0 20px; border-radius:26px; background:var(--color-primary); color:#fff; font-size:15px; font-weight:700; border:none; box-shadow:0 4px 14px rgba(126,34,206,.4); z-index:30; cursor:pointer; }
    #sec-connect .cn-hint { font-size:13px; color:var(--dg-text-sub); margin-top:5px; line-height:1.5; }

    /* ════════════════════════════════════════════════════════════════════
       2026-09-23 ⚠️ 바텀시트 안의 연결 폼 스타일
       ────────────────────────────────────────────────────────────────────
       openSheet()는 #appSheetHost 에 렌더하는데, 이 host는 #sec-connect 바깥의
       형제 노드다. 그래서 위의 `#sec-connect .cn-lbl` / `.kko-input` 같은
       스코프 규칙이 시트 안에서는 하나도 먹지 않는다.
       → 라벨이 block이 안 되고 입력칸이 width:100%가 안 돼서 폼이 한 줄로
         뭉개진다("신청서가 잘 구현이 안 된다"는 지적의 실제 원인).
       여기서 같은 규칙을 #appSheetHost 기준으로 한 번 더 선언해 둔다.
       ⚠️ 위 #sec-connect 규칙을 고치면 여기도 같이 고칠 것.
       ════════════════════════════════════════════════════════════════════ */
    #appSheetHost .kko-input { width:100%; min-height:50px; border:1px solid var(--color-border); border-radius:var(--radius-input); padding:12px 14px; font-size:15.5px; background:#fff; color:var(--color-text); font-family:inherit; }
    #appSheetHost .kko-input:focus { outline:2px solid var(--color-primary); border-color:var(--color-primary); }
    #appSheetHost textarea.kko-input { resize:vertical; line-height:1.6; }
    #appSheetHost .cn-sec-sub { font-size:14px; color:var(--dg-text-sub); margin-top:5px; margin-bottom:6px; line-height:1.5; }
    #appSheetHost .cn-req { color:var(--color-error); font-weight:700; }
    #appSheetHost .cn-lbl { display:block; font-size:15px; font-weight:700; margin:18px 0 7px; letter-spacing:-0.02em; }
    #appSheetHost .cn-lbl small { font-weight:400; color:var(--color-text-sub); }
    #appSheetHost .cn-hint { font-size:13px; color:var(--dg-text-sub); margin-top:5px; line-height:1.5; }
    #appSheetHost .cn-seg { display:flex; flex-wrap:wrap; gap:6px; padding-bottom:2px; }
    #appSheetHost .cn-seg button { flex:0 0 auto; height:40px; padding:0 15px; border-radius:999px; font-size:15px; font-weight:600; border:1.5px solid var(--color-border); background:#fff; color:#5E636B; cursor:pointer; font-family:inherit; }
    #appSheetHost .cn-seg button.on { background:var(--color-primary); border-color:var(--color-primary); color:#fff; }
    #appSheetHost .cn-seg.small button { height:36px; font-size:14px; }

    .cn-lightbox { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:9995; display:flex; align-items:center; justify-content:center; }
    .cn-lightbox img { max-width:94vw; max-height:90vh; border-radius:8px; }
    img.zoomable { cursor:zoom-in; }
    #sec-connect .cn-chat-wrap { display:flex; flex-direction:column; height:calc(100vh - 260px); }
    #sec-connect .cn-chat-log { flex:1; overflow-y:auto; background:var(--color-bg); border-radius:var(--radius-card); padding:12px; display:flex; flex-direction:column; gap:8px; }
    #sec-connect .cn-bubble { max-width:78%; padding:9px 13px; font-size:14px; line-height:1.45; white-space:pre-wrap; word-break:break-word; border-radius:18px; }
    #sec-connect .cn-bubble.mine { background:var(--color-primary); color:#fff; border-bottom-right-radius:6px; }
    #sec-connect .cn-bubble.other { background:#fff; color:var(--color-text); border:1px solid var(--color-border); border-bottom-left-radius:6px; }
    #sec-connect .cn-btime { font-size:10px; color:#999; margin-top:2px; }
    /* ===== SECTION CSS: ai =====
       원본 feedback-room.html에서 .kko-btn-main/.kko-btn-outline/.kko-fade-in/.kko-card-in/
       .kko-skeleton(+keyframes)은 공유 shell과 동일해서 제거. .kko-card/.kko-input/.kko-header/
       .kko-tabs/.kko-tab/.kko-bubble-*는 공유되지 않는 이름이라(connect 섹션도 각자 스코프해
       따로 갖고 있음) #sec-ai 로 스코프해서 새로 둔다. */
    #sec-ai .kko-header { height:var(--height-header); background:var(--color-primary); display:flex; align-items:center; gap:10px; padding:0 16px; flex-shrink:0; }
    #sec-ai .kko-header .kko-back { color:#fff; font-size:20px; line-height:1; text-decoration:none; }
    #sec-ai .kko-header .kko-title { color:#fff; font-weight:700; font-size:16px; }
    #sec-ai .kko-tabs { display:flex; border-bottom:1px solid var(--color-border); overflow-x:auto; background:#fff; }
    #sec-ai .kko-tab { flex:1; padding:12px 8px; font-size:12px; font-weight:500; white-space:nowrap; color:var(--color-text-sub); border-bottom:2px solid transparent; background:transparent; }
    #sec-ai .kko-tab.kko-tab-active { color:var(--color-primary); font-weight:700; border-bottom-color:var(--color-primary); }
    #sec-ai .kko-card { background:var(--color-card); border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:20px; }
    #sec-ai .kko-input, #sec-ai textarea.kko-input { min-height:48px; border-radius:var(--radius-input); border:1px solid var(--color-border); }
    #sec-ai .kko-input:focus { border-color:var(--color-primary); outline-color:var(--color-primary); }
    #sec-ai .kko-bubble-mine { background:var(--color-primary); color:#fff; border-radius:18px; }
    #sec-ai .kko-bubble-other { background:#fff; color:var(--color-text); border:1px solid var(--color-border); border-radius:18px; }
    #sec-ai .animate-fade-in { animation: hx-fade-in .4s ease-out both; }
    #sec-ai .animate-slide-in { animation: hx-slide-in .35s cubic-bezier(0.16,1,0.3,1) both; }
    #sec-ai .animate-fade-in-up { animation: hx-fade-in-up .4s ease-out both; }
    #sec-ai .animate-shake { animation: hx-shake .4s ease-in-out both; }
    #sec-ai .hx-scroll::-webkit-scrollbar { width:5px; }
    #sec-ai .hx-scroll::-webkit-scrollbar-thumb { background:#5eead4; border-radius:9999px; }
    @keyframes hx-fade-in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes hx-slide-in { from { opacity:0; transform:translateY(12px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes hx-fade-in-up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @keyframes hx-shake { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-5px);} 40%,80%{transform:translateX(5px);} }
    /* ===== SECTION CSS: textbook ===== (원본: study-room.html)
       원본의 :root 토큰, .kko-card, .kko-btn-main, .kko-btn-outline, .kko-input, .kko-fade-in,
       .kko-card-in, .kko-skeleton, .kko-spinner(+keyframes), html/body, 전역 font-family는
       전부 공유 shell과 동일해서 제거. 섹션 전용으로 남는 건 자체 헤더와 이수교육 행 구분선뿐.
       ⚠️ CSS 주석 안에 별표+슬래시 조합을 쓰면 주석이 거기서 끊겨 다음 규칙이 통째로
       날아간다(실제로 .kko-btn-* 로 줄여 쓰다가 헤더 규칙이 사라졌었음) — 와일드카드 금지. */
    #sec-textbook .kko-header { height:var(--height-header); background:var(--color-primary); display:flex; align-items:center; gap:10px; padding:0 16px; flex-shrink:0; }
    #sec-textbook .kko-header .kko-title { color:#fff; font-weight:700; font-size:16px; }
    #sec-textbook .reqedu-row:last-child { border-bottom:none; }
    /* ===== SECTION CSS: admin =====
       edu-dashboard.html(1️⃣교사현황) + district-dashboard.html(2️⃣부서별활동관리) 흡수.
       두 원본 모두 [data-theme="jesagil"]/:root(--color-*)/.lucide-i/html,body/body/
       .brand-accent-bar/.card-border/.kko-fade-in/.kko-card-in(+keyframes)를 공유 shell과
       동일하게 재선언하고 있어 전부 제거하고, 섹션 전용 스타일만 #sec-admin 범위로 가져옴. */
    #sec-admin .kko-header { height:56px; min-height:56px; background:var(--color-primary); color:#fff; display:flex; align-items:center; flex-shrink:0; padding:0 20px; }
    #sec-admin .section-card { border-radius: var(--rounded-box); overflow: hidden; box-shadow: var(--shadow-card); }
    #sec-admin .section-stripe { height: 6px; }
    #sec-admin .border-base-300 { border-color: var(--color-border) !important; }
    #sec-admin .tabs.tabs-boxed { background: transparent; padding: 0; gap: 6px; border-radius: 0; }
    #sec-admin .tabs.tabs-boxed .tab {
      background: transparent !important; border-radius: 0 !important;
      border-bottom: 2px solid transparent; color: var(--color-text-sub); font-weight: 600;
    }
    #sec-admin .tabs.tabs-boxed .tab.tab-active {
      background: transparent !important; color: var(--color-primary) !important;
      border-bottom-color: var(--color-primary); font-weight: 800;
    }
    #sec-admin .settlement-box { box-shadow: var(--shadow-card) !important; transition: transform .1s ease, box-shadow .15s ease; }
    #sec-admin .settlement-box:active { transform: scale(0.97); }
    #sec-admin .settlement-box .box-icon { font-size: 26px; line-height: 1; }
    #sec-admin .kko-table-card { background: var(--color-card); border-radius: var(--radius-card); box-shadow: var(--shadow-card); border: none; }
    #sec-admin .table tbody tr:hover, #sec-admin .table tbody tr:hover td { background: var(--color-primary-light) !important; }

    /* ── 2026-09-22: "글자가 너무 작다"는 지적 반영 — 관리자 표·요약 숫자 전반 확대 ── */
    #sec-admin .table { font-size: 14px; }
    #sec-admin .table th { font-size: 13px; }
    #sec-admin .tl-count { font-size: 13px; color: var(--dg-text-sub); }
    #sec-admin .tl-limit-seg button { font-size: 13px; }
    /* 총 교사 수 / 부서별 교사 현황 카드의 숫자·라벨 */
    #sec-admin .section-card .text-xs { font-size: 13px; }
    #sec-admin .section-card .text-\[11px\] { font-size: 12.5px; }
    #sec-admin .section-card .text-2xl { font-size: 30px; }
    #sec-admin .section-card .text-lg { font-size: 19px; }

    /* 교사 명단 — 폰에서는 이름·지역·등급·활동까지만 보이고 나머지는 행을 눌러 시트로 */
    #sec-admin .tl-phone-hint { display: none; }
    @media (max-width: 640px) {
      #sec-admin .tl-more { display: none; }
      #sec-admin .tl-phone-hint { display: block; }
      #sec-admin .table { font-size: 15px; }
      #sec-admin .table th, #sec-admin .table td { padding-left: 6px; padding-right: 6px; }
    }
    #sec-admin .tl-act b { color: var(--color-primary); font-weight: 800; }

    /* ── 2026-09-23 부서별 교사 현황: 막대그래프 → 표 ── */
    #sec-admin .dept-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    #sec-admin .dept-table th, #sec-admin .dept-table td {
      padding: 9px 6px; text-align: center; border-bottom: 1px solid var(--color-border); white-space: nowrap;
    }
    #sec-admin .dept-table th { font-size: 13px; font-weight: 800; color: var(--color-text-sub); background: var(--dg-bg-soft); }
    #sec-admin .dept-table .dept-name { text-align: left; font-weight: 700; padding-left: 10px; }
    #sec-admin .dept-table .dept-total { font-weight: 800; color: var(--color-primary); }
    #sec-admin .dept-table td b { font-weight: 700; }
    #sec-admin .dept-table .dept-pct { display: block; font-size: 11px; color: var(--color-text-sub); font-weight: 500; margin-top: 1px; }
    #sec-admin .dept-table .dept-zero { color: #D1D5DB; }
    #sec-admin .dept-table tfoot td { background: var(--dg-bg-soft); border-bottom: none; font-weight: 800; }

    /* ── 2026-09-23 부서 탭: 전체 + 교자장부청 한 줄(아이콘 없음) ── */
    #sec-admin .tl-dept-tabs { display: flex; gap: 6px; }
    #sec-admin .tl-dept-tabs button {
      flex: 1 1 0; min-width: 0; height: 38px; border-radius: 14px;
      border: 1.5px solid var(--color-border); background: #fff;
      color: var(--color-text-sub); font-size: 15px; font-weight: 700;
      font-family: inherit; cursor: pointer; padding: 0;
    }
    #sec-admin .tl-dept-tabs button.on { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
    /* 2026-09-23: 풀네임(교역자·자문회…)으로 되돌려 6칸이 되었으므로 글자를 줄여 한 줄 유지 */
    #sec-admin .tl-dept-tabs button { font-size: 13.5px; padding: 0 2px; letter-spacing: -0.05em; }
    @media (max-width: 400px) { #sec-admin .tl-dept-tabs button { font-size: 12px; } }

    /* ── 2026-09-23 "전주교회 총 교사 수" 강조 ── */
    #sec-admin .ts-total-label { font-size: 14px; font-weight: 700; color: var(--color-text-sub); }
    #sec-admin .ts-total-num { font-size: 40px; font-weight: 900; color: var(--color-primary);
      letter-spacing: -0.05em; line-height: 1.15; }
    @media (max-width: 640px) { #sec-admin .ts-total-num { font-size: 34px; } }
    /* 부서별 교사 현황 표 글자 확대 */
    #sec-admin .dept-table { font-size: 15px; }
    #sec-admin .dept-table th { font-size: 14px; }
    #sec-admin .dept-table .dept-name { font-size: 15.5px; }
    #sec-admin .dept-table .dept-total { font-size: 16px; }
    #sec-admin .dept-table td b { font-size: 15.5px; }

    /* ── 2026-09-23 "교사 명단 관리" 배너(중앙·2배) ── */
    /* 2026-09-23: "새 타이틀 같은 느낌으로" — 연보라 카드 대신 보라 그라데이션 밴드에
       흰 글자, 위아래 잎사귀색 실선으로 장 구분처럼 보이게. */
    #sec-admin .tl-banner { position: relative; text-align: center; padding: 26px 16px 22px;
      border-radius: 18px; overflow: hidden; color: #fff;
      background: linear-gradient(135deg, #9333EA, var(--color-primary));
      box-shadow: 0 6px 20px rgba(126,34,206,.25); }
    #sec-admin .tl-banner::before { content: ''; position: absolute; left: 0; right: 0; top: 0;
      height: 4px; background: var(--color-leaf); }
    #sec-admin .tl-banner-t { font-size: 32px; font-weight: 900; letter-spacing: -0.06em; line-height: 1.2; }
    #sec-admin .tl-banner-s { font-size: 13px; color: rgba(255,255,255,.85); line-height: 1.6; margin-top: 10px; }
    @media (max-width: 640px) { #sec-admin .tl-banner-t { font-size: 27px; } }

    /* ── 2026-09-23 "등급 승인" 제목 강조 ── */
    #sec-admin .bulk-title { font-size: 22px; font-weight: 900; letter-spacing: -0.04em; color: var(--color-primary); }
    #sec-admin .bulk-title-sub { display: block; font-size: 12.5px; font-weight: 600; color: var(--color-text-sub);
      letter-spacing: -0.02em; margin-top: 3px; }

    /* ── 2026-09-23 교사 통합 검색 ── */
    #sec-admin .tl-search { position: relative; }
    #sec-admin .tl-search input {
      width: 100%; height: 46px; padding: 0 40px 0 14px; border-radius: 14px;
      border: 1.5px solid var(--color-border); background: #fff; font-size: 15px;
      font-family: inherit; outline: none;
    }
    #sec-admin .tl-search input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 4px var(--color-primary-light); }
    #sec-admin .tl-search .clr { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; font-size: 18px; color: var(--color-text-sub); cursor: pointer; padding: 4px 6px; }

    /* ════════════════════════════════════════════════════════════════
       2026-09-23 교사 개별 시트(.tls-*)
       ⚠️ 공유 #appSheetHost(= #sec-admin 바깥)에 렌더되므로 #sec-admin 으로
          스코프하면 안 된다. 반드시 전역 .tls- 접두사로 둘 것.
       ════════════════════════════════════════════════════════════════ */
    .tls { letter-spacing: -0.02em; }
    .tls-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .tls-name { font-size: 22px; font-weight: 900; letter-spacing: -0.04em; color: var(--dg-text); }
    .tls-suffix { font-size: 15px; font-weight: 600; color: var(--dg-text-sub); }
    .tls-sub { font-size: 13.5px; color: var(--dg-text-sub); margin-top: 4px; font-weight: 500; }
    .tls-close { background: none; border: none; font-size: 20px; line-height: 1; color: var(--dg-text-sub); cursor: pointer; padding: 2px 4px; }
    .tls-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
    .tls-sec-t { font-size: 13px; font-weight: 800; color: var(--color-primary); margin: 20px 0 8px;
      padding-bottom: 6px; border-bottom: 1.5px solid var(--color-primary-light); }
    .tls-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .tls-stat { border: 1.5px solid var(--color-border); border-radius: 14px; padding: 12px 6px; text-align: center; }
    .tls-stat b { display: block; font-size: 22px; font-weight: 900; color: var(--color-primary); letter-spacing: -0.04em; }
    .tls-stat span { display: block; font-size: 11.5px; color: var(--dg-text-sub); font-weight: 600; margin-top: 3px; }
    .tls-grid { display: grid; grid-template-columns: 104px 1fr; gap: 8px 12px; font-size: 13.5px; align-items: start; }
    .tls-k { color: var(--dg-text-sub); font-weight: 600; }
    .tls-v { font-weight: 600; color: var(--dg-text); word-break: break-word; }
    .tls-dim { color: #C3C6CC; font-weight: 500; }
    .tls-warn { color: var(--color-warning); font-weight: 700; }
    .tls-wait, .tls-empty { font-size: 13.5px; color: var(--dg-text-sub); background: var(--dg-bg-soft);
      border-radius: 14px; padding: 14px; line-height: 1.6; }
    .tls-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .tls-chip { display: inline-flex; align-items: center; height: 25px; padding: 0 10px; border-radius: 999px;
      background: var(--color-primary-light); color: var(--color-primary); font-size: 12.5px; font-weight: 700; }
    .tls-chip.leaf { background: var(--color-leaf-light); color: var(--color-leaf-dark); }
    .tls-edu-sum { font-size: 13.5px; font-weight: 700; color: var(--dg-text-sub); margin-bottom: 8px; }
    .tls-edu-row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border: 1.5px solid var(--color-border); border-radius: 14px; margin-bottom: 6px; }
    .tls-edu-row.on { border-color: var(--color-leaf-light); background: var(--color-leaf-light); }
    .tls-edu-nm { font-size: 13.5px; font-weight: 700; }
    .tls-edu-st { font-size: 12.5px; font-weight: 700; color: #AAAAAA; white-space: nowrap; }
    .tls-edu-row.on .tls-edu-st { color: var(--color-leaf-dark); }
    .tls-id { font-size: 11.5px; color: #C3C6CC; margin-top: 18px; text-align: right; }

    /* ════════════════════════════════════════════════════════════════════
       2026-09-23 포도원 표지 — 스플래시 + 로그인
       podo-splash.html 목업을 그대로 옮겨온 것. 클래스에 pd- 접두사를 붙여
       기존 섹션 CSS와 섞이지 않게 했다(목업의 Tailwind 유틸리티는 전부
       일반 CSS로 풀어썼음 — app.html은 Tailwind CDN을 쓰지만 이 화면만은
       유틸리티 의존을 줄여 나중에 손대기 쉽게).
       ════════════════════════════════════════════════════════════════════ */
    #loginPanel { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #fff; }
    .pd-screen { position: absolute; inset: 0; display: flex; flex-direction: column; transition: opacity .6s ease-in-out; }
    .pd-screen.pd-hide { opacity: 0; pointer-events: none; z-index: -1; }

    /* ① 스플래시 */
    #pdSplash { z-index: 20; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #9333EA, var(--color-primary)); }
    .pd-bunch { position: relative; width: 64px; height: 64px; margin-bottom: 24px; }
    .pd-dot { width: 20px; height: 20px; border-radius: 50%; background: #fff; position: absolute;
      box-shadow: inset -3px -3px 6px rgba(0,0,0,.1); }
    .pd-leaf { width: 24px; height: 16px; background: var(--color-leaf); border-radius: 20px 0 20px 0;
      position: absolute; top: -12px; right: 14px; transform-origin: bottom left;
      animation: pdLeafGrow .6s cubic-bezier(.34,1.56,.64,1) forwards; animation-delay: 1s; opacity: 0; }
    /* 흩어진 포도알이 가운데로 모여 한 송이가 된다 — "연결"의 시각적 은유 */
    @keyframes pdGather1 { 0% { transform: translate(-50px,-50px) scale(0); opacity: 0; } 100% { transform: translate(0,0) scale(1); opacity: 1; } }
    @keyframes pdGather2 { 0% { transform: translate(0,-60px) scale(0); opacity: 0; }    100% { transform: translate(0,0) scale(1); opacity: 1; } }
    @keyframes pdGather3 { 0% { transform: translate(50px,-50px) scale(0); opacity: 0; }  100% { transform: translate(0,0) scale(1); opacity: 1; } }
    @keyframes pdGather4 { 0% { transform: translate(-40px,30px) scale(0); opacity: 0; }  100% { transform: translate(0,0) scale(1); opacity: 1; } }
    @keyframes pdGather5 { 0% { transform: translate(40px,30px) scale(0); opacity: 0; }   100% { transform: translate(0,0) scale(1); opacity: 1; } }
    @keyframes pdGather6 { 0% { transform: translate(0,60px) scale(0); opacity: 0; }      100% { transform: translate(0,0) scale(1); opacity: 1; } }
    @keyframes pdLeafGrow { 0% { transform: scale(0) rotate(-20deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    .pd-d1 { top: 0;    left: 0;    animation: pdGather1 .8s cubic-bezier(.16,1,.3,1) forwards; }
    .pd-d2 { top: 0;    left: 22px; animation: pdGather2 .8s cubic-bezier(.16,1,.3,1) forwards; animation-delay: .1s; opacity: 0; }
    .pd-d3 { top: 0;    left: 44px; animation: pdGather3 .8s cubic-bezier(.16,1,.3,1) forwards; animation-delay: .2s; opacity: 0; }
    .pd-d4 { top: 20px; left: 11px; animation: pdGather4 .8s cubic-bezier(.16,1,.3,1) forwards; animation-delay: .3s; opacity: 0; }
    .pd-d5 { top: 20px; left: 33px; animation: pdGather5 .8s cubic-bezier(.16,1,.3,1) forwards; animation-delay: .4s; opacity: 0; }
    .pd-d6 { top: 40px; left: 22px; animation: pdGather6 .8s cubic-bezier(.16,1,.3,1) forwards; animation-delay: .5s; opacity: 0; }
    @keyframes pdFadeUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
    .pd-fade { animation: pdFadeUp .8s ease-out forwards; opacity: 0; }
    .pd-fade.d1 { animation-delay: 1.2s; }
    .pd-fade.d2 { animation-delay: 1.4s; }
    .pd-title { font-size: 38px; white-space: nowrap; font-weight: 900; color: #fff; letter-spacing: -0.05em; margin: 0 0 4px; }
    .pd-tagline { font-size: 15px; font-weight: 500; color: rgba(255,255,255,.9); letter-spacing: .02em; margin: 0 0 32px; }
    .pd-conn { position: absolute; bottom: 48px; display: flex; gap: 8px; opacity: .5; }
    .pd-conn i { display: block; height: 6px; border-radius: 3px; background: #fff; }
    .pd-conn i:nth-child(2) { width: 32px; }
    .pd-conn i:nth-child(1), .pd-conn i:nth-child(3) { width: 6px; }

    /* ② 로그인 */
    #pdLogin { z-index: 10; justify-content: center; padding: 0 28px; background: #fff; }
    #pdLoginContent { transform: translateY(-20px); transition: transform .7s ease-out; }
    #pdLoginContent.pd-settled { transform: translateY(0); }
    .pd-mark { width: 56px; height: 56px; border-radius: 16px; background: var(--color-primary-light);
      border: 1px solid #E9D5FF; display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .pd-hello { font-size: 26px; font-weight: 800; color: #111827; line-height: 1.4; letter-spacing: -0.03em; margin: 0 0 8px; }
    .pd-welcome { font-size: 14px; color: #6B7280; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 40px; }
    .pd-welcome b { color: var(--color-primary); font-weight: 700; }
    .pd-field { margin-bottom: 16px; }
    .pd-label { display: block; font-size: 13px; font-weight: 700; color: #4B5563; margin: 0 0 8px 4px; }
    .pd-input { background: #F3F4F6; border: 1.5px solid transparent; border-radius: 14px;
      font-size: 16px; padding: 16px 20px; width: 100%; color: #111827; font-family: inherit;
      transition: all .2s ease; outline: none; }
    .pd-input::placeholder { color: #9CA3AF; font-weight: 500; }
    .pd-input:focus { background: #fff; border-color: var(--color-primary); box-shadow: 0 0 0 4px var(--color-primary-light); }
    .pd-input.pd-err { border-color: #F87171; background: #FEF2F2; }
    .pd-enter { width: 100%; height: 54px; margin-top: 22px; border: none; border-radius: 14px;
      background: var(--color-primary); color: #fff; font-size: 16.5px; font-weight: 800;
      font-family: inherit; cursor: pointer; letter-spacing: -0.02em; transition: transform .1s ease; }
    .pd-enter:active { transform: scale(.98); }
    .pd-loading { margin-top: 12px; height: 40px; display: flex; align-items: center; justify-content: center;
      gap: 8px; opacity: 0; transition: opacity .3s ease; }
    .pd-loading.on { opacity: 1; }
    .pd-loading i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #D1D5DB;
      border-top-color: var(--color-primary); animation: kkoSpin .7s linear infinite; display: block; }
    .pd-loading span { font-size: 15px; font-weight: 700; color: var(--color-primary); }
    .pd-foot { margin-top: 8px; text-align: center; }
    .pd-foot p { font-size: 13px; color: #9CA3AF; font-weight: 500; margin: 0 0 12px; }
    .pd-foot a { color: var(--color-primary); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
    .pd-forget { background: none; border: none; font-family: inherit; font-size: 13px; color: #9CA3AF;
      font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
    /* 저장된 고유번호로 바로 들어가는 안내 줄 */
    .pd-saved { display: flex; align-items: center; gap: 8px; background: var(--color-primary-light);
      border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; font-size: 13.5px;
      font-weight: 600; color: var(--color-primary-dark); }
    .pd-saved b { font-weight: 800; }

    /* 2026-09-23 로그인 화면 교사 현황 요약 */
    .pd-stats { background: #F8F5FF; border: 1px solid var(--color-primary-light);
      border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
    .pd-stats-t { font-size: 12.5px; font-weight: 800; color: var(--color-primary); margin-bottom: 10px; }
    .pd-stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .pd-stat { text-align: center; }
    .pd-stat b { display: block; font-size: 19px; font-weight: 900; letter-spacing: -0.04em; color: #374151; }
    .pd-stat span { display: block; font-size: 11px; color: #6B7280; font-weight: 600; margin-top: 2px; }
    .pd-stat.total b { color: var(--color-primary); }
    .pd-stat.act b { color: var(--color-leaf-dark); }
    .pd-stat.rest b { color: #9CA3AF; }

    /* ════════════════════════════════════════════════════════════════════
       2026-09-23 PC(데스크톱) 레이아웃 — "당근마켓처럼 모바일 앱이 PC 화면
       가운데에 떠 있는" 형태.

       ⚠️ 규칙: 여기 아래는 전부 @media (min-width:769px) 안에만 둔다.
          모바일(~768px) 레이아웃은 한 줄도 건드리지 않는다(사용자 요청).
       ⚠️ position:fixed 요소(하단 탭바 / FAB 2개 / 설치 토스트 / 바텀시트)는
          뷰포트 기준이라 그냥 두면 PC에서 화면 양 끝에 붙는다. 전부 아래에서
          480px 컬럼 기준으로 다시 잡아준다. 새 fixed 요소를 추가하면 여기도
          같이 추가할 것.
       ════════════════════════════════════════════════════════════════════ */
    /* PC 폭 사다리 — 화면이 커지면 앱 컬럼도 같이 커진다(헤더·탭바는 항상 이 폭 안).
       값만 여기서 바꾸면 #appPanel·탭바·FAB·시트가 전부 따라옵니다. */
    @media (min-width: 769px)  { :root { --app-max-width: 720px; } }
    @media (min-width: 1100px) { :root { --app-max-width: 820px; } }
    @media (min-width: 1440px) { :root { --app-max-width: 900px; } }

    @media (min-width: 769px) {
      /* 앱 컬럼 바깥은 살짝 더 진한 회색 — 흰 앱 영역과 대비가 생겨야
         "가운데 떠 있는" 느낌이 난다(본문 배경 #F5F5F5와 같은 색이면 경계가 안 보임). */
      body { background: var(--app-outer-bg); }

      #appPanel {
        max-width: var(--app-max-width);
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 0 20px rgba(0,0,0,0.08);
        /* h-screen(100vh) + flex-col 유지 — 내부 스크롤 구조는 모바일과 동일 */
      }
      /* 표지도 앱 컬럼 안에서만 — PC에서 스플래시가 화면 전체를 덮으면
         "앱이 가운데 떠 있다"는 인상이 깨진다. */
      #loginPanel { background: var(--app-outer-bg); }
      #loginPanel .pd-screen {
        left: calc(50% - (var(--app-max-width) / 2));
        right: auto;
        width: var(--app-max-width);
        box-shadow: 0 0 20px rgba(0,0,0,0.08);
      }
      /* 로그인 본문이 넓은 화면에서 너무 퍼지지 않게 */
      #pdLoginContent { max-width: 420px; margin: 0 auto; width: 100%; }

      /* 하단 탭바: left/right:0 대신 480px 컬럼 안으로 */
      #bottomTabBar {
        left: calc(50% - (var(--app-max-width) / 2));
        right: auto;
        width: var(--app-max-width);
        border-left: 1px solid var(--dg-line);
        border-right: 1px solid var(--dg-line);
      }

      /* FAB 2종: 화면 우측 끝이 아니라 앱 컬럼 우측 안쪽에 붙게 */
      #sec-activity .act-fab { right: calc(50% - (var(--app-max-width) / 2) + 20px); }
      #sec-connect  .cn-fab  { right: calc(50% - (var(--app-max-width) / 2) + 16px); }

      /* 설치 안내 토스트 — 이 요소는 kkoCardIn 애니메이션이 transform을 점유하므로
         translateX(-50%)로 가운데 맞추면 재생 0.3초 동안 위치가 튄다. left를 calc로 직접 계산. */
      #kkoInstallToast {
        left: calc(50% - (var(--app-max-width) / 2) + 16px);
        right: auto;
        width: calc(var(--app-max-width) - 32px);
      }

      /* 바텀시트: 배경 딤은 화면 전체(앱처럼 보이게), 시트만 480px 중앙 정렬 */
      .sheet { max-width: var(--app-max-width); border-radius: 20px 20px 0 0; }
      /* daisyUI 모달(성장/코칭 등)도 같은 폭으로 */
      .modal .modal-box { max-width: var(--app-max-width); }

      /* PC에서 마우스 hover 피드백(터치엔 없던 것 — 모바일 영향 없음) */
      #bottomTabBar .tab:hover { color: var(--color-primary); }

      /* ── 넓은 화면에서 "쫙 펼쳐져 배열이 깨지는" 것 방지 ──
         컬럼 자체는 900px까지 넓어지지만, 탭바 아이콘과 헤더 내용까지 그 폭을
         꽉 채우면 아이콘 사이가 휑해진다. 안쪽 내용만 따로 폭을 잡아둔다. */
      #bottomTabBar { justify-content: center; }
      #bottomTabBar .tab { flex: 0 1 120px; max-width: 120px; }

      /* 헤더: 제목과 아이콘이 양 끝으로 벌어지지 않게 안쪽 폭 제한 + 가운데 정렬 */
      #appHeader {
        --hdr-gutter: max(16px, calc((100% - 620px) / 2));
        padding-left: var(--hdr-gutter);
        padding-right: var(--hdr-gutter);
      }
      /* 섹션 자체 헤더(내활동/연결/교재/관리자)도 같은 기준으로 */
      #sec-activity .act-appbar,
      #sec-connect .kko-tabs,
      #admin-subtabs {
        --hdr-gutter: max(16px, calc((100% - 620px) / 2));
        padding-left: var(--hdr-gutter);
        padding-right: var(--hdr-gutter);
      }
    }
  </style>
</head>
