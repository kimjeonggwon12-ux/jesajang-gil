<!DOCTYPE html>
<html lang="ko" data-theme="jesagil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>복음방 교사</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 제사장의 길 공통 디자인 시스템 테마 (jesagil) — 다른 HTML 파일에도 동일하게 붙여넣어 사용 */
    [data-theme="jesagil"] {
      /* DaisyUI 4.12는 색상 변수를 OKLCH(L% C H)로 받음 — HSL 아님, 주의 */
      --p: 51.06% 0.2301 276.97;   /* primary: indigo-600 */
      --pc: 100% 0 0;
      --s: 66.58% 0.1574 58.32;    /* secondary: amber-600 */
      --sc: 100% 0 0;
      --a: 59.60% 0.1274 163.23;   /* accent: emerald-600 */
      --ac: 100% 0 0;
      --n: 27.95% 0.0368 260.03;   /* neutral: slate-800 */
      --nc: 96.70% 0.0029 264.54;
      --b1: 100% 0 0;              /* base-100: white */
      --b2: 96.70% 0.0029 264.54;  /* base-200: gray-100 */
      --b3: 92.76% 0.0058 264.53;  /* base-300: gray-200 */
      --bc: 27.81% 0.0296 256.85;  /* base-content: gray-800 */
      --in: 68.47% 0.1479 237.32;
      --inc: 100% 0 0;
      --su: 69.59% 0.1491 162.48;
      --suc: 100% 0 0;
      --wa: 76.86% 0.1647 70.08;
      --wac: 0% 0 0;
      --er: 57.71% 0.2152 27.33;
      --erc: 100% 0 0;
      --rounded-box: 0.75rem;
      --rounded-btn: 0.5rem;
      --rounded-badge: 1rem;
    }
    html, body { height: 100%; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
    /* 브랜드 그라데이션 액센트 바 — navbar 바로 아래, 여러 파일에서 재사용 */
    .brand-accent-bar { height: 3px; background: linear-gradient(90deg, oklch(var(--p)), oklch(var(--s)), oklch(var(--a))); flex-shrink: 0; }
    .brand-avatar { background: linear-gradient(135deg, oklch(var(--p)), oklch(var(--a))); }
    /* 홈 대시보드 상단 헤더 — 목업 디자인의 어두운 네이비 카드 */
    .home-hero { background: #1a1a2e; }
    /* 홈 화면 전체 배경(목업 지정색) — 다른 탭(활동방/피드백방/공부방)에는 영향 없음 */
    .home-bg { background: #f8f9fa; }
    .step-circle { width: 2.25rem; height: 2.25rem; border-radius: 9999px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.95rem; flex-shrink:0; }
  </style>
</head>
<body class="bg-base-200">
  <!--
    ⚠️ 임시(당분간만): 편의를 위해 입장(성도고유번호+이름) 화면을 비활성화했습니다.
    운영 복귀 시 → 아래 loginPanel 의 style="display:none" 를 지우고,
    <script> 하단의 DOMContentLoaded 리스너 한 줄을 지우면 됩니다.
    (startSession() 로그인 코드는 복구용으로 그대로 보존)
  -->
  <div class="hero min-h-screen" id="loginPanel" style="display:none">
    <div class="hero-content text-center">
      <div class="card w-full max-w-sm bg-base-100 shadow-xl">
        <div class="card-body items-center">
          <div class="w-16 h-16 rounded-full brand-avatar flex items-center justify-center text-3xl shadow-md mb-1">🙏</div>
          <h2 class="card-title text-2xl">복음방 교사</h2>
          <p class="text-xs text-base-content/50 -mt-1 mb-2">성도 고유번호와 이름으로 입장하세요</p>
          <div class="w-full flex flex-col gap-2 mt-2">
            <input type="text" id="memberId" placeholder="성도고유번호" class="input input-bordered w-full" />
            <input type="text" id="name" placeholder="이름" class="input input-bordered w-full" />
          </div>
          <button onclick="startSession()" class="btn btn-primary w-full mt-4">입장</button>
        </div>
      </div>
    </div>
  </div>

  <div id="appPanel" class="flex flex-col h-screen" style="display:none">
    <div class="navbar bg-neutral text-neutral-content px-4 min-h-0 py-3">
      <div class="flex-1 flex items-center gap-2">
        <span class="text-xl leading-none">🙏</span>
        <div class="flex flex-col leading-tight">
          <span class="text-lg font-bold">복음방 교사</span>
          <span class="text-[11px] text-neutral-content/50">교사 훈련 플랫폼</span>
        </div>
      </div>
      <div class="flex-none flex items-center gap-3">
        <button class="btn btn-ghost btn-sm" onclick="goHome()">🏠 홈</button>
        <span class="text-xs text-neutral-content/70" id="userDisplay"></span>
      </div>
    </div>
    <div class="brand-accent-bar"></div>
    <div role="tablist" class="tabs tabs-boxed bg-base-300 rounded-none p-1.5 gap-1">
      <button role="tab" class="tab tab-active flex-1 gap-1.5" data-room="home" onclick="switchTab('home', this)"><span>🏠</span> 홈</button>
      <button role="tab" class="tab flex-1 gap-1.5" data-room="activity" onclick="switchTab('activity', this)"><span>🙌</span> 활동방</button>
      <button role="tab" class="tab flex-1 gap-1.5" data-room="feedback" onclick="switchTab('feedback', this)"><span>💬</span> 피드백방</button>
      <button role="tab" class="tab flex-1 gap-1.5" data-room="study" onclick="switchTab('study', this)"><span>📚</span> 공부방</button>
    </div>
    <div id="homeContent" class="flex-1 w-full overflow-y-auto home-bg" style="display:none"></div>
    <iframe id="content" class="flex-1 w-full border-0" style="display:none"></iframe>
    <div class="text-center py-2 bg-base-100 border-t border-base-300 text-xs">
      <div class="dropdown dropdown-top dropdown-center">
        <div tabindex="0" role="button" class="link link-primary">⚙️ 관리자 메뉴</div>
        <ul tabindex="0" class="dropdown-content menu menu-sm bg-base-100 rounded-box z-10 w-44 p-2 shadow-md border border-base-300">
          <li><a href="admin-home.html" target="_blank" rel="noopener">🔐 관리자 홈</a></li>
          <li><a href="district-leader-view.html?memberId=0020113000010&name=%EA%B9%80%EC%A0%95%EA%B6%8C" target="_blank" rel="noopener">🗺️ 지역장 개인 화면</a></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- 새 전도 대상자 추가 모달 (daisyUI <dialog>, confirm()/alert() 같은 네이티브 다이얼로그 아님) -->
  <dialog id="targetModal" class="modal">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-3">새 대상자 추가</h3>
      <div class="flex flex-col gap-2">
        <input type="text" id="tm-name" placeholder="대상자 이름" class="input input-bordered w-full" />
        <select id="tm-stage" class="select select-bordered w-full"></select>
        <input type="date" id="tm-date" class="input input-bordered w-full" />
        <textarea id="tm-memo" placeholder="메모 (선택)" rows="3" class="textarea textarea-bordered w-full"></textarea>
      </div>
      <div class="modal-action">
        <button class="btn btn-ghost" onclick="closeTargetModal()">취소</button>
        <button class="btn btn-primary" id="tm-submit" onclick="submitAddTarget()">저장</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>닫기</button></form>
  </dialog>

  <!-- 내 성장 궤도 박스 클릭 시 뜨는 승급 조건 상세 모달 -->
  <dialog id="growthModal" class="modal">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-3">다음 등급 승급 조건</h3>
      <div id="growthModalBody"></div>
      <div class="modal-action">
        <button class="btn btn-ghost" onclick="closeGrowthModal()">닫기</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>닫기</button></form>
  </dialog>

  <script>
    // 각 방 파일명 — 실제 파일이 이 이름과 같은 폴더에 있어야 합니다.
    const ROOM_FILES = {
      study: 'study-room.html',
      activity: 'activity-room.html',
      feedback: 'feedback-room.html'
    };
    const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

    // activity-room.html 등 다른 방 파일과 동일한 패턴 — 관리자 테스트링크(?memberId=&name=)로
    // 특정 교사 계정으로 미리보기 가능(예: home.html?memberId=0020113000010&name=김정권).
    const urlParams = new URLSearchParams(window.location.search);
    const paramMemberId = urlParams.get('memberId');
    const paramName = urlParams.get('name');
    if (paramMemberId && paramName) {
      window.TEST_MEMBER_ID = paramMemberId;
      window.TEST_NAME = paramName;
    }

    let memberId = '';
    let name = '';

    // ⚠️ 임시(당분간만): 로그인 없이 바로 입장. 운영 복귀 시 이 리스너 한 줄만 제거.
    function enterWithoutLogin() {
      // window.TEST_MEMBER_ID/TEST_NAME이 있으면(관리자 테스트링크 ?memberId=&name=) 그 값 사용,
      // 없으면 study-room.html 등과 동일한 기본 테스트 계정으로 폴백.
      memberId = window.TEST_MEMBER_ID || 'TEST-0001';
      name = window.TEST_NAME || '테스트사용자';
      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('appPanel').style.display = 'flex';
      document.getElementById('userDisplay').textContent = `${name} (${memberId})`;
      switchTab('home', document.querySelector('.tab[data-room="home"]'));
    }
    // 홈 버튼: 기본 화면(홈 대시보드)으로 되돌아갑니다.
    function goHome() {
      switchTab('home', document.querySelector('.tab[data-room="home"]'));
    }
    window.addEventListener('DOMContentLoaded', enterWithoutLogin);

    function startSession() {
      memberId = document.getElementById('memberId').value.trim();
      name = document.getElementById('name').value.trim();

      if (!memberId || !name) {
        alert('성도고유번호와 이름을 입력해주세요.');
        return;
      }

      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('appPanel').style.display = 'flex';
      document.getElementById('userDisplay').textContent = `${name} (${memberId})`;

      // 최초 진입 시 홈 탭 활성화
      switchTab('home', document.querySelector('.tab[data-room="home"]'));
    }

    function switchTab(room, btnEl) {
      // 탭 버튼 활성 표시 갱신
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('tab-active'));
      if (btnEl) {
        btnEl.classList.add('tab-active');
      } else {
        const fallback = document.querySelector(`.tab[data-room="${room}"]`);
        if (fallback) fallback.classList.add('tab-active');
      }

      const homeEl = document.getElementById('homeContent');
      const iframeEl = document.getElementById('content');

      if (room === 'home') {
        iframeEl.style.display = 'none';
        homeEl.style.display = 'block';
        loadHomeDashboard();
        return;
      }

      homeEl.style.display = 'none';
      iframeEl.style.display = 'block';

      const file = ROOM_FILES[room];
      if (!file) {
        console.error('알 수 없는 방:', room);
        return;
      }

      const params = new URLSearchParams();
      params.set('memberId', memberId);
      params.set('name', name);

      iframeEl.src = `${file}?${params.toString()}`;
    }

    // ============ 홈 대시보드 ============
    //
    // 핵심 구조: "전도 대상자 단계"(대상자가 걸어가는 여정: 친분→만남→상담→동행교사→복음방→
    // 센터인도→센터섬김→센터교사)와 "교사 성장 궤도"(교사 본인의 등급: 교사→활동교사→우수교사→
    // 센터교사)는 서로 다른 개념. 대상자가 "복음방"/"센터인도" 단계에 도달한 이력(전도대상자이력
    // 시트)을 이번 달 열매로 자체 집계해서 보여주되, 교사 등급 승급을 실제로 좌우하는 leadCount/
    // leadGoal(getMyTierStatus_)은 전도부가 별도로 등록하는 공식 "센터인도실적" 시트 기준 그대로
    // 유지한다 — 두 지표는 화면에서는 연결되어 보이지만 데이터상 자동 연동은 하지 않음(정확성 우선).

    async function callApi(payload) {
      const res = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // 목업 성장 궤도의 4단계 — 마지막 "센터교사"는 현재 백엔드 등급 체계(휴교사/교사/활동교사/
    // 우수교사)에 아직 없는 미래 단계라, 항상 잠김(회색)으로만 표시하는 시각적 플레이스홀더임
    // (실제 판정 로직 없음).
    const GROWTH_STEPS = ['교사', '활동교사', '우수교사', '센터교사'];
    // 등급 뱃지 pill 색상(목업 지정색 그대로)
    const TIER_COLORS = {
      '휴교사': '#9ca3af', '교사': '#3b82f6', '활동교사': '#f59e0b', '우수교사': '#f97316', '센터교사': '#ef4444'
    };
    // "복음방" 관련 활동 유형(집계용) — activity-room.html ACTIVITY_OPTIONS 중 이름에 "복음방"이
    // 들어간 것들을 모아서 "이번 달 활동" 카드의 "복음방" 숫자로 씀(정확한 단일 유형이 따로 없어서).
    const GOSPEL_ROOM_TYPES = ['복음방 이전 상담 활동', '복음방 교사 교육'];
    // 백엔드 응답이 stages를 안 내려줄 때의 폴백(전도대상자 8단계, Code.gs TARGET_STAGES와 동일).
    const TARGET_STAGES_FALLBACK = ['친분', '만남', '상담', '동행교사', '복음방', '센터인도', '센터섬김', '센터교사'];
    // 전도 대상자 상세 화면 — 단계별 가이드 문구(정확히 지정된 문구)
    const STAGE_GUIDE = {
      '친분': '자연스러운 관계를 쌓는 시기예요. 공통 관심사를 찾아보세요',
      '만남': '정기적인 만남으로 신뢰를 쌓아가세요. 다음 만남 날짜를 잡아두세요',
      '상담': '마음을 열고 이야기 나눌 수 있는 단계예요. 경청이 중요해요',
      '동행교사': '함께 활동하며 자연스럽게 신앙을 나눠보세요',
      '복음방': '복음방 등록을 권유해보세요. 이 단계가 되면 이번 달 열매에 반영됩니다',
      '센터인도': '센터로 함께 나올 수 있도록 안내해주세요',
      '센터섬김': '센터 안에서 섬기는 자리를 찾도록 도와주세요',
      '센터교사': '교사로 세워지는 단계예요. 축하드려요!'
    };

    let home = {
      loading: true,
      error: '',
      tierStatus: null,   // getMyTierStatus 응답
      monthlyStats: { meet: 0, gospel: 0, feedback: 0 },
      targets: [],         // getTargets rows (history 배열 포함)
      stages: [],           // TARGET_STAGES(백엔드에서 내려줌)
      view: 'dashboard',   // 'dashboard' | 'targets' | 'targetDetail'
      targetsFilter: 'active', // 'active' | 'done' | 'all'
      detailTargetId: null
    };

    async function loadHomeDashboard() {
      home.loading = true; home.error = '';
      renderHome();
      try {
        const [tierRes, actRes, targetRes] = await Promise.all([
          callApi({ action: 'getMyTierStatus', memberId }),
          callApi({ action: 'getMyActivities', memberId }),
          callApi({ action: 'getTargets', memberId })
        ]);
        if (tierRes && !tierRes.error) home.tierStatus = tierRes;
        home.monthlyStats = computeMonthlyStats((actRes && actRes.rows) || []);
        if (targetRes && !targetRes.error) {
          home.targets = targetRes.rows || [];
          home.stages = targetRes.stages || TARGET_STAGES_FALLBACK;
        } else {
          home.stages = TARGET_STAGES_FALLBACK;
        }
      } catch (e) {
        home.error = String(e);
      }
      home.loading = false;
      renderHome();
    }

    async function refreshTargets() {
      const res = await callApi({ action: 'getTargets', memberId });
      if (res && !res.error) { home.targets = res.rows || []; home.stages = res.stages || home.stages; }
    }

    function isThisMonth(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d)) return false;
      const now = new Date();
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }

    function computeMonthlyStats(rows) {
      let meet = 0, gospel = 0, feedback = 0;
      rows.forEach(r => {
        if (!isThisMonth(r.submittedAt)) return;
        (r.activities || []).forEach(t => {
          if (t === '전도 대상자 만남') meet++;
          else if (GOSPEL_ROOM_TYPES.includes(t)) gospel++;
          else if (t === '피드백') feedback++;
        });
      });
      return { meet, gospel, feedback };
    }

    // 이번 달 "열매"(복음방/센터인도 단계 도달) — 전도대상자이력 기준 이번 달 vs 전월 비교.
    // 공식 센터인도실적(전도부 등록)과는 완전히 별개인 자체 집계 지표.
    function computeFruitStats() {
      const now = new Date();
      const thisY = now.getFullYear(), thisM = now.getMonth();
      let lastM = thisM - 1, lastY = thisY;
      if (lastM < 0) { lastM = 11; lastY -= 1; }
      let gospelThis = 0, centerThis = 0, gospelLast = 0, centerLast = 0;
      home.targets.forEach(t => {
        (t.history || []).forEach(h => {
          const d = new Date(h.changedAt);
          if (isNaN(d)) return;
          const y = d.getFullYear(), m = d.getMonth();
          const isThis = (y === thisY && m === thisM);
          const isLast = (y === lastY && m === lastM);
          if (!isThis && !isLast) return;
          if (h.toStage === '복음방') { if (isThis) gospelThis++; else gospelLast++; }
          if (h.toStage === '센터인도') { if (isThis) centerThis++; else centerLast++; }
        });
      });
      return { gospelThis, centerThis, gospelLast, centerLast };
    }

    // D-day 라벨/색상 — D-3 이내(오늘·내일 포함)=주황, 지남=초록, 없음=회색.
    function ddayInfo(dateStr) {
      if (!dateStr) return { label: '', cls: 'badge-ghost' };
      const target = new Date(dateStr + 'T00:00:00');
      if (isNaN(target.getTime())) return { label: '', cls: 'badge-ghost' };
      const today = new Date(); today.setHours(0,0,0,0);
      const diff = Math.round((target - today) / 86400000);
      if (diff === 0) return { label: '오늘', cls: 'badge-warning' };
      if (diff === 1) return { label: '내일', cls: 'badge-warning' };
      if (diff > 1 && diff <= 3) return { label: `D-${diff}`, cls: 'badge-warning' };
      if (diff > 3) return { label: `D-${diff}`, cls: 'badge-ghost' };
      if (diff === -1) return { label: '어제', cls: 'badge-success' };
      return { label: `D+${Math.abs(diff)}`, cls: 'badge-success' };
    }

    function stageIndex(stage) { return home.stages.indexOf(stage); }

    // ============ 오늘 만남 알림 배너 ============

    function meetingBannerHtml() {
      const upcoming = home.targets.filter(t => {
        const dd = ddayInfo(t.nextMeetingDate);

      });
      if (!upcoming.length) return '';
      const first = upcoming[0];
      const when = ddayInfo(first.nextMeetingDate).label;
      const extra = upcoming.length > 1 ? ` 외 ${upcoming.length - 1}명` : '';
      return `
        <div class="px-4 py-2.5 text-sm font-bold flex items-center gap-2" style="background:#fef9c3;color:#854d0e;border-bottom:1px solid #fde68a;">
          🔔 ${esc(when)} ${esc(first.targetName)}님 만남이 있어요${extra}
        </div>`;
    }

    // ============ 성장 궤도 ============

    function growthTrackHtml() {
      const ts = home.tierStatus;
      const tier = ts ? ts.tier : '교사';
      const currentIdx = GROWTH_STEPS.indexOf(tier); // 휴교사면 -1(궤도에 아예 없음)
      const nextIdx = ts && ts.nextTier ? GROWTH_STEPS.indexOf(ts.nextTier) : -1;

      const stepsHtml = GROWTH_STEPS.map((label, i) => {
        let circleCls, icon, labelCls;
        if (i <= currentIdx) { circleCls = 'bg-success text-white'; icon = '✓'; labelCls = 'text-success font-bold'; }
        else if (i === nextIdx) { circleCls = 'bg-info text-white'; icon = '→'; labelCls = 'text-info font-bold'; }
        else { circleCls = 'bg-base-300 text-base-content/30'; icon = ''; labelCls = 'text-base-content/40'; }
        const lineFilled = i < currentIdx || (i === currentIdx && i < GROWTH_STEPS.length - 1);
        return `
          <div class="flex items-center ${i < GROWTH_STEPS.length - 1 ? 'flex-1' : ''}">
            <div class="flex flex-col items-center gap-1">
              <div class="step-circle ${circleCls}">${icon}</div>
              <div class="text-[11px] whitespace-nowrap ${labelCls}">${esc(label)}</div>
            </div>
            ${i < GROWTH_STEPS.length - 1 ? `<div class="h-1 flex-1 mx-1 rounded-full ${lineFilled ? 'bg-success' : 'bg-base-300'}" style="margin-bottom:18px"></div>` : ''}
          </div>
        `;
      }).join('');

      let calloutHtml = '';
      if (ts && ts.nextTier && ts.leadGoal != null) {
        const leadCount = ts.leadCount || 0;
        const remaining = Math.max(0, ts.leadGoal - leadCount);
        const headline = remaining > 0
          ? `${esc(ts.nextTier)}까지 복음방 인도 ${remaining}회 남았어요${remaining <= 1 ? ' · 거의 다 왔어요!' : ''}`
          : `${esc(ts.nextTier)} 승급 조건을 채웠어요! 🎉`;
        calloutHtml = `
          <div class="alert bg-info/10 border border-info/30 mt-4 items-start cursor-pointer" onclick="openGrowthModal()">
            <div class="flex-1">
              <div class="font-bold text-info text-sm">${headline}</div>
              <div class="text-xs text-base-content/50 mt-0.5">최근 6개월 센터 인도 ${leadCount}회 달성했어요! (목표 ${ts.leadGoal}회)</div>
            </div>
            <span class="text-info">›</span>
          </div>`;
      } else if (ts && !ts.nextTier) {
        calloutHtml = `<div class="alert bg-success/10 border border-success/30 mt-4"><div class="text-sm font-bold text-success">현재 최고 등급(우수교사)입니다 🎉</div></div>`;
      }

      return `
        <div class="p-4">
          <div class="text-sm font-bold text-base-content mb-3">내 성장 궤도</div>
          <div class="flex items-start">${stepsHtml}</div>
          ${calloutHtml}
        </div>
      `;
    }

    function conditionRowHtml(label, count, goal, desc) {
      const done = goal > 0 && count >= goal;
      return `
        <div class="flex items-center gap-3 p-3 rounded-box ${done ? 'bg-success/10' : 'bg-base-200'}">
          <div class="text-xl">${done ? '✅' : '⬜'}</div>

    // ============ 전도 대상자 카드(미리보기/목록 공용) ============

    function hashCode(s) {
      let h = 0;
      for (let i = 0; i < (s || '').length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
      return h;
    }

    function targetStageBarHtml(t) {
      const idx = stageIndex(t.stage);
      return `
        <div class="mt-3 pt-3 border-t border-base-200">
          <div class="text-[10px] text-base-content/40 font-bold mb-1.5">전도 단계</div>
          <div class="flex items-center gap-1 mb-1">
            ${home.stages.map((s, i) => `<div class="h-1.5 flex-1 rounded-full ${i <= idx ? 'bg-success' : 'bg-base-300'}"></div>`).join('')}
          </div>
          <div class="flex items-center justify-between text-[9px] text-base-content/40">
            ${home.stages.map((s, i) => `<span class="${i === idx ? 'font-bold text-success' : ''}">${esc(s)}</span>`).join('')}
          </div>
        </div>
      `;
    }

    function targetCardHtml(t) {
      const dd = ddayInfo(t.nextMeetingDate);
      const initial = (t.targetName || '?').slice(0, 1);
      const avatarColors = ['bg-warning/20 text-warning', 'bg-info/20 text-info', 'bg-accent/20 text-accent', 'bg-secondary/20 text-secondary'];
      const colorCls = avatarColors[Math.abs(hashCode(t.targetId)) % avatarColors.length];

      return `
        <div class="card card-border bg-base-100 shadow-sm mb-2 cursor-pointer active:scale-[0.99] transition" onclick="openTargetDetail('${esc(t.targetId)}')">
          <div class="card-body p-3">

              <div class="w-10 h-10 rounded-full ${colorCls} flex items-center justify-center font-bold shrink-0">${esc(initial)}</div>
              <div class="flex-1 min-w-0">

              <span class="text-base-content/30 text-xs shrink-0">기록 ›</span>

            ${targetStageBarHtml(t)}

          ${home.targets.length > 0 ? `<button class="btn btn-ghost btn-xs w-full mt-1" onclick="openTargetsView()">전체 ${home.targets.length}명 보기 ›</button>` : ''}
        </div>

          <div class="text-2xl font-bold mb-3">${esc(name)}${name.endsWith('님') ? '' : '님'}</div>
          ${tier ? `<span class="badge badge-lg border-none text-white" style="background:${pillColor}">${esc(tier)}</span>` : ''}
        </div>
      `;
    }

    function dashboardViewHtml() {
      if (home.loading) {
        return homeHeaderHtml() + `<div class="text-center py-16 text-sm text-base-content/40"><span class="loading loading-spinner loading-md align-middle mr-2"></span>불러오는 중...</div>`;
      }
      if (home.error) {
        return homeHeaderHtml() + `<div class="p-4"><div class="alert alert-error text-sm">⚠️ ${esc(home.error)}</div></div>`;
      }
      return `
        ${homeHeaderHtml()}
        ${meetingBannerHtml()}
        <div class="py-4 flex flex-col gap-5">
          <div class="card card-border bg-base-100 shadow-sm mx-4">${growthTrackHtml()}</div>
          ${fruitCardHtml()}
          ${monthlyStatsHtml()}
          ${targetsPreviewSectionHtml()}

        <div class="sticky bottom-0 p-3 bg-base-100 border-t border-base-300 mt-2">
          <button class="btn btn-outline btn-block" onclick="openTargetsView()">+ 오늘 활동 기록하기</button>
        </div>
      `;

    function targetsViewHtml() {
      const filter = home.targetsFilter;
      const filtered = home.targets.filter(t => {
        if (filter === 'active') return !t.completed;
        if (filter === 'done') return t.completed;
        return true;
      });
      const activeCount = home.targets.filter(t => !t.completed).length;
      const doneCount = home.targets.filter(t => t.completed).length;

      const filterBtn = (key, label) => `
        <button class="btn btn-sm ${filter === key ? 'btn-primary' : 'btn-outline'}" onclick="setTargetsFilter('${key}')">${label}</button>`;

        <div class="home-hero text-white p-5">

          ${filtered.length === 0

    // ============ 전도 대상자 상세(관리 일지) 화면 ============

    function historyRowHtml(h) {
      return `
        <div class="flex gap-3 pb-3 mb-3 border-b border-base-200 last:border-0 last:pb-0 last:mb-0">
          <div class="text-[11px] text-base-content/40 w-24 shrink-0 leading-tight">${esc(h.changedAt)}</div>
          <div class="flex-1 text-sm">
            ${h.fromStage ? `<span class="text-base-content/40">${esc(h.fromStage)}</span> → ` : ''}<span class="font-bold">${esc(h.toStage)}</span>
            ${h.memo ? `<div class="text-xs text-base-content/50 mt-0.5">${esc(h.memo)}</div>` : ''}
          </div>
        </div>`;
    }

    function targetDetailViewHtml() {
      const t = home.targets.find(x => x.targetId === home.detailTargetId);
      if (!t) {
        return `
          <div class="home-hero text-white p-5">
            <button class="text-white/70 text-sm" onclick="closeTargetDetail()">‹ 전도 대상자</button>
          </div>
          <div class="p-6 text-center text-sm text-base-content/40">대상자를 찾을 수 없습니다.</div>`;
      }
      const idx = stageIndex(t.stage);
      const isLast = idx >= 0 && idx === home.stages.length - 1;
      const nextStage = (!isLast && idx >= 0) ? home.stages[idx + 1] : null;
      const guide = STAGE_GUIDE[t.stage] || '';
      const historyHtml = (t.history && t.history.length)
        ? t.history.map(historyRowHtml).join('')
        : `<div class="text-xs text-base-content/40 text-center py-4">이력이 없습니다.</div>`;

      let actionHtml;
      if (t.completed) {
        actionHtml = `<div class="text-center text-sm text-base-content/40 py-2">✅ 완료된 대상자입니다</div>`;
      } else if (isLast) {
        actionHtml = `<button class="btn btn-success btn-block" onclick="completeTarget()">완료 처리</button>`;
      } else if (nextStage) {
        actionHtml = `<button class="btn btn-primary btn-block" onclick="advanceTargetStage()">다음 단계로 이동 → ${esc(nextStage)}</button>`;
      } else {
        actionHtml = '';
      }

      return `
        <div class="home-hero text-white p-5">
          <button class="text-white/70 text-sm mb-2" onclick="closeTargetDetail()">‹ 전도 대상자</button>
          <div class="text-xl font-bold">${esc(t.targetName)}</div>
          ${t.completed ? `<span class="badge badge-success badge-sm mt-2">완료</span>` : ''}
        </div>
        <div class="p-4 flex flex-col gap-4 pb-8">
          <div class="card bg-base-100 card-border shadow-sm">
            <div class="card-body p-4 items-center text-center">
              <div class="text-xs text-base-content/40 mb-1">현재 단계</div>
              <div class="text-3xl font-black text-primary mb-2">${esc(t.stage)}</div>
              ${targetStageBarHtml(t)}

              <textarea id="detail-memo" rows="3" class="textarea textarea-bordered textarea-sm w-full">${esc(t.memo || '')}</textarea>

              ${historyHtml}

          ${actionHtml}
        </div>

    function renderHome() {
      const root = document.getElementById('homeContent');
      if (home.view === 'targets') root.innerHTML = targetsViewHtml();
      else if (home.view === 'targetDetail') root.innerHTML = targetDetailViewHtml();
      else root.innerHTML = dashboardViewHtml();
    }

    function openTargetsView() {
      home.view = 'targets';
      home.targetsFilter = 'active';
      renderHome();
    }
    function closeTargetsView() {
      home.view = 'dashboard';
      renderHome();
    }
    function setTargetsFilter(key) {
      home.targetsFilter = key;
      renderHome();
    }
    function openTargetDetail(targetId) {
      home.view = 'targetDetail';
      home.detailTargetId = targetId;
      renderHome();
    }
    function closeTargetDetail() {
      home.view = 'targets';
      renderHome();
    }

    async function advanceTargetStage() {
      const t = home.targets.find(x => x.targetId === home.detailTargetId);
      if (!t) return;
      const idx = stageIndex(t.stage);
      const next = home.stages[idx + 1];
      if (!next) return;
      try {
        const res = await callApi({ action: 'updateTarget', memberId, targetId: t.targetId, stage: next });
        if (res && res.error) throw new Error(res.error);
        await refreshTargets();
        renderHome();
      } catch (e) {
        alert('단계 변경 중 오류가 발생했습니다: ' + e.message);
      }
    }

    async function completeTarget() {
      const t = home.targets.find(x => x.targetId === home.detailTargetId);
      if (!t) return;
      try {
        const res = await callApi({ action: 'updateTarget', memberId, targetId: t.targetId, completed: true });
        if (res && res.error) throw new Error(res.error);
        await refreshTargets();
        home.view = 'targets';
        home.targetsFilter = 'done';
        renderHome();
      } catch (e) {
        alert('완료 처리 중 오류가 발생했습니다: ' + e.message);
      }
    }

    async function saveTargetDetailFields() {
      const t = home.targets.find(x => x.targetId === home.detailTargetId);
      if (!t) return;
      const nextMeetingDate = document.getElementById('detail-date').value;
      const memo = document.getElementById('detail-memo').value.trim();
      try {
        const res = await callApi({ action: 'updateTarget', memberId, targetId: t.targetId, nextMeetingDate, memo });
        if (res && res.error) throw new Error(res.error);
        await refreshTargets();
        renderHome();
      } catch (e) {
        alert('저장 중 오류가 발생했습니다: ' + e.message);
      }
    }

    // ============ 새 대상자 추가 모달 ============

    function fillStageSelect() {
      const sel = document.getElementById('tm-stage');
      sel.innerHTML = (home.stages.length ? home.stages : TARGET_STAGES_FALLBACK)
        .map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    }

    function openAddTargetModal() {
      fillStageSelect();
      document.getElementById('tm-name').value = '';
      document.getElementById('tm-stage').value = (home.stages[0] || TARGET_STAGES_FALLBACK[0]);
      document.getElementById('tm-date').value = '';
      document.getElementById('tm-memo').value = '';
      document.getElementById('targetModal').showModal();
    }

    function closeTargetModal() {
      document.getElementById('targetModal').close();
    }

    async function submitAddTarget() {
      const btn = document.getElementById('tm-submit');
      const targetName = document.getElementById('tm-name').value.trim();
      const stage = document.getElementById('tm-stage').value;
      const nextMeetingDate = document.getElementById('tm-date').value;
      const memo = document.getElementById('tm-memo').value.trim();
      if (!targetName) { alert('대상자 이름을 입력해주세요.'); return; }

      btn.disabled = true; btn.textContent = '저장 중...';
      try {
        const res = await callApi({ action: 'addTarget', memberId, name, targetName, stage, nextMeetingDate, memo });
        if (res && res.error) throw new Error(res.error);
        closeTargetModal();
        await refreshTargets();
        renderHome();
      } catch (e) {
        alert('저장 중 오류가 발생했습니다: ' + e.message);
      }
      btn.disabled = false; btn.textContent = '저장';
    }
  </script>
</body>
</html>
