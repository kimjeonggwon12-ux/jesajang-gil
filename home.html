<!DOCTYPE html>
<html lang="ko" data-theme="jesagil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>복음방 교사</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5B4FCF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="복음방 교사">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    /* 제사장의 길 공통 디자인 시스템 테마 (jesagil) — 다른 HTML 파일에도 동일하게 붙여넣어 사용 */
    [data-theme="jesagil"] {
      /* DaisyUI 4.12는 색상 변수를 OKLCH(L% C H)로 받음 — HSL 아님, 주의 */
      /* 2026-09-17: 카카오톡 스타일 리디자인 — 메인 컬러를 #5B4FCF(보라)로 변경(OKLCH 환산값) */
      --p: 51.43% 0.1901 281.61;   /* primary: #5B4FCF */
      --pc: 100% 0 0;
      --s: 66.58% 0.1574 58.32;    /* secondary: amber-600 */
      --sc: 100% 0 0;
      --a: 59.60% 0.1274 163.23;   /* accent: emerald-600 */
      --ac: 100% 0 0;
      --n: 27.95% 0.0368 260.03;   /* neutral: slate-800 */
      --nc: 96.70% 0.0029 264.54;
      --b1: 100% 0 0;              /* base-100: white */
      --b2: 96.70% 0.0029 264.54;  /* base-200: gray-100 */
      --b3: 92.76% 0.0058 264.53;  /* base-300: gray-200 */
      --bc: 27.81% 0.0296 256.85;  /* base-content: gray-800 */
      --in: 68.47% 0.1479 237.32;
      --inc: 100% 0 0;
      /* 2026-09-18: 디자인 시스템 확정 — success/warning/error를 지정 hex로 재계산(OKLCH) */
      --su: 61.67% 0.1191 162.14;   /* success: #2D9B6F */
      --suc: 100% 0 0;
      --wa: 75.76% 0.1525 74.86;    /* warning: #E8A020 */
      --wac: 0% 0 0;
      --er: 59.56% 0.1901 25.05;    /* error: #D94040 */
      --erc: 100% 0 0;
      --rounded-box: 0.75rem;
      --rounded-btn: 0.5rem;
      --rounded-badge: 1rem;
    }
    /* 2026-09-18: 디자인 시스템 확정 — 다른 6개 파일과 동일한 시맨틱 토큰 세트를 home.html에도
       도입(지금까지 home.html만 이 :root 블록이 없어 인라인 hex를 직접 썼음). 기존 인라인 hex는
       스펙값과 이미 동일해서 굳이 대량 치환하지 않고, 앞으로 새로 추가하는 스타일만 이 변수를 씀.
       --color-accent(#FF6B6B, 따뜻한 포인트)는 DaisyUI --a(에메랄드=활동교사 등급 색, 여러 파일에서
       이미 그 의미로 쓰이고 있음)와 별개 — 등급색 의미를 깨지 않기 위해 전역 --a는 안 바꿨다. */
    :root {
      --color-primary: #5B4FCF;
      --color-primary-light: #EDE9FF;
      --color-primary-dark: #3D34A5;
      --color-surface: #FFFFFF;
      --color-card: #FFFFFF;
      --color-bg: #F5F5F5;
      --color-text: #1A1A2E;
      --color-text-sub: #666680;
      --color-border: #E8E8F0;
      --color-success: #2D9B6F;
      --color-warning: #E8A020;
      --color-error: #D94040;
      --color-accent: #FF6B6B;
      --radius-card: 16px;
      --radius-btn: 12px;
      --radius-input: 10px;
      --shadow-card: 0 2px 12px rgba(0,0,0,0.08);
      --height-btn: 52px;
      --height-btn-sm: 44px;
      --height-header: 56px;
      --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px;
    }
    .lucide-i { width:1em; height:1em; display:inline-block; vertical-align:-0.15em; flex-shrink:0; }
    html, body { height: 100%; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: var(--color-bg); }
    /* 브랜드 그라데이션 액센트 바 — navbar 바로 아래, 여러 파일에서 재사용 */
    .brand-accent-bar { height: 3px; background: linear-gradient(90deg, oklch(var(--p)), oklch(var(--s)), oklch(var(--a))); flex-shrink: 0; }
    .brand-avatar { background: linear-gradient(135deg, oklch(var(--p)), oklch(var(--a))); }

    /* 2026-09-17: 카카오톡 스타일 리디자인 — 카드/버튼/입력창/하단 탭바 공통 스타일 */
    .card-border { border-width: 0 !important; border-radius: 16px !important; box-shadow: 0 2px 12px rgba(0,0,0,0.08) !important; }
    .kko-btn-main {
      display: flex; align-items: center; justify-content: center;
      height: 52px; min-height: 52px; border-radius: 12px;
      background: #5B4FCF; color: #fff; font-size: 16px; font-weight: 700;
      border: none; width: 100%;
    }
    .kko-btn-main[disabled] { opacity: .6; }
    .kko-btn-outline {
      display: flex; align-items: center; justify-content: center;
      height: 44px; min-height: 44px; border-radius: 12px;
      background: #fff; color: #5B4FCF; font-size: 14px; font-weight: 700;
      border: 1.5px solid #5B4FCF; width: 100%;
    }
    .kko-form .input, .kko-form .select, .kko-form textarea {
      min-height: 48px; border-radius: 12px;
    }
    .kko-form .input:focus, .kko-form .select:focus, .kko-form textarea:focus {
      border-color: #5B4FCF !important; outline-color: #5B4FCF !important;
    }
    /* 2026-09-18: 하단 탭바 전면 개선 — 아이콘 전용(SVG, 텍스트 없음) + 완전 고정(position:fixed).
       appPanel(flex column, h-screen)의 마지막 flex 자식이었던 걸 fixed로 빼내면서, 남은 flex:1
       콘텐츠(#homeContent/iframe#content)가 그 높이를 그대로 흡수해버리므로 아래에서 padding-bottom:
       72px 로 다시 확보해준다(가려짐 방지). */
    #bottomTabBar {
      display: flex; height: 56px; flex-shrink: 0; background: #fff; border-top: 1px solid #EEEEEE;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #bottomTabBar .tab {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: #AAAAAA; background: transparent !important; border: none !important;
    }
    #bottomTabBar .tab:before, #bottomTabBar .tab:after { display: none !important; }
    #bottomTabBar .tab .tab-icon { display: flex; width: 24px; height: 24px; }
    #bottomTabBar .tab .tab-icon svg { width: 24px; height: 24px; }
    #bottomTabBar .tab.tab-active { color: #5B4FCF; }
    #homeContent, #content { padding-bottom: 72px; }
    /* 2026-09-18: 내 성장 나무 — 현재 등급 pill 은 은은하게 숨쉬듯 pulse */
    @keyframes growthPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
    .growth-pulse { animation: growthPulse 2s ease-in-out infinite; }
    /* Phase 2: 대상자 단계 상승 축하 모달 — 위에서 뚝 떨어지는 효과 */
    @keyframes stageUpDrop {
      0%   { transform: translateY(-140px) scale(0.9); opacity: 0; }
      70%  { transform: translateY(8px) scale(1.02); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .stage-up-drop { animation: stageUpDrop .55s cubic-bezier(.34,1.56,.64,1); }

    /* 2026-09-17: 카카오톡 스타일 3단계 — 마이크로 애니메이션 + PWA 보조 UI (모든 파일 공통 클래스명) */
    @keyframes kkoFadeIn { from { opacity:0; } to { opacity:1; } }
    .kko-fade-in { animation: kkoFadeIn .2s ease; }
    @keyframes kkoCardIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .kko-card-in { animation: kkoCardIn .3s ease; }
    .kko-btn-main, .kko-btn-outline, #bottomTabBar .tab, .coop-req-btn {
      transition: transform .1s ease;
    }
    .kko-btn-main:active, .kko-btn-outline:active, .coop-req-btn:active { transform: scale(0.97); }
    #bottomTabBar .tab.tab-active .tab-icon { animation: kkoTabBounce .2s ease; }
    @keyframes kkoTabBounce { 0% { transform: translateY(0); } 40% { transform: translateY(-4px); } 100% { transform: translateY(0); } }
    @keyframes kkoShimmer { 0% { background-position:-200px 0; } 100% { background-position:200px 0; } }
    .kko-skeleton { background:linear-gradient(90deg,#EEEEEE 25%,#F5F5F5 37%,#EEEEEE 63%); background-size:400px 100%; animation:kkoShimmer 1.4s ease infinite; border-radius:8px; }
    .kko-spinner { width:36px; height:36px; border-radius:50%; border:3px solid #EDE9FF; border-top-color:#5B4FCF; animation:kkoSpin .7s linear infinite; display:inline-block; }
    @keyframes kkoSpin { to { transform:rotate(360deg); } }
    #kkoInstallToast {
      position:fixed; left:16px; right:16px; z-index:60;
      bottom:calc(72px + env(safe-area-inset-bottom, 0px));
      background:#222222; color:#fff; border-radius:12px; padding:12px 14px;
      font-size:12px; line-height:1.5; box-shadow:0 4px 16px rgba(0,0,0,0.25);
      animation: kkoCardIn .3s ease;
    }
  </style>
</head>
<body>
  <!--
    ⚠️ 임시(당분간만): 편의를 위해 입장(성도고유번호+이름) 화면을 비활성화했습니다.
    운영 복귀 시 → 아래 loginPanel 의 style="display:none" 를 지우고,
    <script> 하단의 DOMContentLoaded 리스너 한 줄을 지우면 됩니다.
    (startSession() 로그인 코드는 복구용으로 그대로 보존)
  -->
  <div class="hero min-h-screen" id="loginPanel" style="display:none">
    <div class="hero-content text-center">
      <div class="card w-full max-w-sm bg-base-100 shadow-xl">
        <div class="card-body items-center">
          <div class="w-16 h-16 rounded-full brand-avatar flex items-center justify-center text-3xl shadow-md mb-1">🙏</div>
          <h2 class="card-title text-2xl">복음방 교사</h2>
          <p class="text-xs text-base-content/50 -mt-1 mb-2">성도 고유번호와 이름으로 입장하세요</p>
          <div class="w-full flex flex-col gap-2 mt-2">
            <input type="text" id="memberId" placeholder="성도고유번호" class="input input-bordered w-full" />
            <input type="text" id="name" placeholder="이름" class="input input-bordered w-full" />
          </div>
          <button onclick="startSession()" class="kko-btn-main mt-4">입장</button>
        </div>
      </div>
    </div>
  </div>

  <!--
    2026-09-14: 홈+활동방 통합 개편 — 기존 상단 헤더(복음방 교사 · 교사 훈련 플랫폼 브랜드바)를
    완전히 제거하고, 세로 폭이 기존의 약 2/3인 얇은 인사말 바로 교체했습니다. "홈" 탭은 별도로
    없고, 이 인사말 바 아래 탭 이름 자체가 "활동방"이며 그 안에 옛 홈 대시보드+활동방 등록 화면이
    하나로 합쳐져 있습니다(activity-room.html은 이제 이 화면으로 리다이렉트만 함).
    2026-09-17: 카카오톡 스타일 리디자인 — 위 인사말 바 위에 얇은 퍼플 앱 헤더를 다시 추가하고,
    상단 tabs-boxed 탭바는 제거해 하단 고정 탭바(⚙️ 설정 포함)로 옮겼습니다.
  -->
  <div id="appPanel" class="flex flex-col h-screen" style="display:none">
    <header class="flex items-center justify-between px-4 flex-shrink-0" style="height:56px;background:#5B4FCF">
      <div class="text-white font-bold text-base">복음방 교사</div>
      <div class="flex items-center gap-4 text-white">
        <svg class="lucide-i" style="width:20px;height:20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" title="알림"><path d="M10.268 21a2 2 0 0 0 3.464 0" /><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" /></svg>
        <svg class="lucide-i" style="width:20px;height:20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" title="내 프로필"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
      </div>
    </header>
    <div class="px-4 flex-shrink-0" style="padding-top:16px;padding-bottom:16px;background:#fff">
      <div style="font-size:20px;font-weight:700;color:#333333">안녕하세요, <span id="greetName">-</span> 교사님</div>
    </div>
    <div id="homeContent" class="flex-1 w-full overflow-y-auto" style="display:none;background:#F5F5F5"></div>
    <iframe id="content" class="flex-1 w-full border-0" style="display:none"></iframe>
    <nav id="bottomTabBar">
      <button role="tab" class="tab tab-active" data-room="activity" onclick="switchTab('activity', this)" title="활동방">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></span>
      </button>
      <button role="tab" class="tab" data-room="feedback" onclick="switchTab('feedback', this)" title="피드백방">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 4v7H5.17l-.59.59-.58.58V4h11m1-2H4c-.55 0-1 .45-1 1v14l4-4h9c.55 0 1-.45 1-1V3c0-.55-.45-1-1-1zm4 4h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1z"/></svg></span>
      </button>
      <button role="tab" class="tab" data-room="study" onclick="switchTab('study', this)" title="공부방">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/></svg></span>
      </button>
      <button role="tab" class="tab" data-room="coach" onclick="onCoachTabClick(this)" title="교관">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="currentColor">
          <g transform="translate(0,0) scale(0.6)"><path d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></g>
          <g transform="translate(9,9) scale(0.6)"><path d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></g>
        </svg></span>
      </button>
    </nav>
  </div>

  <!-- 2026-09-17: iOS/안드로이드 홈화면 추가 안내 토스트 (localStorage로 최초 1회만) -->
  <div id="kkoInstallToast" style="display:none">
    <span id="kkoInstallToastText"></span>
  </div>

  <!-- 내 성장 박스 클릭 시 뜨는 승급 조건 상세 모달 -->
  <dialog id="growthModal" class="modal">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-3">다음 등급 승급 조건</h3>
      <div id="growthModalBody"></div>
      <div class="modal-action">
        <button class="btn btn-ghost" onclick="closeGrowthModal()">닫기</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>닫기</button></form>
  </dialog>

  <!-- Phase 2: 대상자 단계 상승 축하 모달 -->
  <dialog id="stageUpModal" class="modal">
    <div class="modal-box stage-up-drop text-center">
      <div id="stageUpEmoji" style="font-size:56px;line-height:1">🎉</div>
      <div id="stageUpMainText" class="text-lg font-bold mt-2"></div>
      <div id="stageUpBonusText" class="text-sm font-bold text-primary mt-1"></div>
      <div class="modal-action justify-center">
        <button class="btn btn-primary btn-sm" onclick="closeStageUpModal()">확인</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>닫기</button></form>
  </dialog>

  <!-- Phase 2: 격려 메시지 전체 보기 모달 -->
  <dialog id="encourageBannerModal" class="modal">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-3">💌 받은 격려 메시지</h3>
      <div id="encourageBannerBody" class="flex flex-col gap-3"></div>
      <div class="modal-action">
        <button class="btn btn-primary btn-sm" onclick="closeEncourageBannerModal()">확인했어요</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>닫기</button></form>
  </dialog>

  <script>
    // 각 방 파일명(피드백방/공부방은 여전히 iframe) — 활동방은 이제 native(#homeContent)라 목록에 없음.
    const ROOM_FILES = {
      study: 'study-room.html',
      feedback: 'feedback-room.html',
      coach: 'coach-dashboard.html'
    };
    const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

    // activity-room.html 등 다른 방 파일과 동일한 패턴 — 관리자 테스트링크(?memberId=&name=)로
    // 특정 교사 계정으로 미리보기 가능(예: home.html?memberId=0020113000010&name=김정권).
    const urlParams = new URLSearchParams(window.location.search);
    const paramMemberId = urlParams.get('memberId');
    const paramName = urlParams.get('name');
    if (paramMemberId && paramName) {
      window.TEST_MEMBER_ID = paramMemberId;
      window.TEST_NAME = paramName;
    }

    let memberId = '';
    let name = '';

    // ⚠️ 임시(당분간만): 로그인 없이 바로 입장. 운영 복귀 시 이 리스너 한 줄만 제거.
    function enterWithoutLogin() {
      memberId = window.TEST_MEMBER_ID || 'TEST-0001';
      name = window.TEST_NAME || '테스트사용자';
      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('appPanel').style.display = 'flex';
      document.getElementById('greetName').textContent = name;
      switchTab('activity', document.querySelector('.tab[data-room="activity"]'));
      showInstallToastIfNeeded();
    }

    // 2026-09-17: iOS/안드로이드 홈화면 추가 안내 — localStorage 키로 최초 1회만, 3초 후 자동 소멸.
    function showInstallToastIfNeeded() {
      try {
        if (localStorage.getItem('kko_install_toast_shown')) return;
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const guide = isIOS ? '사파리: 공유 버튼 → 홈 화면에 추가' : '브라우저 메뉴 → 홈 화면에 추가';
        const el = document.getElementById('kkoInstallToast');
        const textEl = document.getElementById('kkoInstallToastText');
        if (!el || !textEl) return;
        textEl.textContent = `홈 화면에 추가하면 앱처럼 사용할 수 있어요! (${guide})`;
        el.style.display = 'block';
        localStorage.setItem('kko_install_toast_shown', '1');
        setTimeout(() => { el.style.display = 'none'; }, 3000);
      } catch (e) {}
    }

    // 2026-09-17: PWA service worker 등록(오프라인 기본화면 캐시).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
    // 옛 "🏠 홈" 버튼 자리를 대체(현재는 아무 곳에서도 호출하지 않지만, 외부 링크 호환을 위해 보존).
    function goHome() {
      switchTab('activity', document.querySelector('.tab[data-room="activity"]'));
    }
    window.addEventListener('DOMContentLoaded', enterWithoutLogin);

    function startSession() {
      memberId = document.getElementById('memberId').value.trim();
      name = document.getElementById('name').value.trim();

      if (!memberId || !name) {
        alert('성도고유번호와 이름을 입력해주세요.');
        return;
      }

      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('appPanel').style.display = 'flex';
      document.getElementById('greetName').textContent = name;

      switchTab('activity', document.querySelector('.tab[data-room="activity"]'));
    }

    function switchTab(room, btnEl, extraParams) {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('tab-active'));
      if (btnEl) {
        btnEl.classList.add('tab-active');
      } else {
        const fallback = document.querySelector(`.tab[data-room="${room}"]`);
        if (fallback) fallback.classList.add('tab-active');
      }

      const homeEl = document.getElementById('homeContent');
      const iframeEl = document.getElementById('content');

      // 2026-09-17: 탭 전환 페이드인 — 매번 클래스 제거 후 리플로우해서 재트리거.
      const retriggerFade = (el) => { el.classList.remove('kko-fade-in'); void el.offsetWidth; el.classList.add('kko-fade-in'); };

      if (room === 'activity') {
        iframeEl.style.display = 'none';
        homeEl.style.display = 'block';
        retriggerFade(homeEl);
        loadHomeDashboard();
        return;
      }

      homeEl.style.display = 'none';
      iframeEl.style.display = 'block';
      retriggerFade(iframeEl);

      const file = ROOM_FILES[room];
      if (!file) {
        console.error('알 수 없는 방:', room);
        return;
      }

      const params = extraParams || new URLSearchParams();
      if (!params.has('memberId')) params.set('memberId', memberId);
      if (!params.has('name')) params.set('name', name);

      iframeEl.src = `${file}?${params.toString()}`;
    }

    // 2026-09-18: 하단 탭바 "교관" 진입 게이트 — 교관명단(coach 시트)에 등록된 고유번호만
    // coach-dashboard.html 로 이동, 아니면 안내 메시지만 띄우고 탭 전환 안 함. 결과는
    // home.coachAccess(null=미확인/true/false)에 캐시해 재클릭 시 재조회하지 않는다.
    async function onCoachTabClick(btnEl) {
      if (home.coachAccess === false) {
        alert('교관으로 등록된 사용자만 접근할 수 있습니다');
        return;
      }
      if (home.coachAccess === true) {
        switchTab('coach', btnEl);
        return;
      }
      try {
        const res = await callApi({ action: 'getMyCoach', memberId });
        home.coachAccess = !!(res && res.isCoach);
      } catch (e) {
        home.coachAccess = false;
      }
      if (home.coachAccess) {
        switchTab('coach', btnEl);
      } else {
        alert('교관으로 등록된 사용자만 접근할 수 있습니다');
      }
    }

    // ============ 활동방(홈+활동방 통합) ============

    async function callApi(payload) {
      const res = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      // 2026-09-16: Apps Script가 간헐적으로 JSON 대신 HTML(구글 로그인/오류 페이지 등)을
      // 반환하는 경우가 있어(GitHub Pages에서 열 때 신고됨) — 그대로 res.json()을 부르면
      // "Unexpected token '<'..." 같은 알아보기 힘든 파싱 에러가 던져지므로, Content-Type을
      // 먼저 확인해서 사람이 읽는 메시지로 통일한다. 호출부는 기존 try/catch(e.message 표시)를
      // 그대로 쓰면 되므로 이 함수만 고치면 됨.
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) {
        throw new Error('서버 연결 오류. 잠시 후 다시 시도해주세요.');
      }
      return await res.json();
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    // 2026-09-18: 디자인 시스템 확정 — 이모지 아이콘 일부를 Lucide SVG로 교체(반복 사용되는 것만 상수화).
    const ICON_BOT = '<svg class="lucide-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8" /><rect width="16" height="12" x="4" y="8" rx="2" /><path d="M2 14h2" /><path d="M20 14h2" /><path d="M15 13v2" /><path d="M9 13v2" /></svg>';
    const ICON_HANDSHAKE = '<svg class="lucide-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17 2 2a1 1 0 1 0 3-3" /><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4" /><path d="m21 3 1 11h-2" /><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3" /><path d="M3 4h8" /></svg>';
    function todayStr() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    }
    // 이름 가운데 글자 마스킹(화면 표시 전용, 서버에는 항상 원본이 저장됨) — "홍길동"→"홍*동".
    function maskName(nm) {
      const s = String(nm || '').trim();
      if (s.length <= 1) return s;
      if (s.length === 2) return s[0] + '*';
      return s[0] + '*'.repeat(s.length - 2) + s[s.length - 1];
    }
    // 2026-09-15: "이번 달"→"올해"로 집계 기간 변경(사용자 요청 — 나중에 승급심사 주기(6개월/1년)
    // 확정되면 그 기준으로 바꿀 것, 지금은 달력 연도 기준).
    function isThisYear(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d)) return false;
      return d.getFullYear() === new Date().getFullYear();
    }

    // 교사 구분 4단계 표시(2026-09-15: "센터교사"는 실존하지 않는 단계라 삭제, 전부 실제 TEACHER_TIERS).
    const GROWTH_STAGES = ['휴교사', '교사', '활동교사', '우수교사'];

    // 활동 기록 Step2/3 — Code.gs ROLE_OPTIONS/ROLE_ACTIVITY_OPTIONS 와 동일(둘 다 바뀌면 같이 고칠 것).
    // 2026-09-15: 3역할(인도자/섬김이/교사) → 4역할로 확장, 순서도 인도자/교사/섬김이/협력교사로 변경.
    // 협력교사 = 순수 협력자로서 돕는 역할, 교사와 동일하게 11종 전부(동행교사 포함) 사용.
    const ROLE_OPTIONS = ['인도자', '교사', '섬김이', '협력교사'];
    const ROLE_ACTIVITY_OPTIONS = ['피드백', '섭외', '친분', '만남1', '만남2', '상담1', '상담2', '복음방', '센터소개', '센터수강'];
    const TEACHER_EXTRA_ACTIVITY = '동행교사';
    // '동행교사' 추가 항목을 받는 역할(Code.gs ROLES_WITH_EXTRA_ACTIVITY와 동일).
    const ROLES_WITH_EXTRA_ACTIVITY = ['교사', '협력교사'];
    // 2026-09-15: 사용자 요청 — "협력교사"는 UI 라벨(칩/타일 등)에는 짧게 "협력"으로만 표기.
    // 2026-09-18: 4역할 전체를 "인도/교사/섬김/협력"로 축약(사용자 요청) — 내부 값(체크박스
    // value, 백엔드로 보내는/받는 role 문자열, roleCounts·roleItemCounts 조회 키)은 항상
    // '인도자'/'교사'/'섬김이'/'협력교사' 그대로 유지, 화면 표시(esc(roleShortLabel(...)))에만 적용.
    const ROLE_SHORT_LABEL = { '인도자': '인도', '교사': '교사', '섬김이': '섬김', '협력교사': '협력' };
    function roleShortLabel(role) { return ROLE_SHORT_LABEL[role] || role; }
    // 상담1/상담2/복음방 선택 시 추가 입력하는 반응(Code.gs REACTION_OPTIONS와 동일).
    const REACTION_OPTIONS = ['긍정적', '중립', '부정적'];
    // 2026-09-15: 협력 교사 찾기 — Code.gs COOP_REQUEST_TYPES와 문구가 같아야 함.
    const COOP_REQUEST_TYPES = ['섬김이 동행', '상담 협력', '복음방 보조', '기타'];
    const GENDER_OPTIONS = ['남', '여'];
    // 2026-09-15: "60대이상" 뭉뚱그림 → 60대/70대이상 분리(장년회/자문회 자동 배정에 필요, ageGenderToOrg 참고).
    const AGE_GROUP_OPTIONS = ['10대', '20대', '30대', '40대', '50대', '60대', '70대이상'];
    // 백엔드 응답이 stages를 안 내려줄 때의 폴백(전도대상자 9단계, Code.gs TARGET_STAGES와 동일).
    const TARGET_STAGES_FALLBACK = ['섭외', '친분', '만남1', '만남2', '상담1', '상담2', '복음방', '센터소개', '센터수강'];
    // Step3 활동 항목 → Step4 "현재 단계" 자동 매핑(스테이지형 항목만; 피드백/동행교사는 매핑 없음).
    const ACTIVITY_TO_STAGE = {
      '섭외': '섭외', '친분': '친분', '만남1': '만남1', '만남2': '만남2',
      '상담1': '상담1', '상담2': '상담2', '복음방': '복음방', '센터소개': '센터소개', '센터수강': '센터수강'
    };
    // "AI코칭 바로가기" — 대상자 단계를 feedback-room.html "내 수강생 코칭"의 하츠 진행 단계(STAGE_OPTIONS)로 변환.
    const HEARTS_STAGE_MAP = {
      '섭외': '친분', '친분': '친분', '만남1': '만남', '만남2': '만남',
      '상담1': '상담', '상담2': '상담', '복음방': '스터디', '센터소개': '아카데미 소개', '센터수강': '수강생'
    };
    // Phase 2(2026-09-15): "관계 온도계" — 대상자 현재 단계에 따라 차갑게→매우 뜨겁게 색상 단계 부여.
    // 대상자 일지 카드 배경 + 대상자 막대 그래프(renderTargetsChart)에 공용으로 사용.
    // TARGET_STAGES_FALLBACK/home.stages와 이름이 같이 바뀌면 이 맵도 같이 고칠 것.
    const STAGE_TEMP = {
      '섭외':   { bg: '#EFF6FF', border: '#BFDBFE', text: '#1D4ED8', color: '#3B82F6', label: '차갑게' },
      '친분':   { bg: '#EFF6FF', border: '#BFDBFE', text: '#1D4ED8', color: '#3B82F6', label: '차갑게' },
      '만남1':  { bg: '#F0F9FF', border: '#BAE6FD', text: '#0369A1', color: '#0EA5E9', label: '시원하게' },
      '만남2':  { bg: '#F0F9FF', border: '#BAE6FD', text: '#0369A1', color: '#0EA5E9', label: '시원하게' },
      '상담1':  { bg: '#FFF7ED', border: '#FED7AA', text: '#C2410C', color: '#F97316', label: '따뜻하게' },
      '상담2':  { bg: '#FFF7ED', border: '#FED7AA', text: '#C2410C', color: '#F97316', label: '따뜻하게' },
      '복음방': { bg: '#FEF2F2', border: '#FECACA', text: '#B91C1C', color: '#EF4444', label: '뜨겁게' },
      '센터소개': { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', color: '#DC2626', label: '매우 뜨겁게' },
      '센터수강': { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', color: '#DC2626', label: '매우 뜨겁게' }
    };
    const STAGE_TEMP_DEFAULT = { bg: '#F9FAFB', border: '#E5E7EB', text: '#6B7280', color: '#9CA3AF', label: '-' };
    function stageTemp(stage) { return STAGE_TEMP[stage] || STAGE_TEMP_DEFAULT; }

    // 2026-09-15: 대상자 연령대×성별 → 부서(자문회/장년회/부녀회/청년회) 자동 배정.
    // 사용자 확정 규칙: 70대이상=자문회(공통) / 40~60대=남 장년회·여 부녀회 / 10~30대=청년회(공통).
    // feedback-room.html TARGET_OPTIONS(자문/장년/부녀/청년)에 그대로 대응.
    function ageGenderToOrg(ageGroup, gender) {
      if (ageGroup === '70대이상') return '자문';
      if (['40대', '50대', '60대'].includes(ageGroup)) return gender === '여' ? '부녀' : '장년';
      if (['10대', '20대', '30대'].includes(ageGroup)) return '청년';
      return '';
    }

    let home = {
      loading: true,
      error: '',
      tierStatus: null,        // getMyTierStatus 응답
      monthlyActRes: null,     // getMyActivities 응답 { rows, roleCounts, roleItemCounts }
      gospelLeads: [],         // getMyGospelLeads rows(읽기 전용, 전도부 입력)
      centerLeads: [],         // getMyCenterLeads rows(읽기 전용, 전도부 입력)
      targets: [],             // getMyTargets rows
      stages: TARGET_STAGES_FALLBACK,
      encouragements: [],      // getMyEncouragements rows(읽지 않은 격려 메시지만, 최신순)
      expandedRolePart: null,  // '인도자'|'교사'|'섬김이'|'협력교사'|null — 이번 달 활동 "항목별 건수 펼쳐보기"
      view: 'dashboard',       // 'dashboard' | 'targetDetail'
      detailTargetId: null,
      detailJournal: null,     // getTargetJournal 응답
      detailLoading: false,
      // 2026-09-15: 활동 기록 목록(접이식) + 항목별 AI 피드백
      historyOpen: false,      // "내 활동 기록" 펼침 여부(기본 접힘)
      aiFeedback: {},          // 활동 행 키 -> { loading, text }
      coachReplyNotif: [],     // 2026-09-18: 아직 안 본 교관 답변 완료 배너용 (getHistory 필터 결과)
      coachAccess: null,       // 2026-09-18: 하단 "교관" 탭 진입 가능 여부 캐시 — null=미확인, true/false=getMyCoach 결과
      // 2026-09-15: 협력 교사 찾기 (2026-09-19: 바쁨정도 선언→프로필 등록 기반으로 개편)
      coop: {

        list: null,            // searchTeachers 응답 { myRegion, rows, total }
        listLoading: false,
        requests: null,        // getMyCoopRequests 응답 { incoming, outgoing }
        modalTarget: null,     // 협력 요청 팝업 대상 { memberId, name }
        modalType: '섬김이 동행', modalMemo: '', modalSending: false,
        inboxOpen: false,      // 받은 요청 상세 보기
        responding: {}         // requestId -> true
      },
      form: {
        date: todayStr(),
        roles: [],
        activityItem: '',
        targetName: '', targetGender: '', targetAgeGroup: '', targetStage: '',
        // 2026-09-15: "특이사항" 입력란 제거(사용자 요청) — 오늘 한 일/다음 할 일 2개만 받는다.
        // 시트의 "특이사항" 컬럼은 기존 데이터 보존을 위해 그대로 두고 새 입력만 빈값으로 저장.
        todayWork: '', nextWork: '',
        // 2026-09-15: 상담1/상담2/복음방 선택 시에만 쓰는 추가 입력(상담제목 또는 복음방과목 겸용 + 반응).
        extraTitle: '', reaction: '', reactionNote: '',
        loading: false
      }
    };

    async function loadHomeDashboard() {
      home.loading = true; home.error = '';
      renderHome();
      try {
        const [tierRes, actRes, gospelRes, centerRes, targetRes, encRes] = await Promise.all([
          callApi({ action: 'getMyTierStatus', memberId }),
          callApi({ action: 'getMyActivities', memberId }),
          callApi({ action: 'getMyGospelLeads', memberId }),
          callApi({ action: 'getMyCenterLeads', memberId }),
          callApi({ action: 'getMyTargets', memberId }),
          callApi({ action: 'getMyEncouragements', memberId })
        ]);
        if (tierRes && !tierRes.error) home.tierStatus = tierRes;
        home.monthlyActRes = (actRes && !actRes.error) ? actRes : { rows: [], roleCounts: {}, roleItemCounts: {} };
        home.gospelLeads = (gospelRes && gospelRes.rows) || [];
        home.centerLeads = (centerRes && centerRes.rows) || [];
        home.encouragements = (encRes && encRes.rows) || [];
        if (targetRes && !targetRes.error) {
          home.targets = targetRes.rows || [];
          home.stages = targetRes.stages || TARGET_STAGES_FALLBACK;
        } else {
          home.stages = TARGET_STAGES_FALLBACK;
        }
      } catch (e) {
        home.error = String(e);
      }
      home.loading = false;
      renderHome();
      // 협력 요청 수신 배너용 — 메인 로드를 막지 않도록 뒤이어 별도로(실패해도 조용히 무시).
      loadCoopRequests();
      // 2026-09-18: 교관 답변 완료 알림 배너용 — 마찬가지로 메인 로드를 막지 않음.
      loadCoachReplyNotif();
    }

    async function loadCoopRequests() {
      try {
        const res = await callApi({ action: 'getMyCoopRequests', memberId });
        if (res && !res.error) { home.coop.requests = res; renderHome(); }
      } catch (e) { /* 배너는 부가 기능 — 실패해도 대시보드 동작에 영향 없음 */ }
    }

    // 2026-09-18: 교관이 "교관에게 요청"/"AI 코칭 후 교관님께 전달" 건에 답변을 달면
    // 피드백방에 직접 들어가지 않아도 홈에서 바로 보이는 배너. feedback-room.html "내 피드백
    // 이력" 탭과 동일한 getHistory 액션을 재사용(같은 시트, 같은 source 값 2종).
    function _coachReplySeenKey_() { return `kko_seen_coach_replies_${memberId}`; }
    function _coachReplySeenSet_() {
      try { return new Set(JSON.parse(localStorage.getItem(_coachReplySeenKey_()) || '[]')); }
      catch (e) { return new Set(); }
    }
    async function loadCoachReplyNotif() {
      try {
        const res = await callApi({ action: 'getHistory', memberId });
        const rows = (res && !res.error && res.rows) || [];
        const seen = _coachReplySeenSet_();
        home.coachReplyNotif = rows.filter(r =>
          (r.source === '교관요청' || r.source === '사람에스컬레이션') &&
          r.status === '완료' && r.handlerAnswer && !seen.has(r.receiptNo)
        );
        renderHome();
      } catch (e) { /* 배너는 부가 기능 — 실패해도 대시보드 동작에 영향 없음 */ }
    }
    function openCoachReplyBanner() {
      try {
        const seen = _coachReplySeenSet_();
        home.coachReplyNotif.forEach(r => seen.add(r.receiptNo));
        localStorage.setItem(_coachReplySeenKey_(), JSON.stringify([...seen]));
      } catch (e) {}
      home.coachReplyNotif = [];
      switchTab('feedback', document.querySelector('.tab[data-room="feedback"]'), new URLSearchParams({ tab: 'history' }));
    }
    function coachReplyBannerHtml() {
      const rows = home.coachReplyNotif || [];
      if (!rows.length) return '';
      return `
        <div class="mx-4">
          <div id="coach-reply-banner" onclick="openCoachReplyBanner()" class="rounded-box px-3 py-2.5 flex items-center gap-2 cursor-pointer" style="background:linear-gradient(90deg,#EDE9FF,#E0D9FF);border:1px solid #C4B5FD">
            <span style="font-size:20px">💬</span>
            <div class="flex-1 text-xs font-bold truncate" style="color:#4C1D95">교관님이 ${rows.length}건에 답변하셨습니다</div>
            <span class="text-[10px] shrink-0" style="color:#5B4FCF">확인하기 →</span>
          </div>
        </div>`;
    }

    async function refreshAfterSubmit() {
      const [tierRes, actRes, targetRes] = await Promise.all([
        callApi({ action: 'getMyTierStatus', memberId }),
        callApi({ action: 'getMyActivities', memberId }),
        callApi({ action: 'getMyTargets', memberId })
      ]);
      if (tierRes && !tierRes.error) home.tierStatus = tierRes;
      if (actRes && !actRes.error) home.monthlyActRes = actRes;
      if (targetRes && !targetRes.error) { home.targets = targetRes.rows || []; home.stages = targetRes.stages || home.stages; }
    }

    function stageIndex(stage) { return home.stages.indexOf(stage); }

    // ============ B. 내 성장 (5단계, 화살표 없음 — 클릭 시 승급 조건 모달) ============

    function conditionRowHtml(label, count, goal, desc) {
      const done = goal > 0 && count >= goal;
      return `
        <div class="flex items-center gap-3 p-3 rounded-box ${done ? 'bg-success/10' : 'bg-base-200'}">
          <div class="text-xl">${done ? '✅' : '⬜'}</div>
          <div class="flex-1">
            <div class="text-sm font-bold">${esc(label)}</div>
            <div class="text-xs text-base-content/50">${esc(desc)}</div>
          </div>
          <div class="text-sm font-black ${done ? 'text-success' : 'text-base-content/60'}">${count}/${goal}${done ? ' 달성!' : ''}</div>
        </div>`;
    }

    function openGrowthModal() {
      const ts = home.tierStatus;
      const body = document.getElementById('growthModalBody');
      if (!ts || !ts.nextTier) {
        body.innerHTML = `<div class="text-sm text-base-content/60">축하드려요! 이미 최고 등급이에요 🎉</div>`;
        document.getElementById('growthModal').showModal();
        return;
      }
      const rows = [];
      if (ts.leadGoal != null) {
        rows.push(conditionRowHtml('복음방 · 센터 인도', ts.leadCount || 0, ts.leadGoal, `최근 6개월 ${ts.leadGoal}회 이상`));
      }
      if (ts.monthlyGoal != null) {
        rows.push(conditionRowHtml('이번 달 활동', ts.monthlyCount || 0, ts.monthlyGoal, `이번 달 ${ts.monthlyGoal}회 이상`));
      }
      body.innerHTML = `
        <div class="text-sm text-base-content/60 mb-3">${esc(ts.nextTier)} 승급까지 필요한 조건이에요. 하나씩 달성해봐요!</div>
        <div class="flex flex-col gap-2">${rows.join('') || '<div class="text-xs text-base-content/40">조건 정보가 없습니다.</div>'}</div>
      `;
      document.getElementById('growthModal').showModal();
    }
    function closeGrowthModal() {
      document.getElementById('growthModal').close();
    }

    // 2026-09-18: 사용자 피드백 2차 — 활성/비활성 2단계 대비만으로는 부족, 4단계(현재/다음목표/
    // 지나온 등급/아직 먼 등급)로 세분화. 각 단계별 색상·테두리·아이콘·캡션이 전부 다르다.
    function growthStagesHtml() {
      const ts = home.tierStatus;
      const current = ts ? ts.tier : '';
      const curIdx = GROWTH_STAGES.indexOf(current);

      const pills = GROWTH_STAGES.map((s, i) => {
        let style, icon = '', cls = '';
        if (i === curIdx) {
          style = 'background:#5B4FCF;color:#fff;border:none;box-shadow:0 4px 12px rgba(91,79,207,0.4);transform:scale(1.05)';
          cls = ' growth-pulse';
        } else if (i === curIdx + 1) {
          style = 'background:#EDE9FF;color:#5B4FCF;border:1px dashed #5B4FCF';
        } else if (curIdx >= 0 && i < curIdx) {
          style = 'background:#F0F0F0;color:#AAAAAA;border:none';
          icon = '✓ ';
        } else {
          style = 'background:#fff;color:#CCCCCC;border:1px solid #EEEEEE';
          icon = '🔒 ';
        }
        return `<div class="flex-1 flex items-center justify-center text-[11px] font-bold${cls}" style="height:44px;border-radius:22px;${style}">${icon}${esc(s)}</div>`;
      }).join('');
      const captionRow = GROWTH_STAGES.map((s, i) => {
        let text = '', color = '#5B4FCF';
        if (i === curIdx) { text = '📍 현재 나의 위치'; }
        else if (i === curIdx + 1) { text = '다음 목표'; color = 'rgba(91,79,207,0.55)'; }
        return `<div class="flex-1 text-center text-[10px] font-bold" style="color:${color}">${text}</div>`;
      }).join('');

      // 승급(또는 휴교사 복귀) 조건 한 줄 — 다음 등급이 센터인도 기준이면 leadGoal, 휴교사→교사
      // 복귀처럼 활동건수 기준이면 monthlyGoal을 씀(getMyTierStatus_ 응답 필드 그대로 재사용).
      let goalLine = '';
      if (ts && ts.nextTier) {
        if (ts.leadGoal != null) {
          const remaining = Math.max(0, ts.leadGoal - (ts.leadCount || 0));
          goalLine = remaining > 0 ? `센터 인도 ${remaining}명 더하면 ${ts.nextTier}!` : `${ts.nextTier} 승급 조건을 채웠어요! 🎉`;
        } else if (ts.monthlyGoal != null) {
          const remaining = Math.max(0, ts.monthlyGoal - (ts.monthlyCount || 0));
          goalLine = remaining > 0 ? `이번 달 활동 ${remaining}건 더하면 ${ts.nextTier}!` : `${ts.nextTier} 복귀 조건을 채웠어요! 🎉`;
        }
      } else if (ts && !ts.nextTier) {
        goalLine = '현재 최고 등급이에요! 🎉';
      }
      const calloutHtml = goalLine
        ? `<div class="mt-3 text-center font-bold" style="color:#5B4FCF;font-size:12px">${esc(goalLine)}</div>`
        : '';

      // Phase 2: 내 등급이 활동교사 이상이면 작은 MVP 후보 배지 표시(사용자 요청).
      const isMvpCandidate = current && curIdx >= GROWTH_STAGES.indexOf('활동교사');

      return `
        <div class="card card-border bg-base-100 shadow-sm mx-4">
          <div class="card-body p-5 cursor-pointer" onclick="openGrowthModal()">
            <div class="flex items-center justify-between mb-3">
              <div class="text-sm font-bold text-base-content">🌳 내 성장 나무</div>
              ${isMvpCandidate ? `<span class="badge badge-sm" style="background:#FBBF24;color:#78350F;border:none">이번 달 지역 MVP 후보 🏆</span>` : ''}
            </div>
            <div class="flex items-stretch gap-1.5">${pills}</div>
            <div class="flex items-stretch gap-1.5 mt-1">${captionRow}</div>
            ${calloutHtml}
          </div>
        </div>
      `;
    }

    // ============ C. 올해 활동 (좌: 전도부 입력 읽기전용 / 우: 역할별 내 활동 집계) ============
    // 2026-09-15: "이번 달 활동"→"올해 활동"으로 명칭·집계기간 변경(사용자 요청).

      home.expandedRolePart = (home.expandedRolePart === role) ? null : role;

          </div>`;
      };

      return `
        <div class="px-4">

          <div class="grid grid-cols-2 gap-3">
            <div class="rounded-box p-3" style="background:#ecfdf5;border:1px solid #a7f3d0">

                <span class="text-xs text-emerald-800">복음방 인도</span>
                <span class="text-base font-black text-emerald-700">${gospelCount}명</span>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-xs text-emerald-800">센터 인도</span>
                <span class="text-base font-black text-emerald-700">${centerCount}명</span>
              </div>
            </div>
            <div class="flex flex-col gap-2">
              ${roleTile('인도자')}
              ${roleTile('교사')}
              ${roleTile('섬김이')}
              ${roleTile('협력교사')}
            </div>
          </div>
        </div>
      `;
    }

    // ============ D. 활동 기록 (항상 펼쳐진 상태, Step1~5) ============

    function wireActivityForm() {
      const f = home.form;

      const dateEl = document.getElementById('af-date');
      if (dateEl) dateEl.onchange = e => { f.date = e.target.value; };

      document.querySelectorAll('.af-role-cb').forEach(cb => {
        cb.onchange = e => {
          const v = e.target.value;
          if (e.target.checked) { if (!f.roles.includes(v)) f.roles.push(v); }
          else { f.roles = f.roles.filter(r => r !== v); }
          const hasTeacherExtra = f.roles.some(r => ROLES_WITH_EXTRA_ACTIVITY.includes(r));
          const opts = hasTeacherExtra ? ROLE_ACTIVITY_OPTIONS.concat([TEACHER_EXTRA_ACTIVITY]) : ROLE_ACTIVITY_OPTIONS;
          if (!opts.includes(f.activityItem)) f.activityItem = f.roles.length ? opts[0] : '';
          renderHome();
        };
      });

      const itemEl = document.getElementById('af-item');
      if (itemEl) itemEl.onchange = e => {
        f.activityItem = e.target.value;
        const mapped = ACTIVITY_TO_STAGE[f.activityItem];
        if (mapped) f.targetStage = mapped;
        // 상담1/상담2/복음방 전용 추가 입력란은 항목이 바뀌면 이전 값이 새 항목에 잘못 딸려가지 않도록 매번 초기화.
        f.extraTitle = ''; f.reaction = ''; f.reactionNote = '';
        renderHome();
      };

      const bindInput = (id, key) => { const el = document.getElementById(id); if (el) el.oninput = e => { f[key] = e.target.value; }; };
      bindInput('af-tname', 'targetName');
      bindInput('af-today', 'todayWork');
      bindInput('af-next', 'nextWork');
      bindInput('af-extra-title', 'extraTitle');
      bindInput('af-reaction-note', 'reactionNote');

      const bindChange = (id, key) => { const el = document.getElementById(id); if (el) el.onchange = e => { f[key] = e.target.value; }; };
      bindChange('af-tgender', 'targetGender');
      bindChange('af-tage', 'targetAgeGroup');
      // af-tstage는 관계 온도계 카드 배경을 실시간으로 바꿔야 해서 다른 필드와 달리 renderHome() 호출.
      const tstageEl = document.getElementById('af-tstage');
      if (tstageEl) tstageEl.onchange = e => { f.targetStage = e.target.value; renderHome(); };

      document.querySelectorAll('.af-reaction-radio').forEach(radio => {
        radio.onchange = e => { f.reaction = e.target.value; };
      });

      const submitBtn = document.getElementById('af-submit');
      if (submitBtn) submitBtn.onclick = submitActivityForm;
      const aiBtn = document.getElementById('af-aicoach');
      if (aiBtn) aiBtn.onclick = goToAiCoaching;
    }

    async function submitActivityForm() {
      const f = home.form;
      if (!f.roles.length) { alert('역할을 하나 이상 선택해주세요.'); return; }
      if (!f.activityItem) { alert('활동 항목을 선택해주세요.'); return; }

      const isConsult = f.activityItem === '상담1' || f.activityItem === '상담2';
      const isGospel = f.activityItem === '복음방';

      // Phase 2: 단계 상승 축하 모달 판정용 — refreshAfterSubmit()이 home.targets를 새 값으로
      // 덮어쓰기 전에, 지금 이름의 기존 대상자가 있었는지·이전 단계가 몇 단계였는지 미리 기록.
      const targetNameTrimmed = f.targetName.trim();
      const newStage = f.targetStage;
      const prevTarget = targetNameTrimmed ? home.targets.find(t => t.targetName === targetNameTrimmed) : null;
      const prevStageIdx = prevTarget ? stageIndex(prevTarget.stage) : -1;
      const newStageIdx = stageIndex(newStage);

      f.loading = true;
      renderHome();
      try {
        const res = await callApi({
          action: 'submitActivity', memberId, name,
          roles: f.roles, activityItem: f.activityItem, date: f.date,
          target: {
            name: targetNameTrimmed, gender: f.targetGender, ageGroup: f.targetAgeGroup, stage: f.targetStage,
            note: '', todayWork: f.todayWork.trim(), nextWork: f.nextWork.trim()
          },
          consultTitle: isConsult ? f.extraTitle.trim() : '',
          gospelSubject: isGospel ? f.extraTitle.trim() : '',
          reaction: (isConsult || isGospel) ? f.reaction : '',
          reactionNote: (isConsult || isGospel) ? f.reactionNote.trim() : ''
        });
        if (res && res.error) throw new Error(res.error);
        // 대상자 일지 내용만 비우고(다음 대상자를 이어서 기록하기 쉽게), 날짜/역할/항목은 유지.
        f.targetName = ''; f.targetGender = ''; f.targetAgeGroup = ''; f.targetStage = '';
        f.todayWork = ''; f.nextWork = '';
        f.extraTitle = ''; f.reaction = ''; f.reactionNote = '';
        await refreshAfterSubmit();
        // 기존 대상자(이름 일치)가 있었고, 이번에 선택한 단계가 그보다 앞서 있었다면 승급으로 간주.
        if (targetNameTrimmed && prevTarget && newStageIdx >= 0 && newStageIdx > prevStageIdx) {
          openStageUpModal(targetNameTrimmed, prevTarget.stage, newStage);
        }
      } catch (e) {
        alert('등록 중 오류가 발생했습니다: ' + e.message);
      }
      f.loading = false;
      renderHome();
    }

    let stageUpAutoCloseTimer = null;
    function openStageUpModal(targetName, fromStage, toStage) {
      const maskedName = maskName(targetName);
      const mainEl = document.getElementById('stageUpMainText');
      const bonusEl = document.getElementById('stageUpBonusText');
      const emojiEl = document.getElementById('stageUpEmoji');
      if (mainEl) mainEl.textContent = `${maskedName}님이 ${fromStage} → ${toStage}로 올라갔어요!`;
      let bonus = '';
      if (toStage === '복음방') bonus = '복음방 인도 완료! 🎉';
      else if (toStage === '센터소개') bonus = '센터 소개 완료! 🏆';
      if (bonusEl) bonusEl.textContent = bonus;
      if (emojiEl) emojiEl.textContent = toStage === '센터소개' ? '🏆' : '🎉';
      const dlg = document.getElementById('stageUpModal');
      if (dlg && !dlg.open) dlg.showModal();
      if (stageUpAutoCloseTimer) clearTimeout(stageUpAutoCloseTimer);
      stageUpAutoCloseTimer = setTimeout(closeStageUpModal, 2000);
    }
    function closeStageUpModal() {
      if (stageUpAutoCloseTimer) { clearTimeout(stageUpAutoCloseTimer); stageUpAutoCloseTimer = null; }
      const dlg = document.getElementById('stageUpModal');
      if (dlg && dlg.open) dlg.close();
    }

    function goToAiCoaching() {
      const f = home.form;
      const maskedName = maskName(f.targetName);

      if (maskedName) parts.push(`대상자: ${maskedName}`);
      if (f.targetStage) parts.push(`단계: ${f.targetStage}`);

      if (f.nextWork.trim()) parts.push(`다음 할 일: ${f.nextWork.trim()}`);

      const params = new URLSearchParams();
      params.set('memberId', memberId);
      params.set('name', name);
      const heartsStage = HEARTS_STAGE_MAP[f.targetStage];
      if (heartsStage) params.set('heartsStage', heartsStage);
      if (parts.length) params.set('situation', parts.join(' / '));
      // 2026-09-15: 대상자 연령대×성별로 "대상 선택"(자문/장년/부녀/청년)도 자동 전달.
      const targetGroup = ageGenderToOrg(f.targetAgeGroup, f.targetGender);

    function renderTargetsChart() {
      if (targetsChartInstance) { targetsChartInstance.destroy(); targetsChartInstance = null; }
      const canvas = document.getElementById('targetsChart');
      if (!canvas || !home.targets.length) return;
      const stages = home.stages;
      const n = stages.length || 1;
      const labels = home.targets.map(t => maskName(t.targetName));
      const values = home.targets.map(t => {
        const idx = stageIndex(t.stage);
        return idx >= 0 ? idx + 1 : 0.3; // 단계 미상도 아주 얇게 표시(0이면 막대가 안 보여 구분이 안 됨)
      });
      targetsChartInstance = new Chart(canvas, {
        type: 'bar',
        data: { labels, datasets: [{
          data: values,
          backgroundColor: home.targets.map(t => stageIndex(t.stage) >= 0 ? stageTemp(t.stage).color : '#d1d5db'),
          borderRadius: 4
        }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          onClick: (evt, elements) => {
            if (!elements.length) return;
            const t = home.targets[elements[0].index];
            if (t) openTargetDetail(t.targetId);
          },
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => (home.targets[ctx.dataIndex] && home.targets[ctx.dataIndex].stage) || '단계 미상' } }
          },
          scales: {
            y: { min: 0, max: n, ticks: { stepSize: 1, font: { size: 9 }, callback: v => stages[v - 1] || '' } },
            x: { ticks: { font: { size: 9 } } }
          }
        }
      });
    }

    // ============ F-2. 내 활동 기록(접이식) + 항목별 AI 피드백 ============
    // 2026-09-15 신설. 데이터는 이미 받아둔 getMyActivities 응답(home.monthlyActRes.rows)을 그대로 씀
    // — 추가 API 호출 없음. 각 행의 "🤖 AI 피드백"만 getActivityFeedback 액션을 호출한다.

    function activityRowKey(a) { return `${a.submittedAt}::${a.activityItem || (a.activities && a.activities[0]) || ''}`; }

    function toggleHistory() { home.historyOpen = !home.historyOpen; renderHome(); }

    async function runActivityAiFeedback(key) {
      const rows = (home.monthlyActRes && home.monthlyActRes.rows) || [];
      const a = rows.find(r => activityRowKey(r) === key);
      if (!a) return;
      home.aiFeedback[key] = { loading: true, text: '' };
      renderHome();

      // 다른 AI 호출 지점과 동일하게 최대 3회, 1초 간격 재시도(백엔드 _callAi_의 503 재시도와 별개).
      let lastErr = '';
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          const res = await callApi({
            action: 'getActivityFeedback',
            targetName: maskName(a.targetName) || '대상자',   // 원본 이름은 보내지 않음(마스킹 후 전송)
            stage: a.targetStage || '',
            todayWork: a.todayWork || '',
            nextWork: a.nextWork || ''
          });
          if (res && res.error) throw new Error(res.error);
          home.aiFeedback[key] = { loading: false, text: res.text || '(응답 없음)' };
          renderHome();
          return;
        } catch (e) {
          lastErr = e.message || String(e);
        }
        if (attempt < 3) await new Promise(r => setTimeout(r, 1000));
      }
      home.aiFeedback[key] = { loading: false, text: '오류가 발생했습니다: ' + lastErr };

    // 이미지 파일을 작은 정사각형 썸네일로 축소+압축해서 base64 data URL로 변환(시트 셀 용량 한도
    // 고려 — 원본 그대로 저장하면 너무 커서 128x128, JPEG 70%로 축소).
    function fileToThumbnailDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('이미지를 읽지 못했습니다.'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('이미지를 불러오지 못했습니다.'));
          img.onload = () => {
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const s = Math.min(img.width, img.height);
            const sx = (img.width - s) / 2, sy = (img.height - s) / 2;
            ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

      document.querySelectorAll('.coop-respond').forEach(btn => {

      const bindProfileField = (id, key) => {
        const el = document.getElementById(id);
        if (el) el.oninput = e => { pf[key] = e.target.value; };
      };
      bindProfileField('coop-profile-phone', 'phone');
      bindProfileField('coop-profile-strengths', 'strengths');

      bindProfileField('coop-profile-intro', 'intro');
      const photoInput = document.getElementById('coop-profile-photo');
      if (photoInput) photoInput.onchange = async e => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try { pf.photoUrl = await fileToThumbnailDataUrl(file); renderHome(); }
        catch (err) { alert('사진을 불러오지 못했습니다: ' + err.message); }
      };
      const photoClear = document.getElementById('coop-profile-photo-clear');
      if (photoClear) photoClear.onclick = () => { pf.photoUrl = ''; renderHome(); };
      const saveBtn = document.getElementById('coop-profile-save');
      if (saveBtn) saveBtn.onclick = saveMyProfile;
      const delBtn = document.getElementById('coop-profile-delete');
      if (delBtn) delBtn.onclick = deleteMyProfile;

      // 검색 필터 3종 — select는 즉시 재조회, 키워드 입력창은 Enter로 조회(매 타이핑마다 재조회 안 함).
      const bindFilterSelect = (id, key) => {
        const el = document.getElementById(id);
        if (el) el.onchange = e => { c[key] = e.target.value; searchCoopTeachers(); };
      };
      bindFilterSelect('coop-f-role', 'filterRole');
      bindFilterSelect('coop-f-region', 'filterRegion');
      const kwEl = document.getElementById('coop-f-keyword');
      if (kwEl) {
        kwEl.oninput = e => { c.filterKeyword = e.target.value; };
        kwEl.onkeydown = e => { if (e.key === 'Enter') searchCoopTeachers(); };
      }

      document.querySelectorAll('.coop-req-btn').forEach(btn => {
        btn.onclick = () => openCoopModal(btn.dataset.mid, btn.dataset.name);
      });

      if (c.modalTarget) {
        const t = document.getElementById('coop-modal-type');
        if (t) t.onchange = e => { c.modalType = e.target.value; };
        const m = document.getElementById('coop-modal-memo');
        if (m) m.oninput = e => { c.modalMemo = e.target.value; };
        const cancel = document.getElementById('coop-modal-cancel');
        if (cancel) cancel.onclick = closeCoopModal;
        const send = document.getElementById('coop-modal-send');
        if (send) send.onclick = sendCoopRequest;
      }
    }

    // ============ G. 리더 격려 메시지 배너 ============

    function encouragementBannerHtml() {
      if (!home.encouragements.length) return '';
      const first = home.encouragements[0];
      const more = home.encouragements.length - 1;
      return `
        <div id="encourage-banner" class="mx-4 rounded-box px-3 py-2.5 flex items-center gap-2 cursor-pointer" style="background:linear-gradient(90deg,#FDE68A,#FCD34D);border:1px solid #FBBF24">
          <span style="font-size:20px">💌</span>
          <div class="flex-1 text-xs font-bold truncate" style="color:#78350F">${esc(first.fromName || '지역장')}님: '${esc(first.message)}'${more > 0 ? ` 외 ${more}건` : ''}</div>
          <span class="text-[10px] shrink-0" style="color:#92400E">전체보기 →</span>
        </div>
      `;
    }

    function openEncourageBannerModal() {
      const body = document.getElementById('encourageBannerBody');
      if (body) {
        body.innerHTML = home.encouragements.map(m => `
          <div class="border border-base-300 rounded-box p-3">
            <div class="text-xs font-bold text-base-content/60 mb-1">${esc(m.fromName || '지역장')}님 · ${esc(String(m.sentAt || '').slice(0, 16))}</div>
            <div class="text-sm">${esc(m.message)}</div>
          </div>
        `).join('');
      }
      document.getElementById('encourageBannerModal').showModal();
    }

    async function closeEncourageBannerModal() {
      const ids = home.encouragements.map(m => m.id);
      const dlg = document.getElementById('encourageBannerModal');
      if (dlg && dlg.open) dlg.close();
      home.encouragements = []; // 배너는 바로 사라짐 — 읽음 처리는 아래에서 백그라운드로 진행
      renderHome();
      try {
        await Promise.all(ids.map(id => callApi({ action: 'markEncouragementRead', messageId: id })));
      } catch (e) {
        // 읽음 처리가 실패해도 화면엔 이미 반영됨 — 실패한 메시지는 다음 로그인 때 배너로 다시 뜸(데이터 유실 아님).
      }
    }

    // ============ 화면 조립 ============

    function dashboardViewHtml() {
      if (home.loading) {
        return `<div class="text-center py-16 text-sm text-base-content/40"><span class="loading loading-spinner loading-md align-middle mr-2"></span>불러오는 중...</div>`;
      }
      if (home.error) {
        return `<div class="p-4"><div class="alert alert-error text-sm">⚠️ ${esc(home.error)}</div></div>`;
      }
      return `
        <div class="py-4 flex flex-col gap-5">
          ${encouragementBannerHtml()}
          ${coopInboxBannerHtml()}
          ${coachReplyBannerHtml()}
          ${growthStagesHtml()}
          ${monthlyBoxesHtml()}
          ${activityFormHtml()}
          ${activityHistorySectionHtml()}
          ${targetsSectionHtml()}
          ${coopSectionHtml()}
        </div>
        ${coopModalHtml()}
      `;
    }

    function renderHome() {
      const root = document.getElementById('homeContent');
      if (home.view === 'targetDetail') {
        if (targetsChartInstance) { targetsChartInstance.destroy(); targetsChartInstance = null; }
        root.innerHTML = targetDetailViewHtml();
        return;
      }
      root.innerHTML = dashboardViewHtml();
      wireActivityForm();
      renderTargetsChart();
      wireHistoryAndCoop();
      const bannerEl = document.getElementById('encourage-banner');
      if (bannerEl) bannerEl.onclick = openEncourageBannerModal;
    }
  </script>
</body>
</html>
