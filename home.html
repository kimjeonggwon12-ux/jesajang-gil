<!DOCTYPE html>
<html lang="ko" data-theme="jesagil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>복음방 교사</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 제사장의 길 공통 디자인 시스템 테마 (jesagil) — 다른 HTML 파일에도 동일하게 붙여넣어 사용 */
    [data-theme="jesagil"] {
      /* DaisyUI 4.12는 색상 변수를 OKLCH(L% C H)로 받음 — HSL 아님, 주의 */
      --p: 51.06% 0.2301 276.97;   /* primary: indigo-600 */
      --pc: 100% 0 0;
      --s: 66.58% 0.1574 58.32;    /* secondary: amber-600 */
      --sc: 100% 0 0;
      --a: 59.60% 0.1274 163.23;   /* accent: emerald-600 */
      --ac: 100% 0 0;
      --n: 27.95% 0.0368 260.03;   /* neutral: slate-800 */
      --nc: 96.70% 0.0029 264.54;
      --b1: 100% 0 0;              /* base-100: white */
      --b2: 96.70% 0.0029 264.54;  /* base-200: gray-100 */
      --b3: 92.76% 0.0058 264.53;  /* base-300: gray-200 */
      --bc: 27.81% 0.0296 256.85;  /* base-content: gray-800 */
      --in: 68.47% 0.1479 237.32;
      --inc: 100% 0 0;
      --su: 69.59% 0.1491 162.48;
      --suc: 100% 0 0;
      --wa: 76.86% 0.1647 70.08;
      --wac: 0% 0 0;
      --er: 57.71% 0.2152 27.33;
      --erc: 100% 0 0;
      --rounded-box: 0.75rem;
      --rounded-btn: 0.5rem;
      --rounded-badge: 1rem;
    }
    html, body { height: 100%; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
    /* 브랜드 그라데이션 액센트 바 — navbar 바로 아래, 여러 파일에서 재사용 */
    .brand-accent-bar { height: 3px; background: linear-gradient(90deg, oklch(var(--p)), oklch(var(--s)), oklch(var(--a))); flex-shrink: 0; }
    .brand-avatar { background: linear-gradient(135deg, oklch(var(--p)), oklch(var(--a))); }
  </style>
</head>
<body class="bg-base-200">
  <!--
    ⚠️ 임시(당분간만): 편의를 위해 입장(성도고유번호+이름) 화면을 비활성화했습니다.
    운영 복귀 시 → 아래 loginPanel 의 style="display:none" 를 지우고,
    <script> 하단의 DOMContentLoaded 리스너 한 줄을 지우면 됩니다.
    (startSession() 로그인 코드는 복구용으로 그대로 보존)
  -->
  <div class="hero min-h-screen" id="loginPanel" style="display:none">
    <div class="hero-content text-center">
      <div class="card w-full max-w-sm bg-base-100 shadow-xl">
        <div class="card-body items-center">
          <div class="w-16 h-16 rounded-full brand-avatar flex items-center justify-center text-3xl shadow-md mb-1">🙏</div>
          <h2 class="card-title text-2xl">복음방 교사</h2>
          <p class="text-xs text-base-content/50 -mt-1 mb-2">성도 고유번호와 이름으로 입장하세요</p>
          <div class="w-full flex flex-col gap-2 mt-2">
            <input type="text" id="memberId" placeholder="성도고유번호" class="input input-bordered w-full" />
            <input type="text" id="name" placeholder="이름" class="input input-bordered w-full" />
          </div>
          <button onclick="startSession()" class="btn btn-primary w-full mt-4">입장</button>
        </div>
      </div>
    </div>
  </div>

  <!--
    2026-09-14: 홈+활동방 통합 개편 — 기존 상단 헤더(복음방 교사 · 교사 훈련 플랫폼 브랜드바)를
    완전히 제거하고, 세로 폭이 기존의 약 2/3인 얇은 인사말 바로 교체했습니다. "홈" 탭은 별도로
    없고, 이 인사말 바 아래 탭 이름 자체가 "활동방"이며 그 안에 옛 홈 대시보드+활동방 등록 화면이
    하나로 합쳐져 있습니다(activity-room.html은 이제 이 화면으로 리다이렉트만 함).
  -->
  <div id="appPanel" class="flex flex-col h-screen" style="display:none">
    <div class="flex items-center justify-between px-4 py-2 bg-base-100">
      <div class="text-sm font-bold text-base-content">안녕하세요, <span id="greetName">-</span> 교사님</div>
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="btn btn-ghost btn-xs text-base-content/40">⚙️</div>
        <ul tabindex="0" class="dropdown-content menu menu-sm bg-base-100 rounded-box z-10 w-44 p-2 shadow-md border border-base-300">
          <li><a href="admin-home.html" target="_blank" rel="noopener">🔐 관리자 홈</a></li>
          <li><a href="district-leader-view.html?memberId=0020113000010&name=%EA%B9%80%EC%A0%95%EA%B6%8C" target="_blank" rel="noopener">🗺️ 지역장 개인 화면</a></li>
        </ul>
      </div>
    </div>
    <div class="brand-accent-bar"></div>
    <div role="tablist" class="tabs tabs-boxed bg-base-300 rounded-none p-1.5 gap-1">
      <button role="tab" class="tab tab-active flex-1 gap-1.5" data-room="activity" onclick="switchTab('activity', this)"><span>🙌</span> 활동방</button>
      <button role="tab" class="tab flex-1 gap-1.5" data-room="feedback" onclick="switchTab('feedback', this)"><span>💬</span> 피드백방</button>
      <button role="tab" class="tab flex-1 gap-1.5" data-room="study" onclick="switchTab('study', this)"><span>📚</span> 공부방</button>
    </div>
    <div id="homeContent" class="flex-1 w-full overflow-y-auto bg-base-200" style="display:none"></div>
    <iframe id="content" class="flex-1 w-full border-0" style="display:none"></iframe>
    <div class="text-center py-2 bg-base-100 border-t border-base-300 text-xs">
      <div class="dropdown dropdown-top dropdown-center">
        <div tabindex="0" role="button" class="link link-primary">⚙️ 관리자 메뉴</div>
        <ul tabindex="0" class="dropdown-content menu menu-sm bg-base-100 rounded-box z-10 w-44 p-2 shadow-md border border-base-300">
          <li><a href="admin-home.html" target="_blank" rel="noopener">🔐 관리자 홈</a></li>
          <li><a href="district-leader-view.html?memberId=0020113000010&name=%EA%B9%80%EC%A0%95%EA%B6%8C" target="_blank" rel="noopener">🗺️ 지역장 개인 화면</a></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- 내 성장 박스 클릭 시 뜨는 승급 조건 상세 모달 -->
  <dialog id="growthModal" class="modal">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-3">다음 등급 승급 조건</h3>
      <div id="growthModalBody"></div>
      <div class="modal-action">
        <button class="btn btn-ghost" onclick="closeGrowthModal()">닫기</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>닫기</button></form>
  </dialog>

  <script>
    // 각 방 파일명(피드백방/공부방은 여전히 iframe) — 활동방은 이제 native(#homeContent)라 목록에 없음.
    const ROOM_FILES = {
      study: 'study-room.html',
      feedback: 'feedback-room.html'
    };
    const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

    // activity-room.html 등 다른 방 파일과 동일한 패턴 — 관리자 테스트링크(?memberId=&name=)로
    // 특정 교사 계정으로 미리보기 가능(예: home.html?memberId=0020113000010&name=김정권).
    const urlParams = new URLSearchParams(window.location.search);
    const paramMemberId = urlParams.get('memberId');
    const paramName = urlParams.get('name');
    if (paramMemberId && paramName) {
      window.TEST_MEMBER_ID = paramMemberId;
      window.TEST_NAME = paramName;
    }

    let memberId = '';
    let name = '';

    // ⚠️ 임시(당분간만): 로그인 없이 바로 입장. 운영 복귀 시 이 리스너 한 줄만 제거.
    function enterWithoutLogin() {
      memberId = window.TEST_MEMBER_ID || 'TEST-0001';
      name = window.TEST_NAME || '테스트사용자';
      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('appPanel').style.display = 'flex';
      document.getElementById('greetName').textContent = name;
      switchTab('activity', document.querySelector('.tab[data-room="activity"]'));
    }
    // 옛 "🏠 홈" 버튼 자리를 대체(현재는 아무 곳에서도 호출하지 않지만, 외부 링크 호환을 위해 보존).
    function goHome() {
      switchTab('activity', document.querySelector('.tab[data-room="activity"]'));
    }
    window.addEventListener('DOMContentLoaded', enterWithoutLogin);

    function startSession() {
      memberId = document.getElementById('memberId').value.trim();
      name = document.getElementById('name').value.trim();

      if (!memberId || !name) {
        alert('성도고유번호와 이름을 입력해주세요.');
        return;
      }

      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('appPanel').style.display = 'flex';
      document.getElementById('greetName').textContent = name;

      switchTab('activity', document.querySelector('.tab[data-room="activity"]'));
    }

    function switchTab(room, btnEl, extraParams) {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('tab-active'));
      if (btnEl) {
        btnEl.classList.add('tab-active');
      } else {
        const fallback = document.querySelector(`.tab[data-room="${room}"]`);
        if (fallback) fallback.classList.add('tab-active');
      }

      const homeEl = document.getElementById('homeContent');
      const iframeEl = document.getElementById('content');

      if (room === 'activity') {
        iframeEl.style.display = 'none';
        homeEl.style.display = 'block';
        loadHomeDashboard();
        return;
      }

      homeEl.style.display = 'none';
      iframeEl.style.display = 'block';

      const file = ROOM_FILES[room];
      if (!file) {
        console.error('알 수 없는 방:', room);
        return;
      }

      const params = extraParams || new URLSearchParams();
      if (!params.has('memberId')) params.set('memberId', memberId);
      if (!params.has('name')) params.set('name', name);

      iframeEl.src = `${file}?${params.toString()}`;
    }

    // ============ 활동방(홈+활동방 통합) ============

    async function callApi(payload) {
      const res = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function todayStr() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    }
    // 이름 가운데 글자 마스킹(화면 표시 전용, 서버에는 항상 원본이 저장됨) — "홍길동"→"홍*동".
    function maskName(nm) {
      const s = String(nm || '').trim();
      if (s.length <= 1) return s;
      if (s.length === 2) return s[0] + '*';
      return s[0] + '*'.repeat(s.length - 2) + s[s.length - 1];
    }
    function isThisMonth(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d)) return false;
      const now = new Date();
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }

    // 교사 구분 5단계 표시(항상 전부 노출, 화살표 없음 — Code.gs TEACHER_TIERS + 미래 단계 "센터교사")
    const GROWTH_STAGES = ['휴교사', '교사', '활동교사', '우수교사', '센터교사'];
    const TIER_COLORS = { '휴교사': '#9ca3af', '교사': '#3b82f6', '활동교사': '#f59e0b', '우수교사': '#f97316', '센터교사': '#ef4444' };

    // 활동 기록 Step2/3 — Code.gs ROLE_OPTIONS/ROLE_ACTIVITY_OPTIONS 와 동일(둘 다 바뀌면 같이 고칠 것).
    const ROLE_OPTIONS = ['인도자', '섬김이', '교사'];
    const ROLE_ACTIVITY_OPTIONS = ['피드백', '섭외', '친분', '만남1', '만남2', '상담1', '상담2', '복음방', '센터소개', '센터수강'];
    const TEACHER_EXTRA_ACTIVITY = '동행교사';
    const GENDER_OPTIONS = ['남', '여'];
    const AGE_GROUP_OPTIONS = ['10대', '20대', '30대', '40대', '50대', '60대이상'];
    // 백엔드 응답이 stages를 안 내려줄 때의 폴백(전도대상자 8단계, Code.gs TARGET_STAGES와 동일).
    const TARGET_STAGES_FALLBACK = ['섭외', '친분', '만남1', '만남2', '상담1', '상담2', '복음방', '센터소개'];
    // Step3 활동 항목 → Step4 "현재 단계" 자동 매핑(스테이지형 항목만; 피드백/센터수강/동행교사는 매핑 없음).
    const ACTIVITY_TO_STAGE = {
      '섭외': '섭외', '친분': '친분', '만남1': '만남1', '만남2': '만남2',
      '상담1': '상담1', '상담2': '상담2', '복음방': '복음방', '센터소개': '센터소개'
    };
    // "AI코칭 바로가기" — 대상자 단계를 feedback-room.html "내 수강생 코칭"의 하츠 진행 단계(STAGE_OPTIONS)로 변환.
    const HEARTS_STAGE_MAP = {
      '섭외': '친분', '친분': '친분', '만남1': '만남', '만남2': '만남',
      '상담1': '상담', '상담2': '상담', '복음방': '스터디', '센터소개': '아카데미 소개'
    };

    let home = {
      loading: true,
      error: '',
      tierStatus: null,        // getMyTierStatus 응답
      monthlyActRes: null,     // getMyActivities 응답 { rows, roleCounts, roleItemCounts }
      gospelLeads: [],         // getMyGospelLeads rows(읽기 전용, 전도부 입력)
      centerLeads: [],         // getMyCenterLeads rows(읽기 전용, 전도부 입력)
      targets: [],             // getMyTargets rows
      stages: TARGET_STAGES_FALLBACK,
      expandedRolePart: null,  // '인도자'|'섬김이'|'교사'|null — 이번 달 활동 "항목별 건수 펼쳐보기"
      view: 'dashboard',       // 'dashboard' | 'targetDetail'
      detailTargetId: null,
      detailJournal: null,     // getTargetJournal 응답
      detailLoading: false,
      form: {
        date: todayStr(),
        roles: [],
        activityItem: '',
        targetName: '', targetGender: '', targetAgeGroup: '', targetStage: '',
        note: '', todayWork: '', nextWork: '',
        loading: false
      }
    };

    async function loadHomeDashboard() {
      home.loading = true; home.error = '';
      renderHome();
      try {
        const [tierRes, actRes, gospelRes, centerRes, targetRes] = await Promise.all([
          callApi({ action: 'getMyTierStatus', memberId }),
          callApi({ action: 'getMyActivities', memberId }),
          callApi({ action: 'getMyGospelLeads', memberId }),
          callApi({ action: 'getMyCenterLeads', memberId }),
          callApi({ action: 'getMyTargets', memberId })
        ]);
        if (tierRes && !tierRes.error) home.tierStatus = tierRes;
        home.monthlyActRes = (actRes && !actRes.error) ? actRes : { rows: [], roleCounts: {}, roleItemCounts: {} };
        home.gospelLeads = (gospelRes && gospelRes.rows) || [];
        home.centerLeads = (centerRes && centerRes.rows) || [];
        if (targetRes && !targetRes.error) {
          home.targets = targetRes.rows || [];
          home.stages = targetRes.stages || TARGET_STAGES_FALLBACK;
        } else {
          home.stages = TARGET_STAGES_FALLBACK;
        }
      } catch (e) {
        home.error = String(e);
      }
      home.loading = false;
      renderHome();
    }

    async function refreshAfterSubmit() {
      const [tierRes, actRes, targetRes] = await Promise.all([
        callApi({ action: 'getMyTierStatus', memberId }),
        callApi({ action: 'getMyActivities', memberId }),
        callApi({ action: 'getMyTargets', memberId })
      ]);
      if (tierRes && !tierRes.error) home.tierStatus = tierRes;
      if (actRes && !actRes.error) home.monthlyActRes = actRes;
      if (targetRes && !targetRes.error) { home.targets = targetRes.rows || []; home.stages = targetRes.stages || home.stages; }
    }

    function stageIndex(stage) { return home.stages.indexOf(stage); }

    // ============ B. 내 성장 (5단계, 화살표 없음 — 클릭 시 승급 조건 모달) ============

    function conditionRowHtml(label, count, goal, desc) {
      const done = goal > 0 && count >= goal;
      return `
        <div class="flex items-center gap-3 p-3 rounded-box ${done ? 'bg-success/10' : 'bg-base-200'}">
          <div class="text-xl">${done ? '✅' : '⬜'}</div>
          <div class="flex-1">
            <div class="text-sm font-bold">${esc(label)}</div>
            <div class="text-xs text-base-content/50">${esc(desc)}</div>
          </div>
          <div class="text-sm font-black ${done ? 'text-success' : 'text-base-content/60'}">${count}/${goal}${done ? ' 달성!' : ''}</div>
        </div>`;
    }

    function openGrowthModal() {
      const ts = home.tierStatus;
      const body = document.getElementById('growthModalBody');
      if (!ts || !ts.nextTier) {
        body.innerHTML = `<div class="text-sm text-base-content/60">축하드려요! 이미 최고 등급이에요 🎉</div>`;
        document.getElementById('growthModal').showModal();
        return;
      }
      const rows = [];
      if (ts.leadGoal != null) {
        rows.push(conditionRowHtml('복음방 · 센터 인도', ts.leadCount || 0, ts.leadGoal, `최근 6개월 ${ts.leadGoal}회 이상`));
      }
      if (ts.monthlyGoal != null) {
        rows.push(conditionRowHtml('이번 달 활동', ts.monthlyCount || 0, ts.monthlyGoal, `이번 달 ${ts.monthlyGoal}회 이상`));
      }
      body.innerHTML = `
        <div class="text-sm text-base-content/60 mb-3">${esc(ts.nextTier)} 승급까지 필요한 조건이에요. 하나씩 달성해봐요!</div>
        <div class="flex flex-col gap-2">${rows.join('') || '<div class="text-xs text-base-content/40">조건 정보가 없습니다.</div>'}</div>
      `;
      document.getElementById('growthModal').showModal();
    }
    function closeGrowthModal() {
      document.getElementById('growthModal').close();
    }

    function growthStagesHtml() {
      const ts = home.tierStatus;
      const current = ts ? ts.tier : '';
      const pills = GROWTH_STAGES.map(s => {
        const active = s === current;
        const locked = s === '센터교사'; // 실제 등급 체계에 없는 미래 단계, 항상 잠김 표시
        const cls = active ? '' : (locked ? 'bg-base-200 text-base-content/30 border-base-200' : 'bg-base-100 text-base-content/50 border-base-300');
        const style = active ? `background:${TIER_COLORS[s]};color:#fff;border-color:transparent` : '';
        return `<div class="flex-1 text-center py-2.5 px-1 rounded-box text-[11px] font-bold border ${cls}" style="${style}">${esc(s)}</div>`;
      }).join('');

      let calloutHtml = '';
      if (ts && ts.nextTier && ts.leadGoal != null) {
        const leadCount = ts.leadCount || 0;
        const remaining = Math.max(0, ts.leadGoal - leadCount);
        const headline = remaining > 0
          ? `${esc(ts.nextTier)}까지 센터 인도 ${remaining}회 남았어요${remaining <= 1 ? ' · 거의 다 왔어요!' : ''}`
          : `${esc(ts.nextTier)} 승급 조건을 채웠어요! 🎉`;
        calloutHtml = `<div class="mt-3 text-xs text-info font-bold">${headline}</div>`;
      } else if (ts && !ts.nextTier) {
        calloutHtml = `<div class="mt-3 text-xs text-success font-bold">현재 최고 등급(우수교사)입니다 🎉</div>`;
      }

      return `
        <div class="card card-border bg-base-100 shadow-sm mx-4">
          <div class="card-body p-4 cursor-pointer" onclick="openGrowthModal()">
            <div class="text-sm font-bold text-base-content mb-3">내 성장</div>
            <div class="flex items-stretch gap-1.5">${pills}</div>
            ${calloutHtml}
          </div>
        </div>
      `;
    }

    // ============ C. 이번 달 활동 (좌: 전도부 입력 읽기전용 / 우: 역할별 내 활동 집계) ============

    function toggleRolePart(role) {
      home.expandedRolePart = (home.expandedRolePart === role) ? null : role;
      renderHome();
    }

    function monthlyBoxesHtml() {
      const gospelCount = home.gospelLeads.filter(r => isThisMonth(r.date)).length;
      const centerCount = home.centerLeads.filter(r => isThisMonth(r.date)).length;
      const rc = (home.monthlyActRes && home.monthlyActRes.roleCounts) || {};
      const ric = (home.monthlyActRes && home.monthlyActRes.roleItemCounts) || {};

      const roleTile = (role, colorCls) => {
        const expanded = home.expandedRolePart === role;
        const items = ric[role] || {};
        const itemKeys = Object.keys(items);
        return `
          <div class="border border-base-300 rounded-box p-2.5 cursor-pointer" onclick="toggleRolePart('${role}')">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-base-content/60">${esc(role)} 활동</span>
              <span class="text-lg font-black ${colorCls}">${rc[role] || 0}<span class="text-xs font-normal text-base-content/40">건</span></span>
            </div>
            ${expanded ? (itemKeys.length
              ? `<div class="mt-2 pt-2 border-t border-base-200 flex flex-wrap gap-1">${itemKeys.map(k => `<span class="badge badge-ghost badge-sm">${esc(k)} ${items[k]}</span>`).join('')}</div>`
              : `<div class="mt-2 pt-2 border-t border-base-200 text-[11px] text-base-content/30">이번 달 기록 없음</div>`) : ''}
          </div>`;
      };

      return `
        <div class="px-4">
          <div class="text-sm font-bold text-base-content mb-3">이번 달 활동</div>
          <div class="grid grid-cols-2 gap-3">
            <div class="rounded-box p-3" style="background:#ecfdf5;border:1px solid #a7f3d0">
              <div class="text-[11px] font-bold text-emerald-700 mb-2">전도부 등록 (읽기 전용)</div>
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-xs text-emerald-800">복음방 인도</span>
                <span class="text-base font-black text-emerald-700">${gospelCount}명</span>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-xs text-emerald-800">센터 인도</span>
                <span class="text-base font-black text-emerald-700">${centerCount}명</span>
              </div>
            </div>
            <div class="flex flex-col gap-2">
              ${roleTile('인도자', 'text-primary')}
              ${roleTile('섬김이', 'text-secondary')}
              ${roleTile('교사', 'text-accent')}
            </div>
          </div>
        </div>
      `;
    }

    // ============ D. 활동 기록 (항상 펼쳐진 상태, Step1~5) ============

    function activityFormHtml() {
      const f = home.form;
      const hasTeacher = f.roles.includes('교사');
      const itemOptions = hasTeacher ? ROLE_ACTIVITY_OPTIONS.concat([TEACHER_EXTRA_ACTIVITY]) : ROLE_ACTIVITY_OPTIONS;
      const stageOptions = home.stages.length ? home.stages : TARGET_STAGES_FALLBACK;

      return `
        <div class="card card-border bg-base-100 shadow-sm mx-4">
          <div class="card-body p-4 gap-4">
            <div class="text-sm font-bold text-base-content">활동 기록</div>

            <div>
              <div class="text-xs font-bold text-base-content/50 mb-1">① 날짜</div>
              <input type="date" id="af-date" class="input input-bordered input-sm w-full" value="${esc(f.date)}" max="${esc(todayStr())}">
            </div>

            <div>
              <div class="text-xs font-bold text-base-content/50 mb-1">② 역할 (복수 선택 가능)</div>
              <div class="flex gap-2">
                ${ROLE_OPTIONS.map(r => `
                  <label class="flex items-center gap-1.5 border border-base-300 rounded-box px-2 py-2 text-xs cursor-pointer flex-1 justify-center ${f.roles.includes(r) ? 'bg-primary/10 border-primary text-primary font-bold' : ''}">
                    <input type="checkbox" class="checkbox checkbox-xs af-role-cb" value="${esc(r)}" ${f.roles.includes(r) ? 'checked' : ''}> ${esc(r)}
                  </label>`).join('')}
              </div>
            </div>

            <div>
              <div class="text-xs font-bold text-base-content/50 mb-1">③ 활동 항목</div>
              <select id="af-item" class="select select-bordered select-sm w-full" ${f.roles.length ? '' : 'disabled'}>
                ${f.roles.length
                  ? itemOptions.map(o => `<option value="${esc(o)}" ${f.activityItem === o ? 'selected' : ''}>${esc(o)}</option>`).join('')
                  : '<option>역할을 먼저 선택하세요</option>'}
              </select>
            </div>

            <div class="border-t border-base-200 pt-3">
              <div class="text-xs font-bold text-base-content/50 mb-2">④ 대상자 일지</div>
              <div class="grid grid-cols-2 gap-2 mb-2">
                <input type="text" id="af-tname" placeholder="이름" class="input input-bordered input-sm w-full col-span-2" value="${esc(f.targetName)}">
                <select id="af-tgender" class="select select-bordered select-sm w-full">
                  <option value="">성별</option>
                  ${GENDER_OPTIONS.map(g => `<option value="${esc(g)}" ${f.targetGender === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}
                </select>
                <select id="af-tage" class="select select-bordered select-sm w-full">
                  <option value="">연령대</option>
                  ${AGE_GROUP_OPTIONS.map(a => `<option value="${esc(a)}" ${f.targetAgeGroup === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}
                </select>
                <select id="af-tstage" class="select select-bordered select-sm w-full col-span-2">
                  <option value="">현재 단계</option>
                  ${stageOptions.map(s => `<option value="${esc(s)}" ${f.targetStage === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
                </select>
              </div>
              <textarea id="af-note" rows="2" placeholder="특이사항" class="textarea textarea-bordered textarea-sm w-full mb-2">${esc(f.note)}</textarea>
              <textarea id="af-today" rows="2" placeholder="오늘 한 일" class="textarea textarea-bordered textarea-sm w-full mb-2">${esc(f.todayWork)}</textarea>
              <textarea id="af-next" rows="2" placeholder="다음 할 일" class="textarea textarea-bordered textarea-sm w-full">${esc(f.nextWork)}</textarea>
              <div class="text-[10px] text-base-content/40 mt-1">이름 가운데 글자는 목록/현황 화면에 자동으로 * 표시돼요 (예: 홍*동)</div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button id="af-submit" class="btn btn-primary btn-sm" ${f.loading ? 'disabled' : ''}>${f.loading ? '등록 중...' : '등록'}</button>
              <button id="af-aicoach" class="btn btn-outline btn-secondary btn-sm">AI코칭 바로가기 →</button>
            </div>
          </div>
        </div>
      `;
    }

    function wireActivityForm() {
      const f = home.form;

      const dateEl = document.getElementById('af-date');
      if (dateEl) dateEl.onchange = e => { f.date = e.target.value; };

      document.querySelectorAll('.af-role-cb').forEach(cb => {
        cb.onchange = e => {
          const v = e.target.value;
          if (e.target.checked) { if (!f.roles.includes(v)) f.roles.push(v); }
          else { f.roles = f.roles.filter(r => r !== v); }
          const hasTeacher = f.roles.includes('교사');
          const opts = hasTeacher ? ROLE_ACTIVITY_OPTIONS.concat([TEACHER_EXTRA_ACTIVITY]) : ROLE_ACTIVITY_OPTIONS;
          if (!opts.includes(f.activityItem)) f.activityItem = f.roles.length ? opts[0] : '';
          renderHome();
        };
      });

      const itemEl = document.getElementById('af-item');
      if (itemEl) itemEl.onchange = e => {
        f.activityItem = e.target.value;
        const mapped = ACTIVITY_TO_STAGE[f.activityItem];
        if (mapped) { f.targetStage = mapped; renderHome(); }
      };

      const bindInput = (id, key) => { const el = document.getElementById(id); if (el) el.oninput = e => { f[key] = e.target.value; }; };
      bindInput('af-tname', 'targetName');
      bindInput('af-note', 'note');
      bindInput('af-today', 'todayWork');
      bindInput('af-next', 'nextWork');

      const bindChange = (id, key) => { const el = document.getElementById(id); if (el) el.onchange = e => { f[key] = e.target.value; }; };
      bindChange('af-tgender', 'targetGender');
      bindChange('af-tage', 'targetAgeGroup');
      bindChange('af-tstage', 'targetStage');

      const submitBtn = document.getElementById('af-submit');
      if (submitBtn) submitBtn.onclick = submitActivityForm;
      const aiBtn = document.getElementById('af-aicoach');
      if (aiBtn) aiBtn.onclick = goToAiCoaching;
    }

    async function submitActivityForm() {
      const f = home.form;
      if (!f.roles.length) { alert('역할을 하나 이상 선택해주세요.'); return; }
      if (!f.activityItem) { alert('활동 항목을 선택해주세요.'); return; }

      f.loading = true;
      renderHome();
      try {
        const res = await callApi({
          action: 'submitActivity', memberId, name,
          roles: f.roles, activityItem: f.activityItem, date: f.date,
          target: {
            name: f.targetName.trim(), gender: f.targetGender, ageGroup: f.targetAgeGroup, stage: f.targetStage,
            note: f.note.trim(), todayWork: f.todayWork.trim(), nextWork: f.nextWork.trim()
          }
        });
        if (res && res.error) throw new Error(res.error);
        // 대상자 일지 내용만 비우고(다음 대상자를 이어서 기록하기 쉽게), 날짜/역할/항목은 유지.
        f.targetName = ''; f.targetGender = ''; f.targetAgeGroup = ''; f.targetStage = '';
        f.note = ''; f.todayWork = ''; f.nextWork = '';
        await refreshAfterSubmit();
      } catch (e) {
        alert('등록 중 오류가 발생했습니다: ' + e.message);
      }
      f.loading = false;
      renderHome();
    }

    // ============ E. AI코칭 연동 ============

    function goToAiCoaching() {
      const f = home.form;
      const maskedName = maskName(f.targetName);
      const parts = [];
      if (maskedName) parts.push(`대상자: ${maskedName}`);
      if (f.targetStage) parts.push(`단계: ${f.targetStage}`);
      if (f.note.trim()) parts.push(`특이사항: ${f.note.trim()}`);
      if (f.todayWork.trim()) parts.push(`오늘 한 일: ${f.todayWork.trim()}`);

      const params = new URLSearchParams();
      params.set('memberId', memberId);
      params.set('name', name);
      const heartsStage = HEARTS_STAGE_MAP[f.targetStage];
      if (heartsStage) params.set('heartsStage', heartsStage);
      if (parts.length) params.set('situation', parts.join(' / '));

      switchTab('feedback', document.querySelector('.tab[data-room="feedback"]'), params);
    }

    // ============ F. 내 전도 대상자 현황 ============

    function targetStageBarsHtml(t) {
      const idx = stageIndex(t.stage);
      return `
        <div class="flex items-end gap-1 h-14 mt-1">
          ${home.stages.map((s, i) => `
            <div class="flex-1 flex flex-col items-end justify-end h-full" title="${esc(s)}">
              <div class="w-full rounded-t-sm ${i <= idx ? 'bg-primary' : 'bg-base-300'}" style="height:${Math.round((i + 1) / home.stages.length * 100)}%"></div>
            </div>`).join('')}
        </div>
        <div class="text-[9px] text-base-content/40 text-center mt-1">${esc(t.stage || '-')} (${idx >= 0 ? idx + 1 : 0}/${home.stages.length}단계)</div>
      `;
    }

    function targetCardHtml(t) {
      const initial = (t.targetName || '?').slice(0, 1);
      return `
        <div class="card card-border bg-base-100 shadow-sm shrink-0 cursor-pointer active:scale-[0.99] transition" style="width:150px" onclick="openTargetDetail('${esc(t.targetId)}')">
          <div class="card-body p-3">
            <div class="flex items-center gap-2 mb-1">
              <div class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold text-xs shrink-0">${esc(initial)}</div>
              <div class="min-w-0">
                <div class="font-bold text-xs truncate">${esc(maskName(t.targetName))}</div>
                <div class="text-[10px] text-base-content/40 truncate">${esc(t.gender || '')} ${esc(t.ageGroup || '')}</div>
              </div>
            </div>
            ${targetStageBarsHtml(t)}
          </div>
        </div>
      `;
    }

    function targetsSectionHtml() {
      if (!home.targets.length) {
        return `
          <div class="px-4">
            <div class="text-sm font-bold text-base-content mb-3">내 전도 대상자 현황</div>
            <div class="text-xs text-base-content/40 border border-dashed border-base-300 rounded-box p-6 text-center">
              대상자 일지를 채워 활동을 등록하면 여기 자동으로 등록돼요.
            </div>
          </div>`;
      }
      return `
        <div class="px-4">
          <div class="text-sm font-bold text-base-content mb-3">내 전도 대상자 현황</div>
          <div class="flex gap-3 overflow-x-auto pb-2">
            ${home.targets.map(t => targetCardHtml(t)).join('')}
          </div>
        </div>
      `;
    }

    async function openTargetDetail(targetId) {
      home.view = 'targetDetail';
      home.detailTargetId = targetId;
      home.detailJournal = null;
      home.detailLoading = true;
      renderHome();
      try {
        const res = await callApi({ action: 'getTargetJournal', memberId, targetId });
        if (res && !res.error) home.detailJournal = res;
        else home.error = (res && res.error) || '';
      } catch (e) {}
      home.detailLoading = false;
      renderHome();
    }

    function closeTargetDetail() {
      home.view = 'dashboard';
      renderHome();
    }

    function journalRowHtml(j) {
      return `
        <div class="flex gap-3 pb-3 mb-3 border-b border-base-200 last:border-0 last:pb-0 last:mb-0">
          <div class="text-[11px] text-base-content/40 w-20 shrink-0 leading-tight">${esc(String(j.submittedAt || '').split(' ')[0])}</div>
          <div class="flex-1 text-sm">
            <div class="flex flex-wrap items-center gap-1 mb-1">
              ${j.roles.map(r => `<span class="badge badge-ghost badge-xs">${esc(r)}</span>`).join('')}
              <span class="font-bold text-xs">${esc(j.activityItem)}</span>
              <span class="text-[10px] text-base-content/40">· ${esc(j.writerName)}</span>
            </div>
            ${j.note ? `<div class="text-xs text-base-content/60">특이사항: ${esc(j.note)}</div>` : ''}
            ${j.todayWork ? `<div class="text-xs text-base-content/60">오늘: ${esc(j.todayWork)}</div>` : ''}
            ${j.nextWork ? `<div class="text-xs text-base-content/60">다음: ${esc(j.nextWork)}</div>` : ''}
          </div>
        </div>`;
    }

    function targetDetailViewHtml() {
      if (home.detailLoading || !home.detailJournal) {
        return `
          <div class="p-4">
            <button class="text-xs text-base-content/50 mb-3" onclick="closeTargetDetail()">‹ 활동방</button>
            <div class="text-center py-16 text-sm text-base-content/40"><span class="loading loading-spinner loading-md align-middle mr-2"></span>불러오는 중...</div>
          </div>`;
      }
      const { target, journal } = home.detailJournal;
      const latestNextWork = journal.length ? journal[0].nextWork : '';

      return `
        <div class="p-4 pb-8 flex flex-col gap-4">
          <button class="text-xs text-base-content/50 self-start" onclick="closeTargetDetail()">‹ 활동방</button>

          <div class="card card-border bg-base-100 shadow-sm">
            <div class="card-body p-4">
              <div class="flex items-center justify-between mb-2">
                <div class="text-lg font-black">${esc(maskName(target.targetName))}</div>
                <span class="badge badge-primary badge-sm">${esc(target.stage || '-')}</span>
              </div>
              <div class="text-xs text-base-content/40 mb-1">${esc(target.gender || '')} ${esc(target.ageGroup || '')}</div>
              ${targetStageBarsHtml(target)}
            </div>
          </div>

          ${latestNextWork ? `
          <div class="alert bg-info/10 border border-info/30">
            <div class="text-sm"><b>다음 할 일:</b> ${esc(latestNextWork)}</div>
          </div>` : ''}

          <div class="card card-border bg-base-100 shadow-sm">
            <div class="card-body p-4">
              <div class="text-sm font-bold mb-2">담당 교사 (인도자/섬김이)</div>
              <div class="text-xs text-base-content/60">인도자: ${target.leaderId ? esc(target.leaderId) : '미배정'}</div>
              <div class="text-xs text-base-content/60">섬김이: ${target.helperId ? esc(target.helperId) : '미배정'}</div>
              ${target.teacherChangeLog ? `<div class="text-[10px] text-base-content/40 mt-2 leading-relaxed">${esc(target.teacherChangeLog)}</div>` : ''}
            </div>
          </div>

          <div class="card card-border bg-base-100 shadow-sm">
            <div class="card-body p-4">
              <div class="text-sm font-bold mb-3">날짜별 활동 히스토리</div>
              ${journal.length === 0
                ? `<div class="text-xs text-base-content/40 text-center py-4">기록이 없습니다.</div>`
                : journal.map(journalRowHtml).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ============ 화면 조립 ============

    function dashboardViewHtml() {
      if (home.loading) {
        return `<div class="text-center py-16 text-sm text-base-content/40"><span class="loading loading-spinner loading-md align-middle mr-2"></span>불러오는 중...</div>`;
      }
      if (home.error) {
        return `<div class="p-4"><div class="alert alert-error text-sm">⚠️ ${esc(home.error)}</div></div>`;
      }
      return `
        <div class="py-4 flex flex-col gap-5">
          ${growthStagesHtml()}
          ${monthlyBoxesHtml()}
          ${activityFormHtml()}
          ${targetsSectionHtml()}
        </div>
      `;
    }

    function renderHome() {
      const root = document.getElementById('homeContent');
      if (home.view === 'targetDetail') {
        root.innerHTML = targetDetailViewHtml();
        return;
      }
      root.innerHTML = dashboardViewHtml();
      wireActivityForm();
    }
  </script>
</body>
</html>
