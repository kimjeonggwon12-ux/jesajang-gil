name: 백업 파일 상태 확인
on:
  schedule:
    - cron: '47 18 * * *' # 매일 03:47 KST. 일요일 백업 03:00 뒤 45분 유예.
  workflow_dispatch:
    inputs:
      notification_test:
        description: '메일 수신 시험만 실행 (운영 백업 조회도 하지 않음)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: backup-watch
  cancel-in-progress: false
jobs:
  notification-test:
    if: github.event_name == 'workflow_dispatch' && inputs.notification_test
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: 메일 수신 확인용 의도된 실패
        shell: bash
        run: |
          echo '## 실패 이메일 수신 시험' >> "$GITHUB_STEP_SUMMARY"
          echo '운영 백업/API/DB/Telegram을 호출하지 않은 알림 시험입니다.' >> "$GITHUB_STEP_SUMMARY"
          echo '::error title=실패 이메일 수신 시험::운영 장애가 아닙니다. 이 실행의 이메일 수신을 확인하세요.'
          exit 1
  check:
    # 감시 인증/실패 알림 수신 설정 확인 후 명시적으로 활성화한다.
    if: "!inputs.notification_test && vars.BACKUP_WATCH_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/backup-watch.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 백업 상태 읽기 및 실패 표시
        env:
          # 기존 TS_CRON_KEY가 현재 Vercel 키와 맞는지 읽기 실행으로 먼저 검증한다.
          BACKUP_WATCH_KEY: ${{ secrets.TS_CRON_KEY }}
        run: node tools/backup-watch.mjs
