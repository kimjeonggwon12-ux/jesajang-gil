# 교사광장 텔레그램 봇 — 매일 저녁 9시(KST) 교사 참여율·등급 서머리 발송
# Apps Script action 'tsEveningSummary' 호출(TeacherSquareBot.gs sendEveningSummary). 중복키 evening_날짜로 하루 한 번.
name: teachersquare-evening-summary

on:
  schedule:
    - cron: '3 12 * * *'   # 21:03 KST
    - cron: '23 12 * * *'  # 21:23 KST (앞 실행이 밀리거나 빠졌을 때 — 같은 날짜는 중복키로 한 번만)
    - cron: '43 12 * * *'  # 21:43 KST
    - cron: '13 13 * * *'  # 22:13 KST
    # 정각(0분)은 GitHub 예약이 가장 붐벼 많이 밀림 → 몇 분 비켜서 여러 번 시도
  workflow_dispatch:
    inputs:
      date:
        description: '기준 날짜 (yyyy-MM-dd, 비우면 오늘)'
        required: false
      force:
        description: '이미 보낸 날짜도 다시 보내기'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call Apps Script
        env:
          KEY: ${{ secrets.TS_CRON_KEY }}
          DATE: ${{ github.event.inputs.date }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          # 예약 실행은 GitHub 지연으로 몇 시간 늦게 돌 수 있음 → 날짜를 '원래 보낼 날'로 고정(자정 넘어 돌면 다음 날 것을 미리 보내던 버그)
          if [ -z "$DATE" ] && [ "${{ github.event_name }}" = "schedule" ]; then DATE=$(TZ=Asia/Seoul date -d '12 hours ago' +%F); fi
          URL="https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec"
          BODY=$(jq -nc --arg key "$KEY" --arg date "$DATE" --arg force "$FORCE" \
            '{action:"tsEveningSummary", key:$key} + (if $date != "" then {date:$date} else {} end) + (if $force == "true" then {force:true} else {} end)')
          RES=$(curl -sSL --retry 3 --max-time 240 -H "Content-Type: text/plain" --data "$BODY" "$URL")
          echo "$RES"
          echo "$RES" | jq -e '.ok == true or .skipped == true' > /dev/null
