<!DOCTYPE html>
<html lang="ko" data-theme="jesagil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제사장의 길 - 부서별</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  /* 제사장의 길 공통 디자인 시스템 테마 (jesagil) — 다른 관리자 화면과 동일 */
  [data-theme="jesagil"] {
    --p: 51.06% 0.2301 276.97; --pc: 100% 0 0;
    --s: 66.58% 0.1574 58.32;  --sc: 100% 0 0;
    --a: 59.60% 0.1274 163.23; --ac: 100% 0 0;
    --n: 27.95% 0.0368 260.03; --nc: 96.70% 0.0029 264.54;
    --b1: 100% 0 0; --b2: 96.70% 0.0029 264.54; --b3: 92.76% 0.0058 264.53;
    --bc: 27.81% 0.0296 256.85;
    --in: 68.47% 0.1479 237.32; --inc: 100% 0 0;
    --su: 69.59% 0.1491 162.48; --suc: 100% 0 0;
    --wa: 76.86% 0.1647 70.08;  --wac: 0% 0 0;
    --er: 57.71% 0.2152 27.33;  --erc: 100% 0 0;
    --rounded-box: 0.75rem; --rounded-btn: 0.5rem; --rounded-badge: 1rem;
  }
  html, body { margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .brand-accent-bar { height: 3px; background: linear-gradient(90deg, oklch(var(--p)), oklch(var(--s)), oklch(var(--a))); }
</style>
</head>
<body class="bg-base-200 min-h-screen">
<div class="max-w-5xl mx-auto min-h-screen bg-base-100 shadow-sm flex flex-col">
  <div id="root" class="flex-1"></div>
</div>

<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

// 백엔드 ORG_DEPTS 와 순서 동일 — 교사명단 "부서" 컬럼에 없는 값은 전부 "기타"로 묶여서 옴.
const DEPTS = ['교역자', '자문회', '장년회', '부녀회', '청년회', '기타'];
const DEPT_ICON = { '교역자': '⛪', '자문회': '🧭', '장년회': '👨‍👩‍👧', '부녀회': '👩', '청년회': '🧑‍🎓', '기타': '📁' };

const TIER_ORDER = ['휴교사', '교사', '활동교사', '우수교사'];
const TIER_BADGE = { '우수교사': 'badge-secondary', '활동교사': 'badge-accent', '교사': 'badge-primary', '휴교사': 'badge-ghost' };
const TIER_TEXT_COLOR = { '휴교사': 'text-base-content/50', '교사': 'text-primary', '활동교사': 'text-accent', '우수교사': 'text-secondary' };

let state = {
  dept: null,        // null = "전체 요약" 화면(조직별 요약), DEPTS 중 하나면 그 부서 상세 화면
  region: '',       // '' = 전체 — per-teacher 목록만 이 값으로 클라이언트에서 필터링(요약/지역별 표는 항상 부서 전체 기준)
  loading: false,
  error: '',
  approving: {},    // memberId::suggestedTier → true
  cache: {},        // dept → getDistrictReport(region:'') 응답 (부서 전체 데이터를 한 번만 받아 캐시)
  regionView: 'table',   // 'table' | 'chart' — 지역별 상세 섹션 표시 방식
  activityView: 'table', // 'table' | 'chart' — 지역별 활동 분석 섹션 표시 방식
  teacherDetailOpen: false, // 교사별 상세(지역 필터+표) 접기/펼치기 — 기본 접힘
  pendingOnly: false // true면 교사별 상세 표를 "승급·강등 제안 있는 교사만"으로 좁혀서 보여줌
};

// 전체 조직별 요약 (getOrgSummary) — "전체 요약" 화면 전용, 부서 상세와 별도로 캐시.
let orgSummary = null;
let orgSummaryLoading = false;

// 전체 활동실적(getAllActivities) — "지역별 활동 분석" 전용, 부서 상세 화면 진입 시 1회만 로드해 캐시.
let allActivities = null;
let allActivitiesLoading = false;

// 활동방(activity-room.html) ACTIVITY_OPTIONS 와 동일 목록 — 표/그래프의 열(항목) 표준 순서용.
const ACTIVITY_OPTIONS = [
  '전도 섭외', '전도 대상자 만남', '복음방 이전 상담 활동', '상담 활동', '상담 교육',
  '복음방 교사 교육', '동행 교사', '피드백', '선교센터 섬김이', '선교센터 교사로 출석', '선교센터 인도자'
];
const ACTIVITY_ICON = {
  '전도 섭외': '📞', '전도 대상자 만남': '🤝', '복음방 이전 상담 활동': '📖', '상담 활동': '💬',
  '상담 교육': '🎓', '복음방 교사 교육': '👩‍🏫', '동행 교사': '🚶', '피드백': '📝',
  '선교센터 섬김이': '🙌', '선교센터 교사로 출석': '✅', '선교센터 인도자': '🎯'
};
const ACTIVITY_PALETTE = ['#4f46e5','#0ea5e9','#059669','#d97706','#dc2626','#7c3aed','#db2777','#65a30d','#0891b2','#ea580c','#64748b'];
const GRADE_BADGE = { '상': 'badge-success', '중': 'badge-warning', '하': 'badge-ghost', '-': 'badge-ghost' };

const TIER_CHART_COLOR = { '휴교사': '#9ca3af', '교사': '#4f46e5', '활동교사': '#059669', '우수교사': '#d97706' };
let regionCharts = []; // Chart.js 인스턴스(지역별 상세+활동 분석 공용) — 다시 그리기 전 항상 destroy 해서 캔버스 재사용 시 에러 방지

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }

// 관리자 화면 공통 메인 내비게이션 — 관리자 홈 / 통합 / 부서별 / 피드백 / 교사 어플로 가기 5개.
// 세 관리방(통합·부서별·피드백) 어디서든 서로 바로 이동 가능하도록 각 파일에 동일하게 둠.
function mainNavHtml(current) {
  const item = (key, href, icon, label) => {
    const active = key === current;
    return `<a href="${href}" class="btn btn-xs ${active ? 'btn-primary pointer-events-none' : 'btn-ghost'}">${icon} ${label}</a>`;
  };
  return `
    <div class="flex flex-wrap items-center gap-1.5 px-5 py-2 bg-base-200 border-b border-base-300">
      <a href="admin-home.html" class="btn btn-xs btn-ghost">🔐 관리자 홈</a>
      ${item('edu', 'edu-dashboard.html', '🎓', '통합')}
      ${item('district', 'district-dashboard.html', '🗺️', '부서별')}
      ${item('coach', 'coach-dashboard.html', '🎧', '피드백')}
      <a href="home.html" class="btn btn-xs btn-ghost ml-auto">🏃 교사 어플로 가기</a>
    </div>
  `;
}

async function callApi(payload) {
  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

async function loadReport(force) {
  const key = state.dept;
  if (!force && state.cache[key]) { render(); return; }
  state.loading = true; state.error = '';
  render();
  try {
    // region은 항상 '전체'로 받아서 캐시 — 지역 드롭다운은 클라이언트에서만 필터링(재요청 없이 즉시 전환)
    const res = await callApi({ action: 'getDistrictReport', dept: state.dept, region: '' });
    if (res && res.error) { state.error = res.error; }
    else { state.cache[key] = res; }
  } catch (e) {
    state.error = '서버 연결에 실패했습니다: ' + e;
  }
  state.loading = false;
  render();
}

async function loadOrgSummary(force) {
  if (!force && orgSummary) { render(); return; }
  orgSummaryLoading = true;
  render();
  try {
    const res = await callApi({ action: 'getOrgSummary' });
    orgSummary = (res && !res.error) ? res : { error: (res && res.error) || '불러오기 실패' };
  } catch (e) {
    orgSummary = { error: String(e) };
  }
  orgSummaryLoading = false;
  render();
}

// "지역별 활동 분석" 전용 — 전 교사 활동실적을 1회만 받아 캐시(부서 무관, 부서 전환해도 재요청 없음).
async function loadAllActivities(force) {
  if (!force && (allActivities || allActivitiesLoading)) return;
  allActivitiesLoading = true;
  render();
  try {
    const res = await callApi({ action: 'getAllActivities' });
    allActivities = (res && Array.isArray(res.rows)) ? res.rows : [];
  } catch (e) {
    allActivities = [];
  }
  allActivitiesLoading = false;
  render();
}

// dept가 null이면 "전체 요약" 화면으로 전환 — 이미 요약을 받아왔으면 재요청 없이 그대로 보여줌.
function switchDept(dept) {
  state.dept = dept;
  state.region = ''; // 부서를 바꾸면 지역 필터는 초기화(그 부서에 없는 지역일 수 있어서)
  if (dept === null) loadOrgSummary(false);
  else { loadReport(false); loadAllActivities(false); }
}

function switchRegion(region) {
  state.region = region;
  render(); // 이미 캐시된 부서 전체 데이터에서 클라이언트 필터링만 하면 되므로 재요청 불필요
}

async function approve(t) {
  const key = t.memberId + '::' + t.suggestion.suggestedTier;
  if (!confirm(`${t.name} 교사를 "${t.suggestion.suggestedTier}"(으)로 변경 승인하시겠습니까?\n\n등급변경승인 시트에 기록되며, 지역장·교관 등 다른 승인자와 합쳐 2인이 되면 즉시 반영됩니다.`)) return;
  state.approving[key] = true;
  render();
  try {
    const res = await callApi({
      action: 'approveTierChange',
      memberId: t.memberId,
      name: t.name,
      currentTier: t.tier,
      suggestedTier: t.suggestion.suggestedTier,
      reason: t.suggestion.reason,
      type: t.suggestion.pendingType || 'auto',
      approver: '관리자(부서별 교사 관리)'
    });
    if (res && res.error) {
      alert('승인 실패: ' + res.error);
    } else if (res && res.applied) {
      alert(`2인 승인 완료 — ${t.name} 교사가 "${t.suggestion.suggestedTier}"(으)로 변경되었습니다.`);
    } else if (res && res.note) {
      alert(res.note);
    } else {
      alert(`승인 접수 완료 (현재 ${(res && res.approvalCount) || 1}/2). 1명 더 승인하면 반영됩니다.`);
    }
    delete state.cache[state.dept];
    await loadReport(true);
  } catch (e) {
    alert('승인 중 오류가 발생했습니다: ' + e);
  }
  delete state.approving[key];
  render();
}

// ============ 관리자 즉시 반영 (지역장·교관 2인 승인과 별개) ============
// 통합(edu-dashboard.html)에 있던 "등급 심사"(checkTierChanges/applyTierChange, 관리자 단독 즉시
// 반영)를 부서별로 옮겨왔다가, "교사별 상세 표와 뭐가 다르냐"는 피드백으로 별도 섹션은 없애고
// 아래 표의 "승급·강등 제안" 셀(suggestionCell) 안에 "⚡ 즉시 반영" 버튼으로 통합함 — 2인 승인
// (✅ 승인)과 관리자 단독 즉시 반영(⚡ 즉시 반영)을 같은 자리에서 고를 수 있음.
async function applyTierChangeInstant(memberId, newTier) {
  const key = 'instant::' + memberId;
  state.approving[key] = true;
  render();
  try {
    const res = await callApi({ action: 'applyTierChange', memberId, newTier });
    if (res && res.error) throw new Error(res.error);
    // 캐시된 report에서도 해당 교사의 등급/제안을 갱신해서 재요청 없이 즉시 반영
    Object.values(state.cache).forEach(rpt => {
      if (!rpt) return;
      const row = (rpt.rows || []).find(r => r.memberId === memberId);
      if (row) { row.tier = newTier; row.suggestion = null; }
    });
  } catch (e) {
    alert('반영 중 오류가 발생했습니다: ' + e.message);
  }
  delete state.approving[key];
  render();
}

// "전체 요약" 화면 — 6개 조직 카드, 클릭 시 페이지 이동 없이 바로 그 부서 상세 탭으로 전환.
function orgSummarySectionHtml() {
  if (orgSummaryLoading && !orgSummary) {
    return `<div class="p-4">
      <div class="text-xs text-base-content/40 border border-base-300 rounded-box p-6 text-center">
        <span class="loading loading-spinner loading-sm align-middle mr-1"></span>조직별 집계 중 (교사 수가 많아 20초 정도 걸릴 수 있습니다)
      </div>
    </div>`;
  }
  if (!orgSummary) return '';
  if (orgSummary.error) {
    return `<div class="p-4"><div class="alert alert-error py-2 text-sm"><div>⚠️ ${esc(orgSummary.error)}</div></div></div>`;
  }
  const orgs = orgSummary.orgs || [];
  return `
    <div class="p-4">
      <div class="text-xs text-base-content/50 mb-3">${esc(orgSummary.month || '')} 기준 · 교역자/자문회/장년회/부녀회/청년회/기타 6개 조직 · 카드 클릭 시 그 부서 상세로 이동</div>
      <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-3">
        ${orgs.map(o => {
          const tc = o.tierCounts || {};
          return `
          <button class="btn-org-card card card-border bg-base-100 shadow-sm text-left hover:shadow-md hover:-translate-y-0.5 transition-all" data-dept="${esc(o.dept)}">
            <div class="card-body p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="text-xl">${DEPT_ICON[o.dept] || '📁'}</span>
                <span class="font-bold text-base-content">${esc(o.dept)}</span>
              </div>
              <div class="grid grid-cols-2 gap-x-2 gap-y-1 text-xs">
                <div class="text-base-content/50">총 교사 수</div><div class="text-right font-medium">${o.totalTeachers}명</div>
                <div class="text-base-content/50">휴교사</div><div class="text-right font-medium">${(tc['휴교사']||0)}명 <span class="text-base-content/30">(${pct(tc['휴교사']||0, o.totalTeachers)}%)</span></div>
                <div class="text-base-content/50">활동교사</div><div class="text-right font-medium">${(tc['활동교사']||0)}명 <span class="text-base-content/30">(${pct(tc['활동교사']||0, o.totalTeachers)}%)</span></div>
                <div class="text-base-content/50">우수교사</div><div class="text-right font-medium">${(tc['우수교사']||0)}명 <span class="text-base-content/30">(${pct(tc['우수교사']||0, o.totalTeachers)}%)</span></div>
              </div>
            </div>
          </button>`;
        }).join('')}
      </div>
    </div>
  `;
}

// 부서 전체 요약 카드 (지역 필터와 무관하게 항상 부서 전체 기준)
function summaryCardHtml(summary) {
  if (!summary) return '';
  return `
    <div class="px-4 pt-4">
      <div class="card card-border bg-base-100 shadow-sm">
        <div class="card-body p-4">
          <div class="text-xs font-bold text-base-content/50 mb-1">📊 부서 전체 요약</div>
          <div class="flex flex-wrap items-end gap-x-7 gap-y-3">
            <div>
              <div class="text-xs text-base-content/50">총 교사 수</div>
              <div class="text-2xl font-black text-primary">${summary.totalTeachers.toLocaleString()}명</div>
            </div>
            ${TIER_ORDER.map(t => `
              <div>
                <div class="text-xs ${TIER_TEXT_COLOR[t]} font-medium">${esc(t)}</div>
                <div class="text-sm font-bold text-base-content">${(summary.tierCounts[t]||0).toLocaleString()}명 <span class="text-base-content/40 text-xs font-normal">(${pct(summary.tierCounts[t]||0, summary.totalTeachers)}%)</span></div>
              </div>
            `).join('')}
            <div>
              <div class="text-xs text-base-content/50">활동자 수</div>
              <div class="text-sm font-bold">${summary.activeCount.toLocaleString()}명</div>
            </div>
            <div>
              <div class="text-xs text-base-content/50">이번 달 활동</div>
              <div class="text-sm font-bold">${summary.monthlyActivityCount.toLocaleString()}건</div>
            </div>
            <div>
              <div class="text-xs text-base-content/50">승급 대상</div>
              <div class="text-sm font-bold ${summary.promotionCount ? 'text-success' : ''}">${summary.promotionCount.toLocaleString()}명</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

// 지역별 상세 섹션 (표/그래프 토글) — 지역 필터와 무관하게 부서 내 전 지역을 항상 나열
function byRegionSectionHtml(byRegion) {
  if (!byRegion || byRegion.length === 0) return '';
  const toggleLabel = state.regionView === 'table' ? '📊 그래프로 보기' : '📋 표로 보기';
  return `
    <div class="px-4 pt-3">
      <div class="flex items-center justify-between mb-2">
        <div class="text-xs font-bold text-base-content/50">🗺️ 지역별 상세</div>
        <button id="btn-region-view-toggle" class="btn btn-xs btn-outline">${toggleLabel}</button>
      </div>
      <div class="bg-info/10 border border-info/30 rounded-lg p-3 text-[11px] text-base-content/70 leading-relaxed mb-2">
        ℹ️ 지금 보고 있는 부서 안에서 <b>지역별로</b> 교사 현황을 나눠 보여드립니다. 지역마다 총 교사 수,
        등급별 인원(휴교사·교사·활동교사·우수교사, 각 인원과 비율), 이번 달 활동한 교사 수(활동자),
        이번 달 총 활동 건수, 승급 대상자 수가 나옵니다. 우리 지역이 다른 지역과 비교해 활동이 활발한

      </div>

// 지역별 상세 그래프 3종 (막대 높이는 지역 수에 비례 — 모바일에서도 지역명이 안 겹치도록)
function chartHeight(n) { return Math.max(200, n * 30 + 40); }

        <div class="bg-info/10 border border-info/30 rounded-lg p-3 text-[11px] text-base-content/70 leading-relaxed mb-3">
          ℹ️ 지역마다 교사 등급 분포를 막대 4개(휴교사·교사·활동교사·우수교사, 색깔로 구분)로 나란히
          비교할 수 있는 그래프입니다. 각 막대의 길이는 <b>그 지역 전체 교사 중 그 등급이 차지하는 비율(%)</b>을
          뜻합니다 — 인원 수가 아니라 비율이라, 교사 수가 다른 지역끼리도 바로 비교할 수 있습니다.
          활동교사·우수교사 막대가 길수록 활동이 활발한 지역이고, 휴교사 막대가 길면 관리가 더 필요한
          지역입니다. 지역별 막대를 나란히 비교해 보시면 어느 지역에 더 신경 써야 할지 한눈에 파악하실 수
          있습니다.
        </div>
        <div style="height:${h}px"><canvas id="chart-tier-stack"></canvas></div>

    </div>

function destroyRegionCharts() {
  regionCharts.forEach(c => c.destroy());
  regionCharts = [];
}

function renderRegionCharts(byRegion) {
  if (!byRegion || byRegion.length === 0) return;
  const labels = byRegion.map(r => r.region);

  // 지역(세트)마다 휴교사·교사·활동교사·우수교사 4개 막대를 나란히(그룹) 표시 — 한 지역 안에서
  // 전 교사의 등급 분포 추이를 한눈에 비교하는 지표(지역장·중간관리자용). stacked 아님(그룹 막대).
  const c3 = document.getElementById('chart-tier-stack');
  if (c3) regionCharts.push(new Chart(c3, {
    type: 'bar',
    data: {
      labels,
      datasets: TIER_ORDER.map(t => ({
        label: t, backgroundColor: TIER_CHART_COLOR[t],
        data: byRegion.map(r => pct(r.tierCounts[t]||0, r.totalTeachers))
      }))
    },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
      scales: { x: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } }, y: {} } }
  }));
}

// ============ 지역별 활동 분석 (getAllActivities 기반, 이번 달) ============
// "이번 달 활동" 건수 하나만 보여주던 것을, 활동 유형(11종)별로 지역마다 몇 건·몇 %인지 펼쳐서
// 활동이 어디에 치중돼 있는지 보여주는 섹션. 지역별 상세와 같은 표/그래프 토글 형태.

function isThisMonth(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return false;
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}

// report: 현재 부서의 getDistrictReport 캐시(지역 필터와 무관하게 항상 부서 전체 rows 기준).
function buildActivityAnalysis(report) {
  if (!report || !allActivities) return null;
  const regionOf = {};
  const teacherCountByRegion = {};
  report.rows.forEach(r => {
    regionOf[String(r.memberId).trim()] = r.region || '';
    teacherCountByRegion[r.region || ''] = (teacherCountByRegion[r.region || ''] || 0) + 1;
  });

  const countsByRegion = {}; // region -> { type -> count }
  const totalByRegion = {};
  allActivities.forEach(a => {
    const region = regionOf[String(a.memberId).trim()];
    if (region === undefined) return; // 이 부서 소속 교사가 아님
    if (!isThisMonth(a.submittedAt)) return;
    (a.activities || []).forEach(type => {
      if (!type) return;
      if (!countsByRegion[region]) countsByRegion[region] = {};
      countsByRegion[region][type] = (countsByRegion[region][type] || 0) + 1;
      totalByRegion[region] = (totalByRegion[region] || 0) + 1;
    });
  });

  const regions = Object.keys(teacherCountByRegion);
  const seenTypes = new Set();
  Object.values(countsByRegion).forEach(m => Object.keys(m).forEach(t => seenTypes.add(t)));
  const types = ACTIVITY_OPTIONS.filter(t => seenTypes.has(t))
    .concat([...seenTypes].filter(t => !ACTIVITY_OPTIONS.includes(t)));

  const regionStats = regions.map(region => {
    const total = totalByRegion[region] || 0;
    const teacherCount = teacherCountByRegion[region] || 0;
    return {
      region, total, teacherCount,
      perTeacher: teacherCount > 0 ? total / teacherCount : 0,
      counts: countsByRegion[region] || {}
    };
  }).sort((a, b) => b.total - a.total);

  // 상/중/하 평가 — 교사 1인당 이번 달 활동 건수 기준, 부서 내 지역 순위를 3분위로 나눔.
  const rankOrder = [...regionStats].sort((a, b) => b.perTeacher - a.perTeacher);
  const rankMap = {};
  rankOrder.forEach((r, i) => { rankMap[r.region] = i; });
  const n = rankOrder.length;
  regionStats.forEach(r => {
    if (n <= 1) { r.grade = '-'; return; }
    const i = rankMap[r.region];
    const third = n / 3;
    r.grade = i < third ? '상' : (i < third * 2 ? '중' : '하');
  });

  return { types, regionStats };
}

function activityAnalysisTableHtml(analysis) {
  const { types, regionStats } = analysis;
  if (regionStats.length === 0 || types.length === 0) {
    return `<div class="text-xs text-base-content/40 border border-dashed border-base-300 rounded-box p-6 text-center">이번 달 활동 기록이 없습니다.</div>`;
  }
  return `
    <div class="overflow-x-auto border border-base-300 rounded-box">
      <table class="table table-zebra table-sm">
        <thead class="sticky top-0 bg-base-100"><tr>
          <th>지역</th><th>총 활동</th>
          ${types.map(t => `<th class="whitespace-nowrap">${esc(ACTIVITY_ICON[t]||'')} ${esc(t)}</th>`).join('')}
          <th>평가</th>
        </tr></thead>
        <tbody>
          ${regionStats.map(r => `
            <tr>
              <td class="font-medium">${esc(r.region || '(미상)')}</td>
              <td>${r.total}건</td>
              ${types.map(t => {
                const c = r.counts[t] || 0;
                return `<td class="text-xs whitespace-nowrap">${c}건 <span class="text-base-content/40">(${pct(c, r.total)}%)</span></td>`;
              }).join('')}
              <td><span class="badge ${GRADE_BADGE[r.grade]} badge-sm">${esc(r.grade)}</span></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function activityAnalysisChartsHtml(analysis) {
  const h = chartHeight(analysis.regionStats.length);
  return `
    <div class="card card-border bg-base-100 shadow-sm">
      <div class="card-body p-3">
        <div class="text-xs font-medium text-base-content/60 mb-2">📊 지역별 활동 유형 비중 (이번 달, 지역 막대 100% 기준)</div>
        <div style="height:${h}px"><canvas id="chart-activity-analysis"></canvas></div>
      </div>
    </div>
  `;
}

function renderActivityAnalysisChart(analysis) {
  const c = document.getElementById('chart-activity-analysis');
  if (!c || !analysis || analysis.regionStats.length === 0) return;
  const labels = analysis.regionStats.map(r => r.region || '(미상)');
  const datasets = analysis.types.map((t, i) => ({
    label: t,
    backgroundColor: ACTIVITY_PALETTE[i % ACTIVITY_PALETTE.length],
    data: analysis.regionStats.map(r => pct(r.counts[t] || 0, r.total))
  }));
  regionCharts.push(new Chart(c, {
    type: 'bar',
    data: { labels, datasets },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 9 } } } },
      scales: { x: { stacked: true, beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } }, y: { stacked: true } } }
  }));
}

function activityAnalysisSectionHtml(analysis) {
  if (allActivitiesLoading && !allActivities) {
    return `
      <div class="px-4 pt-3">
        <div class="text-xs font-bold text-base-content/50 mb-2">📊 지역별 활동 분석 (이번 달)</div>
        <div class="text-xs text-base-content/40 border border-base-300 rounded-box p-6 text-center">
          <span class="loading loading-spinner loading-sm align-middle mr-1"></span>이번 달 활동 내역 불러오는 중...
        </div>
      </div>`;
  }
  if (!analysis) return '';
  const toggleLabel = state.activityView === 'table' ? '📊 그래프로 보기' : '📋 표로 보기';
  return `
    <div class="px-4 pt-3">
      <div class="flex items-center justify-between mb-2">
        <div class="text-xs font-bold text-base-content/50">📊 지역별 활동 분석 (이번 달)</div>
        <button id="btn-activity-view-toggle" class="btn btn-xs btn-outline">${toggleLabel}</button>
      </div>
      ${state.activityView === 'table' ? activityAnalysisTableHtml(analysis) : activityAnalysisChartsHtml(analysis)}
    </div>
  `;
}

function regionFilterHtml(regions, shownCount) {
  return `
    <div class="flex items-center gap-2 px-4 py-3 border-y border-base-300 bg-base-100">
      <label class="text-xs text-base-content/50">🔍 지역 필터</label>
      <select id="region-select" class="select select-bordered select-sm w-40">
        <option value="" ${state.region === '' ? 'selected' : ''}>전체 (${regions.length}개 지역)</option>
        ${regions.map(r => `<option value="${esc(r)}" ${state.region === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}
      </select>
      <span class="text-xs text-base-content/40 ml-auto">${shownCount}명 표시</span>
    </div>
  `;
}

function suggestionCell(t) {
  const s = t.suggestion;
  if (!s) return `<span class="text-base-content/30 text-xs">-</span>`;
  const key = t.memberId + '::' + s.suggestedTier;
  const instantKey = 'instant::' + t.memberId;
  return `
    <div class="flex flex-col gap-1">
      <div class="flex items-center gap-1 flex-wrap text-xs">
        <span class="badge ${TIER_BADGE[s.suggestedTier] || 'badge-ghost'} badge-sm">→ ${esc(s.suggestedTier)}</span>
        ${s.pendingType === 'reason' ? '<span class="badge badge-warning badge-outline badge-xs">사유자</span>' : ''}
      </div>
      <div class="text-[10px] text-base-content/40">${esc(s.reason)}</div>
      <div class="flex items-center gap-1">
        <progress class="progress progress-primary w-14 h-1.5" value="${s.approvalCount}" max="2"></progress>
        <span class="text-[10px] text-base-content/40">${s.approvalCount}/2</span>
      </div>
      <div class="flex items-center gap-1">
        <button class="btn-approve btn btn-primary btn-xs" data-mid="${esc(t.memberId)}" data-tier="${esc(s.suggestedTier)}" ${state.approving[key] ? 'disabled' : ''}>
          ${state.approving[key] ? '처리중...' : '✅ 승인(2인)'}
        </button>
        <button class="btn-tier-apply btn btn-outline btn-success btn-xs" data-mid="${esc(t.memberId)}" data-tier="${esc(s.suggestedTier)}" ${state.approving[instantKey] ? 'disabled' : ''} title="관리자 단독 즉시 반영 — 2인 승인 없이 바로 등급이 바뀝니다">
          ${state.approving[instantKey] ? '처리중...' : '⚡ 즉시 반영'}
        </button>
      </div>
    </div>
  `;
}

function tableHtml(rows) {
  if (rows.length === 0) {
    return `<div class="text-center py-16">
      <div class="text-5xl mb-3">📭</div>
      <div class="text-sm text-base-content/40">이 조건에 해당하는 교사가 없습니다.</div>
    </div>`;
  }
  return `
    <div class="overflow-x-auto">
      <table class="table table-zebra table-sm">
        <thead class="sticky top-0 bg-base-100"><tr>
          <th>이름</th><th>지역</th><th>등급</th><th>이번 달 활동</th><th>마지막 활동일</th><th>승급·강등 제안</th>
        </tr></thead>
        <tbody>
          ${rows.map(t => `
            <tr>
              <td class="font-medium">${esc(t.name)}<div class="text-[10px] text-base-content/40">${esc(t.memberId)}</div></td>
              <td class="text-base-content/60 text-xs">${esc(t.region || '')}</td>
              <td><span class="badge ${TIER_BADGE[t.tier] || 'badge-ghost'} badge-sm">${esc(t.tier)}</span></td>
              <td class="text-center">${t.monthlyCount}건</td>
              <td class="text-xs whitespace-nowrap ${t.lastActivityDate ? '' : 'text-base-content/40'}">${t.lastActivityDate ? esc(t.lastActivityDate) : '기록 없음'}</td>
              <td class="min-w-[160px]">${suggestionCell(t)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  const root = document.getElementById('root');
  const isOverview = state.dept === null;
  const report = isOverview ? null : state.cache[state.dept];
  const allRows = report ? report.rows : [];
  const filteredRows = state.region ? allRows.filter(r => r.region === state.region) : allRows;
  const pendingCount = filteredRows.filter(t => t.suggestion).length;
  const tableRows = state.pendingOnly ? filteredRows.filter(t => t.suggestion) : filteredRows;
  const analysis = (!isOverview && report) ? buildActivityAnalysis(report) : null;

  root.innerHTML = `
    <div class="navbar bg-neutral text-neutral-content px-5 py-4 min-h-0">
      <div class="flex-1 flex items-center gap-2">
        <span class="text-xl leading-none">🗺️</span>
        <div class="text-lg font-bold">부서별</div>
      </div>
    </div>
    <div class="brand-accent-bar"></div>
    ${mainNavHtml('district')}

    ${!isOverview ? `
      <div class="px-4 pt-3 flex items-center justify-between">
        <button id="btn-back-overview" class="text-xs text-primary hover:underline">← 전체 요약</button>
        <div class="text-sm font-bold text-base-content flex items-center gap-1">${DEPT_ICON[state.dept] || '📁'} ${esc(state.dept)}</div>
      </div>` : ''}

    ${isOverview
      ? orgSummarySectionHtml()
      : state.loading
        ? `<div class="text-sm text-base-content/40 text-center py-16"><span class="loading loading-spinner loading-md align-middle mr-2"></span>불러오는 중...</div>`
        : state.error
          ? `<div class="p-4"><div class="alert alert-error py-2 text-sm"><div>⚠️ ${esc(state.error)}</div></div></div>`
          : `
            ${summaryCardHtml(report && report.summary)}
            ${byRegionSectionHtml(report && report.byRegion)}
            ${activityAnalysisSectionHtml(analysis)}
            <details id="teacher-detail-details" class="mt-3 mx-4 border border-base-300 rounded-box bg-base-100 overflow-hidden" ${state.teacherDetailOpen ? 'open' : ''}>
              <summary class="cursor-pointer select-none px-4 py-3 text-xs font-bold text-base-content/50 flex items-center justify-between">
                <span>🔍 교사별 상세 (${tableRows.length}${state.pendingOnly ? `/${filteredRows.length}` : ''}명)</span>
                <span class="text-base-content/30 text-[11px] font-normal">펼치기/접기</span>
              </summary>
              <div class="border-t border-base-300">
                ${regionFilterHtml((report && report.regions) || [], filteredRows.length)}
                ${pendingCount > 0 ? `
                  <div class="p-4 pb-0">
                    <div class="alert alert-warning py-2 text-sm flex items-center justify-between gap-3">
                      <div>📌 등급변경 제안 ${pendingCount}건 — 표의 "승급·강등 제안" 열에서 ✅ 승인(2인 합의) 또는 ⚡ 즉시 반영(관리자 단독)으로 처리하세요.</div>
                      <label class="flex items-center gap-1.5 text-xs whitespace-nowrap cursor-pointer">
                        <input type="checkbox" id="pending-only-checkbox" class="checkbox checkbox-xs" ${state.pendingOnly ? 'checked' : ''}>
                        제안 있는 교사만 보기
                      </label>
                    </div>
                  </div>` : ''}
                <div class="p-4">${tableHtml(tableRows)}</div>
              </div>
            </details>
          `}
  `;

  document.querySelectorAll('.btn-org-card').forEach(btn => {
    btn.onclick = () => switchDept(btn.dataset.dept);
  });
  const backBtn = document.getElementById('btn-back-overview');
  if (backBtn) backBtn.onclick = () => switchDept(null);
  const regionSelect = document.getElementById('region-select');
  if (regionSelect) regionSelect.onchange = (e) => switchRegion(e.target.value);
  document.querySelectorAll('.btn-approve').forEach(btn => {
    btn.onclick = () => {
      const t = filteredRows.find(r => r.memberId === btn.dataset.mid && r.suggestion && r.suggestion.suggestedTier === btn.dataset.tier);
      if (t) approve(t);
    };
  });
  document.querySelectorAll('.btn-tier-apply').forEach(btn => {
    btn.onclick = () => applyTierChangeInstant(btn.dataset.mid, btn.dataset.tier);
  });
  const detailsEl = document.getElementById('teacher-detail-details');
  if (detailsEl) detailsEl.ontoggle = () => { state.teacherDetailOpen = detailsEl.open; };
  const pendingOnlyCb = document.getElementById('pending-only-checkbox');
  if (pendingOnlyCb) pendingOnlyCb.onchange = (e) => { state.pendingOnly = e.target.checked; render(); };

  const viewToggleBtn = document.getElementById('btn-region-view-toggle');
  if (viewToggleBtn) viewToggleBtn.onclick = () => {
    state.regionView = state.regionView === 'table' ? 'chart' : 'table';
    render();
  };
  const activityToggleBtn = document.getElementById('btn-activity-view-toggle');
  if (activityToggleBtn) activityToggleBtn.onclick = () => {
    state.activityView = state.activityView === 'table' ? 'chart' : 'table';
    render();
  };

  destroyRegionCharts();
  if (!isOverview && report && !state.loading && !state.error) {
    if (state.regionView === 'chart') renderRegionCharts(report.byRegion);
    if (state.activityView === 'chart') renderActivityAnalysisChart(analysis);
  }
}

loadOrgSummary(false); // 기본 진입 화면 = "전체 요약"(state.dept === null)
</script>
