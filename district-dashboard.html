<!DOCTYPE html>
<html lang="ko" data-theme="jesagil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제사장의 길 - 부서별</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --color-primary: #5B4FCF;
    --color-primary-light: #EDE9FF;
    --color-primary-dark: #3D34A5;
    --color-surface: #FFFFFF;
    --color-card: #FFFFFF;
    --color-bg: #F5F5F5;
    --color-text: #1A1A2E;
    --color-text-sub: #666680;
    --color-border: #E8E8F0;
    --color-success: #2D9B6F;
    --color-warning: #E8A020;
    --color-error: #D94040;
    --color-accent: #FF6B6B;
    --radius-card: 16px;
    --radius-btn: 12px;
    --radius-input: 10px;
    --shadow-card: 0 2px 12px rgba(0,0,0,0.08);
    --height-btn: 52px;
    --height-btn-sm: 44px;
    --height-header: 56px;
    --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px;
  }
  .lucide-i { width:1em; height:1em; display:inline-block; vertical-align:-0.15em; flex-shrink:0; }
  .kko-card-in { animation: kkoCardIn .3s ease; }
  @keyframes kkoCardIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  .kko-fade-in { animation: kkoFadeIn .2s ease; }
  @keyframes kkoFadeIn { from { opacity:0; } to { opacity:1; } }

  /* 제사장의 길 공통 디자인 시스템 테마 (jesagil) — 다른 관리자 화면과 동일, primary는 카카오톡 보라(#5B4FCF)로 통일 */
  [data-theme="jesagil"] {
    --p: 51.43% 0.1901 281.61; --pc: 100% 0 0;
    --s: 66.58% 0.1574 58.32;  --sc: 100% 0 0;
    --a: 59.60% 0.1274 163.23; --ac: 100% 0 0;
    --n: 27.95% 0.0368 260.03; --nc: 96.70% 0.0029 264.54;
    --b1: 100% 0 0; --b2: 96.70% 0.0029 264.54; --b3: 92.76% 0.0058 264.53;
    --bc: 27.81% 0.0296 256.85;
    --in: 68.47% 0.1479 237.32; --inc: 100% 0 0;
    --su: 61.67% 0.1191 162.14; --suc: 100% 0 0;
    --wa: 75.76% 0.1525 74.86;  --wac: 0% 0 0;
    --er: 59.56% 0.1901 25.05;  --erc: 100% 0 0;
    --rounded-box: 0.75rem; --rounded-btn: 0.5rem; --rounded-badge: 1rem;
  }
  html, body { margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: var(--color-bg); }
  .brand-accent-bar { height: 3px; background: linear-gradient(90deg, oklch(var(--p)), oklch(var(--s)), oklch(var(--a))); }

  /* 카카오톡 스타일 헤더 — 56px 보라 */
  .kko-header { height:56px; min-height:56px; display:flex; align-items:center; background:var(--color-primary); color:#fff; padding:0 20px; }

  /* 기존 DaisyUI .card.card-border 요소(요약/지역별/부서 카드 등)를 카카오톡 카드 룩(흰 배경+그림자+radius 16px)으로 통일 */
  .card-border { border-width: 0 !important; border-radius: var(--radius-card) !important; box-shadow: var(--shadow-card) !important; }

  /* 지역별 표 — 카드형(흰 배경+그림자) 래퍼. overflow는 강제하지 않음(가로 스크롤 표의 sticky 헤더/열 유지 목적) */
  .kko-table-card { background: var(--color-card); border-radius: var(--radius-card); box-shadow: var(--shadow-card); border: none; }

  /* 표 행 hover — 연보라 배경 */
  .table tbody tr:hover, .table tbody tr:hover td { background: var(--color-primary-light) !important; }
</style>
</head>
<body class="bg-base-200 min-h-screen">
<div class="max-w-5xl mx-auto min-h-screen bg-base-100 shadow-sm flex flex-col">
  <div id="root" class="flex-1"></div>
</div>

<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyXJtQEWGdF6PKv2qstTp3ZgjhMSWfmUShh4uw8Km9LDJjj78WLmGO89HHE0Eb3M5lW/exec";

// 백엔드 ORG_DEPTS 와 순서 동일 — 교사명단 "부서" 컬럼에 없는 값은 전부 "기타"로 묶여서 옴.

const deptBucket = d => (DEPTS.includes(d) && d !== '기타') ? d : '기타'; // 5개 외 부서(예: 교육부)는 '기타'로 묶임
const DEPT_ICON = { '교역자': '⛪', '자문회': '🧭', '장년회': '👨‍👩‍👧', '부녀회': '👩', '청년회': '🧑‍🎓', '기타': '📁' };

// Lucide SVG 아이콘 — 헤더/섹션 타이틀/필터/빈 상태 등 눈에 잘 띄는 자리 우선 교체용.
// wrapper: <svg class="lucide-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">{inner}</svg>
function lucide(inner) { return `<svg class="lucide-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`; }
const ICONS = {
  map: lucide('<path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z" /><path d="M15 5.764v15" /><path d="M9 3.236v15" />'),
  users: lucide('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M16 3.128a4 4 0 0 1 0 7.744" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" />'),
  barChart2: lucide('<path d="M5 21v-6" /><path d="M12 21V3" /><path d="M19 21V9" />'),
  alertTriangle: lucide('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" />'),
  search: lucide('<path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" />'),
  clipboardList: lucide('<rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="M12 11h4" /><path d="M12 16h4" /><path d="M8 11h.01" /><path d="M8 16h.01" />'),
  checkCircle2: lucide('<circle cx="12" cy="12" r="10" /><path d="m16 9-5.5 5.5L8 12" />'),
  mapPin: lucide('<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /><circle cx="12" cy="10" r="3" />'),
  zap: lucide('<path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z" />'),
  lock: lucide('<rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />'),
};

// 2026-09-15: 사용자 요청 — "협력교사"는 표/카드/그래프 등 UI 라벨에는 짧게 "협력"으로만 표기.
// 내부 값(ROLE_PARTS_DASH 원소, state.expandedRoleCol 키, getDistrictReport 응답 필드명)은
// 항상 '협력교사' 그대로 유지하고, 화면에 그릴 때만 이 함수를 통해 표시 텍스트를 바꾼다.
function roleShortLabel(role) { return role === '협력교사' ? '협력' : role; }

// 2026-09-16: 전도부 총무 피드백 — 이 화면은 이미 부서 탭 하나로 범위가 좁혀진 상세 화면이라
// "전주 OO회" 접두어가 중복이라는 지적으로 전부 제거, 지역 번호만 표기(예: "1지역"). 교역자처럼
// 지역 구분이 없는 부서는 region이 비어있으므로 그때만 부서명을 대신 보여준다.
function regionOnlyLabel(dept, region) {
  if (region) return region;
  return (dept === '교역자') ? '전체' : (dept || '전체');
}

const TIER_ORDER = ['휴교사', '교사', '활동교사', '우수교사'];
const TIER_BADGE = { '우수교사': 'badge-secondary', '활동교사': 'badge-accent', '교사': 'badge-primary', '휴교사': 'badge-ghost' };
const TIER_TEXT_COLOR = { '휴교사': 'text-base-content/50', '교사': 'text-primary', '활동교사': 'text-accent', '우수교사': 'text-secondary' };

const TEACHER_VIEW = new URLSearchParams(location.search).get('view') === 'teachers'; // 교사 명단 별도 화면(관리자 홈/메뉴의 "교사 명단")
const TEACHER_LIST_TAB = '__teacherList__'; // state.dept 의 특수값 — "👥 교사 명단" 탭(전체 교사 flat list)

let state = {
  dept: null,        // null = "전체 요약" 화면(조직별 요약), DEPTS 중 하나면 그 부서 상세 화면, TEACHER_LIST_TAB이면 교사 명단 탭
  region: '',       // '' = 전체 — per-teacher 목록만 이 값으로 클라이언트에서 필터링(요약/지역별 표는 항상 부서 전체 기준)
  loading: false,
  error: '',
  approving: {},    // memberId::suggestedTier → true
  cache: {},        // dept → getDistrictReport(region:'') 응답 (부서 전체 데이터를 한 번만 받아 캐시)
  regionView: 'table',   // 'table' | 'chart' — 지역별 상세 섹션 표시 방식
  activityView: 'table', // 'table' | 'chart' — 지역별 활동 분석 섹션 표시 방식
  roleActivityView: 'table', // 'table' | 'chart' — 지역별 인섬교(인도자·교사·섬김이·협력) 활동 섹션 표시 방식
  teacherDetailOpen: false, // 교사별 상세(지역 필터+표) 접기/펼치기 — 기본 접힘
  pendingOnly: false, // true면 교사별 상세 표를 "승급·강등 제안 있는 교사만"으로 좁혀서 보여줌
  showSampleData: false, // 2026-09-16: 브리핑용 샘플 데이터 토글 — ON이면 "지역별 인섬교 활동" 표/그래프/AI분석이 실제 데이터 대신 고정 샘플을 사용
  aiAnalysis: null, // { loading, error, text } — 부서 탭 하단 "🤖 AI 지역 분석" 결과(부서 바뀌면 초기화)
  // 2026-09-15: 3역할(인도자/섬김이/교사) → 4역할(인도자/교사/섬김이/협력교사)로 확장.
  expandedRoleCol: { '인도자': false, '교사': false, '섬김이': false, '협력교사': false }, // "지역별 인섬교 활동" 표에서 역할 열 헤더 클릭 시 11개 항목 펼치기/접기
  // Phase 2(2026-09-15): 리더 격려 메시지 팝업 — encourageTarget이 {memberId,name}이면 열림.
  encourageTarget: null,
  encourageFromName: '', // 세션 내 재입력 편의를 위해 보내는 분 성함을 기억(로그인 없는 관리자 화면이라 매번 입력 필요)
  encourageText: '',
  encourageSending: false,
  encourageSentNote: '',
  // 2026-09-16: "👥 교사 명단" 탭 — 전체 교사 flat list 필터 + 선택된 교사(상세 패널).
  tlFilterDept: '장년회', // 교사 명단은 부서를 고른 상태로 시작(지역장·교관 등록이 부서별)
  tlChecked: new Set(), tlMinLeads: 0, tlPosQuery: '',
  bulkApproverDept: '', bulkApproverName: '', bulkTier: '', bulkBusy: false, bulkNote: '',
  tlFilterRegion: '',
  tlFilterTier: '',
  tlFilterApply: '', // '' | 'yes' | 'no' — 활동 신청 여부 필터
  tlSelected: null, // 선택된 교사의 memberId
  tlAssigning: false // 교관/지역장 지정 API 호출 중
};

// 전체 조직별 요약 (getOrgSummary) — "전체 요약" 화면 전용, 부서 상세와 별도로 캐시.
let orgSummary = null;
let orgSummaryLoading = false;

// 전체 활동실적(getAllActivities) — "지역별 활동 분석" 전용, 부서 상세 화면 진입 시 1회만 로드해 캐시.
let allActivities = null;
let allActivitiesLoading = false;

// 2026-09-16: "👥 교사 명단" 탭 전용 — 전체 교사 명단(getRoster) 1회만 로드해 캐시.
let rosterAll = null;
let rosterLoading = false;
// 2026-09-20: 부서별 "교사별 상세"를 교사 명단으로 통합 — 전 교사 활동/제안/활동 신청 리포트(getTeacherListReport)를 명단 행에 합친다.
let tlReport = null;
let tlReportLoading = false;

// 활동방(activity-room.html) ACTIVITY_OPTIONS 와 동일 목록 — 표/그래프의 열(항목) 표준 순서용.
const ACTIVITY_OPTIONS = [
  '전도 섭외', '전도 대상자 만남', '복음방 이전 상담 활동', '상담 활동', '상담 교육',
  '복음방 교사 교육', '동행 교사', '피드백', '선교센터 섬김이', '선교센터 교사로 출석', '선교센터 인도자'
];
const ACTIVITY_ICON = {
  '전도 섭외': '📞', '전도 대상자 만남': '🤝', '복음방 이전 상담 활동': '📖', '상담 활동': '💬',
  '상담 교육': '🎓', '복음방 교사 교육': '👩‍🏫', '동행 교사': '🚶', '피드백': '📝',
  '선교센터 섬김이': '🙌', '선교센터 교사로 출석': '✅', '선교센터 인도자': '🎯'
};
const ACTIVITY_PALETTE = ['#4f46e5','#0ea5e9','#059669','#d97706','#dc2626','#7c3aed','#db2777','#65a30d','#0891b2','#ea580c','#64748b'];
const GRADE_BADGE = { '상': 'badge-success', '중': 'badge-warning', '하': 'badge-ghost', '-': 'badge-ghost' };

const TIER_CHART_COLOR = { '휴교사': '#9ca3af', '교사': '#4f46e5', '활동교사': '#059669', '우수교사': '#d97706' };
let regionCharts = []; // Chart.js 인스턴스(지역별 상세+활동 분석 공용) — 다시 그리기 전 항상 destroy 해서 캔버스 재사용 시 에러 방지

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }
// home.html maskName()과 동일 규칙(2/3글자 이상 이름 마스킹) — MVP 카드에서 실명 노출 방지용.
function maskName(nm) {
  const s = String(nm || '').trim();
  if (s.length <= 1) return s;
  if (s.length === 2) return s[0] + '*';
  return s[0] + '*'.repeat(s.length - 2) + s[s.length - 1];
}

// 2026-09-17: 소제목 스타일 전면 강화(사용자 요청 — "폰트 크기 20px+/900굵기/네이비/배경 띠 +
// 바로 아래 1~2줄 설명"). 모든 섹션 소제목을 이 함수 하나로 통일해서 재사용 — 소제목 스타일을
// 나중에 또 바꾸면 여기 한 곳만 고치면 됨.
function sectionTitleBand(icon, title, desc, bandColor) {
  bandColor = bandColor || '#E0E7FF';
  return `
    <div class="rounded-lg px-3 py-2" style="background:${bandColor}">
      <div style="font-size:20px;font-weight:900;color:#1F3864;line-height:1.3">${icon} ${esc(title)}</div>
    </div>
    ${desc ? `<div class="text-xs text-base-content/50 mt-1 mb-2 leading-relaxed">${esc(desc)}</div>` : ''}
  `;
}

// 관리자 화면 공통 메인 내비게이션 — 관리자 홈 / 통합 / 부서별 / 피드백 / 교사 어플로 가기 5개.
// 세 관리방(통합·부서별·피드백) 어디서든 서로 바로 이동 가능하도록 각 파일에 동일하게 둠.
function mainNavHtml(current) {
  const item = (key, href, icon, label) => {
    const active = key === current;
    return `<a href="${href}" class="btn btn-xs ${active ? 'btn-primary pointer-events-none' : 'btn-ghost'}">${icon} ${label}</a>`;
  };
  return `
    <div class="flex flex-wrap items-center gap-1.5 px-5 py-2 bg-base-200 border-b border-base-300">
      <a href="admin-home.html" class="btn btn-xs btn-ghost">${ICONS.lock} 관리자 홈</a>
      ${item('edu', 'edu-dashboard.html', '🎓', '통합')}
      ${item('district', 'district-dashboard.html', ICONS.map, '부서별')}
      ${item('teachers', 'district-dashboard.html?view=teachers', '👥', '교사 명단')}
      <a href="home.html" class="btn btn-xs btn-ghost ml-auto">🏃 교사 어플로 가기</a>
    </div>
  `;
}

async function callApi(payload) {
  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return await res.json();
}

async function loadReport(force) {
  const key = state.dept;
  if (!force && state.cache[key]) { render(); return; }
  state.loading = true; state.error = '';
  render();
  try {
    // region은 항상 '전체'로 받아서 캐시 — 지역 드롭다운은 클라이언트에서만 필터링(재요청 없이 즉시 전환)
    const res = await callApi({ action: 'getDistrictReport', dept: state.dept, region: '' });
    if (res && res.error) { state.error = res.error; }
    else {
      if (Array.isArray(res.byRegion)) res.byRegion.sort((x, y) => String(x.region || '').localeCompare(String(y.region || ''), 'ko', { numeric: true })); // 1지역부터 순서대로
      state.cache[key] = res;
    }
  } catch (e) {
    state.error = '서버 연결에 실패했습니다: ' + e;
  }
  state.loading = false;
  render();
}

async function loadOrgSummary(force) {
  if (!force && orgSummary) { render(); return; }
  orgSummaryLoading = true;
  render();
  try {
    const res = await callApi({ action: 'getOrgSummary' });
    orgSummary = (res && !res.error) ? res : { error: (res && res.error) || '불러오기 실패' };
  } catch (e) {
    orgSummary = { error: String(e) };
  }
  orgSummaryLoading = false;
  render();
}

// "지역별 활동 분석" 전용 — 전 교사 활동실적을 1회만 받아 캐시(부서 무관, 부서 전환해도 재요청 없음).
async function loadAllActivities(force) {
  if (!force && (allActivities || allActivitiesLoading)) return;
  allActivitiesLoading = true;
  render();
  try {
    const res = await callApi({ action: 'getAllActivities' });

}

// "👥 교사 명단" 탭 전용 — 전체 교사 명단을 1회만 받아 캐시(부서 무관, 탭 전환해도 재요청 없음).
async function loadRosterAll(force) {
  if (!force && (rosterAll || rosterLoading)) return;
  rosterLoading = true;
  render();
  try {
    const res = await callApi({ action: 'getRoster' });
    rosterAll = (res && Array.isArray(res.rows)) ? res.rows : [];
  } catch (e) {

  }
  rosterLoading = false;

}

// 전 교사 리포트(이번 달 활동·마지막 활동일·승급/강등 제안·활동 신청)를 1회 받아 명단 행에 합친다(느려서 명단이 먼저 뜨고 뒤이어 채워짐).
async function loadTeacherReport(force) {
  if (!force && (tlReport || tlReportLoading)) return;
  tlReportLoading = true;
  render();
  try {
    const res = await callApi({ action: 'getTeacherListReport' });
    tlReport = (res && Array.isArray(res.rows)) ? res.rows : [];
    if (res && res.error) tlReport = [];
  } catch (e) {
    tlReport = [];
  }
  tlReportLoading = false;
  mergeTeacherReport();
  render();
}
function mergeTeacherReport() {
  if (!rosterAll || !tlReport) return;
  const byId = {};
  tlReport.forEach(r => { byId[String(r.memberId)] = r; });
  rosterAll.forEach(t => {
    const r = byId[String(t.memberId)];
    if (!r) return;
    t.monthlyCount = r.monthlyCount; t.lastActivityDate = r.lastActivityDate; t.conditionText = r.conditionText;
    t.actTotal = r.actTotal || 0; t.actTypes = r.actTypes || {}; t.leads1y = r.leads1y || 0; t.suggestion = r.suggestion; t.apply = r.apply; t.affilSel = r.affil; t.genderSel = r.gender; t._rep = true;
  });
}
// 앱에서 기록한 활동 요약 — "상담1 3 · 만남1 2" 형태(많은 순, 상위 3개 + 나머지 개수).
function actSummaryText(t, max) {
  const items = Object.entries(t.actTypes || {}).sort((a, b) => b[1] - a[1]);
  if (!items.length) return '';
  const shown = items.slice(0, max || 3).map(([k, v]) => k + ' ' + v).join(' · ');
  return items.length > (max || 3) ? shown + ' 외 ' + (items.length - (max || 3)) + '종' : shown;
}
function applyText(a) {
  if (!a) return '';
  const sch = a.scheduleType === '언제나' ? '언제나 가능' : a.scheduleType === '상의' ? '상의 후 결정'
    : [a.from && a.to ? a.from.slice(5).replace('-', '/') + '~' + a.to.slice(5).replace('-', '/') : '', (a.days || []).join(''), (a.times || []).join('·'), a.hours].filter(Boolean).join(' · ');
  return (a.roles || []).join('·') + (sch ? ' (' + sch + ')' : '');
}

// dept가 null이면 "전체 요약" 화면, TEACHER_LIST_TAB이면 "교사 명단" 탭으로 전환 — 이미 받아왔으면 재요청 없이 그대로 보여줌.
function switchDept(dept) {
  state.dept = dept;
  state.region = ''; // 부서를 바꾸면 지역 필터는 초기화(그 부서에 없는 지역일 수 있어서)
  state.aiAnalysis = null; // 다른 부서의 AI 분석 결과가 남아있지 않도록 초기화
  if (dept === null) loadOrgSummary(false);
  else if (dept === TEACHER_LIST_TAB) { loadRosterAll(false); loadTeacherReport(false); }
  else { loadReport(false); loadAllActivities(false); }
}

function switchRegion(region) {
  state.region = region;
  render(); // 이미 캐시된 부서 전체 데이터에서 클라이언트 필터링만 하면 되므로 재요청 불필요
}

// ============ 2026-09-16: "👥 교사 명단" 탭 — 전체 교사 flat list + 교관/지역장 지정 ============
// 기존 upsertRosterLeader 액션(교사명단 시트 "직책"열 갱신)을 그대로 재사용 — 신규 백엔드 없음.
async function assignPosition(t, position) {
  // 이미 그 직책이면 눌렀을 때 해제(빈 직책으로 되돌림), 아니면 새로 지정.
  const nextPosition = (t.position === position) ? '' : position;
  const label = position === '교관' ? '교관' : '지역장';
  const verb = nextPosition ? '지정' : '해제';
  if (!confirm(`${maskName(t.name)} 교사를 ${label}(으)로 ${verb}하시겠습니까?`)) return;
  state.tlAssigning = true;
  render();
  try {
    const res = await callApi({
      action: 'upsertRosterLeader',
      memberId: t.memberId, name: t.name, region: t.region, dept: t.dept, position: nextPosition
    });
    if (res && res.error) throw new Error(res.error);
    t.position = nextPosition; // 캐시된 rosterAll 행에도 즉시 반영(재요청 없이 화면 갱신)
  } catch (e) {
    alert(`${label} ${verb} 중 오류가 발생했습니다: ` + e.message);
  }
  state.tlAssigning = false;
  render();
}

// ④ 교육부·전도부 일괄 등급 승인. 교관·지역장은 등급 승인 권한이 없다(등록/지정만).
const APPROVER_DEPTS = ['교육부', '전도부'];

function teacherListRowsFiltered() {
  let rows = rosterAll || [];
  if (state.tlFilterDept) rows = rows.filter(t => deptBucket(t.dept) === state.tlFilterDept);
  if (state.tlFilterRegion) rows = rows.filter(t => t.region === state.tlFilterRegion);
  if (state.tlFilterTier) rows = rows.filter(t => t.tier === state.tlFilterTier);
  if (state.tlFilterApply === 'yes') rows = rows.filter(t => t._rep && t.apply);
  if (state.tlFilterApply === 'no') rows = rows.filter(t => t._rep && !t.apply);
  if (state.pendingOnly) rows = rows.filter(t => t.suggestion);
  if (state.tlMinLeads > 0) rows = rows.filter(t => t._rep && (t.leads1y || 0) >= state.tlMinLeads);
  return [...rows].sort((a, b) =>
    (a.dept || '').localeCompare(b.dept || '', 'ko') ||
    (a.region || '').localeCompare(b.region || '', 'ko', { numeric: true }) ||
    (a.name || '').localeCompare(b.name || '', 'ko'));
}

async function runBulkApprove(useSuggested) {
  const rows = teacherListRowsFiltered();
  const byId = {}; (rosterAll || []).forEach(t => { byId[t.memberId] = t; });
  const ids = [...state.tlChecked].filter(id => byId[id]);
  const items = [];
  ids.forEach(id => {
    const t = byId[id];
    const newTier = useSuggested ? (t.suggestion && t.suggestion.suggestedTier) : state.bulkTier;
    if (newTier && newTier !== t.tier) items.push({ memberId: id, newTier, prevTier: t.tier, reason: useSuggested ? (t.suggestion && t.suggestion.reason) || '' : '최근 1년 센터 등록·활동 실적 기준 일괄 승인' });
  });
  state.bulkNote = '';
  if (!state.bulkApproverDept) { state.bulkNote = '⚠️ 승인 주체(교육부/전도부)를 선택해주세요.'; render(); return; }
  if (!state.bulkApproverName.trim()) { state.bulkNote = '⚠️ 승인자 성함을 입력해주세요.'; render(); return; }
  if (!useSuggested && !state.bulkTier) { state.bulkNote = '⚠️ 변경할 등급을 선택해주세요.'; render(); return; }
  if (!items.length) { state.bulkNote = '⚠️ 변경할 대상이 없어요. (이미 그 등급이거나, 제안이 없는 분만 선택됐어요)'; render(); return; }
  const summary = {}; items.forEach(i => { summary[i.newTier] = (summary[i.newTier] || 0) + 1; });
  const sumText = Object.entries(summary).map(([k, v]) => `${k} ${v}명`).join(', ');
  if (!confirm(`${state.bulkApproverDept} ${state.bulkApproverName.trim()}님 승인으로 ${items.length}명의 등급을 변경합니다.\n(${sumText})\n진행할까요?`)) return;
  state.bulkBusy = true; render();
  try {
    const res = await callApi({ action: 'bulkChangeTier', items, approverDept: state.bulkApproverDept, approverName: state.bulkApproverName.trim() });
    if (res && res.error) throw new Error(res.error);
    const okIds = new Set((res.changed || []).map(c => String(c.memberId)));
    (rosterAll || []).forEach(t => {
      const it = items.find(i => String(i.memberId) === String(t.memberId));
      if (it && okIds.has(String(t.memberId))) { t.tier = it.newTier; t.suggestion = null; state.tlChecked.delete(t.memberId); }
    });
    state.bulkNote = `${res.changed.length}명 승인 완료` + ((res.failed && res.failed.length) ? ` (실패 ${res.failed.length}명)` : '');
    loadTeacherReport(true); // 제안/등급을 서버 기준으로 다시 계산
  } catch (e) {
    state.bulkNote = '⚠️ 승인 실패: ' + e.message;
  }
  state.bulkBusy = false; render();
}

function wireTeacherList() {
  const $ = id => document.getElementById(id);
  document.querySelectorAll('.tl-dept-tab').forEach(b => {
    b.onclick = () => { state.tlFilterDept = b.dataset.dept; state.tlFilterRegion = ''; state.tlPosQuery = ''; render(); };
  });
  const bind = (id, fn) => { const el = $(id); if (el) el.onchange = fn; };
  bind('tl-filter-region', e => { state.tlFilterRegion = e.target.value; render(); });
  bind('tl-filter-tier', e => { state.tlFilterTier = e.target.value; render(); });
  bind('tl-filter-apply', e => { state.tlFilterApply = e.target.value; render(); });
  bind('tl-min-leads', e => { state.tlMinLeads = Math.max(0, Number(e.target.value) || 0); render(); });
  bind('bulk-approver-dept', e => { state.bulkApproverDept = e.target.value; });
  bind('bulk-tier', e => { state.bulkTier = e.target.value; });
  const nm = $('bulk-approver-name'); if (nm) nm.oninput = e => { state.bulkApproverName = e.target.value; };
  const q = $('tl-pos-q');
  if (q) q.oninput = e => { state.tlPosQuery = e.target.value; const box = $('tl-pos-results'); if (box) { box.innerHTML = positionResultsHtml(); wirePosButtons(); } };
  wirePosButtons();
  document.querySelectorAll('.tl-check').forEach(cb => {
    cb.onclick = e => e.stopPropagation();
    cb.onchange = () => { if (cb.checked) state.tlChecked.add(cb.dataset.mid); else state.tlChecked.delete(cb.dataset.mid); render(); };
  });
  const head = $('tl-check-head');
  if (head) head.onchange = () => { const rows = teacherListRowsFiltered(); rows.forEach(t => head.checked ? state.tlChecked.add(t.memberId) : state.tlChecked.delete(t.memberId)); render(); };
  const ca = $('tl-check-all'); if (ca) ca.onclick = () => { teacherListRowsFiltered().forEach(t => state.tlChecked.add(t.memberId)); render(); };
  const cs = $('tl-check-sug'); if (cs) cs.onclick = () => { teacherListRowsFiltered().filter(t => t.suggestion).forEach(t => state.tlChecked.add(t.memberId)); render(); };
  const cn = $('tl-check-none'); if (cn) cn.onclick = () => { state.tlChecked.clear(); render(); };
  const ba = $('bulk-apply'); if (ba) ba.onclick = () => runBulkApprove(false);
  const bs = $('bulk-apply-sug'); if (bs) bs.onclick = () => runBulkApprove(true);
  document.querySelectorAll('.tl-row').forEach(row => {
    row.onclick = () => { state.tlSelected = state.tlSelected === row.dataset.mid ? null : row.dataset.mid; render(); };
  });
  const dc = $('tl-detail-close'); if (dc) dc.onclick = () => { state.tlSelected = null; render(); };
}

function openEncourageModal(memberId, name) {
  state.encourageTarget = { memberId, name };

async function sendEncourageMessage() {
  const t = state.encourageTarget;
  if (!t) return;
  const fromName = (state.encourageFromName || '').trim();
  const message = (state.encourageText || '').trim();
  if (!fromName) { alert('보내는 분 성함을 입력해주세요.'); return; }
  if (!message) { alert('메시지를 입력해주세요.'); return; }
  state.encourageSending = true;
  render();
  try {
    const res = await callApi({ action: 'sendEncouragement', fromId: '', fromName, toId: t.memberId, message });
    if (res && res.error) throw new Error(res.error);
    state.encourageSentNote = `${t.name} 교사님께 전달했습니다! 💌`;
    state.encourageText = '';
  } catch (e) {
    state.encourageSentNote = '오류가 발생했습니다: ' + e.message;
  }
  state.encourageSending = false;
  render();
}

// ============ 지역별 활동 분석 (getAllActivities 기반, 이번 달) ============
// "이번 달 활동" 건수 하나만 보여주던 것을, 활동 유형(11종)별로 지역마다 몇 건·몇 %인지 펼쳐서
// 활동이 어디에 치중돼 있는지 보여주는 섹션. 지역별 상세와 같은 표/그래프 토글 형태.

function isThisMonth(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return false;
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}

// report: 현재 부서의 getDistrictReport 캐시(지역 필터와 무관하게 항상 부서 전체 rows 기준).
function buildActivityAnalysis(report) {
  if (!report || !allActivities) return null;
  const regionOf = {};
  const teacherCountByRegion = {};
  report.rows.forEach(r => {
    regionOf[String(r.memberId).trim()] = r.region || '';
    teacherCountByRegion[r.region || ''] = (teacherCountByRegion[r.region || ''] || 0) + 1;
  });

  const countsByRegion = {}; // region -> { type -> count }
  const totalByRegion = {};
  allActivities.forEach(a => {
    const region = regionOf[String(a.memberId).trim()];
    if (region === undefined) return; // 이 부서 소속 교사가 아님
    if (!isThisMonth(a.submittedAt)) return;
    (a.activities || []).forEach(type => {
      if (!type) return;
      if (!countsByRegion[region]) countsByRegion[region] = {};
      countsByRegion[region][type] = (countsByRegion[region][type] || 0) + 1;
      totalByRegion[region] = (totalByRegion[region] || 0) + 1;
    });
  });

  const regions = Object.keys(teacherCountByRegion);
  const seenTypes = new Set();
  Object.values(countsByRegion).forEach(m => Object.keys(m).forEach(t => seenTypes.add(t)));
  const types = ACTIVITY_OPTIONS.filter(t => seenTypes.has(t))
    .concat([...seenTypes].filter(t => !ACTIVITY_OPTIONS.includes(t)));

  const regionStats = regions.map(region => {
    const total = totalByRegion[region] || 0;
    const teacherCount = teacherCountByRegion[region] || 0;
    return {
      region, total, teacherCount,
      perTeacher: teacherCount > 0 ? total / teacherCount : 0,
      counts: countsByRegion[region] || {}
    };
  }).sort((a, b) => b.total - a.total);

  // 상/중/하 평가 — 교사 1인당 이번 달 활동 건수 기준, 부서 내 지역 순위를 3분위로 나눔.
  const rankOrder = [...regionStats].sort((a, b) => b.perTeacher - a.perTeacher);
  const rankMap = {};
  rankOrder.forEach((r, i) => { rankMap[r.region] = i; });
  const n = rankOrder.length;
  regionStats.forEach(r => {
    if (n <= 1) { r.grade = '-'; return; }
    const i = rankMap[r.region];
    const third = n / 3;
    r.grade = i < third ? '상' : (i < third * 2 ? '중' : '하');
  });

  return { types, regionStats };
}

// ============ 2026-09-15 후속: 지역별 인섬교(인도자·교사·섬김이·협력) 활동 표+그래프 ============
// 위 roleActivitySectionHtml(역할별 총 건수 박스+지역별 표)은 역할별 "총 건수"만 보여줌 —
// 사용자가 "역할 파트 × 11개 활동 항목별 건수/비율까지 지역별로 펼쳐서" 요청해서 신설.
// 활동방(home.html) 신규 역할기반 기록(roles+activityItem)만 대상 — roles가 비어있는 옛 방식
// 기록(activity-room.html 시절)은 이 표에서 제외(그건 아래 "지역별 활동 분석"이 계속 담당).
// 2026-09-15: 3역할(인도자/섬김이/교사) → 4역할(인도자/교사/섬김이/협력교사)로 확장.
const ROLE_PARTS_DASH = ['인도자', '교사', '섬김이', '협력교사'];
const ROLE_ACTIVITY_ITEMS_DASH = ['피드백', '섭외', '친분', '만남1', '만남2', '상담1', '상담2', '복음방', '동행교사', '센터소개', '센터수강'];
function _emptyRoleCounts() {
  const o = {};
  ROLE_PARTS_DASH.forEach(r => { o[r] = 0; });
  return o;
}

// report: 현재 부서의 getDistrictReport 캐시(allActivities는 buildActivityAnalysis와 동일 전역 캐시 재사용).
function buildRoleActivityBreakdown(report) {
  if (!report || !allActivities) return null;
  const regionOf = {};
  report.rows.forEach(r => { regionOf[String(r.memberId).trim()] = r.region || ''; });

  const counts = {}; // counts[region][role][item] = count
  const itemGrandTotal = {};
  let grandTotal = 0;

  allActivities.forEach(a => {
    const region = regionOf[String(a.memberId).trim()];
    if (region === undefined) return; // 이 부서 소속 교사가 아님
    if (!isThisMonth(a.submittedAt)) return;
    const roles = (a.roles || []).filter(r => ROLE_PARTS_DASH.includes(r));
    if (!roles.length) return; // 옛 방식 기록(역할 없음)은 이 표 대상 아님
    roles.forEach(role => {
      (a.activities || []).forEach(item => {
        if (!item) return;
        if (!counts[region]) counts[region] = {};
        if (!counts[region][role]) counts[region][role] = {};
        counts[region][role][item] = (counts[region][role][item] || 0) + 1;
        itemGrandTotal[item] = (itemGrandTotal[item] || 0) + 1;
        grandTotal++;
      });
    });
  });

  const allRegions = report.byRegion.map(r => r.region);

  const regionRoleTotal = {}; // regionRoleTotal[region][role] = 그 지역·역할의 활동 총 건수(그래프1용)
  const regionItemTotal = {}; // regionItemTotal[region][item] = 역할 무관 그 지역·항목 총 건수(그래프2용)
  allRegions.forEach(region => {
    regionRoleTotal[region] = {};
    regionItemTotal[region] = {};
    ROLE_PARTS_DASH.forEach(role => {
      const m = (counts[region] && counts[region][role]) || {};
      regionRoleTotal[region][role] = Object.values(m).reduce((s, v) => s + v, 0);
    });
    ROLE_ACTIVITY_ITEMS_DASH.forEach(item => {
      let sum = 0;
      ROLE_PARTS_DASH.forEach(role => { sum += ((counts[region] && counts[region][role] && counts[region][role][item]) || 0); });
      regionItemTotal[region][item] = sum;
    });
  });

  return { counts, allRegions, regionRoleTotal, regionItemTotal, itemGrandTotal, grandTotal };
}

// 그 지역에서 역할 무관 합산 건수가 가장 높은 항목("강세 항목") 이름 — 표/AI 프롬프트 공용.
function regionTopItem(b, region) {
  let top = '', topV = -1;
  ROLE_ACTIVITY_ITEMS_DASH.forEach(item => {
    const v = (b.regionItemTotal[region] && b.regionItemTotal[region][item]) || 0;
    if (v > topV) { top = item; topV = v; }
  });
  return topV > 0 ? top : '-';
}
function regionTopItemValue(b, region) {
  return Math.max(0, ...ROLE_ACTIVITY_ITEMS_DASH.map(item => (b.regionItemTotal[region] && b.regionItemTotal[region][item]) || 0));
}

// 2026-09-17: 강세(빨강)~중간(노랑)~약세(파랑) 대비 색상 스케일 — "강세 항목"열/히트맵 공용.
// t: 0(가장 약함, 파랑) ~ 1(가장 강함, 빨강).
function divergingColor(t) {
  t = Math.max(0, Math.min(1, isFinite(t) ? t : 0));
  const lerp = (a, b, u) => Math.round(a + (b - a) * u);
  let r, g, bch;
  if (t < 0.5) { const u = t / 0.5; r = lerp(0x1d, 0xea, u); g = lerp(0x4e, 0xb3, u); bch = lerp(0xd8, 0x08, u); }
  else { const u = (t - 0.5) / 0.5; r = lerp(0xea, 0xb9, u); g = lerp(0xb3, 0x1c, u); bch = lerp(0x08, 0x1c, u); }
  const textColor = (t < 0.35 || t > 0.65) ? '#fff' : '#111';
  return { bg: `rgb(${r},${g},${bch})`, text: textColor };
}

// ============ 2026-09-16: 샘플 데이터(브리핑 시연용) ============
// 실제 데이터가 아직 안 쌓였어도 표/그래프/AI 분석을 시연할 수 있도록, 화면 우측 상단 토글로
// 이 고정 샘플로 전환할 수 있다(state.showSampleData). 12개 지역(부녀회 기준 지역 수를 참고해
// 고정) × 역할 4파트(인도자/교사/섬김이/협력교사) × 항목 11개, 지역마다 눈에 띄는 "강세 항목"을 다르게 배정해 현실적인
// 편차를 만든다. Math.sin 기반 결정론적 시드를 써서 매 렌더마다 같은 값이 나오게 한다
// (Math.random을 쓰면 토글을 껐다 켤 때마다 숫자가 바뀌어 시연 중 혼란스러움).
const SAMPLE_REGIONS = Array.from({ length: 12 }, (_, i) => `${i + 1}지역`);
const SAMPLE_STRONG_ITEM_BY_REGION = {
  '1지역': '섭외', '2지역': '친분', '3지역': '만남1', '4지역': '만남2', '5지역': '상담1',
  '6지역': '상담2', '7지역': '피드백', '8지역': '복음방', '9지역': '동행교사',
  '10지역': '센터소개', '11지역': '센터수강', '12지역': '친분'
};
function _sampleSeed_(a, b, c, range) {
  const x = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453;
  return Math.floor((x - Math.floor(x)) * range);
}
function buildSampleRoleActivityBreakdown() {
  const counts = {};
  const itemGrandTotal = {};
  let grandTotal = 0;
  SAMPLE_REGIONS.forEach((region, ri) => {
    counts[region] = {};
    const strongItem = SAMPLE_STRONG_ITEM_BY_REGION[region];
    ROLE_PARTS_DASH.forEach((role, roi) => {
      counts[region][role] = {};
      const roleFactor = role === '교사' ? 1.3 : (role === '인도자' ? 1.1 : 1); // 교사 활동이 조금 더 많게
      ROLE_ACTIVITY_ITEMS_DASH.forEach((item, ii) => {
        const base = 2 + _sampleSeed_(ri, roi, ii, 6); // 기본 2~7건
        const boost = item === strongItem ? 10 + _sampleSeed_(ri, roi, ii, 6) : 0; // 강세 항목만 확 높임
        counts[region][role][item] = Math.round((base + boost) * roleFactor);
      });
    });
  });
  SAMPLE_REGIONS.forEach(region => {
    ROLE_PARTS_DASH.forEach(role => {
      ROLE_ACTIVITY_ITEMS_DASH.forEach(item => {
        const c = counts[region][role][item];
        itemGrandTotal[item] = (itemGrandTotal[item] || 0) + c;
        grandTotal += c;
      });
    });
  });

  const regionRoleTotal = {}, regionItemTotal = {};
  SAMPLE_REGIONS.forEach(region => {
    regionRoleTotal[region] = {};
    regionItemTotal[region] = {};
    ROLE_PARTS_DASH.forEach(role => { regionRoleTotal[region][role] = Object.values(counts[region][role]).reduce((s, v) => s + v, 0); });
    ROLE_ACTIVITY_ITEMS_DASH.forEach(item => {
      let sum = 0;
      ROLE_PARTS_DASH.forEach(role => { sum += counts[region][role][item]; });
      regionItemTotal[region][item] = sum;
    });
  });

  return { counts, allRegions: SAMPLE_REGIONS, regionRoleTotal, regionItemTotal, itemGrandTotal, grandTotal, isSample: true };
}

// ============ 2026-09-16: AI 분석 (지역별 인섬교 활동 데이터를 Gemini에 넘겨 요약) ============
// 백엔드 action 'analyzeDistrictData'(Code.gs — 프롬프트 조립을 서버에서 전담, Gemini+503
// 자동 3회 재시도 포함). 프런트는 원본 데이터만 만들어 보낸다(buildAiAnalysisData).
const AI_ANALYSIS_SECTIONS = ['📊 전체 활동 패턴', '🏆 강세 지역/항목', '⚠️ 보완 필요 지역/항목', '💡 다음 달 제안'];

// 2026-09-16: 프롬프트 조립(문구)을 백엔드 analyzeDistrictData_로 이전 — 이 함수는 이제
// 원본 데이터만 만들어서 그대로 보낸다(프롬프트 문구를 나중에 다듬을 때 프런트 재배포 없이
// 백엔드만 고치면 되도록). Code.gs의 analyzeDistrictData_와 이 데이터 shape은 항상 같이 맞출 것.
function buildAiAnalysisData(deptLabel, regionLabel, b) {
  return {
    부서: deptLabel, 지역필터: regionLabel,
    지역별: b.allRegions.map(region => ({
      지역: region,
      총건수: ROLE_PARTS_DASH.reduce((s, role) => s + b.regionRoleTotal[region][role], 0),
      역할별: Object.fromEntries(ROLE_PARTS_DASH.map(role => [role, b.regionRoleTotal[region][role]])),
      항목별: Object.fromEntries(ROLE_ACTIVITY_ITEMS_DASH.map(item => [item, b.regionItemTotal[region][item] || 0])),
      강세항목: regionTopItem(b, region)
    })),
    항목별전체합계: b.itemGrandTotal, 전체합계: b.grandTotal
  };
}

function parseAiSections(text) {
  const sections = {};
  const re = /##\s*(.+?)\s*\n([\s\S]*?)(?=\n##\s|$)/g;
  let m;
  while ((m = re.exec(text))) sections[m[1].trim()] = m[2].trim();
  return sections;
}

async function runAiAnalysis(deptLabel, regionLabel, b) {
  state.aiAnalysis = { loading: true, error: '', text: '' };
  render();
  const data = buildAiAnalysisData(deptLabel, regionLabel, b);
  let lastErrMsg = '';
  // 백엔드(_callAi_)가 이미 503 등 일시 오류를 최대 3회 자동 재시도하지만, 이 클라이언트 fetch
  // 자체가 실패(네트워크 오류 등)하는 경우까지 대비해 여기서도 최대 3회, 1초 간격 재시도.
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const res = await callApi({ action: 'analyzeDistrictData', data });
      if (res && res.text) { state.aiAnalysis = { loading: false, error: '', text: res.text }; render(); return; }
      lastErrMsg = 'AI 응답이 비어 있습니다.';
    } catch (e) {
      lastErrMsg = e.message || String(e);
    }
    if (attempt < 3) await new Promise(r => setTimeout(r, 1000));
  }
  state.aiAnalysis = { loading: false, error: '잠시 후 다시 시도해주세요.', text: '' };
  render();
}

function aiAnalysisResultHtml(text) {
  const sections = parseAiSections(text);
  const known = AI_ANALYSIS_SECTIONS.filter(k => sections[k]);
  if (!known.length) {
    // 모델이 지정한 마크다운 제목 형식을 안 지킨 경우 — 원문 그대로 한 카드에 표시(파싱 실패해도 결과 자체는 보여줌)
    return `<div class="card card-border bg-base-100 shadow-sm"><div class="card-body p-4 text-xs whitespace-pre-wrap leading-relaxed">${esc(text)}</div></div>`;
  }
  return `
    <div class="grid gap-2">
      ${known.map(k => `
        <div class="card card-border bg-base-100 shadow-sm">
          <div class="card-body p-3">
            <div class="text-xs font-bold text-base-content mb-1">${esc(k)}</div>
            <div class="text-[11px] text-base-content/70 whitespace-pre-wrap leading-relaxed">${esc(sections[k])}</div>
          </div>
        </div>`).join('')}
    </div>
  `;
}

function aiAnalysisSectionHtml(b) {
  if (!b) return '';
  const a = state.aiAnalysis || {};
  return `
    <div class="px-4 pt-3 pb-4">
      <div class="flex items-start justify-between gap-2 mb-1">
        <div class="flex-1">${sectionTitleBand('🤖', 'AI 분석', '', '#F5F3FF')}</div>
        <button id="btn-ai-analysis" class="btn btn-xs btn-outline btn-primary shrink-0 mt-1" ${a.loading ? 'disabled' : ''}>${a.loading ? '분석 중...' : '🤖 AI 지역 분석'}</button>
      </div>
      ${a.loading ? `<div class="text-xs text-base-content/40 border border-base-300 rounded-box p-6 text-center"><span class="loading loading-spinner loading-sm align-middle mr-1"></span>🤖 데이터 분석 중...</div>` : ''}
      ${a.error ? `<div class="alert alert-warning py-2 text-sm"><div>${ICONS.alertTriangle} ${esc(a.error)}</div></div>` : ''}
      ${a.text ? aiAnalysisResultHtml(a.text) : (!a.loading && !a.error ? `<div class="text-xs text-base-content/40 border border-dashed border-base-300 rounded-box p-4 text-center">위 데이터를 AI가 요약·제안해드려요. 버튼을 눌러보세요.</div>` : '')}
    </div>
  `;
}

function regionFilterHtml(regions, shownCount) {
  return `
    <div class="flex items-center gap-2 px-4 py-3 border-y border-base-300 bg-base-100">
      <label class="font-bold text-base-content" style="font-size:15px">${ICONS.search} 지역 필터</label>
      <select id="region-select" class="select select-bordered select-sm w-40">
        <option value="" ${state.region === '' ? 'selected' : ''}>전체 (${regions.length}개 지역)</option>
        ${regions.map(r => `<option value="${esc(r)}" ${state.region === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}
      </select>
      <span class="text-xs text-base-content/40 ml-auto">${shownCount}명 표시</span>
    </div>
  `;
}

function render() {
  const root = document.getElementById('root');
  const isOverview = state.dept === null;
  const isTeacherList = state.dept === TEACHER_LIST_TAB;
  const isDeptDetail = !isOverview && !isTeacherList;
  const report = isDeptDetail ? state.cache[state.dept] : null;
  const allRows = report ? report.rows : [];
  const filteredRows = state.region ? allRows.filter(r => r.region === state.region) : allRows;
  const pendingCount = filteredRows.filter(t => t.suggestion).length;
  const tableRows = state.pendingOnly ? filteredRows.filter(t => t.suggestion) : filteredRows;
  const analysis = (isDeptDetail && report) ? buildActivityAnalysis(report) : null;
  const roleBreakdown = state.showSampleData
    ? buildSampleRoleActivityBreakdown()
    : ((isDeptDetail && report) ? buildRoleActivityBreakdown(report) : null);

  root.innerHTML = `
    <div class="kko-header">
      <div class="flex-1 flex items-center gap-2">
        <span class="text-xl leading-none">${ICONS.map}</span>
        <div class="text-lg font-bold">${TEACHER_VIEW ? '교사 명단' : '부서별'}</div>
      </div>
      ${isDeptDetail ? `<button id="btn-sample-toggle" class="btn btn-xs ${state.showSampleData ? 'btn-warning' : 'btn-ghost btn-outline'}">${ICONS.barChart2} 샘플 데이터 ${state.showSampleData ? 'ON' : '보기'}</button>` : ''}
    </div>
    <div class="brand-accent-bar"></div>
    ${mainNavHtml(TEACHER_VIEW ? 'teachers' : 'district')}

    ${TEACHER_VIEW ? '' : `<div class="flex flex-wrap items-center gap-1.5 px-4 py-2 border-b border-base-200">
      <a class="tab-dept-btn btn btn-xs ${isOverview ? 'btn-primary' : 'btn-ghost'}" data-dept="">${ICONS.clipboardList} 전체 요약</a>
      ${DEPTS.map(d => `<a class="tab-dept-btn btn btn-xs ${state.dept === d ? 'btn-primary' : 'btn-ghost'}" data-dept="${esc(d)}">${DEPT_ICON[d]||''} ${esc(d)}</a>`).join('')}
    </div>`}

    ${isDeptDetail ? `
      <div class="px-4 pt-3 flex items-center justify-between">
        <button id="btn-back-overview" class="font-bold text-primary hover:underline" style="font-size:15px">← 전체 요약</button>
        <div class="flex items-center gap-2" style="font-size:28px;font-weight:900;color:#1F3864">${DEPT_ICON[state.dept] || '📁'} ${esc(state.dept)}</div>
      </div>
      <div class="px-4 pt-2">
        <div class="alert bg-base-200 border border-base-300 py-2.5 px-3 text-[11px] text-base-content/70 leading-relaxed">
          🧭 이 화면은 지역장·교관이 담당 지역 교사들의 4역할(인도자·교사·섬김이·협력) 11항목 활동을 체계적으로 관찰·관리하는 직무 공간입니다. 지역별 강세·약세를 파악하고 보완 방향을 제시하세요.
        </div>
      </div>` : ''}

    ${isOverview
      ? orgSummarySectionHtml()
      : isTeacherList
      ? teacherListSectionHtml()
      : state.loading
        ? `<div class="text-sm text-base-content/40 text-center py-16"><span class="loading loading-spinner loading-md align-middle mr-2"></span>불러오는 중...</div>`
        : state.error
          ? `<div class="p-4"><div class="alert alert-error py-2 text-sm"><div>${ICONS.alertTriangle} ${esc(state.error)}</div></div></div>`
          : `
            ${mvpCardHtml(allRows)}
            ${summaryCardHtml(report && report.summary)}
            ${targetStageSectionHtml(report && report.targetStageCounts)}
            ${byRegionSectionHtml(report && report.byRegion)}
            ${strongItemSectionHtml(roleBreakdown)}
            ${aiAnalysisSectionHtml(roleBreakdown)}
            ${activityAnalysisSectionHtml(analysis)}
          `}
    ${encourageModalHtml()}
  `;

  document.querySelectorAll('.btn-org-card').forEach(btn => {
    btn.onclick = () => switchDept(btn.dataset.dept);
  });
  document.querySelectorAll('.tab-dept-btn').forEach(btn => {
    btn.onclick = () => switchDept(btn.dataset.dept || null);
  });
  const backBtn = document.getElementById('btn-back-overview');
  if (backBtn) backBtn.onclick = () => switchDept(null);
  if (isTeacherList) wireTeacherList();
  const regionSelect = document.getElementById('region-select');
  if (regionSelect) regionSelect.onchange = (e) => switchRegion(e.target.value);
  document.querySelectorAll('.btn-encourage-trigger').forEach(btn => {
    btn.onclick = () => openEncourageModal(btn.dataset.mid, btn.dataset.name);
  });
  if (state.encourageTarget) {
    const fromEl = document.getElementById('enc-from');
    if (fromEl) fromEl.oninput = e => { state.encourageFromName = e.target.value; };
    const msgEl = document.getElementById('enc-message');
    if (msgEl) msgEl.oninput = e => { state.encourageText = e.target.value; };
    const cancelBtn = document.getElementById('btn-encourage-cancel');
    if (cancelBtn) cancelBtn.onclick = closeEncourageModal;
    const sendBtn = document.getElementById('btn-encourage-send');
    if (sendBtn) sendBtn.onclick = sendEncourageMessage;
  }
  const detailsEl = document.getElementById('teacher-detail-details');
  if (detailsEl) detailsEl.ontoggle = () => { state.teacherDetailOpen = detailsEl.open; };
  const pendingOnlyCb = document.getElementById('pending-only-checkbox');
  if (pendingOnlyCb) pendingOnlyCb.onchange = (e) => { state.pendingOnly = e.target.checked; render(); };

  const viewToggleBtn = document.getElementById('btn-region-view-toggle');
  if (viewToggleBtn) viewToggleBtn.onclick = () => {
    state.regionView = state.regionView === 'table' ? 'chart' : 'table';
    render();
  };
  const activityToggleBtn = document.getElementById('btn-activity-view-toggle');
  if (activityToggleBtn) activityToggleBtn.onclick = () => {
    state.activityView = state.activityView === 'table' ? 'chart' : 'table';
    render();
  };
  const sampleToggleBtn = document.getElementById('btn-sample-toggle');
  if (sampleToggleBtn) sampleToggleBtn.onclick = () => {
    state.showSampleData = !state.showSampleData;
    state.aiAnalysis = null; // 데이터 소스가 바뀌면 이전 AI 분석 결과는 더 이상 안 맞으므로 초기화
    render();
  };
  const aiBtn = document.getElementById('btn-ai-analysis');
  if (aiBtn) aiBtn.onclick = () => runAiAnalysis(state.dept, state.region || '전체', roleBreakdown);

  destroyRegionCharts();
  if (isDeptDetail && report && !state.loading && !state.error) {
    if (state.regionView === 'chart') renderRegionCharts(report.byRegion);
    if (state.activityView === 'chart') renderActivityAnalysisChart(analysis);
  }
}

if (TEACHER_VIEW) switchDept(TEACHER_LIST_TAB); else loadOrgSummary(false); // 기본 진입 화면 = "전체 요약"(state.dept === null), ?view=teachers 면 교사 명단
</script>
